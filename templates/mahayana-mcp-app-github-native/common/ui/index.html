<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>Mahayana GitHub-native MCP App</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Mahayana GitHub-native MCP App</h1>
    <form id="send-form">
      <label for="message">Message</label>
      <input id="message" required autocomplete="off">
      <button type="submit">Send</button>
    </form>
    <pre id="result" aria-live="polite"></pre>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
