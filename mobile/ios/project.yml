name: Fabushi
options:
  bundleIdPrefix: com.ombhrum
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/../native/include
    LIBRARY_SEARCH_PATHS:
      - $(SRCROOT)/Frameworks
    OTHER_LDFLAGS:
      - $(inherited)
      - -lmahayana_app_host
targets:
  Fabushi:
    type: application
    platform: iOS
    sources:
      - path: Fabushi
    preBuildScripts:
      - name: Generate Fabushi cloth ghost AppIcon
        script: |
          cd "$SRCROOT/../.."
          node scripts/generate-cloth-ghost-icons.mjs --platform=ios
        inputFiles:
          - $(SRCROOT)/../../scripts/generate-cloth-ghost-icons.mjs
          - $(SRCROOT)/../../assets/brand/fabushi-cloth-ghost.svg
        outputFiles:
          - $(SRCROOT)/Fabushi/Assets.xcassets/AppIcon.appiconset/AppIcon-20.png
          - $(SRCROOT)/Fabushi/Assets.xcassets/AppIcon.appiconset/AppIcon-29.png
          - $(SRCROOT)/Fabushi/Assets.xcassets/AppIcon.appiconset/AppIcon-40.png
          - $(SRCROOT)/Fabushi/Assets.xcassets/AppIcon.appiconset/AppIcon-58.png
          - $(SRCROOT)/Fabushi/Assets.xcassets/AppIcon.appiconset/AppIcon-60.png
          - $(SRCROOT)/Fabushi/Assets.xcassets/AppIcon.appiconset/AppIcon-76.png
          - $(SRCROOT)/Fabushi/Assets.xcassets/AppIcon.appiconset/AppIcon-80.png
          - $(SRCROOT)/Fabushi/Assets.xcassets/AppIcon.appiconset/AppIcon-87.png
          - $(SRCROOT)/Fabushi/Assets.xcassets/AppIcon.appiconset/AppIcon-120.png
          - $(SRCROOT)/Fabushi/Assets.xcassets/AppIcon.appiconset/AppIcon-152.png
          - $(SRCROOT)/Fabushi/Assets.xcassets/AppIcon.appiconset/AppIcon-167.png
          - $(SRCROOT)/Fabushi/Assets.xcassets/AppIcon.appiconset/AppIcon-180.png
          - $(SRCROOT)/Fabushi/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ombhrum.fabushi
        INFOPLIST_KEY_CFBundleDisplayName: 全球法布施
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Fabushi/Fabushi-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 1.2.57
        CURRENT_PROJECT_VERSION: 30
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: Fabushi/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.ombhrum.fabushi
            CFBundleURLSchemes: [fabushi]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSLocationWhenInUseUsageDescription: 用于在聊天中按你的选择分享当前位置。
        NSMicrophoneUsageDescription: 用于在聊天中按你的操作录制并发送语音消息。
        CFBundleIconName: AppIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    scheme:
      testTargets:
        - FabushiTests
        - FabushiUITests
      gatherCoverageData: true
  FabushiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FabushiTests
    dependencies:
      - target: Fabushi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FabushiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FabushiUITests
    dependencies:
      - target: Fabushi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
