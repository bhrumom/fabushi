name: Merge queue CI fallback

on:
  push:
    branches:
      - 'gh-readonly-queue/main/**'

permissions:
  actions: write
  contents: read

concurrency:
  group: merge-queue-ci-fallback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ensure-ci-result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prefer native merge_group CI, dispatch full CI only when missing
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const queueRef = context.ref.replace(/^refs\/heads\//, '');
            const workflowId = 'ci.yml';

            // Native merge_group delivery is the canonical path. Give GitHub a
            // short window to emit checks_requested before using the fallback.
            await new Promise((resolve) => setTimeout(resolve, 20_000));

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              head_sha: sha,
              per_page: 30,
            });

            const existing = runs.workflow_runs.find((run) =>
              ['merge_group', 'workflow_dispatch'].includes(run.event) &&
              ['queued', 'in_progress', 'completed'].includes(run.status),
            );

            if (existing) {
              core.info(`CI already exists for queue SHA ${sha}: run ${existing.id} (${existing.event}/${existing.status}).`);
            } else {
              core.warning(`No merge_group CI was delivered for queue SHA ${sha}; dispatching the canonical CI workflow on ${queueRef}.`);
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: workflowId,
                ref: queueRef,
              });
            }

            // The branch ruleset requires a check named `CI result`. GitHub may
            // occasionally omit the merge_group delivery; a workflow_dispatch
            // run can validate the exact queue SHA, but merge queue does not
            // reliably wake on that run's aggregate check. Keep this fallback
            // job in progress until the canonical CI run completes, then mirror
            // its conclusion through this push-triggered `CI result` check.
            const deadline = Date.now() + 5 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: currentRuns } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                head_sha: sha,
                per_page: 30,
              });
              const current = currentRuns.workflow_runs.find((run) =>
                ['merge_group', 'workflow_dispatch'].includes(run.event) &&
                ['queued', 'in_progress', 'completed'].includes(run.status),
              );
              if (current?.status === 'completed') {
                if (current.conclusion !== 'success') {
                  core.setFailed(`Canonical CI run ${current.id} concluded ${current.conclusion} for queue SHA ${sha}.`);
                  return;
                }
                core.info(`Canonical CI run ${current.id} succeeded for queue SHA ${sha}; publishing fallback CI result success.`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
            core.setFailed(`Timed out waiting for canonical CI on queue SHA ${sha}.`);
