name: Legacy archive CI
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-policy:
    name: Legacy archive status
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: |
          echo 'Legacy source archive only. Product behavior NOT_VERIFIED.' >> "$GITHUB_STEP_SUMMARY"
          echo 'FCM-027 layered quality gates belong to canonical fabushi-governance and split product repositories.' >> "$GITHUB_STEP_SUMMARY"
  result:
    name: CI result
    if: always()
    needs: [release-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          ARCHIVE_RESULT: ${{ needs.release-policy.result }}
        run: |
          test "$ARCHIVE_RESULT" = success
          echo 'Archive status only; this is not product test or release acceptance.'
