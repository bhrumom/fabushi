name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  changes:
    name: Classify CI changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      worker: ${{ steps.classify.outputs.worker }}
      mcp: ${{ steps.classify.outputs.mcp }}
      workflows: ${{ steps.classify.outputs.workflows }}
      electron: ${{ steps.classify.outputs.electron }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' }}
        run: |
          set -euo pipefail
          if [ "$FORCE_ALL" = "true" ] || [ -z "$BASE_SHA" ]; then
            frontend=true
            worker=true
            mcp=true
            workflows=true
            electron=true
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            changed="$(git diff --name-only "$BASE_SHA" HEAD)"
            printf '%s\n' "$changed" >> "$GITHUB_STEP_SUMMARY"
            frontend=false
            worker=false
            mcp=false
            workflows=false
            electron=false
            if printf '%s\n' "$changed" | grep -Eq '^(frontend/|contracts/automation/cross-platform-journeys\.json$)'; then frontend=true; fi
            if printf '%s\n' "$changed" | grep -Eq '^(fabushi/web/|third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/)'; then worker=true; fi
            if printf '%s\n' "$changed" | grep -Eq '^(\.agents/plugins/|ai-backend/|frontend/packages/mcp-app-sdk/|plugins/)'; then mcp=true; fi
            if printf '%s\n' "$changed" | grep -Eq '^\.github/workflows/'; then workflows=true; fi
            if printf '%s\n' "$changed" | grep -Eq '^(\.github/scripts/(assert-electron-feature-host-bridge\.sh|assert-feature-command-router-coverage\.py|assert-fabushi-desktop-architecture\.py)$|desktop/electron/|desktop/src/|frontend/apps/host/|frontend/apps/web/src/app/(host|remote-computer)/|frontend/apps/web/src/lib/(fabushi-runtime|mahayana-host|remote-computer)/|third_party/mahayana/mahayana-rs/(mahayana-agent-codex/|mahayana-app-host/|mahayana-computer/|mahayana-feature-host/|mahayana-host-protocol/))'; then electron=true; fi
          fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "mcp=$mcp" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"
          echo "electron=$electron" >> "$GITHUB_OUTPUT"
          printf 'frontend=%s worker=%s mcp=%s workflows=%s electron=%s\n' "$frontend" "$worker" "$mcp" "$workflows" "$electron" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout frontend inputs
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /frontend/**
            /contracts/automation/cross-platform-journeys.json
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - id: pnpm-store
        name: Restore reusable pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/fabushi-pnpm-store
          key: frontend-pnpm-${{ runner.os }}-v2-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --store-dir "$RUNNER_TEMP/fabushi-pnpm-store"
      - name: Save pnpm store before compiling
        if: steps.pnpm-store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/fabushi-pnpm-store
          key: frontend-pnpm-${{ runner.os }}-v2-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Typecheck frontend workspace
        run: pnpm typecheck
      - name: Build official web frontend
        run: pnpm build:web

  worker:
    name: Worker checks
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fabushi/web
    steps:
      - name: Checkout Worker inputs
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fabushi/web/**
            /third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/**
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check Worker JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          printf '{"type":"module"}\n' > package.json
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './build/*' -print0 | xargs -0 -n1 node --check
      - name: Run Worker contract tests
        shell: bash
        run: |
          set -euo pipefail
          printf '{"type":"module"}\n' > package.json
          find tests -maxdepth 1 -name '*.test.js' -print0 | sort -z > /tmp/worker-tests
          if [ -s /tmp/worker-tests ]; then
            xargs -0 -n1 node < /tmp/worker-tests
          fi
      - name: Validate Worker bundle with Wrangler dry-run
        run: npx --yes wrangler@latest deploy --dry-run --outdir ../../worker-dry-run

  mcp-contracts:
    name: MCP plugin contracts
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - name: Checkout MCP inputs
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.agents/plugins/**
            /ai-backend/**
            /frontend/packages/mcp-app-sdk/**
            /plugins/**
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-backend/package-lock.json
      - name: Install MCP contract dependencies
        run: npm ci --prefer-offline
      - name: Validate official MCP plugin contracts
        run: npm test
      - name: Validate shared MCP command and schema rules
        working-directory: frontend/packages/mcp-app-sdk
        run: npm test

  workflow-guardrails:
    name: Post-Flutter migration guardrails
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workflow inputs
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/**
      - name: Reject retired Flutter workflows and commands
        shell: bash
        run: |
          set -euo pipefail
          retired=(
            .github/workflows/deploy-flutter-web.yml
            .github/workflows/desktop-installers.yml
            .github/workflows/native-smoke.yml
            .github/workflows/android-real-device-e2e.yml
            .github/workflows/publish-cd-release.yml
            .github/workflows/rollback-production.yml
          )
          for path in "${retired[@]}"; do
            if [ -e "$path" ]; then
              echo "Retired Flutter workflow was reintroduced: $path" >&2
              exit 1
            fi
          done
          flutter_action='subosito/'"flutter-action"
          flutter_command='flutter '"(pub get|build|test|analyze)"
          if grep -R -n -E "${flutter_action}|${flutter_command}" .github/workflows; then
            echo "Flutter commands are not allowed in the migrated automatic workflow set." >&2
            exit 1
          fi
          echo "No Flutter Actions remain in the migrated workflow set."

  electron-feature-host-contract:
    name: Electron Feature Host contract
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Electron Feature Host bridge inputs
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/assert-electron-feature-host-bridge.sh
            /.github/scripts/assert-feature-command-router-coverage.py
            /.github/scripts/assert-fabushi-desktop-architecture.py
            /desktop/electron/**
            /desktop/src/edge/**
            /desktop/src/main.tsx
            /frontend/apps/host/**
            /frontend/apps/web/src/app/host/**
            /frontend/apps/web/src/app/remote-computer/**
            /frontend/apps/web/src/lib/fabushi-runtime/**
            /frontend/apps/web/src/lib/mahayana-host/**
            /frontend/apps/web/src/lib/remote-computer/**
            /third_party/mahayana/mahayana-rs/mahayana-app-host/Cargo.toml
            /third_party/mahayana/mahayana-rs/mahayana-app-host/src/lib.rs
            /third_party/mahayana/mahayana-rs/mahayana-computer/Cargo.toml
            /third_party/mahayana/mahayana-rs/mahayana-computer/src/lib.rs
            /third_party/mahayana/mahayana-rs/mahayana-feature-host/Cargo.toml
            /third_party/mahayana/mahayana-rs/mahayana-feature-host/src/implementation.rs
            /third_party/mahayana/mahayana-rs/mahayana-host-protocol/src/lib.rs
      - name: Require 100 percent FeatureCommand router coverage
        run: python3 .github/scripts/assert-feature-command-router-coverage.py
      - name: Guard the Fabushi desktop architecture
        run: python3 .github/scripts/assert-fabushi-desktop-architecture.py
      - name: Verify Electron to Rust Feature Host bridge
        shell: bash
        run: bash .github/scripts/assert-electron-feature-host-bridge.sh

  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - frontend
      - worker
      - mcp-contracts
      - workflow-guardrails
      - electron-feature-host-contract
    if: always()
    steps:
      - name: Check only the required CI jobs selected by this diff
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            "Classifier:${{ needs.changes.result }}" \
            "Frontend:${{ needs.frontend.result }}" \
            "Worker:${{ needs.worker.result }}" \
            "MCP contracts:${{ needs.mcp-contracts.result }}" \
            "Migration guardrails:${{ needs.workflow-guardrails.result }}" \
            "Electron Feature Host:${{ needs.electron-feature-host-contract.result }}"
          do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "$name failed: $result"
              exit 1
            fi
          done
          echo "Diff-selected post-Flutter migration CI checks passed."
