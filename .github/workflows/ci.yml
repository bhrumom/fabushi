name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Release-control integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .version app-version.json)" = "$(jq -r .version desktop/package.json)"
          test "$(jq -r .version app-version.json)" = "1.2.24"
          grep -F 'workflow_dispatch:' .github/workflows/native-electron-release.yml >/dev/null
          grep -F 'runs-on: macos-15' .github/workflows/native-electron-release.yml >/dev/null
          ! grep -Eq 'windows-latest|ubuntu-latest|Android|Native iOS' .github/workflows/native-electron-release.yml
          git diff --check HEAD^ HEAD || true
          echo 'Required CI result: fast release-control gate only.' >> "$GITHUB_STEP_SUMMARY"
