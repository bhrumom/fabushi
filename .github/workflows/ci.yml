name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Release-control integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .version app-version.json)" = "$(jq -r .version desktop/package.json)"
          test "$(jq -r .version app-version.json)" = "1.2.41"
          release=.github/workflows/native-electron-release.yml
          grep -F 'workflow_dispatch:' "$release" >/dev/null
          grep -F 'runs-on: macos-15' "$release" >/dev/null
          grep -F 'RELEASE_TARGET=macos' "$release" >/dev/null
          grep -F 'RELEASE_TIER=test' "$release" >/dev/null
          grep -F 'bash .github/scripts/require-release-source-gates.sh' "$release" >/dev/null
          grep -F 'already exists; refusing to mutate an existing release' "$release" >/dev/null
          ! grep -Eq 'windows-latest|ubuntu-latest|Android|Native iOS' "$release"
          node desktop/scripts/check-app-agent-stable-rebase-contract.mjs
          node --test desktop/electron/remote-device-agent-supervisor-packaged-helper.test.cjs
          node --test chatgpt-vps-control/tests/ios-interactive-app-e2e-contract.test.js
          git diff --check HEAD^ HEAD || true
          echo 'Required CI result: fast release-control, canonical test-release source gate, macOS stable-target rebase, App-owned packaged native-helper binding, and iOS interactive hold contracts.' >> "$GITHUB_STEP_SUMMARY"
