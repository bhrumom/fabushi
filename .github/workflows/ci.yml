name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  homepage-send-regression:
    name: Homepage send flow regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate homepage send flow
        run: python3 scripts/check_home_send_flow.py
