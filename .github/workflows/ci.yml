name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  changes:
    name: Classify CI changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      worker: ${{ steps.classify.outputs.worker }}
      mcp: ${{ steps.classify.outputs.mcp }}
      workflows: ${{ steps.classify.outputs.workflows }}
      electron: ${{ steps.classify.outputs.electron }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      unknown: ${{ steps.classify.outputs.unknown }}
    steps:
      - id: classify
        name: Classify changed paths without checkout
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;

            const domainMatchers = {
              frontend: [
                /^frontend\//,
                /^contracts\/automation\/cross-platform-journeys\.json$/,
              ],
              worker: [
                /^fabushi\/web\//,
                /^third_party\/mahayana\/mahayana-rs\/mahayana-platform-worker\/migrations\//,
              ],
              mcp: [
                /^\.agents\/plugins\//,
                /^ai-backend\//,
                /^frontend\/packages\/mcp-app-sdk\//,
                /^plugins\//,
              ],
              workflows: [
                /^\.github\/workflows\//,
              ],
              electron: [
                /^\.github\/scripts\/(assert-electron-feature-host-bridge\.sh|assert-feature-command-router-coverage\.py|assert-fabushi-desktop-architecture\.py|assert-gbf-runtime-convergence\.py)$/,
                /^desktop\/electron\//,
                /^desktop\/src\//,
                /^frontend\/apps\/host\//,
                /^frontend\/apps\/web\/src\/app\/(host|remote-computer)\//,
                /^frontend\/apps\/web\/src\/lib\/(fabushi-runtime|mahayana-host|remote-computer)\//,
                /^third_party\/mahayana\/mahayana-rs\/(mahayana-agent-codex\/|mahayana-app-host\/|mahayana-computer\/|mahayana-feature-host\/|mahayana-host-protocol\/)/,
              ],
            };

            const isDocsSafe = (filename) =>
              /^projects\//.test(filename) ||
              /^docs\//.test(filename) ||
              /^\.agent\/skills\//.test(filename) ||
              /^[^/]+\.md$/.test(filename) ||
              /^\.github\/[^/]+\.md$/.test(filename);

            async function compareFiles(base, head) {
              if (!base || !head || /^0+$/.test(base)) {
                return { files: [], forceAll: true, reason: 'missing or zero base/head SHA' };
              }
              const { data } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${base}...${head}`,
                per_page: 100,
              });
              const files = (data.files || []).map((file) => file.filename);
              const forceAll = files.length >= 300;
              return {
                files,
                forceAll,
                reason: forceAll ? 'compare API reached the 300-file safety limit' : '',
              };
            }

            let files = [];
            let forceAll = false;
            let forceReason = '';
            let source = eventName;

            if (eventName === 'workflow_dispatch') {
              forceAll = true;
              forceReason = 'manual dispatch intentionally validates all canonical domains';
            } else if (eventName === 'pull_request') {
              const pullNumber = context.payload.pull_request.number;
              const changed = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              });
              files = changed.map((file) => file.filename);
              source = `pull_request #${pullNumber}`;
            } else if (eventName === 'merge_group') {
              const mergeGroup = context.payload.merge_group || {};
              const compared = await compareFiles(mergeGroup.base_sha, mergeGroup.head_sha);
              files = compared.files;
              forceAll = compared.forceAll;
              forceReason = compared.reason;
              source = `merge_group ${mergeGroup.base_sha || '?'}..${mergeGroup.head_sha || '?'}`;
            } else if (eventName === 'push') {
              const compared = await compareFiles(context.payload.before, context.payload.after || context.sha);
              files = compared.files;
              forceAll = compared.forceAll;
              forceReason = compared.reason;
              source = `push ${context.payload.before || '?'}..${context.payload.after || context.sha}`;
            } else {
              forceAll = true;
              forceReason = `unsupported event ${eventName}`;
            }

            const selected = {
              frontend: false,
              worker: false,
              mcp: false,
              workflows: false,
              electron: false,
            };

            const matchesAnyDomain = (filename) => {
              let matched = false;
              for (const [domain, matchers] of Object.entries(domainMatchers)) {
                if (matchers.some((matcher) => matcher.test(filename))) {
                  selected[domain] = true;
                  matched = true;
                }
              }
              return matched;
            };

            const unknownFiles = [];
            if (!forceAll) {
              for (const filename of files) {
                const matched = matchesAnyDomain(filename);
                if (!matched && !isDocsSafe(filename)) {
                  unknownFiles.push(filename);
                }
              }

              if (unknownFiles.length > 0) {
                forceAll = true;
                forceReason = `unclassified non-document paths: ${unknownFiles.join(', ')}`;
              }
            }

            if (forceAll) {
              for (const domain of Object.keys(selected)) {
                selected[domain] = true;
              }
            }

            const docsOnly = !forceAll && files.length > 0 && files.every(isDocsSafe);
            const unknown = unknownFiles.length > 0;

            for (const [domain, value] of Object.entries(selected)) {
              core.setOutput(domain, value ? 'true' : 'false');
            }
            core.setOutput('docs_only', docsOnly ? 'true' : 'false');
            core.setOutput('unknown', unknown ? 'true' : 'false');

            await core.summary
              .addHeading('CI impact classification')
              .addTable([
                [{ data: 'Source', header: true }, source],
                [{ data: 'Changed files', header: true }, String(files.length)],
                [{ data: 'Docs-only fast path', header: true }, String(docsOnly)],
                [{ data: 'Unknown non-doc paths', header: true }, String(unknown)],
                [{ data: 'Force all canonical domains', header: true }, String(forceAll)],
                [{ data: 'Reason', header: true }, forceReason || 'exact changed-path classification'],
              ])
              .addRaw(`\nfrontend=${selected.frontend} worker=${selected.worker} mcp=${selected.mcp} workflows=${selected.workflows} electron=${selected.electron}\n`)
              .addDetails('Changed files', files.length ? files.map((file) => `- ${file}`).join('\n') : '(none)')
              .write();

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout frontend inputs
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /frontend/**
            /contracts/automation/cross-platform-journeys.json
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - id: pnpm-store
        name: Restore reusable pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/fabushi-pnpm-store
          key: frontend-pnpm-${{ runner.os }}-v2-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --store-dir "$RUNNER_TEMP/fabushi-pnpm-store"
      - name: Save pnpm store before compiling
        if: steps.pnpm-store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/fabushi-pnpm-store
          key: frontend-pnpm-${{ runner.os }}-v2-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Typecheck frontend workspace
        run: pnpm typecheck
      - name: Build official web frontend
        run: pnpm build:web

  worker:
    name: Worker checks
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fabushi/web
    steps:
      - name: Checkout Worker inputs
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts
            fabushi/web
            frontend
            third_party/mahayana/mahayana-rs/mahayana-platform-worker
            third_party/mahayana/mahayana-rs/mahayana-pay-worker
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check Worker JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          printf '{"type":"module"}\n' > package.json
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './build/*' -print0 | xargs -0 -n1 node --check
      - name: Run Worker contract tests
        shell: bash
        run: |
          set -euo pipefail
          printf '{"type":"module"}\n' > package.json
          find tests -maxdepth 1 -name '*.test.js' -print0 | sort -z > /tmp/worker-tests
          if [ -s /tmp/worker-tests ]; then
            xargs -0 -n1 node < /tmp/worker-tests
          fi
      - name: Validate Worker bundle with Wrangler dry-run
        run: npx --yes wrangler@latest deploy --dry-run --outdir ../../worker-dry-run

  mcp-contracts:
    name: MCP plugin contracts
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - name: Checkout MCP inputs
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.agents/plugins/**
            /ai-backend/**
            /frontend/packages/mcp-app-sdk/**
            /plugins/**
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-backend/package-lock.json
      - name: Install MCP contract dependencies
        run: npm ci --prefer-offline
      - name: Validate official MCP plugin contracts
        run: npm test
      - name: Validate platform API isolation and SSRF contracts
        working-directory: ai-backend
        run: npm run test:platform-api
      - name: Validate shared MCP command and schema rules
        working-directory: frontend/packages/mcp-app-sdk
        run: npm test

  workflow-guardrails:
    name: Canonical architecture guardrails
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workflow inputs
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/**
      - name: Reject retired Flutter/Tauri/Capacitor workflows and commands
        shell: bash
        run: |
          set -euo pipefail
          retired=(
            .github/workflows/deploy-flutter-web.yml
            .github/workflows/desktop-installers.yml
            .github/workflows/native-smoke.yml
            .github/workflows/android-real-device-e2e.yml
            .github/workflows/publish-cd-release.yml
            .github/workflows/rollback-production.yml
            .github/workflows/mobile-tauri.yml
            .github/workflows/tauri-host-fast-checks.yml
            .github/workflows/tauri-macos-app-store.yml
            .github/workflows/tauri-macos-package.yml
          )
          for path in "${retired[@]}"; do
            if [ -e "$path" ]; then
              echo "Retired client workflow was reintroduced: $path" >&2
              exit 1
            fi
          done
          flutter_action='subosito/'"flutter-action"
          tauri_action='tauri-apps/'"tauri-action"
          flutter_command='flutter '"(pub get|build|test|analyze)"
          tauri_command='(^|[[:space:]])tauri '"(build|android|ios)"
          capacitor_command='npx cap '"(sync|copy|update|build)"
          if grep -R -n -E "${flutter_action}|${tauri_action}|${flutter_command}|${tauri_command}|${capacitor_command}" .github/workflows; then
            echo "Retired Flutter/Tauri/Capacitor commands are not allowed in canonical workflows." >&2
            exit 1
          fi
          echo "Canonical workflows contain no retired Flutter/Tauri/Capacitor build commands."

  electron-feature-host-contract:
    name: Electron Feature Host contract
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Electron Feature Host bridge inputs
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/assert-electron-feature-host-bridge.sh
            /.github/scripts/assert-feature-command-router-coverage.py
            /.github/scripts/assert-fabushi-desktop-architecture.py
            /.github/scripts/assert-gbf-runtime-convergence.py
            /.github/scripts/assert-native-capability-semantics.py
            /.github/scripts/assert-auth-entry-flow.py
            /.github/scripts/assert-bot-mark-motion.py
            /.github/scripts/assert-product-ui-contracts.py
            /.github/scripts/build-offline-asr-engine.mjs
            /desktop/electron/offline-asr-engine.json
            /desktop/electron/offline-asr.cjs
            /.github/scripts/assert-native-desktop-edge-parity.py
            /desktop/electron/**
            /desktop/src/edge/**
            /desktop/src/main.tsx
            /desktop/src/messaging-shell-v2.tsx
            /frontend/apps/host/**
            /frontend/apps/web/src/app/host/**
            /frontend/apps/web/src/app/remote-computer/**
            /frontend/apps/web/src/lib/fabushi-runtime/**
            /frontend/apps/web/src/lib/mahayana-host/**
            /frontend/apps/web/src/lib/remote-computer/**
            /third_party/mahayana/mahayana-rs/mahayana-app-host/Cargo.toml
            /third_party/mahayana/mahayana-rs/mahayana-app-host/src/lib.rs
            /third_party/mahayana/mahayana-rs/mahayana-computer/Cargo.toml
            /third_party/mahayana/mahayana-rs/mahayana-computer/src/lib.rs
            /third_party/mahayana/mahayana-rs/mahayana-feature-host/Cargo.toml
            /third_party/mahayana/mahayana-rs/mahayana-feature-host/src/implementation.rs
            /third_party/mahayana/mahayana-rs/mahayana-host-protocol/src/lib.rs
            /third_party/mahayana/mahayana-rs/mahayana-runtime/src/lib.rs
            /third_party/mahayana/mahayana-rs/mahayana-kernel/src/resilience.rs
            /third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api.rs
            /third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/**
            /third_party/mahayana/mahayana-rs/mahayana-product/src/lib.rs
      - name: Require 100 percent FeatureCommand router coverage
        run: python3 .github/scripts/assert-feature-command-router-coverage.py
      - name: Guard the Fabushi desktop architecture
        run: python3 .github/scripts/assert-fabushi-desktop-architecture.py
      - name: Verify single Mahayana Agent Tool runtime
        run: python3 .github/scripts/assert-gbf-runtime-convergence.py
      - name: Verify native desktop edge parity
        run: python3 .github/scripts/assert-native-desktop-edge-parity.py
      - name: Verify browser-first account login
        run: python3 .github/scripts/assert-auth-entry-flow.py
      - name: Verify living BotMark motion contracts
        run: python3 .github/scripts/assert-bot-mark-motion.py
      - name: Verify product UI capability surfaces
        run: python3 .github/scripts/assert-product-ui-contracts.py
      - name: Reject native capability stubs
        run: python3 .github/scripts/assert-native-capability-semantics.py
      - name: Verify Electron edge, host lifecycle, and offline ASR contracts
        run: node --test desktop/electron/edge-ipc.test.cjs desktop/electron/host-process.test.cjs desktop/electron/native-capability-handlers.test.cjs desktop/electron/offline-asr.test.cjs
      - name: Verify Electron to Rust Feature Host bridge
        shell: bash
        run: bash .github/scripts/assert-electron-feature-host-bridge.sh

  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - frontend
      - worker
      - mcp-contracts
      - workflow-guardrails
      - electron-feature-host-contract
    if: always()
    steps:
      - name: Check only the required CI jobs selected by this diff
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            "Classifier:${{ needs.changes.result }}" \
            "Frontend:${{ needs.frontend.result }}" \
            "Worker:${{ needs.worker.result }}" \
            "MCP contracts:${{ needs.mcp-contracts.result }}" \
            "Migration guardrails:${{ needs.workflow-guardrails.result }}" \
            "Electron Feature Host:${{ needs.electron-feature-host-contract.result }}"
          do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "$name failed: $result"
              exit 1
            fi
          done
          echo "Diff-selected canonical architecture CI checks passed."
