name: Mahayana Cloud Marketplace E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahayana-cloud-marketplace-e2e
  cancel-in-progress: false

env:
  MAHAYANA_MANIFEST: third_party/mahayana/mahayana-rs/Cargo.toml
  PLATFORM_WORKER_DIR: third_party/mahayana/mahayana-rs/mahayana-platform-worker
  PLUGIN_DIR: examples/mahayana-cloud-marketplace/hello-market-plugin
  PLUGIN_ID: cloud-market-hello
  # Marketplace releases are immutable. A fixed version makes every later E2E
  # run fail with version_already_exists before it can exercise install/revoke.
  # run_attempt also keeps an explicit rerun unique after a late-stage failure.
  PLUGIN_VERSION: 0.${{ github.run_id }}.${{ github.run_attempt }}

jobs:
  cloud-marketplace-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 1
      CARGO_PROFILE: ci
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN || vars.WRANGLER_API_TOKEN || vars.CLOUDFLARE_TOKEN || vars.CF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CF_ACCOUNT || secrets.CLOUDFLARE_ACCOUNT || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || vars.CF_ACCOUNT || vars.CLOUDFLARE_ACCOUNT }}
      TEST_ACCOUNT_TOKEN: ${{ secrets.TEST_ACCOUNT_TOKEN || secrets.MAHAYANA_TEST_ACCOUNT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure runner paths
        shell: bash
        run: echo "MAHAYANA_HOME=$RUNNER_TEMP/mahayana-home" >> "$GITHUB_ENV"

      - name: Require deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "Cloudflare API token is not configured." >&2; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "Cloudflare account id is not configured." >&2; exit 1; }
          [ -n "${TEST_ACCOUNT_TOKEN:-}" ] || { echo "Mahayana test account token is not configured." >&2; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Restore Marketplace Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: mahayana-cloud-marketplace
          cache-bin: true
          cache-on-failure: true

      - name: Prepare marketplace validation diagnostics
        shell: bash
        run: mkdir -p artifacts/marketplace-validation

      - name: Check Mahayana Rust formatting
        shell: bash
        run: |
          set -uo pipefail
          log="artifacts/marketplace-validation/rustfmt-check.log"
          set +e
          cargo fmt --manifest-path "$MAHAYANA_MANIFEST" --all -- --check 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            cargo fmt --manifest-path "$MAHAYANA_MANIFEST" --all
            git diff -- third_party/mahayana/mahayana-rs > artifacts/marketplace-validation/rustfmt.patch
          fi
          exit "$status"

      # Compile the deployable boundary before the larger native test graph. This
      # catches Worker-only macro and target errors in seconds on a warm cache.
      - name: Check Mahayana platform Worker
        shell: bash
        run: |
          set -o pipefail
          cargo check --locked --profile "$CARGO_PROFILE" --manifest-path "$MAHAYANA_MANIFEST" --target wasm32-unknown-unknown --package mahayana-platform-worker 2>&1 \
            | tee artifacts/marketplace-validation/platform-worker-check.log

      - name: Test Mahayana marketplace packages
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --profile "$CARGO_PROFILE" --manifest-path "$MAHAYANA_MANIFEST" --package mahayana-cli --package mahayana-platform-client 2>&1 \
            | tee artifacts/marketplace-validation/cargo-test.log

      - name: Build Mahayana CLI E2E binary
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked --profile "$CARGO_PROFILE" --manifest-path "$MAHAYANA_MANIFEST" --package mahayana-cli 2>&1 \
            | tee artifacts/marketplace-validation/mahayana-cli-build.log

      - name: Upload marketplace validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mahayana-marketplace-validation-diagnostics
          path: artifacts/marketplace-validation
          if-no-files-found: error
          retention-days: 7

      # Deployment tooling is deliberately installed after all deterministic
      # validation, so a compile failure never waits on a network tool install.
      - name: Install Cloudflare Worker build tool
        run: cargo install worker-build --locked

      - name: Apply marketplace database migrations
        working-directory: ${{ env.PLATFORM_WORKER_DIR }}
        shell: bash
        run: printf 'y\n' | npx --yes wrangler@4 d1 migrations apply PLATFORM_DB --remote

      - name: Deploy Mahayana platform Worker
        id: platform
        working-directory: ${{ env.PLATFORM_WORKER_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/platform-deploy.log"
          platform_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RUNNER_TEMP/platform-deploy.log" | tail -n 1 | sed 's/[),;]$//')"
          [ -n "$platform_url" ] || { echo "Wrangler did not report a workers.dev URL." >&2; exit 1; }
          echo "url=$platform_url" >> "$GITHUB_OUTPUT"

      - name: Configure Worker test account secret
        working-directory: ${{ env.PLATFORM_WORKER_DIR }}
        shell: bash
        run: printf '%s' "$TEST_ACCOUNT_TOKEN" | npx --yes wrangler@4 secret put TEST_ACCOUNT_TOKEN

      - name: Verify platform health
        shell: bash
        env:
          PLATFORM_URL: ${{ steps.platform.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$PLATFORM_URL/health" | tee "$RUNNER_TEMP/platform-health.json"
          jq -e '.ok == true' "$RUNNER_TEMP/platform-health.json" >/dev/null

      - name: Host and publish external Cloudflare plugin artifact
        id: publish
        shell: bash
        env:
          MAHAYANA_API_BASE_URL: ${{ steps.platform.outputs.url }}
          MAHAYANA_TEST_ACCOUNT_TOKEN: ${{ env.TEST_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/third_party/mahayana/mahayana-rs/target/$CARGO_PROFILE/mahayana"
          manifest="$PLUGIN_DIR/.codex-plugin/plugin.json"
          jq --arg version "$PLUGIN_VERSION" '.version = $version' "$manifest" > "$RUNNER_TEMP/plugin-manifest.json"
          mv "$RUNNER_TEMP/plugin-manifest.json" "$manifest"
          package="$PLUGIN_DIR/package.json"
          jq --arg version "$PLUGIN_VERSION" '.version = $version' "$package" > "$RUNNER_TEMP/plugin-package.json"
          mv "$RUNNER_TEMP/plugin-package.json" "$package"

          # The marketplace now admits externally hosted artifacts. Run the
          # plugin test first so the archive served below is byte-identical to
          # the archive generated again by `plugin publish`.
          "$cli" plugin test "$PLUGIN_DIR" >/dev/null
          source_archive="$RUNNER_TEMP/source-plugin.tar.gz"
          "$cli" plugin pack "$PLUGIN_DIR" --output "$source_archive" >/dev/null
          package_sha="$(sha256sum "$source_archive" | awk '{print $1}')"
          package_size="$(stat -c '%s' "$source_archive")"

          python3 - "$source_archive" "$RUNNER_TEMP/artifact-worker.mjs" <<'PY'
          import base64
          import sys
          from pathlib import Path

          payload = base64.b64encode(Path(sys.argv[1]).read_bytes()).decode("ascii")
          script = f'''const payload = "{payload}";
          export default {{
            async fetch(request) {{
              const url = new URL(request.url);
              if (url.pathname !== "/plugin.tar.gz") return new Response("not found", {{ status: 404 }});
              const bytes = Uint8Array.from(atob(payload), (character) => character.charCodeAt(0));
              return new Response(bytes, {{ headers: {{ "content-type": "application/gzip", "cache-control": "no-store" }} }});
            }}
          }};
          '''
          Path(sys.argv[2]).write_text(script, encoding="utf-8")
          PY
          artifact_worker="mahayana-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx --yes wrangler@4 deploy "$RUNNER_TEMP/artifact-worker.mjs" \
            --name "$artifact_worker" --compatibility-date 2026-08-15 \
            2>&1 | tee "$RUNNER_TEMP/artifact-deploy.log"
          artifact_base="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RUNNER_TEMP/artifact-deploy.log" | tail -n 1 | sed 's/[),;]$//')"
          test -n "$artifact_base"
          artifact_url="$artifact_base/plugin.tar.gz"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "$artifact_url" > "$RUNNER_TEMP/served-plugin.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/served-plugin.tar.gz" | awk '{print $1}')" = "$package_sha"
          test "$(stat -c '%s' "$RUNNER_TEMP/served-plugin.tar.gz")" = "$package_size"
          artifact_source="$(jq -cn --arg url "$artifact_url" '{type:"https",url:$url}')"

          "$cli" login test
          "$cli" plugin publish "$PLUGIN_DIR" --plugin-id "$PLUGIN_ID" --version "$PLUGIN_VERSION" \
            --artifact-source "$artifact_source" | tee "$RUNNER_TEMP/publish.log"
          python3 - "$RUNNER_TEMP/publish.log" "$RUNNER_TEMP/publish.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          for offset, character in enumerate(source):
              if character != "{":
                  continue
              try:
                  value = json.loads(source[offset:])
              except json.JSONDecodeError:
                  continue
              Path(sys.argv[2]).write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              break
          else:
              raise SystemExit("Mahayana publish output did not contain a final JSON object")
          PY
          deployment_url="$artifact_url"
          source_tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          jq -e \
            --arg id "$PLUGIN_ID" \
            --arg version "$PLUGIN_VERSION" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson repository_id "$GITHUB_REPOSITORY_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg tree_hash "$source_tree" \
            --arg package_sha "$package_sha" \
            --argjson package_size "$package_size" \
            --arg artifact_url "$artifact_url" '
            .published == true and .approved == true and
            .storage == "external" and
            .releaseStatus == "approved" and
            .pluginId == $id and .version == $version and
            .source.provider == "github" and
            .source.repository == $repository and
            .source.repositoryId == $repository_id and
            .source.defaultBranch == "main" and
            .source.commit == $commit and
            .source.treeHash == $tree_hash and
            .source.license == "Apache-2.0" and
            .source.visibility == "public" and
            .source.subdirectory == "examples/mahayana-cloud-marketplace/hello-market-plugin" and
            .releaseManifest.protocol == "mahayana.external-release.v1" and
            .releaseManifest.pluginId == $id and
            .releaseManifest.version == $version and
            (.releaseManifest.artifacts | length) == 1 and
            .releaseManifest.artifacts[0].source.type == "https" and
            .releaseManifest.artifacts[0].source.url == $artifact_url and
            .releaseManifest.artifacts[0].sha256 == $package_sha and
            .releaseManifest.artifacts[0].size == $package_size and
            .resolvedArtifacts[0] == $artifact_url and
            (.releaseManifestSha256 | test("^[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/publish.json" >/dev/null
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Legacy hosted-site validation (retired by external artifacts)
        if: ${{ false }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$DEPLOYMENT_URL/" > "$RUNNER_TEMP/plugin-index.html"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$DEPLOYMENT_URL/mahayana/plugin.json" > "$RUNNER_TEMP/plugin-site.json"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$DEPLOYMENT_URL/mahayana/source.json" > "$RUNNER_TEMP/plugin-source.json"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$DEPLOYMENT_URL/mahayana/release-manifest.json" > "$RUNNER_TEMP/release-manifest.json"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$DEPLOYMENT_URL/mahayana/plugin.tar.gz" > "$RUNNER_TEMP/site-plugin.tar.gz"
          source_tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          jq -e \
            --arg id "$PLUGIN_ID" \
            --arg version "$PLUGIN_VERSION" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson repository_id "$GITHUB_REPOSITORY_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg tree_hash "$source_tree" '
            .schemaVersion == 2 and .pluginId == $id and .version == $version and
            .packagePath == "/mahayana/plugin.tar.gz" and
            .runtime == "independent-worker-or-pages" and
            .source.provider == "github" and
            .source.repository == $repository and
            .source.repositoryId == $repository_id and
            .source.commit == $commit and
            .source.treeHash == $tree_hash and
            .source.license == "Apache-2.0" and
            .releaseManifestPath == "/mahayana/release-manifest.json" and
            (.releaseManifestSha256 | test("^[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/plugin-site.json" >/dev/null
          jq -e --slurpfile site "$RUNNER_TEMP/plugin-site.json" \
            '. == $site[0].source' "$RUNNER_TEMP/plugin-source.json" >/dev/null
          expected_sha="$(jq -r '.packageSha256' "$RUNNER_TEMP/plugin-site.json")"
          expected_size="$(jq -r '.packageSize' "$RUNNER_TEMP/plugin-site.json")"
          actual_sha="$(sha256sum "$RUNNER_TEMP/site-plugin.tar.gz" | awk '{print $1}')"
          actual_size="$(stat -c '%s' "$RUNNER_TEMP/site-plugin.tar.gz")"
          release_manifest_sha="$(sha256sum "$RUNNER_TEMP/release-manifest.json" | awk '{print $1}')"
          [ "$actual_sha" = "$expected_sha" ]
          [ "$actual_size" = "$expected_size" ]
          [ "$release_manifest_sha" = "$(jq -r '.releaseManifestSha256' "$RUNNER_TEMP/plugin-site.json")" ]
          jq -e \
            --arg id "$PLUGIN_ID" \
            --arg version "$PLUGIN_VERSION" \
            --arg package_sha "$actual_sha" \
            --argjson package_size "$actual_size" \
            --arg commit "$GITHUB_SHA" \
            --arg tree_hash "$source_tree" \
            --slurpfile source "$RUNNER_TEMP/plugin-source.json" '
            .schemaVersion == 1 and
            .protocol == "mahayana.multi-artifact-release.v1" and
            .pluginId == $id and .version == $version and
            .source == $source[0] and
            .common.id == "common" and
            .common.packagePath == "/mahayana/plugin.tar.gz" and
            .common.sha256 == $package_sha and
            .common.size == $package_size and
            .common.sourceCommit == $commit and
            .common.sourceTreeHash == $tree_hash and
            (.artifacts | length) > 0 and
            all(.artifacts[];
              .packagePath == "/mahayana/plugin.tar.gz" and
              .sha256 == $package_sha and .size == $package_size and
              .sourceCommit == $commit and .sourceTreeHash == $tree_hash)
          ' "$RUNNER_TEMP/release-manifest.json" >/dev/null

      - name: Legacy multipart immutable-version validation (retired)
        if: ${{ false }}
        shell: bash
        env:
          PLATFORM_URL: ${{ steps.platform.outputs.url }}
        run: |
          set -euo pipefail
          duplicate="$RUNNER_TEMP/duplicate-version.tar.gz"
          cp "$RUNNER_TEMP/site-plugin.tar.gz" "$duplicate"
          printf '\nchanged-content\n' >> "$duplicate"
          duplicate_sha="$(sha256sum "$duplicate" | awk '{print $1}')"
          duplicate_size="$(stat -c '%s' "$duplicate")"
          original_sha="$(jq -r '.packageSha256' "$RUNNER_TEMP/publish.json")"
          [ "$duplicate_sha" != "$original_sha" ]
          deployment_url="$(jq -r '.deploymentUrl' "$RUNNER_TEMP/publish.json")"
          source_json="$(jq -c '.source' "$RUNNER_TEMP/publish.json")"
          release_manifest_json="$(jq -c \
            --arg sha "$duplicate_sha" \
            --argjson size "$duplicate_size" '
              .releaseManifest
              | .common.sha256 = $sha
              | .common.size = $size
              | .artifacts |= map(.sha256 = $sha | .size = $size)
            ' "$RUNNER_TEMP/publish.json")"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/duplicate-version-response.json" \
            --write-out '%{http_code}' \
            --request POST "$PLATFORM_URL/v1/marketplace/releases" \
            --header "Authorization: Bearer $TEST_ACCOUNT_TOKEN" \
            --form-string "pluginId=$PLUGIN_ID" \
            --form-string "version=$PLUGIN_VERSION" \
            --form-string "deploymentUrl=$deployment_url" \
            --form-string "packageSha256=$duplicate_sha" \
            --form-string "packageSize=$duplicate_size" \
            --form-string 'platforms=["cli","desktop","mobile","web"]' \
            --form-string "source=$source_json" \
            --form-string "releaseManifest=$release_manifest_json" \
            --form "package=@$duplicate;type=application/gzip")"
          [ "$status" = "409" ]
          jq -e '.error == "version_already_exists"' "$RUNNER_TEMP/duplicate-version-response.json" >/dev/null

      - name: Reject immutable external plugin version overwrite
        shell: bash
        env:
          MAHAYANA_API_BASE_URL: ${{ steps.platform.outputs.url }}
          MAHAYANA_TEST_ACCOUNT_TOKEN: ${{ env.TEST_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/third_party/mahayana/mahayana-rs/target/$CARGO_PROFILE/mahayana"
          artifact_url="${{ steps.publish.outputs.deployment_url }}"
          artifact_source="$(jq -cn --arg url "$artifact_url" '{type:"https",url:$url}')"
          set +e
          "$cli" plugin publish "$PLUGIN_DIR" --plugin-id "$PLUGIN_ID" --version "$PLUGIN_VERSION" \
            --artifact-source "$artifact_source" \
            >"$RUNNER_TEMP/duplicate-version.stdout" \
            2>"$RUNNER_TEMP/duplicate-version.stderr"
          duplicate_status="$?"
          set -e
          test "$duplicate_status" -ne 0
          grep -E 'version_already_exists|already exists|immutable' \
            "$RUNNER_TEMP/duplicate-version.stdout" "$RUNNER_TEMP/duplicate-version.stderr"

      - name: Browse, download, and safely install through Mahayana CLI
        shell: bash
        env:
          MAHAYANA_API_BASE_URL: ${{ steps.platform.outputs.url }}
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/third_party/mahayana/mahayana-rs/target/$CARGO_PROFILE/mahayana"
          "$cli" marketplace browse \
            2> >(tee "$RUNNER_TEMP/browse.stderr" >&2) | tee "$RUNNER_TEMP/browse.json"
          jq -e --arg id "$PLUGIN_ID" --arg version "$PLUGIN_VERSION" --arg deployment "${{ steps.publish.outputs.deployment_url }}" '
            any(.plugins[];
              .pluginId == $id and .latestVersion == $version and
              .releaseStatus == "approved" and
              .deploymentUrl == $deployment and
              (.platforms | index("cli")) != null and
              (.packageSha256 | test("^[0-9a-f]{64}$")) and
              (.packageSize > 0) and
              .source.provider == "github" and
              .source.repository == env.GITHUB_REPOSITORY and
              .source.repositoryId == (env.GITHUB_REPOSITORY_ID | tonumber) and
              .source.commit == env.GITHUB_SHA and
              .releaseManifest.protocol == "mahayana.external-release.v1" and
              .releaseManifest.artifacts[0].source.type == "https" and
              .releaseManifest.artifacts[0].source.url == $deployment and
              (.releaseManifestSha256 | test("^[0-9a-f]{64}$")))
          ' "$RUNNER_TEMP/browse.json" >/dev/null

          archive="$RUNNER_TEMP/$PLUGIN_ID-$PLUGIN_VERSION.tar.gz"
          "$cli" marketplace download "$PLUGIN_ID" --version "$PLUGIN_VERSION" --output "$archive" \
            2> >(tee "$RUNNER_TEMP/download.stderr" >&2) | tee "$RUNNER_TEMP/download.json"
          jq -e --arg id "$PLUGIN_ID" --arg version "$PLUGIN_VERSION" '
            .downloaded == true and .pluginId == $id and .version == $version
          ' "$RUNNER_TEMP/download.json" >/dev/null
          [ "$(sha256sum "$archive" | awk '{print $1}')" = "$(jq -r '.packageSha256' "$RUNNER_TEMP/download.json")" ]
          [ "$(stat -c '%s' "$archive")" = "$(jq -r '.packageSize' "$RUNNER_TEMP/download.json")" ]

          install_repo="$RUNNER_TEMP/installed-repository"
          mkdir -p "$install_repo"
          "$cli" marketplace install "$PLUGIN_ID" --version "$PLUGIN_VERSION" --repository "$install_repo" \
            2> >(tee "$RUNNER_TEMP/install.stderr" >&2) | tee "$RUNNER_TEMP/install.json"
          jq -e --arg id "$PLUGIN_ID" --arg version "$PLUGIN_VERSION" '
            .installed == true and .pluginId == $id and .version == $version and
            .source == "independent-pages-or-worker" and .validation.valid == true
          ' "$RUNNER_TEMP/install.json" >/dev/null
          test -f "$install_repo/.agents/plugins/plugins/$PLUGIN_ID/.codex-plugin/plugin.json"
          test -f "$install_repo/.agents/plugins/marketplace.json"

      - name: Run installed mini app command through Mahayana CLI
        shell: bash
        env:
          MAHAYANA_API_BASE_URL: ${{ steps.platform.outputs.url }}
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/third_party/mahayana/mahayana-rs/target/$CARGO_PROFILE/mahayana"
          install_repo="$RUNNER_TEMP/installed-repository"
          cd "$install_repo"
          "$cli" plugin run "$PLUGIN_ID" hello --json '{"name":"Actions"}' \
            2> >(tee "$RUNNER_TEMP/run.stderr" >&2) | tee "$RUNNER_TEMP/run.txt"
          grep -F 'Hello, Actions!' "$RUNNER_TEMP/run.txt"
          grep -F 'cloud-market-hello' "$RUNNER_TEMP/run.txt"

      - name: Revoke release and reject revoked version download and install
        shell: bash
        env:
          PLATFORM_URL: ${{ steps.platform.outputs.url }}
          MAHAYANA_API_BASE_URL: ${{ steps.platform.outputs.url }}
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/third_party/mahayana/mahayana-rs/target/$CARGO_PROFILE/mahayana"
          curl --fail --silent --show-error \
            --request POST "$PLATFORM_URL/v1/marketplace/plugins/$PLUGIN_ID/releases/$PLUGIN_VERSION/revoke" \
            --header "Authorization: Bearer $TEST_ACCOUNT_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"reason":"actions_revocation_test"}' \
            | tee "$RUNNER_TEMP/revoke.json"
          jq -e --arg id "$PLUGIN_ID" --arg version "$PLUGIN_VERSION" '
            .revoked == true and .pluginId == $id and .version == $version and
            .releaseStatus == "revoked" and .reason == "actions_revocation_test"
          ' "$RUNNER_TEMP/revoke.json" >/dev/null

          "$cli" marketplace browse \
            2> >(tee "$RUNNER_TEMP/after-revoke-browse.stderr" >&2) \
            | tee "$RUNNER_TEMP/after-revoke-browse.json"
          # Browse may legitimately fall back to an older approved release of the
          # same plugin. It must never advertise the version revoked above.
          jq -e --arg id "$PLUGIN_ID" --arg version "$PLUGIN_VERSION" '
            all(.plugins[];
              .pluginId != $id or
              (.latestVersion != $version and .releaseStatus == "approved")
            )
          ' \
            "$RUNNER_TEMP/after-revoke-browse.json" >/dev/null

          metadata_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/after-revoke-metadata.json" \
            --write-out '%{http_code}' \
            "$PLATFORM_URL/v1/marketplace/plugins/$PLUGIN_ID/releases/$PLUGIN_VERSION")"
          [ "$metadata_status" = "410" ]
          jq -e '.error == "release_revoked"' "$RUNNER_TEMP/after-revoke-metadata.json" >/dev/null

          download_status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/after-revoke-download.json" \
            --write-out '%{http_code}' \
            "$PLATFORM_URL/v1/marketplace/plugins/$PLUGIN_ID/releases/$PLUGIN_VERSION/download")"
          [ "$download_status" = "410" ]
          jq -e '.error == "release_revoked"' "$RUNNER_TEMP/after-revoke-download.json" >/dev/null

          revoked_archive="$RUNNER_TEMP/revoked-$PLUGIN_ID-$PLUGIN_VERSION.tar.gz"
          set +e
          "$cli" marketplace download "$PLUGIN_ID" --version "$PLUGIN_VERSION" --output "$revoked_archive" \
            >"$RUNNER_TEMP/after-revoke-cli-download.stdout" \
            2>"$RUNNER_TEMP/after-revoke-cli-download.stderr"
          cli_download_status="$?"
          revoked_install_repo="$RUNNER_TEMP/revoked-install-repository"
          mkdir -p "$revoked_install_repo"
          "$cli" marketplace install "$PLUGIN_ID" --version "$PLUGIN_VERSION" --repository "$revoked_install_repo" \
            >"$RUNNER_TEMP/after-revoke-cli-install.stdout" \
            2>"$RUNNER_TEMP/after-revoke-cli-install.stderr"
          cli_install_status="$?"
          set -e
          [ "$cli_download_status" -ne 0 ]
          [ "$cli_install_status" -ne 0 ]
          [ ! -e "$revoked_archive" ]
          [ ! -e "$revoked_install_repo/.agents/plugins/plugins/$PLUGIN_ID" ]

      - name: Record end-to-end evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mahayana-cloud-marketplace-e2e-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/platform-deploy.log
            ${{ runner.temp }}/platform-health.json
            ${{ runner.temp }}/artifact-deploy.log
            ${{ runner.temp }}/source-plugin.tar.gz
            ${{ runner.temp }}/served-plugin.tar.gz
            ${{ runner.temp }}/publish.log
            ${{ runner.temp }}/publish.json
            ${{ runner.temp }}/plugin-index.html
            ${{ runner.temp }}/plugin-site.json
            ${{ runner.temp }}/plugin-source.json
            ${{ runner.temp }}/release-manifest.json
            ${{ runner.temp }}/site-plugin.tar.gz
            ${{ runner.temp }}/browse.json
            ${{ runner.temp }}/browse.stderr
            ${{ runner.temp }}/download.json
            ${{ runner.temp }}/download.stderr
            ${{ runner.temp }}/install.json
            ${{ runner.temp }}/install.stderr
            ${{ runner.temp }}/run.txt
            ${{ runner.temp }}/run.stderr
            ${{ runner.temp }}/duplicate-version.tar.gz
            ${{ runner.temp }}/duplicate-version-response.json
            ${{ runner.temp }}/duplicate-version.stdout
            ${{ runner.temp }}/duplicate-version.stderr
            ${{ runner.temp }}/revoke.json
            ${{ runner.temp }}/after-revoke-browse.json
            ${{ runner.temp }}/after-revoke-browse.stderr
            ${{ runner.temp }}/after-revoke-metadata.json
            ${{ runner.temp }}/after-revoke-download.json
            ${{ runner.temp }}/after-revoke-cli-download.stdout
            ${{ runner.temp }}/after-revoke-cli-download.stderr
            ${{ runner.temp }}/after-revoke-cli-install.stdout
            ${{ runner.temp }}/after-revoke-cli-install.stderr
