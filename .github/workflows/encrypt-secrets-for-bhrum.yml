name: Encrypt org secrets for bhrum repositories

on:
  push:
    branches:
      - ops/share-secrets-to-bhrum-user-20260920
    paths:
      - '.github/workflows/encrypt-secrets-for-bhrum.yml'
      - '.github/secret-migration/bhrum-targets.json'

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
          ACCESS_TOKEN_PUBLIC_KEY_PEM: ${{ secrets.ACCESS_TOKEN_PUBLIC_KEY_PEM }}
          ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          AUTH_SYSTEM_MAIL_TOKEN: ${{ secrets.AUTH_SYSTEM_MAIL_TOKEN }}
          AUTH_SYSTEM_MAIL_URL: ${{ secrets.AUTH_SYSTEM_MAIL_URL }}
          CHATGPT_ANDROID_APK_SHA256: ${{ secrets.CHATGPT_ANDROID_APK_SHA256 }}
          CHATGPT_ANDROID_APK_URL: ${{ secrets.CHATGPT_ANDROID_APK_URL }}
          CHATGPT_ANDROID_PROBE_URL: ${{ secrets.CHATGPT_ANDROID_PROBE_URL }}
          CHATGPT_AUTO_CONFIRM_STATE_KEY: ${{ secrets.CHATGPT_AUTO_CONFIRM_STATE_KEY }}
          CHATGPT_CODEX_AUTH_B64: ${{ secrets.CHATGPT_CODEX_AUTH_B64 }}
          CHATGPT_SESSION_COOKIES_B64: ${{ secrets.CHATGPT_SESSION_COOKIES_B64 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
          FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
          FABUSHI_PAY_ADMIN_TOKEN: ${{ secrets.FABUSHI_PAY_ADMIN_TOKEN }}
          FABUSHI_PAY_WEBHOOK_SECRET: ${{ secrets.FABUSHI_PAY_WEBHOOK_SECRET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          MACOS_APP_STORE_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_P12_BASE64 }}
          MACOS_APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_PASSWORD }}
          MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MACOS_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          OFFICIAL_SITE_RELEASE_PAT: ${{ secrets.OFFICIAL_SITE_RELEASE_PAT }}
          STAGING_TEST_LOGIN: ${{ secrets.STAGING_TEST_LOGIN }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TEST_ACCOUNT_TOKEN: ${{ secrets.TEST_ACCOUNT_TOKEN }}
          VERSION_POLICY_AUTOMATION_TOKEN: ${{ secrets.VERSION_POLICY_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Install sealed-box dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pynacl

      - name: Encrypt all 48 secrets for all bhrum repositories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          names = json.loads(r'''["ACCESS_TOKEN_PUBLIC_KEY_PEM","ALIPAY_PRIVATE_KEY","ANDROID_KEYSTORE_BASE64","ANDROID_KEYSTORE_PASSWORD","ANDROID_KEY_ALIAS","ANDROID_KEY_PASSWORD","APPLE_ISSUER_ID","APPLE_KEY_ID","APPLE_PRIVATE_KEY","APP_STORE_CONNECT_API_ISSUER_ID","APP_STORE_CONNECT_API_KEY_BASE64","APP_STORE_CONNECT_API_KEY_ID","AUTH_SYSTEM_MAIL_TOKEN","AUTH_SYSTEM_MAIL_URL","CHATGPT_ANDROID_APK_SHA256","CHATGPT_ANDROID_APK_URL","CHATGPT_ANDROID_PROBE_URL","CHATGPT_AUTO_CONFIRM_STATE_KEY","CHATGPT_CODEX_AUTH_B64","CHATGPT_SESSION_COOKIES_B64","CLOUDFLARE_API_TOKEN","FABUSHI_CI_TEST_PASSWORD","FABUSHI_CI_TEST_USERNAME","FABUSHI_PAY_ADMIN_TOKEN","FABUSHI_PAY_WEBHOOK_SECRET","FIREBASE_PROJECT_ID","GCP_SERVICE_ACCOUNT","GCP_WORKLOAD_IDENTITY_PROVIDER","GOOGLE_PLAY_SERVICE_ACCOUNT_JSON","IOS_CERTIFICATE_P12_BASE64","IOS_CERTIFICATE_PASSWORD","IOS_PROVISIONING_PROFILE_BASE64","IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64","MACOS_APP_STORE_CERTIFICATE_P12_BASE64","MACOS_APP_STORE_CERTIFICATE_PASSWORD","MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12_BASE64","MACOS_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD","MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64","MACOS_CERTIFICATE_P12_BASE64","MACOS_CERTIFICATE_PASSWORD","MACOS_CODESIGN_IDENTITY","OFFICIAL_SITE_RELEASE_PAT","STAGING_TEST_LOGIN","STAGING_TEST_PASSWORD","STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET","TEST_ACCOUNT_TOKEN","VERSION_POLICY_AUTOMATION_TOKEN"]''')
          targets = json.loads(Path('.github/secret-migration/bhrum-targets.json').read_text())
          out = Path('encrypted-bhrum-repo-secrets')
          out.mkdir(parents=True, exist_ok=True)

          missing = [name for name in names if os.environ.get(name, '') == '']
          if missing:
              raise SystemExit('Missing source organization secrets: ' + ','.join(missing))

          count = 0
          for target in targets:
              repo = target['repo']
              key = PublicKey(base64.b64decode(target['key']))
              box = SealedBox(key)
              repo_dir = out / repo
              repo_dir.mkdir(parents=True, exist_ok=True)
              for name in names:
                  plaintext = os.environ[name].encode('utf-8')
                  encrypted = base64.b64encode(box.encrypt(plaintext)).decode('ascii')
                  (repo_dir / f'{name}.json').write_text(json.dumps({
                      'encrypted_value': encrypted,
                      'key_id': target['key_id'],
                  }, separators=(',', ':')))
                  count += 1

          (out / 'manifest.json').write_text(json.dumps({
              'repositories': len(targets),
              'secrets': len(names),
              'payloads': count,
          }, separators=(',', ':')))
          print(f'encrypted repositories={len(targets)} secrets={len(names)} payloads={count}')
          PY

      - name: Upload encrypted payloads only
        uses: actions/upload-artifact@v7
        with:
          name: bhrum-repository-secret-ciphertexts
          path: encrypted-bhrum-repo-secrets
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
