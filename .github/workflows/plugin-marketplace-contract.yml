name: Plugin Marketplace Contract

on:
  pull_request:
    paths:
      - '.agents/plugins/**'
      - 'frontend/apps/web/public/.well-known/mahayana/**'
      - 'scripts/check-official-plugin-marketplace.py'
      - 'third_party/mahayana/mahayana-rs/mahayana-cli/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-product/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/**'
      - 'examples/mahayana-cloud-marketplace/**'
      - '.github/workflows/mahayana-cloud-marketplace-e2e.yml'
      - '.github/workflows/plugin-marketplace-contract.yml'
  push:
    branches: [main]
    paths:
      - '.agents/plugins/**'
      - 'frontend/apps/web/public/.well-known/mahayana/**'
      - 'scripts/check-official-plugin-marketplace.py'
      - 'third_party/mahayana/mahayana-rs/mahayana-cli/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-product/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/**'
      - 'examples/mahayana-cloud-marketplace/**'
      - '.github/workflows/mahayana-cloud-marketplace-e2e.yml'
      - '.github/workflows/plugin-marketplace-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-installed-runtime:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mahayana-marketplace-parallel-20260726-r16
          fetch-depth: 0
      - name: Apply installed plugin runtime fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          ffi = Path('third_party/mahayana/mahayana-rs/mahayana-ffi/src/lib.rs')
          text = ffi.read_text(encoding='utf-8')
          old_line = '            bundled_plugin_ids: mini_apps.iter().map(|app| app.plugin_id.clone()).collect(),\n'
          replacement = '''            bundled_plugin_ids: bundled_marketplace_plugin_ids(
                  create.bundled_plugin_marketplace.as_deref(),
                  &mini_apps,
              )?,
          '''
          if old_line in text:
              text = text.replace(old_line, replacement, 1)
          elif 'bundled_marketplace_plugin_ids(' not in text:
              raise SystemExit('unexpected bundled plugin id assignment')

          helper_marker = 'fn discover_mini_apps(client: &MahayanaProductClient) -> Option<Vec<MiniAppDefinition>> {'
          helper = '''fn bundled_marketplace_plugin_ids(
              marketplace_root: Option<&std::path::Path>,
              mini_apps: &[MiniAppDefinition],
          ) -> Result<Vec<String>, String> {
              let Some(marketplace_root) = marketplace_root else {
                  return Ok(Vec::new());
              };
              let mut plugin_ids = Vec::new();
              for mini_app in mini_apps {
                  let plugin_id = mini_app.plugin_id.as_str();
                  if plugin_id.is_empty()
                      || !plugin_id
                          .bytes()
                          .all(|byte| byte.is_ascii_alphanumeric() || byte == b'-')
                  {
                      return Err(format!("invalid bundled plugin id: {plugin_id}"));
                  }
                  if marketplace_root
                      .join("plugins")
                      .join(plugin_id)
                      .join(".codex-plugin/plugin.json")
                      .is_file()
                  {
                      plugin_ids.push(plugin_id.to_string());
                  }
              }
              Ok(plugin_ids)
          }

          '''
          if 'fn bundled_marketplace_plugin_ids(' not in text:
              if text.count(helper_marker) != 1:
                  raise SystemExit('unexpected discover_mini_apps marker')
              text = text.replace(helper_marker, helper + helper_marker, 1)

          test_marker = '    #[test]\n    fn lifecycle_abi_creates_executes_receives_and_closes() {'
          regression = '''    #[test]
              fn bundled_marketplace_enables_only_plugins_present_on_disk() {
                  let unique = std::time::SystemTime::now()
                      .duration_since(std::time::UNIX_EPOCH)
                      .expect("system time")
                      .as_nanos();
                  let root = std::env::temp_dir().join(format!(
                      "mahayana-ffi-marketplace-{}-{unique}",
                      std::process::id()
                  ));
                  let manifest = root.join("plugins/cloud-market-hello/.codex-plugin/plugin.json");
                  std::fs::create_dir_all(manifest.parent().expect("manifest parent"))
                      .expect("create plugin tree");
                  std::fs::write(&manifest, "{}").expect("write plugin manifest");

                  let mini_apps = vec![
                      MiniAppDefinition {
                          plugin_id: "cloud-market-hello".into(),
                          title: "Cloud Market Hello".into(),
                          pinned: false,
                      },
                      MiniAppDefinition {
                          plugin_id: "bot-father".into(),
                          title: "Bot Father".into(),
                          pinned: false,
                      },
                  ];
                  let plugin_ids = bundled_marketplace_plugin_ids(Some(&root), &mini_apps)
                      .expect("bundled plugin ids");
                  assert_eq!(plugin_ids, vec!["cloud-market-hello"]);
                  std::fs::remove_dir_all(root).expect("remove plugin tree");
              }

          '''
          if 'fn bundled_marketplace_enables_only_plugins_present_on_disk()' not in text:
              if text.count(test_marker) != 1:
                  raise SystemExit('unexpected lifecycle test marker')
              text = text.replace(test_marker, regression + test_marker, 1)

          ffi.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit source-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add third_party/mahayana/mahayana-rs/mahayana-ffi/src/lib.rs
          git commit -m "Fix installed marketplace plugin runtime"
          git push origin HEAD:codex/mahayana-marketplace-parallel-20260726-r16

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate official marketplace contract
        run: python3 scripts/check-official-plugin-marketplace.py

  cloud-marketplace-e2e:
    uses: ./.github/workflows/mahayana-cloud-marketplace-e2e.yml
    secrets: inherit