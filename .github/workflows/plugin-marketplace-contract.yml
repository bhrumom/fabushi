name: Plugin Marketplace Contract

on:
  pull_request:
    paths:
      - '.agents/plugins/**'
      - 'frontend/apps/web/public/.well-known/mahayana/**'
      - 'scripts/check-official-plugin-marketplace.py'
      - 'third_party/mahayana/mahayana-rs/mahayana-cli/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-ffi/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-product/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/**'
      - 'examples/mahayana-cloud-marketplace/**'
      - '.github/workflows/mahayana-cloud-marketplace-e2e.yml'
      - '.github/workflows/plugin-marketplace-contract.yml'
  push:
    branches: [main]
    paths:
      - '.agents/plugins/**'
      - 'frontend/apps/web/public/.well-known/mahayana/**'
      - 'scripts/check-official-plugin-marketplace.py'
      - 'third_party/mahayana/mahayana-rs/mahayana-cli/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-ffi/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-product/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/**'
      - 'examples/mahayana-cloud-marketplace/**'
      - '.github/workflows/mahayana-cloud-marketplace-e2e.yml'
      - '.github/workflows/plugin-marketplace-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate official marketplace contract
        run: python3 scripts/check-official-plugin-marketplace.py

  persist-marketplace-fixes:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && hashFiles('.github/workflows/temporary-marketplace-finalize.yml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mahayana-marketplace-parallel-20260726-r16
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Persist product fix and remove temporary bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          product = Path('third_party/mahayana/mahayana-rs/mahayana-product/src/lib.rs')
          source = product.read_text(encoding='utf-8')
          old = '''    let message = serde_json::from_str::<Value>(&body)
              .ok()
              .and_then(|value| {
                  value
                      .get("error")
                      .or_else(|| value.get("message"))
                      .and_then(Value::as_str)
                      .map(str::to_string)
              })
              .unwrap_or(body);
          '''
          new = '''    let message = serde_json::from_str::<Value>(&body)
              .ok()
              .and_then(|value| {
                  let code = value.get("error").and_then(Value::as_str);
                  let detail = value.get("message").and_then(Value::as_str);
                  match (code, detail) {
                      (Some(code), Some(detail)) if code != detail => {
                          Some(format!("{code}: {detail}"))
                      }
                      (Some(code), _) => Some(code.to_string()),
                      (_, Some(detail)) => Some(detail.to_string()),
                      _ => None,
                  }
              })
              .unwrap_or(body);
          '''
          if source.count(old) != 1:
              raise SystemExit('unexpected product error decoder')
          product.write_text(source.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/mahayana-cloud-marketplace-e2e.yml')
          source = workflow.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n          from pathlib import Path\n\n          path = Path(\"third_party/mahayana/mahayana-rs/mahayana-product/src/lib.rs\")\n"
          start = source.index(marker)
          end = source.index("          PY\n", start) + len("          PY\n")
          workflow.write_text(source[:start] + source[end:], encoding='utf-8')
          PY
          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all
          git rm -- .github/workflows/temporary-marketplace-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .github/workflows/mahayana-cloud-marketplace-e2e.yml third_party/mahayana/mahayana-rs/mahayana-product/src/lib.rs
          git diff --cached --check
          git commit -m "Persist marketplace API diagnostics"
          git push origin HEAD:codex/mahayana-marketplace-parallel-20260726-r16

  cloud-marketplace-e2e:
    needs: contract
    uses: ./.github/workflows/mahayana-cloud-marketplace-e2e.yml
    secrets: inherit