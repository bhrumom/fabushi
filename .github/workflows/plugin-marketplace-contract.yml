name: Plugin Marketplace Contract

on:
  pull_request:
    paths:
      - '.agents/plugins/marketplace.json'
      - '.agents/plugins/plugins/**/.codex-plugin/plugin.json'
      - '.agents/plugins/plugins/**/.mahayana/plugin.json'
      - '.agents/plugins/plugins/**/.mcp.json'
      - 'frontend/apps/web/public/.well-known/mahayana/**'
      - 'scripts/check-official-plugin-marketplace.py'
      - 'third_party/mahayana/mahayana-rs/mahayana-cli/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-ffi/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-product/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/**'
      - 'examples/mahayana-cloud-marketplace/**'
      - '.github/workflows/mahayana-cloud-marketplace-e2e.yml'
  push:
    branches: [main]
    paths:
      - '.agents/plugins/marketplace.json'
      - '.agents/plugins/plugins/**/.codex-plugin/plugin.json'
      - '.agents/plugins/plugins/**/.mahayana/plugin.json'
      - '.agents/plugins/plugins/**/.mcp.json'
      - 'frontend/apps/web/public/.well-known/mahayana/**'
      - 'scripts/check-official-plugin-marketplace.py'
      - 'third_party/mahayana/mahayana-rs/mahayana-cli/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-ffi/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-product/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/**'
      - 'examples/mahayana-cloud-marketplace/**'
      - '.github/workflows/mahayana-cloud-marketplace-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate official marketplace contract
        run: python3 scripts/check-official-plugin-marketplace.py

  untrusted-fork-pr-security:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout untrusted pull request without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove secretless read-only pull request boundaries
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$EVENT_NAME" = "pull_request" ]
          [ -n "$HEAD_REPOSITORY" ]
          [ -n "$BASE_REPOSITORY" ]
          [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]
          [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]
          ! grep -R --line-number --fixed-strings 'pull_request_target:' \
            .github/workflows/plugin-marketplace-contract.yml \
            .github/workflows/mahayana-cloud-marketplace-e2e.yml
          python3 scripts/check-official-plugin-marketplace.py

  cloud-marketplace-e2e:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/mahayana-cloud-marketplace-e2e.yml
    secrets: inherit
