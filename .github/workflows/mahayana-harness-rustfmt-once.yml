name: Mahayana Harness lifecycle once

on:
  push:
    branches:
      - feat/mahayana-deepseek-harness-rust
    paths:
      - .github/workflows/mahayana-harness-rustfmt-once.yml
      - third_party/mahayana/mahayana-rs/mahayana-feature-host/**

permissions:
  contents: write

jobs:
  wire-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mahayana-deepseek-harness-rust
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Wire ProductHarness into FeatureHostController
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('third_party/mahayana/mahayana-rs/mahayana-feature-host/src/implementation.rs')
          s = p.read_text()

          s = s.replace(
              'use base64::Engine as _;\n',
              'use crate::ProductHarness;\nuse mahayana_core::BuildProfile;\n\nuse base64::Engine as _;\n',
              1,
          ) if 'use crate::ProductHarness;' not in s else s

          s = s.replace(
              'pub struct FeatureHostController {\n    config: HostConfig,\n    info: HostInfo,\n',
              'pub struct FeatureHostController {\n    config: HostConfig,\n    info: HostInfo,\n    harness: ProductHarness,\n',
              1,
          ) if '    harness: ProductHarness,\n' not in s else s

          helper = '''fn harness_profile_for_surface(platform: SurfacePlatform) -> BuildProfile {
              match platform {
                  SurfacePlatform::Ios | SurfacePlatform::Android | SurfacePlatform::Flutter => BuildProfile::MobileEmbedded,
                  SurfacePlatform::Wasm => BuildProfile::WebWasm,
                  SurfacePlatform::Mock | SurfacePlatform::Electron | SurfacePlatform::Tauri => BuildProfile::DesktopFull,
              }
          }

          '''
          s = s.replace('impl FeatureHostController {\n', helper + 'impl FeatureHostController {\n', 1) if 'fn harness_profile_for_surface(' not in s else s

          s = s.replace(
              '''        state.events.push_back(HostEvent::HostReady {
                      timestamp: timestamp(),
                      info: info.clone(),
                  });
                  Self {
                      config,
                      info,
          ''',
              '''        state.events.push_back(HostEvent::HostReady {
                      timestamp: timestamp(),
                      info: info.clone(),
                  });
                  let harness = ProductHarness::new(harness_profile_for_surface(platform));
                  Self {
                      config,
                      info,
                      harness,
          ''',
              1,
          ) if 'let harness = ProductHarness::new(harness_profile_for_surface(platform));\n        Self {' not in s else s

          s = s.replace(
              '''        state.events.push_back(HostEvent::HostReady {
                      timestamp: timestamp(),
                      info: info.clone(),
                  });
                  Ok(Self {
                      config,
                      info,
                      runtime: Some(runtime),
          ''',
              '''        state.events.push_back(HostEvent::HostReady {
                      timestamp: timestamp(),
                      info: info.clone(),
                  });
                  let harness = ProductHarness::new(harness_profile_for_surface(platform));
                  Ok(Self {
                      config,
                      info,
                      harness,
                      runtime: Some(runtime),
          ''',
              1,
          ) if 'let harness = ProductHarness::new(harness_profile_for_surface(platform));\n        Ok(Self {' not in s else s

          s = s.replace(
              '''    pub fn info(&self) -> HostInfo {
                  self.info.clone()
              }
          ''',
              '''    pub fn harness(&self) -> &ProductHarness {
                  &self.harness
              }

              pub fn info(&self) -> HostInfo {
                  self.info.clone()
              }
          ''',
              1,
          ) if 'pub fn harness(&self) -> &ProductHarness' not in s else s

          required = [
              'use crate::ProductHarness;',
              'harness: ProductHarness,',
              'fn harness_profile_for_surface(',
              'pub fn harness(&self) -> &ProductHarness',
          ]
          missing = [needle for needle in required if needle not in s]
          if missing:
              raise SystemExit(f'lifecycle patch did not apply: {missing}')
          if s.count('harness,') < 2:
              raise SystemExit('lifecycle patch did not initialize both test and production constructors')

          p.write_text(s)
          PY

      - name: Format Rust
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo fmt --all

      - name: Commit lifecycle wiring
        shell: bash
        run: |
          if git diff --quiet -- third_party/mahayana/mahayana-rs/mahayana-feature-host; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/mahayana/mahayana-rs/mahayana-feature-host
          git commit -m "feat(mahayana): wire harness into feature Host lifecycle"
          git push origin HEAD:feat/mahayana-deepseek-harness-rust
