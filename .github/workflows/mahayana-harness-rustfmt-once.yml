name: Mahayana Harness rustfmt once

on:
  pull_request:
    paths:
      - third_party/mahayana/mahayana-rs/mahayana-harness/**
      - third_party/mahayana/mahayana-rs/mahayana-harness-services/**
      - third_party/mahayana/mahayana-rs/mahayana-harness-adapters/**
      - third_party/mahayana/mahayana-rs/mahayana-feature-host/src/harness.rs
      - third_party/mahayana/mahayana-rs/mahayana-feature-host/src/product_harness.rs
      - .github/workflows/mahayana-harness-rustfmt-once.yml

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mahayana-deepseek-harness-rust
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Export extended harness adapters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('third_party/mahayana/mahayana-rs/mahayana-harness-adapters/src/lib.rs')
          text = path.read_text()
          marker = 'use async_trait::async_trait;\n'
          export = 'mod extended;\npub use extended::*;\n\n'
          if export not in text:
              text = text.replace(marker, export + marker, 1)
              path.write_text(text)
          PY

      - name: Format harness migration
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo fmt --all

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- third_party/mahayana/mahayana-rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/mahayana/mahayana-rs
          git commit -m "chore(mahayana): wire and rustfmt harness adapters"
          git push origin HEAD:feat/mahayana-deepseek-harness-rust
