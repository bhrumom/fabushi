name: One-shot Mahayana router repair

on:
  push:
    branches:
      - fix/desktop-release-auth-recovery
    paths:
      - .github/workflows/repair-mahayana-router-once.yml
      - .github/scripts/repair-mahayana-router-once.mjs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/desktop-release-auth-recovery
          fetch-depth: 0

      - name: Apply deterministic router repair
        run: node .github/scripts/repair-mahayana-router-once.mjs

      - name: Verify duplicate routes are gone
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --package mahayana-platform-worker worker_router_rejects_duplicate_developer_commerce_regressions

      - name: Remove one-shot repair machinery and commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name fabushi-ci
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/repair-mahayana-router-once.yml .github/scripts/repair-mahayana-router-once.mjs
          git add third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api.rs third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/schema_tests.rs
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git commit -m 'fix(auth): remove duplicate Mahayana Worker routes'
          git push origin HEAD:fix/desktop-release-auth-recovery
