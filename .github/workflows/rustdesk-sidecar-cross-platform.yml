name: RustDesk sidecar cross-platform

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

on:
  pull_request:
    paths:
      - 'integrations/rustdesk-sidecar/**'
      - '.github/workflows/rustdesk-sidecar-cross-platform.yml'
      - 'desktop/electron/rustdesk-*.cjs'
      - 'desktop/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustdesk-sidecar-cross-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64 native provider
            os: macos-14
            triplet: x64-osx
            target: x86_64-apple-darwin
            suffix: ''
          - name: Windows x64 native provider
            os: windows-2022
            triplet: x64-windows-static
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Verify immutable AGPL upstream provenance
        run: |
          grep -Fx 'repository=https://github.com/rustdesk/rustdesk.git' integrations/rustdesk-sidecar/UPSTREAM.lock
          grep -Fx 'commit=f28ac38ccfa662fd06639a062e0d06249860b142' integrations/rustdesk-sidecar/UPSTREAM.lock
          grep -Fx 'license=AGPL-3.0-only' integrations/rustdesk-sidecar/UPSTREAM.lock
      - name: Prepare pinned corresponding source
        run: bash integrations/rustdesk-sidecar/prepare-source.sh "$RUNNER_TEMP/rustdesk-sidecar"
      - name: Export Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
      - name: Install upstream native dependencies
        working-directory: ${{ runner.temp }}/rustdesk-sidecar
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
        run: $VCPKG_ROOT/vcpkg install --triplet "${{ matrix.triplet }}" --x-install-root="$VCPKG_ROOT/installed"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Compile isolated AGPL provider overlay
        working-directory: ${{ runner.temp }}/rustdesk-sidecar
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
        run: |
          cargo check --locked --target "${{ matrix.target }}" --bin fabushi-sidecar
          cargo check --locked --target "${{ matrix.target }}" --bin fabushi-host-bootstrap
          cargo check --locked --target "${{ matrix.target }}" --bin fabushi-host-daemon
          cargo build --locked --release --target "${{ matrix.target }}" --bin fabushi-sidecar
          cargo build --locked --release --target "${{ matrix.target }}" --bin fabushi-host-bootstrap
          cargo build --locked --release --target "${{ matrix.target }}" --bin fabushi-host-daemon
      - name: Verify provider artifacts
        working-directory: ${{ runner.temp }}/rustdesk-sidecar
        run: |
          test -s "target/${{ matrix.target }}/release/fabushi-sidecar${{ matrix.suffix }}"
          test -s "target/${{ matrix.target }}/release/fabushi-host-bootstrap${{ matrix.suffix }}"
          test -s "target/${{ matrix.target }}/release/fabushi-host-daemon${{ matrix.suffix }}"
      - name: Upload native provider proof
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-sidecar-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/rustdesk-sidecar/target/${{ matrix.target }}/release/fabushi-sidecar${{ matrix.suffix }}
            ${{ runner.temp }}/rustdesk-sidecar/target/${{ matrix.target }}/release/fabushi-host-bootstrap${{ matrix.suffix }}
            ${{ runner.temp }}/rustdesk-sidecar/target/${{ matrix.target }}/release/fabushi-host-daemon${{ matrix.suffix }}
            ${{ runner.temp }}/rustdesk-sidecar/FABUSHI-SIDECAR-SOURCE.txt
            integrations/rustdesk-sidecar/UPSTREAM.lock
            integrations/rustdesk-sidecar/README.md
