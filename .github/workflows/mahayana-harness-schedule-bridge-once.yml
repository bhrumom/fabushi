name: Mahayana Harness final integration once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mahayana-harness-schedule-bridge-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply final Harness product integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/mahayana-harness-finalize-pr-once.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          if marker not in source:
              raise SystemExit('finalizer source block not found')
          body = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(body), {'__name__': '__main__'})
          PY

      - name: Format and verify all Harness crates
        working-directory: third_party/mahayana/mahayana-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          cargo test --profile ci \
            -p mahayana-harness \
            -p mahayana-harness-services \
            -p mahayana-harness-advanced \
            -p mahayana-harness-adapters \
            -p mahayana-harness-agent \
            -p mahayana-harness-protocol \
            -p mahayana-unified-app-host
          cargo clippy \
            -p mahayana-harness \
            -p mahayana-harness-services \
            -p mahayana-harness-advanced \
            -p mahayana-harness-adapters \
            -p mahayana-harness-agent \
            -p mahayana-harness-protocol \
            -p mahayana-unified-app-host \
            --all-targets -- -D warnings

      - name: Commit verified integration and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mahayana-harness-schedule-bridge-once.yml
          rm -f .github/workflows/mahayana-harness-finalize-once.yml
          rm -f .github/workflows/mahayana-harness-finalize-pr-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(mahayana): finalize Rust-native Harness product integration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
