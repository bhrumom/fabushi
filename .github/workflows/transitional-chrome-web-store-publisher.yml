name: Transitional Chrome Web Store publisher

on:
  workflow_dispatch:
    inputs:
      source_repo:
        required: true
        default: bhrumom/fabushi-chrome-extension
        type: string
      tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: chrome-web-store
    env:
      SOURCE_REPO: ${{ inputs.source_repo }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      CHROME_WEBSTORE_PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
      CHROME_WEBSTORE_EXTENSION_ID: ${{ secrets.FABUSHI_CHROME_EXTENSION_ID }}
      CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
      CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
      CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}

    steps:
      - name: Download and verify canonical Chrome release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$SOURCE_REPO" = "bhrumom/fabushi-chrome-extension"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          resolved="$(gh api "repos/$SOURCE_REPO/commits/$RELEASE_TAG" --jq '.sha')"
          test "$resolved" = "$SOURCE_SHA"

          mkdir -p release verify evidence
          gh release download "$RELEASE_TAG" --repo "$SOURCE_REPO" --dir release             --pattern 'fabushi-chrome-*.zip'             --pattern 'fabushi-chrome-*.zip.sha256'             --pattern 'fabushi-chrome-*.content-sha256'

          zip_path="$(find release -maxdepth 1 -type f -name 'fabushi-chrome-*.zip' -print -quit)"
          test -n "$zip_path"
          unzip -q "$zip_path" -d verify

          version="$(node -p "require('./verify/manifest.json').version")"
          test "$RELEASE_TAG" = "v$version"
          test "$(node -p "require('./verify/fabushi-build-provenance.json').sourceSha")" = "$SOURCE_SHA"
          (cd release && sha256sum -c "fabushi-chrome-$version.zip.sha256")
          archive_sha="$(sha256sum "$zip_path" | awk '{print $1}')"

          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE_SHA=$archive_sha" >> "$GITHUB_ENV"

      - name: Upload and submit to Chrome Web Store
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CHROME_WEBSTORE_PUBLISHER_ID"
          test -n "$CHROME_WEBSTORE_EXTENSION_ID"
          test -n "$CHROME_WEBSTORE_CLIENT_ID"
          test -n "$CHROME_WEBSTORE_CLIENT_SECRET"
          test -n "$CHROME_WEBSTORE_REFRESH_TOKEN"
          set +x

          token_response="$(curl --fail-with-body --silent --show-error --request POST             --header 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode "client_id=$CHROME_WEBSTORE_CLIENT_ID"             --data-urlencode "client_secret=$CHROME_WEBSTORE_CLIENT_SECRET"             --data-urlencode "refresh_token=$CHROME_WEBSTORE_REFRESH_TOKEN"             --data-urlencode 'grant_type=refresh_token'             https://oauth2.googleapis.com/token)"
          access_token="$(jq -r '.access_token // empty' <<<"$token_response")"
          test -n "$access_token"

          item_name="publishers/$CHROME_WEBSTORE_PUBLISHER_ID/items/$CHROME_WEBSTORE_EXTENSION_ID"
          upload_file="$(mktemp)"
          upload_http="$(curl --silent --show-error --request POST             --header "Authorization: Bearer $access_token"             --header 'Content-Type: application/zip'             --data-binary "@$ZIP_PATH"             --output "$upload_file"             --write-out '%{http_code}'             "https://chromewebstore.googleapis.com/upload/v2/$item_name:upload")"
          jq --arg status "$upload_http" '{httpStatus:($status|tonumber),response:.}' "$upload_file" > evidence/upload.json
          [[ "$upload_http" =~ ^2 ]]

          upload_state="$(jq -r '.uploadState // empty' "$upload_file")"
          for attempt in $(seq 1 90); do
            [ "$upload_state" = "SUCCEEDED" ] && break
            [ "$upload_state" = "FAILED" ] && exit 1
            sleep 20
            status_json="$(curl --fail-with-body --silent --show-error               --header "Authorization: Bearer $access_token"               "https://chromewebstore.googleapis.com/v2/$item_name:fetchStatus")"
            jq '{name,itemId,lastAsyncUploadState,publishedItemRevisionStatus,submittedItemRevisionStatus,takenDown,warned}'               <<<"$status_json" > evidence/status.json
            upload_state="$(jq -r '.lastAsyncUploadState // empty' <<<"$status_json")"
          done
          test "$upload_state" = "SUCCEEDED"

          publish_json="$(curl --fail-with-body --silent --show-error --request POST             --header "Authorization: Bearer $access_token"             --header 'Content-Type: application/json'             --data '{"publishType":"DEFAULT_PUBLISH","skipReview":false,"blockOnWarnings":true}'             "https://chromewebstore.googleapis.com/v2/$item_name:publish")"
          jq '{name,itemId,state,warningInfo}' <<<"$publish_json" > evidence/publish.json
          publish_state="$(jq -r '.state // empty' <<<"$publish_json")"
          case "$publish_state" in
            PENDING_REVIEW|STAGED|PUBLISHED) ;;
            *) echo "Unexpected publish state: $publish_state" >&2; exit 1 ;;
          esac
          echo "publish_state=$publish_state" >> "$GITHUB_OUTPUT"

      - name: Record redacted provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          jq -n             --arg sourceRepo "$SOURCE_REPO"             --arg tag "$RELEASE_TAG"             --arg sourceSha "$SOURCE_SHA"             --arg version "${VERSION:-}"             --arg archiveSha "${ARCHIVE_SHA:-}"             --arg extensionId "${CHROME_WEBSTORE_EXTENSION_ID:-not-configured}"             --arg publisherId "${CHROME_WEBSTORE_PUBLISHER_ID:-not-configured}"             --arg publishState "${{ steps.submit.outputs.publish_state || '' }}"             '{schemaVersion:1,sourceRepo:$sourceRepo,tag:$tag,sourceSha:$sourceSha,version:$version,archiveSha256:$archiveSha,extensionId:$extensionId,publisherId:$publisherId,publishState:$publishState}'             > evidence/provenance.json

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transitional-chrome-web-store-publish-${{ inputs.tag }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 90
