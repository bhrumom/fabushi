name: MSR marketplace evidence restore

on:
  pull_request:
    paths:
      - .github/workflows/msr-marketplace-evidence-restore.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-evidence:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/msr-sovereign-runtime-final
          fetch-depth: 0

      - name: Restore evidence upload and remove helper
        shell: bash
        run: |
          set -euo pipefail
          target=.github/workflows/mahayana-cloud-marketplace-e2e.yml
          if grep -q 'name: Record end-to-end evidence' "$target"; then
            echo 'Evidence block already present.'
          else
            cat >> "$target" <<'YAML'

      - name: Record end-to-end evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mahayana-cloud-marketplace-e2e-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/platform-deploy.log
            ${{ runner.temp }}/platform-health.json
            ${{ runner.temp }}/artifact-r2-put.log
            ${{ runner.temp }}/source-plugin.tar.gz
            ${{ runner.temp }}/served-plugin.tar.gz
            ${{ runner.temp }}/publish.log
            ${{ runner.temp }}/publish.json
            ${{ runner.temp }}/plugin-index.html
            ${{ runner.temp }}/plugin-site.json
            ${{ runner.temp }}/plugin-source.json
            ${{ runner.temp }}/release-manifest.json
            ${{ runner.temp }}/site-plugin.tar.gz
            ${{ runner.temp }}/browse.json
            ${{ runner.temp }}/browse.stderr
            ${{ runner.temp }}/download.json
            ${{ runner.temp }}/download.stderr
            ${{ runner.temp }}/install.json
            ${{ runner.temp }}/install.stderr
            ${{ runner.temp }}/run.txt
            ${{ runner.temp }}/run.stderr
            ${{ runner.temp }}/duplicate-version.tar.gz
            ${{ runner.temp }}/duplicate-version-response.json
            ${{ runner.temp }}/duplicate-version.stdout
            ${{ runner.temp }}/duplicate-version.stderr
            ${{ runner.temp }}/revoke.json
            ${{ runner.temp }}/after-revoke-browse.json
            ${{ runner.temp }}/after-revoke-browse.stderr
            ${{ runner.temp }}/after-revoke-metadata.json
            ${{ runner.temp }}/after-revoke-download.json
            ${{ runner.temp }}/after-revoke-cli-download.stdout
            ${{ runner.temp }}/after-revoke-cli-download.stderr
            ${{ runner.temp }}/after-revoke-cli-install.stdout
            ${{ runner.temp }}/after-revoke-cli-install.stderr
YAML
          fi
          rm .github/workflows/msr-marketplace-evidence-restore.yml
          git config user.name 'fabushi-msr-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target" .github/workflows/msr-marketplace-evidence-restore.yml
          git diff --cached --check
          git commit -m 'fix(msr): restore marketplace evidence artifact upload'
          git push origin HEAD:feat/msr-sovereign-runtime-final
