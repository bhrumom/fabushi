name: Mahayana Harness materialize verified source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mahayana-harness-materialize-pr.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: mahayana-harness-materialize-v1
          cache-all-crates: true

      - name: Apply validated Harness finalizer
        run: python3 scripts/mahayana_harness_finalize.py

      - name: Format complete Mahayana workspace
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo fmt --all

      - name: Test complete Harness stack
        working-directory: third_party/mahayana/mahayana-rs
        run: >-
          cargo test --profile ci
          -p mahayana-harness
          -p mahayana-harness-services
          -p mahayana-harness-advanced
          -p mahayana-harness-adapters
          -p mahayana-harness-agent
          -p mahayana-harness-protocol
          -p mahayana-unified-app-host

      - name: Strict Clippy complete Harness stack
        working-directory: third_party/mahayana/mahayana-rs
        run: >-
          cargo clippy
          -p mahayana-harness
          -p mahayana-harness-services
          -p mahayana-harness-advanced
          -p mahayana-harness-adapters
          -p mahayana-harness-agent
          -p mahayana-harness-protocol
          -p mahayana-unified-app-host
          --all-targets -- -D warnings

      - name: Remove one-shot migration scaffolding
        shell: bash
        run: |
          rm -f \
            .github/mahayana-harness-finalize.marker \
            .github/workflows/mahayana-harness-clippy-diagnostics.yml \
            .github/workflows/mahayana-harness-finalize-once.yml \
            .github/workflows/mahayana-harness-finalize-pr-once.yml \
            .github/workflows/mahayana-harness-marker-finalize.yml \
            .github/workflows/mahayana-harness-schedule-bridge-once.yml \
            .github/workflows/mahayana-harness-materialize-pr.yml \
            scripts/mahayana_harness_finalize.py \
            scripts/mahayana_harness_finalize_tail.py \
            scripts/mahayana_harness_finalize_tail2.py

      - name: Commit verified source to PR head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes remain.'
            exit 0
          fi
          git commit -m 'feat(mahayana): materialize verified Rust-native Harness integration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
