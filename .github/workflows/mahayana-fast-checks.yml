name: Mahayana fast checks

on:
  pull_request:
    paths:
      - native/mahayana-messaging/**
      - third_party/mahayana/mahayana-rs/**
      - frontend/apps/web/src/lib/mahayana-host/gateway-events.ts
      - scripts/check-mahayana-source-boundary.py
      - .github/scripts/check-mahayana-gateway-event-drift.py
      - .github/workflows/mahayana-fast-checks.yml
  push:
    branches:
      - main
    paths:
      - native/mahayana-messaging/**
      - third_party/mahayana/mahayana-rs/**
      - frontend/apps/web/src/lib/mahayana-host/gateway-events.ts
      - scripts/check-mahayana-source-boundary.py
      - .github/scripts/check-mahayana-gateway-event-drift.py
      - .github/workflows/mahayana-fast-checks.yml
  workflow_dispatch:

concurrency:
  group: mahayana-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  msr204-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/msr-204-hermes-gateway-transcript'
    name: Repair MSR-204 peer state on GitHub runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical MSR-204 branch
        uses: actions/checkout@v5
        with:
          ref: feat/msr-204-hermes-gateway-transcript
          fetch-depth: 0

      - name: Set up stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Repair Rust-owned clarify authority and regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('third_party/mahayana/mahayana-rs/mahayana-gateway-peer/src/lib.rs')
          text = path.read_text()
          old = (
              '    let mut answers = request.locked_answers.clone();\n'
              '    if let Some(client_answers) = object.get("answers").and_then(Value::as_object) {\n'
              '        for (question_id, answer) in client_answers {\n'
              '            if let Some(answer) = answer.as_str() {\n'
              '                answers.insert(question_id.clone(), answer.to_string());\n'
              '            }\n'
              '        }\n'
              '    }\n'
          )
          new = (
              '    let mut answers = BTreeMap::new();\n'
              '    if let Some(client_answers) = object.get("answers").and_then(Value::as_object) {\n'
              '        for (question_id, answer) in client_answers {\n'
              '            if let Some(answer) = answer.as_str() {\n'
              '                answers.insert(question_id.clone(), answer.to_string());\n'
              '            }\n'
              '        }\n'
              '    }\n'
              '    // Rust owns locked clarify answers across reconnects; stale client\n'
              '    // responses may fill unlocked answers but cannot overwrite sealed ones.\n'
              '    answers.extend(request.locked_answers.clone());\n'
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif 'answers.extend(request.locked_answers.clone());' not in text:
              raise SystemExit('clarify merge block did not match expected state')

          marker = '    #[test]\n    fn exported_state_round_trips_for_future_canonical_restart_store() {\n'
          if 'fn locked_clarify_answer_wins_over_stale_client_response()' not in text:
              test = (
                  '    #[test]\n'
                  '    fn locked_clarify_answer_wins_over_stale_client_response() {\n'
                  '        let mut registry = ServerRequestRegistry::default();\n'
                  '        registry.issue_with_id(\n'
                  '            "srq-clarify0003".to_string(),\n'
                  '            "session-3".to_string(),\n'
                  '            "clarify".to_string(),\n'
                  '            json!({}),\n'
                  '            vec!["q1".to_string(), "q2".to_string()],\n'
                  '            30,\n'
                  '        ).unwrap();\n'
                  '        registry.lock_answer("srq-clarify0003", "q1", "server-locked").unwrap();\n'
                  '        let resolved = registry.resolve_response(&json!({\n'
                  '            "jsonrpc": "2.0",\n'
                  '            "id": "srq-clarify0003",\n'
                  '            "result": {"answers": {"q1": "stale-client", "q2": "client-open"}}\n'
                  '        })).unwrap();\n'
                  '        assert_eq!(\n'
                  '            resolved.response,\n'
                  '            ServerRequestResponse::Result(json!({\n'
                  '                "answers": {"q1": "server-locked", "q2": "client-open"}\n'
                  '            }))\n'
                  '        );\n'
                  '    }\n\n'
              )
              if marker not in text:
                  raise SystemExit('peer regression insertion marker missing')
              text = text.replace(marker, test + marker, 1)
          path.write_text(text)
          PY

      - name: Format and verify peer crate
        working-directory: third_party/mahayana/mahayana-rs
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p mahayana-gateway-peer
          cargo test -p mahayana-gateway-peer --locked

      - name: Remove temporary repair plumbing and commit verified source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/mahayana-fast-checks.yml')
          text = path.read_text()
          text = text.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          start = text.index('  msr204-repair:\n')
          end = text.index('  protocol-and-bridge:\n')
          text = text[:start] + text[end:]
          path.write_text(text)
          PY
          rm -f .github/workflows/msr-204-rustfmt-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/mahayana-fast-checks.yml
          git add -u .github/workflows
          git add third_party/mahayana/mahayana-rs/Cargo.lock
          git add third_party/mahayana/mahayana-rs/mahayana-gateway-peer/src/lib.rs
          git add third_party/mahayana/mahayana-rs/mahayana-cli/src/bin/mahayana-gateway.rs
          git diff --cached --check
          git commit -m 'fix(msr): enforce Rust-owned clarify answers'
          git push origin HEAD:feat/msr-204-hermes-gateway-transcript

  protocol-and-bridge:
    name: Rust protocol, Host, and bridge fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CARGO_INCREMENTAL: "1"
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs
    steps:
      - name: Checkout Mahayana sources
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /native/mahayana-messaging/**
            /third_party/mahayana/**
            /frontend/apps/web/src/lib/mahayana-host/gateway-events.ts
            /scripts/check-mahayana-source-boundary.py
            /.github/scripts/check-mahayana-gateway-event-drift.py

      - name: Verify Mahayana source ownership boundary
        run: python3 ../../../scripts/check-mahayana-source-boundary.py

      - name: Verify Rust and TypeScript gateway event catalogs match
        run: python3 ../../../.github/scripts/check-mahayana-gateway-event-drift.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify workspace formatting before native package setup
        run: cargo fmt --all -- --check

      - name: Verify isolated gateway protocol formatting
        run: cargo fmt --manifest-path mahayana-gateway-protocol/Cargo.toml -- --check

      - name: Test isolated gateway protocol contract
        run: cargo test --manifest-path mahayana-gateway-protocol/Cargo.toml

      - name: Install Linux native capture/input dependencies
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libxfixes-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgbm-dev

      - name: Restore targeted Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: mahayana-fast-v6
          cache-all-crates: true

      - name: Test Mahayana CLI as the product logic entry point
        run: >-
          cargo test
          -p mahayana-cli
          --profile ci
          --no-default-features

      - name: Test deterministic CLI test-driver protocol
        run: >-
          cargo test
          -p mahayana-test-driver-protocol
          --profile ci

      - name: Test Mahayana-owned CLI compatibility surfaces
        run: >-
          cargo test
          -p mahayana-tui-compat
          -p mahayana-plugin-archive-compat
          --profile ci

      - name: Test Mahayana-owned authentication and encrypted secrets
        run: >-
          cargo test
          -p mahayana-auth
          -p mahayana-secrets
          --profile ci

      - name: Compile product client against Mahayana-owned auth and secrets
        run: >-
          cargo test
          -p mahayana-platform-client
          --profile ci

      - name: Test sovereign kernel, supervision, and legacy bridge
        run: >-
          cargo test
          -p mahayana-kernel
          -p mahayana-agent-kernel-bridge
          --profile ci

      - name: Test native orchestration and workspace engines
        run: >-
          cargo test
          -p mahayana-orchestrator
          -p mahayana-workspace-engine
          --profile ci

      - name: Test native model and coding agent engine
        run: >-
          cargo test
          -p mahayana-model
          -p mahayana-native-engine
          --profile ci

      - name: Test native MCP transport and Agent adapter
        run: >-
          cargo test
          -p mahayana-mcp-runtime
          -p mahayana-agent
          -p mahayana-agent-responses
          --profile ci

      - name: Test product protocol and MiniApp bridge
        run: >-
          cargo test
          -p mahayana-product
          -p mahayana-miniapp-protocol
          -p mahayana-miniapp-bridge
          --profile ci

      - name: Test Rust-native Mahayana Harness
        run: >-
          cargo test
          -p mahayana-harness-protocol
          -p mahayana-harness-services
          -p mahayana-harness-adapters
          -p mahayana-harness-agent
          -p mahayana-harness-advanced
          -p mahayana-harness
          --profile ci

      - name: Test direct Mahayana Host
        run: >-
          cargo test
          -p mahayana-host
          --profile ci
          --no-default-features
          --features test-host

      - name: Test deterministic feature Host without the production dependency graph
        run: >-
          cargo test
          -p mahayana-feature-host
          --profile ci
          --no-default-features
          --features test-host

      - name: Test production feature adapters over the cached direct Host
        run: >-
          cargo test
          -p mahayana-feature-host
          --profile ci
          --no-default-features
          --features production-host

      - name: Check minimal embedded FFI boundary
        run: >-
          cargo check
          -p mahayana-ffi
          --profile ci
          --no-default-features
          --features desktop
