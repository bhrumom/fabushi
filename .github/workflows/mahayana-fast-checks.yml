name: Mahayana fast checks

on:
  pull_request:
    paths:
      - third_party/mahayana/mahayana-rs/**
      - .github/workflows/mahayana-fast-checks.yml

concurrency:
  group: mahayana-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  protocol-and-bridge:
    name: Rust protocol, Host, and bridge fast gate
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/msr-601-cli-vendor-boundary-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh only Mahayana Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata \
            --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml \
            --format-version 1 \
            >/dev/null
          test -n "$(git status --short -- third_party/mahayana/mahayana-rs/Cargo.lock)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add third_party/mahayana/mahayana-rs/Cargo.lock
          test "$(git diff --cached --name-only)" = "third_party/mahayana/mahayana-rs/Cargo.lock"
          git commit -m 'chore(msr): refresh CLI compatibility lockfile'
          git push origin HEAD:${{ github.head_ref }}
