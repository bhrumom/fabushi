name: Mahayana fast checks

on:
  pull_request:
    paths:
      - native/mahayana-messaging/**
      - third_party/mahayana/mahayana-rs/**
      - scripts/check-mahayana-source-boundary.py
      - .github/workflows/mahayana-fast-checks.yml
  push:
    branches:
      - main
    paths:
      - native/mahayana-messaging/**
      - third_party/mahayana/mahayana-rs/**
      - scripts/check-mahayana-source-boundary.py
      - .github/workflows/mahayana-fast-checks.yml
  workflow_dispatch:

concurrency:
  group: mahayana-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cli-compat-boundary-repair:
    name: One-shot CLI compatibility boundary repair
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/msr-native-runtime-parity-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire optional Codex compatibility and native archive packer
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("third_party/mahayana/mahayana-rs/mahayana-cli/src/main.rs"); s=p.read_text(); old="use codex_cli::plugin_cmd::PluginCli;\nuse codex_cli::plugin_cmd::PluginSubcommand;\nuse codex_core_plugins::plugin_bundle_archive::pack_plugin_bundle_tar_gz;\n"; new="#[cfg(feature = \"codex-compat\")]\nuse codex_cli::plugin_cmd::PluginCli;\n#[cfg(feature = \"codex-compat\")]\nuse codex_cli::plugin_cmd::PluginSubcommand;\nuse plugin_archive::pack_plugin_bundle_tar_gz;\n"; assert old in s or new in s; p.write_text(s.replace(old,new,1) if old in s else s)'
          python3 -c 'from pathlib import Path; p=Path("third_party/mahayana/mahayana-rs/mahayana-cli/src/main.rs"); s=p.read_text(); old="mod plugin_dev;\nmod plugin_dev_template;\n"; new="mod plugin_archive;\nmod plugin_dev;\nmod plugin_dev_template;\n"; assert old in s or new in s; p.write_text(s.replace(old,new,1) if old in s and new not in s else s)'
          python3 -c 'from pathlib import Path; p=Path("third_party/mahayana/mahayana-rs/mahayana-cli/src/main.rs"); s=p.read_text(); old="fn main() {\n    let raw_args = std::env::args_os().collect::<Vec<_>>();\n    if should_run_embedded_agent_cli(raw_args.get(1..).unwrap_or_default()) {\n        if let Err(error) = codex_cli::run_multitool_with_args(raw_args) {\n            eprintln!(\"错误：{error}\");\n            std::process::exit(1);\n        }\n        return;\n    }\n\n    let arg0_guard = codex_arg0::arg0_dispatch();\n    let codex_executable_path = arg0_guard\n        .as_ref()\n        .and_then(|guard| guard.paths().codex_self_exe.as_deref());\n"; new="fn main() {\n    #[cfg(feature = \"codex-compat\")]\n    {\n        let raw_args = std::env::args_os().collect::<Vec<_>>();\n        if should_run_embedded_agent_cli(raw_args.get(1..).unwrap_or_default()) {\n            if let Err(error) = codex_cli::run_multitool_with_args(raw_args) {\n                eprintln!(\"错误：{error}\");\n                std::process::exit(1);\n            }\n            return;\n        }\n    }\n\n    #[cfg(feature = \"codex-compat\")]\n    let arg0_guard = codex_arg0::arg0_dispatch();\n    #[cfg(feature = \"codex-compat\")]\n    let codex_executable_path = arg0_guard\n        .as_ref()\n        .and_then(|guard| guard.paths().codex_self_exe.as_deref());\n    #[cfg(not(feature = \"codex-compat\"))]\n    let codex_executable_path: Option<&Path> = None;\n"; count=s.count(old); assert count == 1 or new in s, f"main compatibility block matches={count}"; p.write_text(s.replace(old,new,1) if old in s else s)'
          python3 -c 'from pathlib import Path; p=Path("third_party/mahayana/mahayana-rs/mahayana-cli/src/main.rs"); s=p.read_text(); needle="\nfn run_embedded_agent_command(\n"; replacement="\n#[cfg(feature = \"codex-compat\")]\nfn run_embedded_agent_command(\n"; assert needle in s or replacement in s; s=s.replace(needle,replacement,1) if needle in s else s; marker="\nfn run(codex_executable_path: Option<&Path>, cli: Cli) -> Result<(), String> {"; fallback="\n#[cfg(not(feature = \"codex-compat\"))]\nfn run_embedded_agent_command(\n    command_path: &[&str],\n    _args: EmbeddedAgentArgs,\n) -> Result<(), String> {\n    Err(format!(\n        \"mahayana {} requires the optional codex-compat adapter in this build\",\n        command_path.join(\" \")\n    ))\n}\n"; assert marker in s; s=s.replace(marker,fallback+marker,1) if fallback not in s else s; p.write_text(s)'
          python3 -c 'from pathlib import Path; p=Path("third_party/mahayana/mahayana-rs/mahayana-cli/src/main.rs"); s=p.read_text(); needle="\nfn run_codex_plugin(args: Vec<String>) -> Result<(), String> {"; replacement="\n#[cfg(not(feature = \"codex-compat\"))]\nfn run_codex_plugin(_args: Vec<String>) -> Result<(), String> {\n    Err(\"legacy plugin marketplace commands require the optional codex-compat adapter; use mahayana marketplace for the native product path\".into())\n}\n\n#[cfg(feature = \"codex-compat\")]\nfn run_codex_plugin(args: Vec<String>) -> Result<(), String> {"; assert needle in s or replacement in s; p.write_text(s.replace(needle,replacement,1) if needle in s else s)'
          python3 -c 'from pathlib import Path; p=Path("third_party/mahayana/mahayana-rs/mahayana-cli/src/main.rs"); s=p.read_text().replace("plugin.codex", "plugin.legacy"); s=s.replace("    use clap::CommandFactory;\n", "    #[cfg(feature = \"codex-compat\")]\n    use clap::CommandFactory;\n"); s=s.replace("    use std::collections::BTreeSet;\n", "    #[cfg(feature = \"codex-compat\")]\n    use std::collections::BTreeSet;\n"); s=s.replace("    #[test]\n    fn embedded_help_uses_mahayana_command_name()", "    #[cfg(feature = \"codex-compat\")]\n    #[test]\n    fn embedded_help_uses_mahayana_command_name()", 1); s=s.replace("    #[test]\n    fn every_visible_embedded_command_is_listed_by_mahayana_help()", "    #[cfg(feature = \"codex-compat\")]\n    #[test]\n    fn every_visible_embedded_command_is_listed_by_mahayana_help()", 1); p.write_text(s)'
          cd third_party/mahayana/mahayana-rs
          cargo fmt --all
          cd ../../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add third_party/mahayana/mahayana-rs/mahayana-cli/src/main.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'CLI compatibility boundary already materialized'
          else
            git commit -m 'refactor(mahayana): isolate CLI Codex compatibility adapter'
            git push origin HEAD:${{ github.head_ref }}
          fi

  protocol-and-bridge:
    name: Rust protocol, Host, and bridge fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CARGO_INCREMENTAL: "1"
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs
    steps:
      - name: Checkout Mahayana sources
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /native/mahayana-messaging/**
            /third_party/mahayana/**
            /scripts/check-mahayana-source-boundary.py
      - name: Verify Mahayana source ownership boundary
        run: python3 ../../../scripts/check-mahayana-source-boundary.py
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Restore targeted Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: mahayana-fast-v6
          cache-all-crates: true
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Test Mahayana-owned authentication and encrypted secrets
        run: cargo test -p mahayana-auth -p mahayana-secrets --profile ci
      - name: Compile product client against Mahayana-owned auth and secrets
        run: cargo test -p mahayana-platform-client --profile ci
      - name: Test sovereign kernel, supervision, and legacy bridge
        run: cargo test -p mahayana-kernel -p mahayana-agent-kernel-bridge --profile ci
      - name: Test native orchestration and workspace engines
        run: cargo test -p mahayana-orchestrator -p mahayana-workspace-engine --profile ci
      - name: Test native model and coding agent engine
        run: cargo test -p mahayana-model -p mahayana-native-engine --profile ci
      - name: Test native MCP transport and Agent adapter
        run: cargo test -p mahayana-mcp-runtime -p mahayana-native-agent --profile ci
      - name: Test protocol and MiniApp bridge
        run: cargo test -p mahayana-miniapp-protocol -p mahayana-miniapp-bridge -p mahayana-host-protocol --profile ci
      - name: Test Rust-native Mahayana Harness
        run: cargo test -p mahayana-harness -p mahayana-harness-services -p mahayana-harness-advanced -p mahayana-harness-adapters -p mahayana-harness-agent -p mahayana-harness-protocol -p mahayana-unified-app-host --profile ci
      - name: Test direct Mahayana Host
        run: cargo test -p mahayana-host --profile ci --no-default-features --features local-only
      - name: Test deterministic feature Host without the production dependency graph
        run: cargo test -p mahayana-feature-host --profile ci --no-default-features
      - name: Test production feature adapters over the cached direct Host
        run: cargo test -p mahayana-feature-host --profile ci --no-default-features --features local-only production_uses_the_real_runtime_and_rust_owned_session_store
      - name: Check minimal embedded FFI boundary
        run: cargo check -p mahayana-ffi --profile ci --no-default-features --features local-only
