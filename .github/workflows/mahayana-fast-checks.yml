name: Mahayana fast checks

on:
  pull_request:
    paths:
      - native/mahayana-messaging/**
      - third_party/mahayana/mahayana-rs/**
      - frontend/apps/web/src/lib/mahayana-host/gateway-events.ts
      - scripts/check-mahayana-source-boundary.py
      - .github/scripts/check-mahayana-gateway-event-drift.py
      - .github/workflows/mahayana-fast-checks.yml
  push:
    branches:
      - main
    paths:
      - native/mahayana-messaging/**
      - third_party/mahayana/mahayana-rs/**
      - frontend/apps/web/src/lib/mahayana-host/gateway-events.ts
      - scripts/check-mahayana-source-boundary.py
      - .github/scripts/check-mahayana-gateway-event-drift.py
      - .github/workflows/mahayana-fast-checks.yml
  workflow_dispatch:

concurrency:
  group: mahayana-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repair-msr-204:
    name: One-shot MSR-204 Hermes transcript repair
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/msr-204-hermes-gateway-transcript' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v5
        with:
          ref: feat/msr-204-hermes-gateway-transcript
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt

      - name: Repair Hermes-style completion and self-hosted Bot projection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one repair anchor, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'desktop/src/mahayana-assistant-turn.ts',
              "    case 'chat.message':\n"
              "      if (event.role !== 'assistant') return turn;\n"
              "      return {\n"
              "        ...turn,\n"
              "        updatedAtMs: now,\n"
              "        parts: reconcileLegacyFinalText(turn, event.text),\n"
              "      };",
              "    case 'chat.message':\n"
              "      if (event.role !== 'assistant') return turn;\n"
              "      return {\n"
              "        ...turn,\n"
              "        updatedAtMs: now,\n"
              "        status: 'completed',\n"
              "        parts: reconcileLegacyFinalText(turn, event.text),\n"
              "      };",
          )

          replace_once(
              'desktop/src/messaging-shell-v2.tsx',
              "import { ElectronMahayanaHostTransport, isElectronMahayanaHostAvailable, MAHAYANA_ACCOUNT_SESSION_RESET_EVENT, readCachedConversationMessages } from '../../frontend/apps/web/src/lib/mahayana-host/electron-transport';",
              "import {\n"
              "  ElectronMahayanaHostTransport,\n"
              "  isElectronMahayanaHostAvailable,\n"
              "  MAHAYANA_ACCOUNT_SESSION_RESET_EVENT,\n"
              "  MAHAYANA_COMMAND_EVENT_NAME,\n"
              "  readCachedConversationMessages,\n"
              "  type MahayanaCommandBridgeDetail,\n"
              "} from '../../frontend/apps/web/src/lib/mahayana-host/electron-transport';",
          )

          replace_once(
              'desktop/src/messaging-shell-v2.tsx',
              "    const unsubscribe = transport.subscribe((event) => {\n"
              "      if (!closed) handleRuntimeEvent(event);\n"
              "    });",
              "    const unsubscribe = transport.subscribe((event) => {\n"
              "      if (!closed) handleRuntimeEvent(event);\n"
              "    });\n"
              "    const onCommandBridge = (event: Event) => {\n"
              "      const detail = (event as CustomEvent<MahayanaCommandBridgeDetail>).detail;\n"
              "      if (!detail || detail.command.type !== 'chat.send') return;\n"
              "      const conversationKey = detail.context?.conversationKey;\n"
              "      if (!conversationKey || activePeerKeyRef.current !== conversationKey) return;\n"
              "\n"
              "      if (detail.phase === 'dispatch') {\n"
              "        agentRequestPendingRef.current = true;\n"
              "        setPendingSend(true);\n"
              "        return;\n"
              "      }\n"
              "      if (detail.phase === 'accepted') {\n"
              "        const operationId = detail.accepted.operationId;\n"
              "        if (!operationId || !claimAgentOperation(operationId)) return;\n"
              "        appendAssistantTurnEvent({\n"
              "          type: 'operation.started',\n"
              "          timestamp: new Date().toISOString(),\n"
              "          operationId,\n"
              "          label: '正在思考',\n"
              "          interruptible: true,\n"
              "        });\n"
              "        return;\n"
              "      }\n"
              "      agentRequestPendingRef.current = false;\n"
              "      setPendingSend(false);\n"
              "      setError(detail.error);\n"
              "    };\n"
              "    window.addEventListener(MAHAYANA_COMMAND_EVENT_NAME, onCommandBridge);",
          )

          replace_once(
              'desktop/src/messaging-shell-v2.tsx',
              "      closed = true;\n"
              "      unsubscribe();\n"
              "      const remoteComputer = remoteComputerControllerRef.current;",
              "      closed = true;\n"
              "      unsubscribe();\n"
              "      window.removeEventListener(MAHAYANA_COMMAND_EVENT_NAME, onCommandBridge);\n"
              "      const remoteComputer = remoteComputerControllerRef.current;",
          )
          PY

      - name: Format canonical Rust workspace
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo fmt --all

      - name: Generate lock and compile gateway slices
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo check -p mahayana-gateway -p mahayana-gateway-protocol -p mahayana-cli --bin mahayana-gateway

      - name: Test gateway projection, replay, and protocol
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo test -p mahayana-gateway -p mahayana-gateway-protocol --locked

      - name: Recheck gateway CLI under generated lock
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo check -p mahayana-cli --bin mahayana-gateway --locked

      - name: Commit verified product repair and remove this one-shot job
        shell: bash
        run: |
          git show f8f95de715c48c01fb90c63cdafd2a4b1e99bb7e:.github/workflows/mahayana-fast-checks.yml > .github/workflows/mahayana-fast-checks.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/mahayana-fast-checks.yml \
            desktop/src/mahayana-assistant-turn.ts \
            desktop/src/messaging-shell-v2.tsx \
            third_party/mahayana/mahayana-rs/Cargo.lock \
            third_party/mahayana/mahayana-rs/mahayana-gateway \
            third_party/mahayana/mahayana-rs/mahayana-gateway-protocol \
            third_party/mahayana/mahayana-rs/mahayana-cli/src/bin/mahayana-gateway.rs
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
            exit 0
          fi
          git commit -m 'fix(msr): complete Hermes assistant turns and Bot routing'
          git push origin HEAD:feat/msr-204-hermes-gateway-transcript

  protocol-and-bridge:
    name: Rust protocol, Host, and bridge fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CARGO_INCREMENTAL: "1"
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs
    steps:
      - name: Checkout Mahayana sources
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /native/mahayana-messaging/**
            /third_party/mahayana/**
            /frontend/apps/web/src/lib/mahayana-host/gateway-events.ts
            /scripts/check-mahayana-source-boundary.py
            /.github/scripts/check-mahayana-gateway-event-drift.py

      - name: Verify Mahayana source ownership boundary
        run: python3 ../../../scripts/check-mahayana-source-boundary.py

      - name: Verify Rust and TypeScript gateway event catalogs match
        run: python3 ../../../.github/scripts/check-mahayana-gateway-event-drift.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify workspace formatting before native package setup
        run: cargo fmt --all -- --check

      - name: Verify isolated gateway protocol formatting
        run: cargo fmt --manifest-path mahayana-gateway-protocol/Cargo.toml -- --check

      - name: Test isolated gateway protocol contract
        run: cargo test --manifest-path mahayana-gateway-protocol/Cargo.toml

      - name: Install Linux native capture/input dependencies
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libxfixes-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgbm-dev

      - name: Restore targeted Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: mahayana-fast-v6
          cache-all-crates: true

      - name: Test Mahayana CLI as the product logic entry point
        run: >-
          cargo test
          -p mahayana-cli
          --profile ci
          --no-default-features

      - name: Test deterministic CLI test-driver protocol
        run: >-
          cargo test
          -p mahayana-test-driver-protocol
          --profile ci

      - name: Test Mahayana-owned CLI compatibility surfaces
        run: >-
          cargo test
          -p mahayana-tui-compat
          -p mahayana-plugin-archive-compat
          --profile ci

      - name: Test Mahayana-owned authentication and encrypted secrets
        run: >-
          cargo test
          -p mahayana-auth
          -p mahayana-secrets
          --profile ci

      - name: Compile product client against Mahayana-owned auth and secrets
        run: >-
          cargo test
          -p mahayana-platform-client
          --profile ci

      - name: Test sovereign kernel, supervision, and legacy bridge
        run: >-
          cargo test
          -p mahayana-kernel
          -p mahayana-agent-kernel-bridge
          --profile ci

      - name: Test native orchestration and workspace engines
        run: >-
          cargo test
          -p mahayana-orchestrator
          -p mahayana-workspace-engine
          --profile ci

      - name: Test native model and coding agent engine
        run: >-
          cargo test
          -p mahayana-model
          -p mahayana-native-engine
          --profile ci

      - name: Test native MCP transport and Agent adapter
        run: >-
          cargo test
          -p mahayana-mcp-runtime
          -p mahayana-native-agent
          --profile ci

      - name: Test product protocol and MiniApp bridge
        run: >-
          cargo test
          -p mahayana-miniapp-protocol
          -p mahayana-miniapp-bridge
          -p mahayana-host-protocol
          --profile ci

      - name: Test Rust-native Mahayana Harness
        run: >-
          cargo test
          -p mahayana-harness
          -p mahayana-harness-services
          -p mahayana-harness-advanced
          -p mahayana-harness-adapters
          -p mahayana-harness-agent
          -p mahayana-harness-protocol
          -p mahayana-unified-app-host
          --profile ci

      - name: Test direct Mahayana Host
        run: >-
          cargo test
          -p mahayana-host
          --profile ci
          --no-default-features
          --features local-only

      - name: Test deterministic feature Host without the production dependency graph
        run: >-
          cargo test
          -p mahayana-feature-host
          --profile ci
          --no-default-features

      - name: Test production feature adapters over the cached direct Host
        run: >-
          cargo test
          -p mahayana-feature-host
          --profile ci
          --no-default-features
          --features local-only
          production_uses_the_real_runtime_and_rust_owned_session_store

      - name: Check minimal embedded FFI boundary
        run: >-
          cargo check
          -p mahayana-ffi
          --profile ci
          --no-default-features
          --features local-only
