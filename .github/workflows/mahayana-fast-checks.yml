name: Mahayana fast checks

on:
  pull_request:
    paths:
      - native/mahayana-messaging/**
      - third_party/mahayana/mahayana-rs/**
      - scripts/check-mahayana-source-boundary.py
      - .github/workflows/mahayana-fast-checks.yml
  push:
    branches:
      - main
    paths:
      - native/mahayana-messaging/**
      - third_party/mahayana/mahayana-rs/**
      - scripts/check-mahayana-source-boundary.py
      - .github/workflows/mahayana-fast-checks.yml
  workflow_dispatch:

concurrency:
  group: mahayana-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  native-runtime-repair:
    name: One-shot MSR-401 module wiring
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/msr-native-runtime-parity-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire native runtime and extension contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("third_party/mahayana/mahayana-rs/mahayana-native-engine/src/lib.rs"); s=p.read_text(); old="        if let Some(root) = workspace_root.as_deref() {\n            if !root.is_dir() {\n                return Err(KernelError::BackendUnavailable(format!(\n                    \"workspace root is not a directory: {}\",\n                    root.display()\n                )));\n            }\n        }\n"; new="        if let Some(root) = workspace_root.as_deref()\n            && !root.is_dir()\n        {\n            return Err(KernelError::BackendUnavailable(format!(\n                \"workspace root is not a directory: {}\",\n                root.display()\n            )));\n        }\n"; assert old in s or new in s; p.write_text(s.replace(old,new,1) if old in s else s)'
          python3 -c 'from pathlib import Path; p=Path("third_party/mahayana/mahayana-rs/mahayana-kernel/src/lib.rs"); s=p.read_text(); old="pub mod resilience;\n"; new="pub mod extension;\npub mod resilience;\n"; assert old in s or new in s; s=s.replace(old,new,1) if old in s and new not in s else s; old2="    Plugins,\n    Memory,\n"; new2="    Plugins,\n    Connectors,\n    MiniApps,\n    Memory,\n"; assert old2 in s or new2 in s; s=s.replace(old2,new2,1) if old2 in s and new2 not in s else s; p.write_text(s)'
          python3 -c 'from pathlib import Path; p=Path("third_party/mahayana/mahayana-rs/mahayana-mcp-runtime/src/lib.rs"); s=p.read_text(); old="use mahayana_platform_core::HostPlatform;\n"; new="pub mod status;\n\nuse mahayana_platform_core::HostPlatform;\n"; assert old in s or new in s; p.write_text(s.replace(old,new,1) if old in s and new not in s else s)'
          cd third_party/mahayana/mahayana-rs
          cargo fmt --all
          cd ../../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add third_party/mahayana/mahayana-rs/mahayana-native-engine/src/lib.rs third_party/mahayana/mahayana-rs/mahayana-kernel/src/lib.rs third_party/mahayana/mahayana-rs/mahayana-mcp-runtime/src/lib.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'MSR-401 wiring already materialized'
          else
            git commit -m 'feat(mahayana): wire extension and MCP status contracts'
            git push origin HEAD:${{ github.head_ref }}
          fi

  protocol-and-bridge:
    name: Rust protocol, Host, and bridge fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CARGO_INCREMENTAL: "1"
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs
    steps:
      - name: Checkout Mahayana sources
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /native/mahayana-messaging/**
            /third_party/mahayana/**
            /scripts/check-mahayana-source-boundary.py
      - name: Verify Mahayana source ownership boundary
        run: python3 ../../../scripts/check-mahayana-source-boundary.py
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Restore targeted Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: mahayana-fast-v6
          cache-all-crates: true
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Test Mahayana-owned authentication and encrypted secrets
        run: cargo test -p mahayana-auth -p mahayana-secrets --profile ci
      - name: Compile product client against Mahayana-owned auth and secrets
        run: cargo test -p mahayana-platform-client --profile ci
      - name: Test sovereign kernel, supervision, and legacy bridge
        run: cargo test -p mahayana-kernel -p mahayana-agent-kernel-bridge --profile ci
      - name: Test native orchestration and workspace engines
        run: cargo test -p mahayana-orchestrator -p mahayana-workspace-engine --profile ci
      - name: Test native model and coding agent engine
        run: cargo test -p mahayana-model -p mahayana-native-engine --profile ci
      - name: Test native MCP transport and Agent adapter
        run: cargo test -p mahayana-mcp-runtime -p mahayana-native-agent --profile ci
      - name: Test protocol and MiniApp bridge
        run: cargo test -p mahayana-miniapp-protocol -p mahayana-miniapp-bridge -p mahayana-host-protocol --profile ci
      - name: Test Rust-native Mahayana Harness
        run: cargo test -p mahayana-harness -p mahayana-harness-services -p mahayana-harness-advanced -p mahayana-harness-adapters -p mahayana-harness-agent -p mahayana-harness-protocol -p mahayana-unified-app-host --profile ci
      - name: Test direct Mahayana Host
        run: cargo test -p mahayana-host --profile ci --no-default-features --features local-only
      - name: Test deterministic feature Host without the production dependency graph
        run: cargo test -p mahayana-feature-host --profile ci --no-default-features
      - name: Test production feature adapters over the cached direct Host
        run: cargo test -p mahayana-feature-host --profile ci --no-default-features --features local-only production_uses_the_real_runtime_and_rust_owned_session_store
      - name: Check minimal embedded FFI boundary
        run: cargo check -p mahayana-ffi --profile ci --no-default-features --features local-only
