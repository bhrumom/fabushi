name: Mahayana fast checks

on:
  pull_request:
    paths:
      - native/mahayana-messaging/**
      - third_party/mahayana/mahayana-rs/**
      - scripts/check-mahayana-source-boundary.py
      - .github/workflows/mahayana-fast-checks.yml
  push:
    branches: [main]
    paths:
      - native/mahayana-messaging/**
      - third_party/mahayana/mahayana-rs/**
      - scripts/check-mahayana-source-boundary.py
      - .github/workflows/mahayana-fast-checks.yml
  workflow_dispatch:

concurrency:
  group: mahayana-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  final-boundary-materialize:
    name: One-shot final CLI and surface boundary materializer
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/msr-sovereign-runtime-final'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Materialize default-native CLI and surface contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('third_party/mahayana/mahayana-rs/mahayana-cli/src/main.rs')
          text = path.read_text()

          old = '''use codex_cli::plugin_cmd::PluginCli;
          use codex_cli::plugin_cmd::PluginSubcommand;
          use codex_core_plugins::plugin_bundle_archive::pack_plugin_bundle_tar_gz;
          '''
          new = '''#[cfg(feature = "codex-compat")]
          use codex_cli::plugin_cmd::PluginCli;
          #[cfg(feature = "codex-compat")]
          use codex_cli::plugin_cmd::PluginSubcommand;
          use plugin_archive::pack_plugin_bundle_tar_gz;
          '''
          assert old in text or new in text
          if old in text:
              text = text.replace(old, new, 1)

          old = 'mod chat_tui;\nmod plugin_dev;\n'
          new = 'mod chat_tui;\nmod plugin_archive;\nmod plugin_dev;\n'
          assert old in text or new in text
          if new not in text:
              text = text.replace(old, new, 1)

          old = '''fn main() {
              let raw_args = std::env::args_os().collect::<Vec<_>>();
              if should_run_embedded_agent_cli(raw_args.get(1..).unwrap_or_default()) {
                  if let Err(error) = codex_cli::run_multitool_with_args(raw_args) {
                      eprintln!("错误：{error}");
                      std::process::exit(1);
                  }
                  return;
              }

              let arg0_guard = codex_arg0::arg0_dispatch();
              let codex_executable_path = arg0_guard
                  .as_ref()
                  .and_then(|guard| guard.paths().codex_self_exe.as_deref());
          '''
          new = '''fn main() {
              #[cfg(feature = "codex-compat")]
              {
                  let raw_args = std::env::args_os().collect::<Vec<_>>();
                  if should_run_embedded_agent_cli(raw_args.get(1..).unwrap_or_default()) {
                      if let Err(error) = codex_cli::run_multitool_with_args(raw_args) {
                          eprintln!("错误：{error}");
                          std::process::exit(1);
                      }
                      return;
                  }
              }

              #[cfg(feature = "codex-compat")]
              let arg0_guard = codex_arg0::arg0_dispatch();
              #[cfg(feature = "codex-compat")]
              let codex_executable_path = arg0_guard
                  .as_ref()
                  .and_then(|guard| guard.paths().codex_self_exe.as_deref());
              #[cfg(not(feature = "codex-compat"))]
              let codex_executable_path: Option<&Path> = None;
          '''
          assert old in text or new in text
          if old in text:
              text = text.replace(old, new, 1)

          marker = '\nfn run_embedded_agent_command(\n'
          marked = '\n#[cfg(feature = "codex-compat")]\nfn run_embedded_agent_command(\n'
          assert marker in text or marked in text
          if marked not in text:
              text = text.replace(marker, marked, 1)

          run_marker = '\nfn run(codex_executable_path: Option<&Path>, cli: Cli) -> Result<(), String> {'
          fallback = '''
          #[cfg(not(feature = "codex-compat"))]
          fn run_embedded_agent_command(
              command_path: &[&str],
              _args: EmbeddedAgentArgs,
          ) -> Result<(), String> {
              Err(format!(
                  "mahayana {} requires the optional codex-compat adapter in this build",
                  command_path.join(" ")
              ))
          }
          '''
          assert run_marker in text
          if fallback not in text:
              text = text.replace(run_marker, fallback + run_marker, 1)

          marker = '\nfn run_codex_plugin(args: Vec<String>) -> Result<(), String> {'
          marked = '\n#[cfg(feature = "codex-compat")]\nfn run_codex_plugin(args: Vec<String>) -> Result<(), String> {'
          assert marker in text or marked in text
          if marked not in text:
              text = text.replace(marker, marked, 1)
          fallback = '''
          #[cfg(not(feature = "codex-compat"))]
          fn run_codex_plugin(_args: Vec<String>) -> Result<(), String> {
              Err("legacy plugin marketplace commands require the optional codex-compat adapter; use mahayana marketplace for the native product path".into())
          }
          '''
          if fallback not in text:
              text = text.replace(marked, fallback + marked, 1)

          text = text.replace('plugin.codex', 'plugin.legacy')
          text = text.replace(
              '    use clap::CommandFactory;\n',
              '    #[cfg(feature = "codex-compat")]\n    use clap::CommandFactory;\n',
          )
          text = text.replace(
              '    use std::collections::BTreeSet;\n',
              '    #[cfg(feature = "codex-compat")]\n    use std::collections::BTreeSet;\n',
          )
          for test_name in (
              'embedded_help_uses_mahayana_command_name',
              'every_visible_embedded_command_is_listed_by_mahayana_help',
          ):
              needle = f'    #[test]\n    fn {test_name}()'
              replacement = f'    #[cfg(feature = "codex-compat")]\n    #[test]\n    fn {test_name}()'
              if replacement not in text:
                  assert needle in text
                  text = text.replace(needle, replacement, 1)

          path.write_text(text)

          kernel = Path('third_party/mahayana/mahayana-rs/mahayana-kernel/src/lib.rs')
          text = kernel.read_text()
          if 'pub mod surface;\n' not in text:
              assert 'pub mod sandbox;\n' in text
              text = text.replace('pub mod sandbox;\n', 'pub mod sandbox;\npub mod surface;\n', 1)
          kernel.write_text(text)
          PY

          cd third_party/mahayana/mahayana-rs
          cargo fmt --all
          cd ../../..

          git fetch --depth=1 origin feat/msr-103-native-auth-secrets-clean
          git checkout FETCH_HEAD -- .github/workflows/mahayana-fast-checks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/mahayana-fast-checks.yml \
            third_party/mahayana/mahayana-rs/mahayana-cli/src/main.rs \
            third_party/mahayana/mahayana-rs/mahayana-kernel/src/lib.rs \
            third_party/mahayana/mahayana-rs/mahayana-kernel/src/surface.rs
          git diff --cached --check
          git commit -m 'refactor(mahayana): isolate default native product surface'
          git push origin HEAD:${{ github.head_ref }}

  protocol-and-bridge:
    name: Rust protocol, Host, and bridge fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CARGO_INCREMENTAL: "1"
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /native/mahayana-messaging/**
            /third_party/mahayana/**
            /scripts/check-mahayana-source-boundary.py
      - name: Verify Mahayana source ownership boundary
        run: python3 ../../../scripts/check-mahayana-source-boundary.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: mahayana-fast-v6
          cache-all-crates: true
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Test Mahayana-owned authentication and encrypted secrets
        run: cargo test -p mahayana-auth -p mahayana-secrets --profile ci
      - name: Compile product client against Mahayana-owned auth and secrets
        run: cargo test -p mahayana-platform-client --profile ci
      - name: Test sovereign kernel, supervision, and legacy bridge
        run: cargo test -p mahayana-kernel -p mahayana-agent-kernel-bridge --profile ci
      - name: Test native orchestration and workspace engines
        run: cargo test -p mahayana-orchestrator -p mahayana-workspace-engine --profile ci
      - name: Test native model and coding agent engine
        run: cargo test -p mahayana-model -p mahayana-native-engine --profile ci
      - name: Test native MCP transport and Agent adapter
        run: cargo test -p mahayana-mcp-runtime -p mahayana-native-agent --profile ci
      - name: Test protocol and MiniApp bridge
        run: cargo test -p mahayana-miniapp-protocol -p mahayana-miniapp-bridge -p mahayana-host-protocol --profile ci
      - name: Test Rust-native Mahayana Harness
        run: cargo test -p mahayana-harness -p mahayana-harness-services -p mahayana-harness-advanced -p mahayana-harness-adapters -p mahayana-harness-agent -p mahayana-harness-protocol -p mahayana-unified-app-host --profile ci
      - name: Test direct Mahayana Host
        run: cargo test -p mahayana-host --profile ci --no-default-features --features local-only
      - name: Test deterministic feature Host without the production dependency graph
        run: cargo test -p mahayana-feature-host --profile ci --no-default-features
      - name: Test production feature adapters over the cached direct Host
        run: cargo test -p mahayana-feature-host --profile ci --no-default-features --features local-only production_uses_the_real_runtime_and_rust_owned_session_store
      - name: Check minimal embedded FFI boundary
        run: cargo check -p mahayana-ffi --profile ci --no-default-features --features local-only
