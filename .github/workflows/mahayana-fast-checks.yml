name: Mahayana fast checks

on:
  pull_request:
    paths:
      - native/mahayana-messaging/**
      - third_party/mahayana/mahayana-rs/**
      - scripts/check-mahayana-source-boundary.py
      - .github/workflows/mahayana-fast-checks.yml
  push:
    branches:
      - main
    paths:
      - native/mahayana-messaging/**
      - third_party/mahayana/mahayana-rs/**
      - scripts/check-mahayana-source-boundary.py
      - .github/workflows/mahayana-fast-checks.yml
  workflow_dispatch:

concurrency:
  group: mahayana-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  orchestrator-rust198-repair:
    name: One-shot Rust 1.98 orchestrator repair
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/msr-103-native-auth-secrets-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact lint repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('third_party/mahayana/mahayana-rs/mahayana-orchestrator/src/lib.rs')
          text = path.read_text()
          replacements = [
              (
                  '''        if let Some(key) = dedupe_key.as_deref() {\n            if let Some(existing) = self.entries.iter_mut().find(|entry| {\n                entry.state == PromptState::Pending && entry.dedupe_key.as_deref() == Some(key)\n            }) {\n                existing.text = text.to_string();\n                existing.priority = existing.priority.max(priority);\n                existing.metadata.extend(metadata);\n                return Ok(existing.id.clone());\n            }\n        }''',
                  '''        if let Some(key) = dedupe_key.as_deref()\n            && let Some(existing) = self.entries.iter_mut().find(|entry| {\n                entry.state == PromptState::Pending && entry.dedupe_key.as_deref() == Some(key)\n            })\n        {\n            existing.text = text.to_string();\n            existing.priority = existing.priority.max(priority);\n            existing.metadata.extend(metadata);\n            return Ok(existing.id.clone());\n        }''',
              ),
              ('    pub fn next(&mut self) -> Option<PromptEntry> {', '    pub fn take_next(&mut self) -> Option<PromptEntry> {'),
              ('        records.sort_by(|left, right| right.updated_at_ms.cmp(&left.updated_at_ms));', '        records.sort_by_key(|record| std::cmp::Reverse(record.updated_at_ms));'),
              (
                  '''        if let Some(parent_id) = parent_id.as_deref() {\n            if !self.tasks.contains_key(parent_id) {\n                return Err(OrchestratorError::SubagentNotFound(parent_id.to_string()));\n            }\n        }''',
                  '''        if let Some(parent_id) = parent_id.as_deref()\n            && !self.tasks.contains_key(parent_id)\n        {\n            return Err(OrchestratorError::SubagentNotFound(parent_id.to_string()));\n        }''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          if text.count('queue.next()') != 2:
              raise SystemExit(f'expected exactly two PromptQueue test calls, found {text.count("queue.next()")})')
          text = text.replace('queue.next()', 'queue.take_next()')
          path.write_text(text)
          PY
          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml -p mahayana-orchestrator
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add third_party/mahayana/mahayana-rs/mahayana-orchestrator/src/lib.rs
          git diff --cached --check
          git commit -m 'fix(mahayana): satisfy Rust 1.98 orchestrator lints'
          git push origin HEAD:${{ github.head_ref }}

  protocol-and-bridge:
    name: Rust protocol, Host, and bridge fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CARGO_INCREMENTAL: "1"
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs
    steps:
      - name: Checkout Mahayana sources
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /native/mahayana-messaging/**
            /third_party/mahayana/**
            /scripts/check-mahayana-source-boundary.py

      - name: Verify Mahayana source ownership boundary
        run: python3 ../../../scripts/check-mahayana-source-boundary.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Restore targeted Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: mahayana-fast-v6
          cache-all-crates: true

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Test Mahayana-owned authentication and encrypted secrets
        run: >-
          cargo test
          -p mahayana-auth
          -p mahayana-secrets
          --profile ci

      - name: Compile product client against Mahayana-owned auth and secrets
        run: >-
          cargo test
          -p mahayana-platform-client
          --profile ci

      - name: Test sovereign kernel, supervision, and legacy bridge
        run: >-
          cargo test
          -p mahayana-kernel
          -p mahayana-agent-kernel-bridge
          --profile ci

      - name: Test native orchestration and workspace engines
        run: >-
          cargo test
          -p mahayana-orchestrator
          -p mahayana-workspace-engine
          --profile ci

      - name: Test native model and coding agent engine
        run: >-
          cargo test
          -p mahayana-model
          -p mahayana-native-engine
          --profile ci

      - name: Test native MCP transport and Agent adapter
        run: >-
          cargo test
          -p mahayana-mcp-runtime
          -p mahayana-native-agent
          --profile ci

      - name: Test protocol and MiniApp bridge
        run: >-
          cargo test
          -p mahayana-miniapp-protocol
          -p mahayana-miniapp-bridge
          -p mahayana-host-protocol
          --profile ci

      - name: Test Rust-native Mahayana Harness
        run: >-
          cargo test
          -p mahayana-harness
          -p mahayana-harness-services
          -p mahayana-harness-advanced
          -p mahayana-harness-adapters
          -p mahayana-harness-agent
          -p mahayana-harness-protocol
          -p mahayana-unified-app-host
          --profile ci

      - name: Test direct Mahayana Host
        run: >-
          cargo test
          -p mahayana-host
          --profile ci
          --no-default-features
          --features local-only

      - name: Test deterministic feature Host without the production dependency graph
        run: >-
          cargo test
          -p mahayana-feature-host
          --profile ci
          --no-default-features

      - name: Test production feature adapters over the cached direct Host
        run: >-
          cargo test
          -p mahayana-feature-host
          --profile ci
          --no-default-features
          --features local-only
          production_uses_the_real_runtime_and_rust_owned_session_store

      - name: Check minimal embedded FFI boundary
        run: >-
          cargo check
          -p mahayana-ffi
          --profile ci
          --no-default-features
          --features local-only
