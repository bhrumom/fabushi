name: CI latency observability

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-latency-observability.yml'
      - 'projects/fabushi-cicd-merge-governance/**'

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-latency-observability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Measure canonical CI latency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query recent CI runs and calculate SLOs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sampleLimit = 50;
            const windowMs = 14 * 24 * 60 * 60 * 1000;
            const cutoff = Date.now() - windowMs;

            const canonicalJobs = new Set([
              'Frontend checks',
              'Worker checks',
              'MCP plugin contracts',
              'Canonical architecture guardrails',
              'Electron Feature Host contract',
            ]);

            const budgets = {
              'fast-path': 30,
              'workflow-governance': 120,
              'single-domain': 900,
              'multi-domain': 1200,
              'full-canonical': 1800,
            };

            const percentile = (values, p) => {
              if (!values.length) return null;
              const sorted = [...values].sort((a, b) => a - b);
              const index = Math.max(0, Math.ceil((p / 100) * sorted.length) - 1);
              return sorted[index];
            };

            const bucketFor = (selected) => {
              if (selected.length === 0) return 'fast-path';
              if (selected.length === 1 && selected[0] === 'Canonical architecture guardrails') {
                return 'workflow-governance';
              }
              if (selected.length >= canonicalJobs.size) return 'full-canonical';
              if (selected.length === 1) return 'single-domain';
              return 'multi-domain';
            };

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              status: 'completed',
              per_page: 100,
            });

            const candidates = data.workflow_runs
              .filter((run) => new Date(run.created_at).getTime() >= cutoff)
              .filter((run) => run.run_started_at && run.updated_at)
              .filter((run) => !['cancelled', 'skipped'].includes(run.conclusion || ''))
              .slice(0, sampleLimit);

            const samples = [];
            for (const run of candidates) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const selected = jobs
                .filter((job) => canonicalJobs.has(job.name) && job.conclusion !== 'skipped')
                .map((job) => job.name)
                .sort();
              const started = new Date(run.run_started_at).getTime();
              const created = new Date(run.created_at).getTime();
              const completed = new Date(run.updated_at).getTime();
              if (![started, created, completed].every(Number.isFinite)) continue;
              samples.push({
                run_id: run.id,
                run_number: run.run_number,
                event: run.event,
                conclusion: run.conclusion,
                head_sha: run.head_sha,
                html_url: run.html_url,
                bucket: bucketFor(selected),
                selected_jobs: selected,
                queue_seconds: Math.max(0, Math.round((started - created) / 1000)),
                duration_seconds: Math.max(0, Math.round((completed - started) / 1000)),
                created_at: run.created_at,
              });
            }

            const bucketNames = ['fast-path', 'workflow-governance', 'single-domain', 'multi-domain', 'full-canonical'];
            const groups = {};
            for (const bucket of bucketNames) {
              const rows = samples.filter((sample) => sample.bucket === bucket);
              const durations = rows.map((sample) => sample.duration_seconds);
              const queues = rows.map((sample) => sample.queue_seconds);
              const p50 = percentile(durations, 50);
              const p95 = percentile(durations, 95);
              const queueP50 = percentile(queues, 50);
              const queueP95 = percentile(queues, 95);
              const minSamples = 5;
              groups[bucket] = {
                samples: rows.length,
                p50_seconds: p50,
                p95_seconds: p95,
                queue_p50_seconds: queueP50,
                queue_p95_seconds: queueP95,
                slo_budget_seconds: budgets[bucket],
                slo_state: rows.length < minSamples ? 'insufficient-samples' : (p95 <= budgets[bucket] ? 'within-budget' : 'over-budget'),
              };
            }

            const report = {
              schema_version: 1,
              generated_at: new Date().toISOString(),
              repository: `${owner}/${repo}`,
              source_workflow: '.github/workflows/ci.yml',
              lookback_days: 14,
              sample_limit: sampleLimit,
              observed_samples: samples.length,
              groups,
              samples,
            };

            const outDir = path.join(process.env.RUNNER_TEMP, 'fcm-ci-latency');
            fs.mkdirSync(outDir, { recursive: true });
            fs.writeFileSync(path.join(outDir, 'ci-latency-report.json'), JSON.stringify(report, null, 2) + '\n');

            const csvEscape = (value) => {
              const text = Array.isArray(value) ? value.join('|') : String(value ?? '');
              return `"${text.replaceAll('"', '""')}"`;
            };
            const header = ['run_id','run_number','event','conclusion','bucket','duration_seconds','queue_seconds','selected_jobs','head_sha','created_at','html_url'];
            const csv = [header.join(',')]
              .concat(samples.map((sample) => header.map((key) => csvEscape(sample[key])).join(',')))
              .join('\n') + '\n';
            fs.writeFileSync(path.join(outDir, 'ci-latency-samples.csv'), csv);

            const table = [
              [
                { data: 'Validation surface', header: true },
                { data: 'N', header: true },
                { data: 'P50', header: true },
                { data: 'P95', header: true },
                { data: 'Queue P95', header: true },
                { data: 'Budget', header: true },
                { data: 'SLO', header: true },
              ],
            ];
            for (const bucket of bucketNames) {
              const group = groups[bucket];
              table.push([
                bucket,
                String(group.samples),
                group.p50_seconds == null ? 'n/a' : `${group.p50_seconds}s`,
                group.p95_seconds == null ? 'n/a' : `${group.p95_seconds}s`,
                group.queue_p95_seconds == null ? 'n/a' : `${group.queue_p95_seconds}s`,
                `${group.slo_budget_seconds}s`,
                group.slo_state,
              ]);
            }

            await core.summary
              .addHeading('FAB-P0003 CI latency SLO')
              .addRaw(`Measured ${samples.length} completed CI runs from the last 14 days (limit ${sampleLimit}).\n\n`)
              .addTable(table)
              .addRaw('\nSLO evaluation is intentionally soft: latency telemetry never bypasses or replaces required CI checks.\n')
              .write();

            core.setOutput('report_dir', outDir);

      - name: Upload latency evidence
        uses: actions/upload-artifact@v7
        with:
          name: fcm-ci-latency-${{ github.run_id }}
          path: ${{ runner.temp }}/fcm-ci-latency
          if-no-files-found: error
          retention-days: 30
