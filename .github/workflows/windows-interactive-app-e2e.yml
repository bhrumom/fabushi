name: Windows interactive app device E2E

on:
  push:
    branches:
      - main
      - fix/tfi-windows-interactive-release-e2e-20260906
    paths:
      - '.github/workflows/windows-interactive-app-e2e.yml'
      - 'chatgpt-vps-control/tests/windows-interactive-app-e2e-contract.test.js'
      - 'desktop/electron/main.cjs'
      - 'desktop/electron/remote-device-agent-supervisor.cjs'
      - 'desktop/electron/app-agent-surface-server.cjs'
      - 'desktop/e2e/app-agent-surface.spec.ts'
      - 'chatgpt-vps-control/lib/**'
      - 'chatgpt-vps-control/bin/**'
      - 'chatgpt-vps-control/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-interactive-app-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-interactive:
    name: Install latest release, login, register, and expose Windows App
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      DEVICE_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-windows-app
      DEVICE_NAME: Fabushi Test Windows ${{ github.run_id }}/${{ github.run_attempt }}
      FABUSHI_API_BASE_URL: ${{ vars.FABUSHI_API_BASE_URL || 'https://api.ombhrum.com' }}
      MAHAYANA_API_BASE_URL: ${{ vars.FABUSHI_API_BASE_URL || 'https://api.ombhrum.com' }}

    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            chatgpt-vps-control/package-lock.json
            desktop/package-lock.json

      - name: Initialize isolated paths and source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sessionDir = Join-Path $env:RUNNER_TEMP 'fabushi-windows-interactive'
          $accountDir = Join-Path $env:RUNNER_TEMP 'fabushi-account'
          $appSessionDir = Join-Path $env:RUNNER_TEMP 'fabushi-ci-app'
          $appData = Join-Path $env:RUNNER_TEMP 'fabushi-windows-app-data'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'windows-interactive-evidence'
          New-Item -ItemType Directory -Force -Path $sessionDir,$accountDir,$appSessionDir,$appData,(Join-Path $evidence 'steps'),(Join-Path $evidence 'release') | Out-Null
          @(
            "FABUSHI_CI_SESSION_DIR=$sessionDir"
            "FABUSHI_ACCOUNT_SESSION_FILE=$(Join-Path $accountDir 'session.json')"
            "FABUSHI_CI_ACCOUNT_SESSION_FILE=$(Join-Path $appSessionDir 'session.json')"
            "FABUSHI_COMPUTER_POLICY_FILE=$(Join-Path $sessionDir 'computer-policy.json')"
            "FABUSHI_DEVICE_CALL_TRACE_FILE=$(Join-Path $sessionDir 'device-calls.jsonl')"
            "FABUSHI_APP_AGENT_DISCOVERY_FILE=$(Join-Path $sessionDir 'app-agent-bridge.json')"
            "FABUSHI_APP_DATA=$appData"
            "EVIDENCE_DIR=$evidence"
          ) | Add-Content -Path $env:GITHUB_ENV
          '{"localExecution":true,"aiComputerControlEnabled":true,"localToolPermission":"always","remoteControlEnabled":true}' | Set-Content -Path (Join-Path $sessionDir 'computer-policy.json') -Encoding utf8NoBOM
          @(
            "workflow_source_sha=$env:GITHUB_SHA"
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "job=$env:GITHUB_JOB"
            "device_id=$env:DEVICE_ID"
            "started_at=$([DateTime]::UtcNow.ToString('o'))"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
          ) | Set-Content -Path (Join-Path $evidence 'source.env') -Encoding utf8NoBOM
          [ordered]@{
            phase='recording-start'; message='Starting whole-session recording before resolving or installing the Windows test release.'; appReady=$false; appExecutable=''; deviceId=$env:DEVICE_ID; runUrl="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"; updatedAt=[DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json -Compress | Set-Content -Path (Join-Path $sessionDir 'status.json') -Encoding utf8NoBOM

      - name: Install CI recording dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            $env:PATH = [Environment]::GetEnvironmentVariable('PATH','Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH','User')
          }
          $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          "FFMPEG_EXE=$ffmpeg" | Add-Content -Path $env:GITHUB_ENV
          & $ffmpeg -version | Select-Object -First 1 | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'ffmpeg-version.txt')

      - name: Start whole-session Windows recording before install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $video = Join-Path $env:EVIDENCE_DIR 'windows-session.mp4'
          $log = Join-Path $env:EVIDENCE_DIR 'ffmpeg-recording.log'
          $args = @('-y','-f','gdigrab','-framerate','12','-i','desktop','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p',$video)
          $process = Start-Process -FilePath $env:FFMPEG_EXE -ArgumentList $args -RedirectStandardError $log -RedirectStandardOutput (Join-Path $env:EVIDENCE_DIR 'ffmpeg-recording.stdout.log') -PassThru
          $process.Id | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'ffmpeg.pid')
          Start-Sleep -Seconds 3
          if ($process.HasExited) { Get-Content $log -ErrorAction SilentlyContinue; throw 'Windows recorder exited before install.' }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $bitmap.Save((Join-Path $env:EVIDENCE_DIR 'steps/000-recording-start.png'),[System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()

      - name: Install protected account helper dependencies
        working-directory: chatgpt-vps-control
        shell: pwsh
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Run narrow Windows workflow ownership contract
        shell: pwsh
        run: node --test chatgpt-vps-control/tests/windows-interactive-app-e2e-contract.test.js

      - id: release
        name: Resolve newest published Windows test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:EVIDENCE_DIR 'release'
          gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | Set-Content -Path (Join-Path $releaseDir 'releases.json') -Encoding utf8NoBOM
          $releases = Get-Content (Join-Path $releaseDir 'releases.json') -Raw | ConvertFrom-Json
          $candidates = @($releases | Where-Object {
            -not $_.draft -and @($_.assets | Where-Object { $_.name -match '^fabushi-[0-9]+\.[0-9]+\.[0-9]+-setup\.exe$' }).Count -gt 0
          } | Sort-Object { if ($_.published_at) { [DateTime]$_.published_at } else { [DateTime]$_.created_at } })
          if ($candidates.Count -eq 0) { throw 'No published Windows Fabushi installer release exists.' }
          $release = $candidates[-1]
          $asset = @($release.assets | Where-Object { $_.name -match '^fabushi-[0-9]+\.[0-9]+\.[0-9]+-setup\.exe$' })[0]
          $release | ConvertTo-Json -Depth 20 | Set-Content -Path (Join-Path $releaseDir 'release.json') -Encoding utf8NoBOM
          $asset | ConvertTo-Json -Depth 20 | Set-Content -Path (Join-Path $releaseDir 'asset.json') -Encoding utf8NoBOM
          $targetSha = (gh api "repos/$env:GITHUB_REPOSITORY/commits/$($release.target_commitish)" --jq .sha).Trim()
          $targetSha | Set-Content -Path (Join-Path $releaseDir 'target-sha.txt') -Encoding utf8NoBOM
          gh release download $release.tag_name --repo $env:GITHUB_REPOSITORY --pattern $asset.name --dir $releaseDir
          $installer = Join-Path $releaseDir $asset.name
          if (-not (Test-Path $installer)) { throw 'Resolved Windows installer was not downloaded.' }
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($asset.digest -and $asset.digest.StartsWith('sha256:')) {
            $declared = $asset.digest.Substring(7).ToLowerInvariant()
            if ($actual -ne $declared) { throw 'Windows installer digest mismatch.' }
          }
          "$actual  $($asset.name)" | Set-Content -Path (Join-Path $releaseDir 'SHA256SUMS.txt') -Encoding utf8NoBOM
          @(
            "tag=$($release.tag_name)"
            "target_sha=$targetSha"
            "asset_name=$($asset.name)"
            "release_id=$($release.id)"
            "asset_id=$($asset.id)"
            "published_at=$($release.published_at)"
            "installer=$installer"
          ) | Add-Content -Path $env:GITHUB_OUTPUT

      - id: install
        name: Install exact published Windows test app
        shell: pwsh
        env:
          INSTALLER: ${{ steps.release.outputs.installer }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $before = Get-Date
          $installerProcess = Start-Process -FilePath $env:INSTALLER -ArgumentList '/S' -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw "Installer exited with $($installerProcess.ExitCode)" }
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\fabushi\fabushi.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Fabushi\fabushi.exe'),
            (Join-Path $env:ProgramFiles 'Fabushi\fabushi.exe')
          ) | Where-Object { Test-Path $_ }
          if ($candidates.Count -ne 1) {
            Get-ChildItem -Path $env:LOCALAPPDATA,$env:ProgramFiles -Filter fabushi.exe -Recurse -ErrorAction SilentlyContinue | Select-Object FullName,LastWriteTime | ConvertTo-Json | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'release/fabushi-executable-search.json')
            $candidates = @(Get-ChildItem -Path $env:LOCALAPPDATA,$env:ProgramFiles -Filter fabushi.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -ge $before.AddMinutes(-2) } | Select-Object -ExpandProperty FullName -Unique)
          }
          if ($candidates.Count -ne 1) { throw "Expected exactly one installed fabushi.exe, found $($candidates.Count)." }
          $exe = $candidates[0]
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
          if (-not $version) { $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion }
          $expected = ($env:RELEASE_TAG -replace '^(desktop-|v)','')
          if ($expected -match '^[0-9]+\.[0-9]+\.[0-9]+$' -and $version -and -not $version.StartsWith($expected)) { throw "Installed version $version does not match release $expected." }
          [ordered]@{installPath=$exe;version=$version;releaseTag=$env:RELEASE_TAG;installedAt=[DateTime]::UtcNow.ToString('o')} | ConvertTo-Json | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'release/installed-app.json') -Encoding utf8NoBOM
          "executable=$exe" | Add-Content -Path $env:GITHUB_OUTPUT
          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Login protected Fabushi test account and export bounded app session
        shell: pwsh
        env:
          FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
          FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:FABUSHI_CI_TEST_USERNAME) { throw 'FABUSHI_CI_TEST_USERNAME is required.' }
          if (-not $env:FABUSHI_CI_TEST_PASSWORD) { throw 'FABUSHI_CI_TEST_PASSWORD is required.' }
          node chatgpt-vps-control/scripts/login-ci-test-account.mjs
          node chatgpt-vps-control/scripts/export-ci-app-account-session.mjs
          $session = Get-Content $env:FABUSHI_CI_ACCOUNT_SESSION_FILE -Raw | ConvertFrom-Json
          if ($session.refreshToken) { throw 'Bounded App session must not contain refreshToken.' }

      - id: launch
        name: Launch installed Fabushi app and wait for App-owned registration
        shell: pwsh
        env:
          APP_EXECUTABLE: ${{ steps.install.outputs.executable }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType File -Force -Path $env:FABUSHI_DEVICE_CALL_TRACE_FILE | Out-Null
          [ordered]@{phase='app-launching';message='Launching the installed Windows Fabushi App; only the App may register the account-scoped device.';appReady=$false;appExecutable=$env:APP_EXECUTABLE;deviceId=$env:DEVICE_ID;runUrl="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID";updatedAt=[DateTime]::UtcNow.ToString('o')} | ConvertTo-Json -Compress | Set-Content -Path (Join-Path $env:FABUSHI_CI_SESSION_DIR 'status.json') -Encoding utf8NoBOM
          $stdout = Join-Path $env:EVIDENCE_DIR 'fabushi-app.stdout.log'
          $stderr = Join-Path $env:EVIDENCE_DIR 'fabushi-app.stderr.log'
          $process = Start-Process -FilePath $env:APP_EXECUTABLE -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $process.Id | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'fabushi-app.pid')
          $registered = $false
          foreach ($attempt in 1..120) {
            if ($process.HasExited) { throw "Installed Fabushi App exited with $($process.ExitCode)." }
            $combined = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
            if ($combined -match 'controllable device online') { $registered = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $registered) { throw 'Installed Windows App did not register its own Fabushi device within 120 seconds.' }
          if (-not (Test-Path $env:FABUSHI_APP_AGENT_DISCOVERY_FILE)) { throw 'App-owned discovery file is missing.' }
          [ordered]@{phase='app-ready';message='Installed Windows Fabushi App is logged in, registered its own device, and is ready for @fabushi test.';appReady=$true;appExecutable=$env:APP_EXECUTABLE;deviceId=$env:DEVICE_ID;runUrl="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID";updatedAt=[DateTime]::UtcNow.ToString('o')} | ConvertTo-Json -Compress | Set-Content -Path (Join-Path $env:FABUSHI_CI_SESSION_DIR 'status.json') -Encoding utf8NoBOM
          "app_pid=$($process.Id)" | Add-Content -Path $env:GITHUB_OUTPUT
          @(
            '## Windows Fabushi App ready for live plugin control'
            ''
            "- Application device ID: ``$env:DEVICE_ID``"
            "- Release: ``${{ steps.release.outputs.tag }}`` -> ``${{ steps.release.outputs.target_sha }}``"
            "- Installed version: ``${{ steps.install.outputs.version }}``"
            "- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            '- The installed App owns device registration. No standalone Runner/KRIS/interactive-runner device agent is started.'
            '- Use `@fabushi test` list_devices, call all six semantic tools: `fabushi.app.status`, `fabushi.app.snapshot`, `fabushi.app.find`, `fabushi.app.action`, `fabushi.app.wait`, `fabushi.app.assert`, then execute the complete current Windows journey and call `ci_session_status`.'
            '- After every category passes except logout, write `TFI_WINDOWS_FULL_JOURNEY READY_FOR_LOGOUT PASS categories=startup,login,main,conversations,search,send,receive,reply,edit,delete,forward,draft,pin,mute,unread,contacts,groups,bot,agent,miniapp,webmcp,media,file,notifications,sync,settings,update` and make the final App action invoke `settings-logout`.'
            '- On any failure, write a `TFI_WINDOWS_FULL_JOURNEY FAIL ...` note and call `ci_session_finish`; never delete an assertion to force green.'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - id: control
        name: Hold for @fabushi test complete Windows journey
        if: steps.launch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $finishFile = Join-Path $env:FABUSHI_CI_SESSION_DIR 'finish-requested.json'
          $notesFile = Join-Path $env:FABUSHI_CI_SESSION_DIR 'remote-notes.jsonl'
          $pidFile = Join-Path $env:EVIDENCE_DIR 'fabushi-app.pid'
          $appPid = [int](Get-Content $pidFile -Raw)
          $deadline = (Get-Date).AddMinutes(25)
          'waiting-for-fabushi-test' | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'remote-control-status.txt')
          while ((Get-Date) -lt $deadline) {
            if (-not (Get-Process -Id $appPid -ErrorAction SilentlyContinue)) { 'app-exited' | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'remote-control-status.txt'); throw 'Fabushi App exited during remote control.' }
            $completedTools = @()
            if (Test-Path $env:FABUSHI_DEVICE_CALL_TRACE_FILE) {
              Get-Content $env:FABUSHI_DEVICE_CALL_TRACE_FILE | ForEach-Object {
                try { $row = $_ | ConvertFrom-Json; if ($row.phase -eq 'completed' -and $row.ok -eq $true) { $completedTools += $row.toolName } } catch {}
              }
            }
            $required = @('fabushi.app.status','fabushi.app.snapshot','fabushi.app.find','fabushi.app.action','fabushi.app.wait','fabushi.app.assert')
            $haveAll = @($required | Where-Object { $_ -in $completedTools }).Count -eq $required.Count
            $readyNote = $false
            if (Test-Path $notesFile) { $readyNote = (Get-Content $notesFile -Raw) -match 'TFI_WINDOWS_FULL_JOURNEY READY_FOR_LOGOUT PASS categories=' }
            $logoutComplete = $false
            if (Test-Path $env:FABUSHI_DEVICE_CALL_TRACE_FILE) {
              Get-Content $env:FABUSHI_DEVICE_CALL_TRACE_FILE | ForEach-Object {
                try { $row = $_ | ConvertFrom-Json; if ($row.phase -eq 'completed' -and $row.ok -eq $true -and $row.toolName -eq 'fabushi.app.action' -and $row.arguments.agentId -eq 'settings-logout' -and $row.arguments.action -eq 'invoke') { $script:logoutComplete = $true } } catch {}
              }
            }
            if ($haveAll -and $readyNote -and $logoutComplete) { 'passed' | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'remote-control-status.txt'); exit 0 }
            if (Test-Path $finishFile) { 'failed' | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'remote-control-status.txt'); throw 'Remote finish arrived before six tools plus READY_FOR_LOGOUT PASS plus settings-logout.' }
            Start-Sleep -Seconds 1
          }
          'timeout' | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'remote-control-status.txt')
          throw 'Timed out waiting for @fabushi test complete Windows journey.'

      - name: Stop live application before secondary Playwright evidence
        if: always()
        shell: pwsh
        run: |
          if (Test-Path (Join-Path $env:EVIDENCE_DIR 'fabushi-app.pid')) {
            Stop-Process -Id ([int](Get-Content (Join-Path $env:EVIDENCE_DIR 'fabushi-app.pid') -Raw)) -Force -ErrorAction SilentlyContinue
          }

      - name: Install existing Electron test dependencies
        if: always()
        working-directory: desktop
        shell: pwsh
        run: npm ci --prefer-offline --no-audit --no-fund

      - id: playwright
        name: Run packaged App Agent Surface Playwright evidence
        if: always()
        continue-on-error: true
        working-directory: desktop
        shell: pwsh
        env:
          FABUSHI_ELECTRON_EXECUTABLE: ${{ steps.install.outputs.executable }}
          FABUSHI_FEATURE_HOST_MODE: test
        run: |
          $env:FABUSHI_CI_ACCOUNT_SESSION_FILE=$null
          $env:FABUSHI_ACCOUNT_SESSION_FILE=$null
          $env:FABUSHI_CI_SESSION_DIR=$null
          $env:FABUSHI_DEVICE_CALL_TRACE_FILE=$null
          $env:FABUSHI_APP_AGENT_DISCOVERY_FILE=$null
          $env:FABUSHI_APP_DATA=$null
          $env:DEVICE_ID=$null
          $env:DEVICE_NAME=$null
          $env:GITHUB_ACTIONS=$null
          npx playwright test e2e/app-agent-surface.spec.ts

      - name: Collect Windows App, device-call, Playwright, and release evidence
        if: always()
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          RELEASE_ASSET_ID: ${{ steps.release.outputs.asset_id }}
          INSTALLED_VERSION: ${{ steps.install.outputs.version }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path (Join-Path $env:EVIDENCE_DIR 'ffmpeg.pid')) {
            $recordPid = [int](Get-Content (Join-Path $env:EVIDENCE_DIR 'ffmpeg.pid') -Raw)
            Stop-Process -Id $recordPid -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
          }
          Copy-Item $env:FABUSHI_DEVICE_CALL_TRACE_FILE (Join-Path $env:EVIDENCE_DIR 'device-calls.jsonl') -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $env:EVIDENCE_DIR 'device-calls.jsonl'))) { New-Item -ItemType File -Path (Join-Path $env:EVIDENCE_DIR 'device-calls.jsonl') | Out-Null }
          Copy-Item (Join-Path $env:FABUSHI_CI_SESSION_DIR 'remote-notes.jsonl') (Join-Path $env:EVIDENCE_DIR 'remote-notes.jsonl') -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $env:EVIDENCE_DIR 'remote-notes.jsonl'))) { New-Item -ItemType File -Path (Join-Path $env:EVIDENCE_DIR 'remote-notes.jsonl') | Out-Null }
          Copy-Item (Join-Path $env:FABUSHI_CI_SESSION_DIR 'finish-requested.json') (Join-Path $env:EVIDENCE_DIR 'finish-requested.json') -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:FABUSHI_CI_SESSION_DIR 'status.json') (Join-Path $env:EVIDENCE_DIR 'final-ci-session-status.json') -ErrorAction SilentlyContinue
          node chatgpt-vps-control/scripts/compile-ci-device-trace.mjs $env:FABUSHI_DEVICE_CALL_TRACE_FILE (Join-Path $env:EVIDENCE_DIR 'generated-regression.json')
          gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100" | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'workflow-jobs.json') -Encoding utf8NoBOM
          $controlStatus = if (Test-Path (Join-Path $env:EVIDENCE_DIR 'remote-control-status.txt')) { (Get-Content (Join-Path $env:EVIDENCE_DIR 'remote-control-status.txt') -Raw).Trim() } else { 'not-run' }
          $completedTools = @()
          Get-Content (Join-Path $env:EVIDENCE_DIR 'device-calls.jsonl') -ErrorAction SilentlyContinue | ForEach-Object { try { $r=$_ | ConvertFrom-Json; if ($r.phase -eq 'completed' -and $r.ok -eq $true -and $r.toolName) { $completedTools += $r.toolName } } catch {} }
          $journeyNote = ''
          Get-Content (Join-Path $env:EVIDENCE_DIR 'remote-notes.jsonl') -ErrorAction SilentlyContinue | ForEach-Object { try { $r=$_ | ConvertFrom-Json; if ($r.note -like '*TFI_WINDOWS_FULL_JOURNEY*') { $journeyNote=$r.note } } catch {} }
          [ordered]@{schema='fabushi.windows.interactive-evidence.v1';workflowSourceSha=$env:GITHUB_SHA;releaseTag=$env:RELEASE_TAG;releaseTargetSha=$env:RELEASE_TARGET_SHA;releaseAssetId=$env:RELEASE_ASSET_ID;installedVersion=$env:INSTALLED_VERSION;runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT;job=$env:GITHUB_JOB;runUrl="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID";deviceId=$env:DEVICE_ID;controlStatus=$controlStatus;playwrightOutcome=$env:PLAYWRIGHT_OUTCOME;journeyNote=$journeyNote;completedTools=@($completedTools | Sort-Object -Unique);completedAt=[DateTime]::UtcNow.ToString('o')} | ConvertTo-Json -Depth 10 | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'report.json') -Encoding utf8NoBOM
          @(
            '# Fabushi Windows interactive evidence'
            ''
            "- Workflow source SHA: ``$env:GITHUB_SHA``"
            "- Release: ``$env:RELEASE_TAG`` -> ``$env:RELEASE_TARGET_SHA``"
            "- Installed version: ``$env:INSTALLED_VERSION``"
            "- Run: ``$env:GITHUB_RUN_ID`` attempt ``$env:GITHUB_RUN_ATTEMPT`` / job ``$env:GITHUB_JOB``"
            "- Device: ``$env:DEVICE_ID``"
            "- @fabushi test journey: ``$controlStatus``"
            "- Playwright packaged App Surface: ``$env:PLAYWRIGHT_OUTCOME``"
            "- Journey note: $journeyNote"
            '- Release upload alone is not treated as pass evidence.'
            '- Device registration is valid only when owned by the installed Windows App after protected-account login.'
          ) | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'README.md') -Encoding utf8NoBOM
          Get-ChildItem -Path $env:EVIDENCE_DIR -File -Recurse | Sort-Object FullName | Select-Object -ExpandProperty FullName | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence-files.txt') -Encoding utf8NoBOM

      - name: Upload complete Windows interactive evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-windows-interactive-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            windows-interactive-evidence/
            desktop/playwright-report/
            desktop/test-results/
          if-no-files-found: error
          retention-days: 90

      - name: Remove private account material and temporary app data
        if: always()
        shell: pwsh
        run: |
          if ($env:FABUSHI_ACCOUNT_SESSION_FILE) { Remove-Item $env:FABUSHI_ACCOUNT_SESSION_FILE -Force -ErrorAction SilentlyContinue }
          if ($env:FABUSHI_CI_ACCOUNT_SESSION_FILE) { Remove-Item $env:FABUSHI_CI_ACCOUNT_SESSION_FILE -Force -ErrorAction SilentlyContinue }
          if ($env:FABUSHI_APP_DATA) { Remove-Item $env:FABUSHI_APP_DATA -Recurse -Force -ErrorAction SilentlyContinue }
          Remove-Item (Join-Path $env:FABUSHI_CI_SESSION_DIR 'account-access-token') -Force -ErrorAction SilentlyContinue

      - name: Enforce complete Windows interactive gate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ steps.release.outcome }}' -ne 'success') { throw 'Release resolution/download did not succeed.' }
          if ('${{ steps.install.outcome }}' -ne 'success') { throw 'Exact Windows installer did not install successfully.' }
          if ('${{ steps.launch.outcome }}' -ne 'success') { throw 'Installed Windows App did not self-register successfully.' }
          if ('${{ steps.control.outcome }}' -ne 'success') { throw '@fabushi test Windows semantic journey did not complete successfully.' }
          if ('${{ steps.playwright.outcome }}' -ne 'success') { throw 'Packaged App Agent Surface Playwright evidence failed.' }
          $video = Join-Path $env:EVIDENCE_DIR 'windows-session.mp4'
          if (-not (Test-Path $video) -or (Get-Item $video).Length -lt 1024) { throw 'Whole-session Windows video evidence is missing or empty.' }
          $trace = Get-Content (Join-Path $env:EVIDENCE_DIR 'device-calls.jsonl') -ErrorAction Stop
          $tools = @()
          foreach ($line in $trace) { try { $r=$line | ConvertFrom-Json; if ($r.phase -eq 'completed' -and $r.ok -eq $true) { $tools += $r.toolName } } catch {} }
          foreach ($required in @('fabushi.app.status','fabushi.app.snapshot','fabushi.app.find','fabushi.app.action','fabushi.app.wait','fabushi.app.assert')) { if ($required -notin $tools) { throw "Required semantic tool missing successful trace: $required" } }
          $report = Get-Content (Join-Path $env:EVIDENCE_DIR 'report.json') -Raw | ConvertFrom-Json
          if ($report.controlStatus -ne 'passed') { throw "Windows interactive report status is $($report.controlStatus)." }
