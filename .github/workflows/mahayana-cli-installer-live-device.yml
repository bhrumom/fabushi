name: Mahayana CLI installer live device (manual MCP validation)

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact canonical source SHA expected behind mahayana-cli-latest
        required: true
        type: string
      hold_minutes:
        description: Maximum official-MCP validation window
        required: true
        default: '30'
        type: choice
        options: ['15', '30', '60']

permissions:
  contents: read

concurrency:
  group: mahayana-cli-installer-live-${{ inputs.expected_source_sha }}
  cancel-in-progress: false

jobs:
  installer-live-device:
    name: Fresh one-line installer device
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEVICE_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-interactive
      DEVICE_NAME: Mahayana installed CLI GitHub Actions ${{ github.run_id }}
      FABUSHI_API_BASE_URL: ${{ vars.FABUSHI_API_BASE_URL || 'https://api.ombhrum.com' }}
      MAHAYANA_API_BASE_URL: ${{ vars.FABUSHI_API_BASE_URL || 'https://api.ombhrum.com' }}
    steps:
      - name: Checkout control scripts only
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            chatgpt-vps-control
          persist-credentials: false

      - name: Resolve private runtime paths
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ inputs.expected_source_sha }}'
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo 'expected_source_sha must be a full commit SHA' >&2; exit 1; }
          {
            echo "EXPECTED_SOURCE_SHA=$expected"
            echo "MAHAYANA_HOME=$RUNNER_TEMP/mahayana-home"
            echo "MAHAYANA_INSTALL_DIR=$RUNNER_TEMP/mahayana-bin"
            echo "FABUSHI_ACCOUNT_SESSION_FILE=$RUNNER_TEMP/mahayana-account-session.json"
            echo "FABUSHI_CI_ACCOUNT_SESSION_FILE=$RUNNER_TEMP/mahayana-ci-session.json"
            echo "FABUSHI_CI_FINISH_FILE=$RUNNER_TEMP/mahayana-home/device-agent/remote-finished.json"
          } >> "$GITHUB_ENV"

      - name: Verify public latest channel points to the exact source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(gh release view mahayana-cli-latest --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          test "$target" = "$EXPECTED_SOURCE_SHA" || {
            echo "mahayana-cli-latest points to $target, expected $EXPECTED_SOURCE_SHA" >&2
            exit 1
          }
          mapfile -t assets < <(gh release view mahayana-cli-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          printf '%s\n' "${assets[@]}"
          printf '%s\n' "${assets[@]}" | grep -qx 'SHA256SUMS.txt'
          printf '%s\n' "${assets[@]}" | grep -qx 'mahayana-linux-x86_64.tar.gz'

      - name: Install released CLI through the public one-line bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MAHAYANA_HOME" "$MAHAYANA_INSTALL_DIR"
          curl -fsSL --retry 5 --retry-all-errors https://ombhrum.com/mahayana/install.sh \
            | env \
                MAHAYANA_HOME="$MAHAYANA_HOME" \
                MAHAYANA_INSTALL_DIR="$MAHAYANA_INSTALL_DIR" \
                FABUSHI_CI_ACCOUNT_SESSION_FILE="$FABUSHI_CI_ACCOUNT_SESSION_FILE" \
                FABUSHI_CI_FINISH_FILE="$FABUSHI_CI_FINISH_FILE" \
                DEVICE_ID="$DEVICE_ID" \
                DEVICE_NAME="$DEVICE_NAME" \
                GITHUB_SHA="$EXPECTED_SOURCE_SHA" \
                sh
          echo "$MAHAYANA_INSTALL_DIR" >> "$GITHUB_PATH"
          "$MAHAYANA_INSTALL_DIR/mahayana" --version
          "$MAHAYANA_INSTALL_DIR/mahayana" device status

      - name: Bind the installed CLI to the dedicated Fabushi CI account
        env:
          FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
          FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FABUSHI_CI_TEST_USERNAME"
          test -n "$FABUSHI_CI_TEST_PASSWORD"
          node chatgpt-vps-control/scripts/login-ci-test-account.mjs
          node chatgpt-vps-control/scripts/export-ci-app-account-session.mjs
          rm -f "$FABUSHI_ACCOUNT_SESSION_FILE"
          mahayana auth
          mahayana device status

      - name: Wait for released CLI registration
        shell: bash
        run: |
          set -euo pipefail
          log="$MAHAYANA_HOME/device-agent/agent.log"
          for attempt in $(seq 1 60); do
            if grep -q "Mahayana controllable device online: $DEVICE_ID" "$log" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if ! grep -q "Mahayana controllable device online: $DEVICE_ID" "$log" 2>/dev/null; then
            mahayana device status >&2 || true
            tail -n 120 "$log" >&2 2>/dev/null || true
            exit 1
          fi
          {
            echo '## Released Mahayana CLI installer device'
            echo "- Latest-channel source: \`$EXPECTED_SOURCE_SHA\`"
            echo "- Device ID: \`$DEVICE_ID\`"
            echo '- Installation path: public `https://ombhrum.com/mahayana/install.sh` -> `mahayana-cli-latest` release asset.'
            echo '- Validate through the official Fabushi MCP, then call `ci_session_finish`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hold fresh installed device for official MCP validation
        shell: bash
        run: |
          set -euo pipefail
          seconds=$(( ${{ inputs.hold_minutes }} * 60 ))
          started="$(date +%s)"
          while (( $(date +%s) - started < seconds )); do
            if test -f "$FABUSHI_CI_FINISH_FILE"; then
              mahayana device stop || true
              exit 0
            fi
            mahayana device status | grep -q '"running": true'
            sleep 5
          done
          echo 'Installer validation window expired without ci_session_finish.' >&2
          exit 1

      - name: Remove ephemeral account/device state
        if: always()
        shell: bash
        run: |
          mahayana logout || true
          mahayana device stop || true
          rm -f "$FABUSHI_ACCOUNT_SESSION_FILE" "$FABUSHI_CI_ACCOUNT_SESSION_FILE"
          sleep 2

  installer-smoke-macos:
    name: One-line installer smoke (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify latest channel and run public shell installer
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ inputs.expected_source_sha }}'
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          target="$(gh release view mahayana-cli-latest --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          test "$target" = "$expected"
          install_dir="$RUNNER_TEMP/mahayana-bin"
          home_dir="$RUNNER_TEMP/mahayana-home"
          mkdir -p "$install_dir" "$home_dir"
          curl -fsSL --retry 5 --retry-all-errors https://ombhrum.com/mahayana/install.sh \
            | MAHAYANA_INSTALL_DIR="$install_dir" MAHAYANA_HOME="$home_dir" sh
          "$install_dir/mahayana" --version
          "$install_dir/mahayana" device status
          "$install_dir/mahayana" device stop

  installer-smoke-windows:
    name: One-line installer smoke (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify latest channel and run public PowerShell installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ inputs.expected_source_sha }}'
          if ($expected -notmatch '^[0-9a-f]{40}$') { throw 'expected_source_sha must be a full commit SHA' }
          $target = gh release view mahayana-cli-latest --repo $env:GITHUB_REPOSITORY --json targetCommitish --jq .targetCommitish
          if ($target.Trim() -ne $expected) { throw "mahayana-cli-latest points to $target, expected $expected" }
          $env:MAHAYANA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'mahayana-bin'
          $env:MAHAYANA_HOME = Join-Path $env:RUNNER_TEMP 'mahayana-home'
          New-Item -ItemType Directory -Force -Path $env:MAHAYANA_INSTALL_DIR, $env:MAHAYANA_HOME | Out-Null
          irm https://ombhrum.com/mahayana/install.ps1 | iex
          $exe = Join-Path $env:MAHAYANA_INSTALL_DIR 'mahayana.exe'
          & $exe --version
          & $exe device status
          & $exe device stop
