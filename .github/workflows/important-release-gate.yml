name: Important Release Gate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example v1.0.0
        required: true
      prerelease:
        description: Mark the GitHub release as prerelease
        required: false
        type: boolean
        default: false
      device_model:
        description: Firebase Test Lab physical device model
        required: false
        default: Pixel2
      device_version:
        description: Android API level for the physical device
        required: false
        default: '30'

permissions:
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag }}

jobs:
  real-device-e2e:
    uses: ./.github/workflows/android-real-device-e2e.yml
    with:
      device_model: ${{ github.event.inputs.device_model }}
      device_version: ${{ github.event.inputs.device_version }}
      device_locale: zh_CN
      device_orientation: portrait
    secrets: inherit

  create-release:
    name: Create GitHub release after real-device E2E
    runs-on: ubuntu-latest
    needs: real-device-e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag exists
        shell: bash
        run: git rev-parse -q --verify "refs/tags/${RELEASE_TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
