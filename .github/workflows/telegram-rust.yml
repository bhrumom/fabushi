name: Telegram Rust Core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/telegram-*/**'
      - 'third_party/mahayana/mahayana-rs/providers/telegram-*/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-telegram/**'
      - 'docs/telegram-*.md'
      - 'scripts/build-telegram-wasm.sh'
      - 'scripts/test-telegram-wasm.mjs'
      - 'scripts/test-telegram-rust.sh'
      - '.github/workflows/telegram-rust.yml'
  push:
    branches: [main]
    paths:
      - 'native/telegram-*/**'
      - 'third_party/mahayana/mahayana-rs/providers/telegram-*/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-telegram/**'
      - 'docs/telegram-*.md'
      - 'scripts/build-telegram-wasm.sh'
      - 'scripts/test-telegram-wasm.mjs'
      - 'scripts/test-telegram-rust.sh'
      - '.github/workflows/telegram-rust.yml'

concurrency:
  group: telegram-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-pr:
    name: PR fast Rust gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Restore Telegram Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: telegram-pr-fast-v2
          cache-all-crates: true
      - name: Test Telegram and embedded Runtime packages together
        run: >-
          cargo test --locked
          --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml
          -p fabushi-telegram-core
          -p fabushi-telegram-protocol
          -p fabushi-telegram-network
          -p fabushi-telegram-storage
          -p fabushi-telegram-runtime
          -p fabushi-telegram-media
          -p fabushi-telegram-wasm
          -p mahayana-core
          -p mahayana-runtime
          -p mahayana-ffi
      - name: Clippy Telegram and embedded Runtime packages together
        run: >-
          cargo clippy --locked
          --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml
          -p fabushi-telegram-core
          -p fabushi-telegram-protocol
          -p fabushi-telegram-network
          -p fabushi-telegram-storage
          -p fabushi-telegram-runtime
          -p fabushi-telegram-media
          -p fabushi-telegram-wasm
          -p mahayana-core
          -p mahayana-runtime
          -p mahayana-ffi
          --all-targets -- -D warnings

  format-and-schema:
    name: Format and pinned TDLib schema
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all -- --check
      - name: Download pinned Telegram schemas
        run: |
          for schema in td_api.tl telegram_api.tl mtproto_api.tl; do
            curl -fsSL \
              "https://raw.githubusercontent.com/tdlib/td/a17f87c4cff7b90b278d12b91ba0614383aaee82/td/generate/scheme/$schema" \
              -o "/tmp/$schema"
          done
      - name: Verify schema digests and surfaces
        run: |
          cargo run --quiet --manifest-path third_party/mahayana/mahayana-rs/providers/telegram-protocol/Cargo.toml --bin td-schema-audit -- td /tmp/td_api.tl
          cargo run --quiet --manifest-path third_party/mahayana/mahayana-rs/providers/telegram-protocol/Cargo.toml --bin td-schema-audit -- telegram /tmp/telegram_api.tl
          cargo run --quiet --manifest-path third_party/mahayana/mahayana-rs/providers/telegram-protocol/Cargo.toml --bin td-schema-audit -- mtproto /tmp/mtproto_api.tl
      - name: Regenerate constructor catalog
        run: >-
          cargo run --quiet
          --manifest-path third_party/mahayana/mahayana-rs/providers/telegram-protocol/Cargo.toml
          --bin tl-schema-codegen --
          /tmp/telegram_api.tl
          /tmp/mtproto_api.tl
          third_party/mahayana/mahayana-rs/providers/telegram-protocol/src/generated/schema_ids.rs
      - name: Reject generated schema drift
        run: git diff --exit-code -- third_party/mahayana/mahayana-rs/providers/telegram-protocol/src/generated/schema_ids.rs

  wasm:
    name: WebAssembly target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Generate browser glue
        run: |
          ./scripts/build-telegram-wasm.sh
          ./scripts/build-mahayana-wasm.sh
      - name: Execute WebAssembly contract
        run: |
          node scripts/test-telegram-wasm.mjs
          node scripts/test-mahayana-wasm.mjs

  rust-full:
    name: ${{ matrix.os }} / ${{ matrix.crate }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        crate:
          - fabushi-telegram-core
          - fabushi-telegram-protocol
          - fabushi-telegram-network
          - fabushi-telegram-storage
          - fabushi-telegram-runtime
          - fabushi-telegram-media
          - fabushi-telegram-wasm
          - mahayana-core
          - mahayana-runtime
          - mahayana-ffi
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --locked --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --package ${{ matrix.crate }}
      - name: Clippy
        run: cargo clippy --locked --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --package ${{ matrix.crate }} --all-targets -- -D warnings

  android-runtime:
    name: Android Rust runtime ABIs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and cargo-ndk
        run: |
          sdkmanager 'ndk;28.2.13676358'
          cargo install cargo-ndk --locked
      - name: Build three Android ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: ./fabushi/android/build_telegram_runtime.sh
      - name: Verify runtime artifacts and ABI symbols
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          nm_tool="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -path '*/bin/llvm-nm' -type f | head -1)"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            library="fabushi/android/app/src/main/jniLibs/$abi/libmahayana_runtime.so"
            test -f "$library"
            for symbol in force_link create execute receive interrupt resolve_approval close free_string; do
              "$nm_tool" -D --defined-only "$library" | grep -q "mahayana_runtime_${symbol}$"
            done
            "$nm_tool" -D --defined-only "$library" | grep -q "mahayana_product_execute$"
            for symbol in force_link create_client create_persistent_client execute close_client free_string; do
              "$nm_tool" -D --defined-only "$library" | grep -q "fabushi_telegram_${symbol}$"
            done
          done

  apple-runtime:
    name: Apple Rust runtime archives
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Build macOS dynamic library
        env:
          TARGET_BUILD_DIR: /tmp/fabushi-macos
          FRAMEWORKS_FOLDER_PATH: Frameworks
          CONFIGURATION: Release
          ARCHS: arm64
        run: ./fabushi/macos/build_telegram_runtime.sh
      - name: Build iOS Simulator static library
        env:
          CONFIGURATION: Release
          PLATFORM_NAME: iphonesimulator
          ARCHS: arm64
        run: ./fabushi/ios/build_telegram_runtime.sh
      - name: Verify Apple symbols
        run: |
          for library in \
            /tmp/fabushi-macos/Frameworks/libmahayana_runtime.dylib \
            fabushi/ios/Runner/Libs/libmahayana_runtime.a; do
            test -f "$library"
            for symbol in force_link create execute receive interrupt resolve_approval close free_string; do
              nm -gU "$library" | grep -q "_mahayana_runtime_${symbol}$"
            done
            nm -gU "$library" | grep -q "_mahayana_product_execute$"
            for symbol in force_link create_client create_persistent_client execute close_client free_string; do
              nm -gU "$library" | grep -q "_fabushi_telegram_${symbol}$"
            done
          done

  desktop-runtime:
    name: ${{ matrix.os }} desktop runtime
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux shared library
        if: runner.os == 'Linux'
        run: ./fabushi/linux/build_telegram_runtime.sh Release /tmp/fabushi-linux
      - name: Verify Linux symbols
        if: runner.os == 'Linux'
        run: |
          test -f /tmp/fabushi-linux/libmahayana_runtime.so
          for symbol in force_link create execute receive interrupt resolve_approval close free_string; do
            nm -D --defined-only /tmp/fabushi-linux/libmahayana_runtime.so | grep -q "mahayana_runtime_${symbol}$"
          done
          nm -D --defined-only /tmp/fabushi-linux/libmahayana_runtime.so | grep -q "mahayana_product_execute$"
          for symbol in force_link create_client create_persistent_client execute close_client free_string; do
            nm -D --defined-only /tmp/fabushi-linux/libmahayana_runtime.so | grep -q "fabushi_telegram_${symbol}$"
          done
      - name: Build Windows dynamic library
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./fabushi/windows/build_telegram_runtime.ps1 -Configuration Release -OutputDirectory "$env:RUNNER_TEMP/fabushi-windows"
      - name: Verify Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "$env:RUNNER_TEMP/fabushi-windows/mahayana_runtime.dll")) {
            throw "Windows Mahayana Rust runtime was not produced."
          }
