    timeout-minutes: 10
    steps:
      - name: Check out the exact M3 closure branch
        uses: actions/checkout@v5
        with:
          ref: fix/fab-p0001-m3-e2e-closure
          fetch-depth: 1

      - name: Apply exact M3 closure patch
