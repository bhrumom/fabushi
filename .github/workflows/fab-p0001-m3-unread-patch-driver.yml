    pub folders: BTreeMap<String, ConversationFolder>,
    pub messages: BTreeMap<ConversationId, BTreeMap<MessageId, Message>>,
    pub read_cursors: BTreeMap<ConversationId, BTreeMap<ActorId, MessageId>>,
''',
