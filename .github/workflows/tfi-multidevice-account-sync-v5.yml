name: TFI multi-device account sync one-shot v5

on:
  push:
    branches: [feat/tfi-multidevice-account-sync]
    paths: [.github/workflows/tfi-multidevice-account-sync-v5.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/apply-tfi-multidevice-account-sync.py
            .github/scripts/repair-tfi-multidevice-transform.py
            .github/workflows/tfi-multidevice-account-sync.yml
            .github/workflows/tfi-multidevice-account-sync-v2.yml
            .github/workflows/tfi-multidevice-account-sync-v3.yml
            .github/workflows/tfi-multidevice-account-sync-v4.yml
            .github/workflows/tfi-multidevice-account-sync-v5.yml
            ai-backend
            desktop/electron
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-backend/package-lock.json
      - run: python3 .github/scripts/repair-tfi-multidevice-transform.py
      - run: git diff --check
      - working-directory: ai-backend
        run: npm ci
      - working-directory: ai-backend
        run: node --test test/account_sync_store.test.js test/miniapp_marketplace_http.test.js
      - run: node --test desktop/electron/native-capability-handlers.test.cjs
      - name: Commit verified integration
        env:
          BRANCH: feat/tfi-multidevice-account-sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/scripts/apply-tfi-multidevice-account-sync.py .github/scripts/repair-tfi-multidevice-transform.py .github/workflows/tfi-multidevice-account-sync.yml .github/workflows/tfi-multidevice-account-sync-v2.yml .github/workflows/tfi-multidevice-account-sync-v3.yml .github/workflows/tfi-multidevice-account-sync-v4.yml .github/workflows/tfi-multidevice-account-sync-v5.yml
          git add ai-backend/src/account_sync_store.js ai-backend/src/platform_api.js ai-backend/src/miniapp_marketplace_mcp.js desktop/electron/native-capability-handlers.cjs desktop/electron/native-capability-handlers.test.cjs
          git commit -m "feat(sync): integrate account difference stream and native bridge"
          git push origin "HEAD:${BRANCH}"
