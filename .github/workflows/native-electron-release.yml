name: Native Electron macOS test release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-version.json'
      - 'desktop/package.json'
      - 'desktop/src/selfhosted-messaging-client-v2.ts'
      - '.github/workflows/native-electron-release.yml'

permissions:
  contents: write

concurrency:
  group: native-electron-macos-test-release
  cancel-in-progress: false

jobs:
  mac-test-release:
    name: macOS test release
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout exact protected run source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Bind exact protected run SHA and version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version="$(jq -r .version app-version.json)"
          test "$version" = "$(jq -r .version desktop/package.json)"
          test "$version" = '1.2.46'
          echo "FABUSHI_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require canonical protected-main test release gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export SOURCE_SHA="$HEAD_SHA"
          export RELEASE_TARGET=macos
          export RELEASE_TIER=test
          bash .github/scripts/require-release-source-gates.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            chatgpt-vps-control/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: release-electron-macos-test-v1
      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci --prefer-offline
      - name: Install Computer Use dependencies
        working-directory: chatgpt-vps-control
        run: npm ci --ignore-scripts --prefer-offline
      - name: Build canonical Mac payload only
        run: |
          cd desktop
          npm run build:host
          cd ..
          node .github/scripts/build-offline-asr-engine.mjs
          cd desktop
          npm run build:renderer
      - name: Install Developer ID Application identity
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CONFIGURED_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          cert="$RUNNER_TEMP/fabushi-developer-id.p12"
          keychain="$RUNNER_TEMP/fabushi-developer-id.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity="$CONFIGURED_IDENTITY"
          if [ -z "$identity" ]; then identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"; fi
          case "$identity" in *'Developer ID Application:'*) ;; *) exit 1 ;; esac
          echo "MACOS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Sign staged native executables
        shell: bash
        run: |
          set -euo pipefail
          host=desktop/resources/bin/mahayana-app-host
          codesign --force --options runtime --timestamp --identifier com.ombhrum.fabushi.mahayana-app-host --sign "$MACOS_CODESIGN_IDENTITY" "$host"
          while IFS= read -r binary; do codesign --force --options runtime --timestamp --identifier com.ombhrum.fabushi.whisper-cli --sign "$MACOS_CODESIGN_IDENTITY" "$binary"; done < <(find desktop/resources/asr -type f -name whisper-cli -print)
          codesign --verify --strict --verbose=2 "$host"
      - name: Stage Computer Use runtime
        env:
          CHATGPT_COMPUTER_HOME: ${{ github.workspace }}/desktop/resources/computer-control
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || vars.MACOS_APP_STORE_TEAM_ID }}
        run: |
          export CHATGPT_COMPUTER_CODESIGN_IDENTITY="$MACOS_CODESIGN_IDENTITY"
          export CHATGPT_COMPUTER_TEAM_ID="${APPLE_TEAM_ID:-}"
          node chatgpt-vps-control/bin/prepare-fabushi-bundle.js
      - name: Package signed Mac DMG ZIP updater assets
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          FABUSHI_MACOS_NOTARIZE: '1'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || vars.MACOS_APP_STORE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: npx electron-builder --mac --publish never
      - name: Notarize staple and verify
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || vars.MACOS_APP_STORE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          MACOS_NOTARIZATION_TIMEOUT_MINUTES: '60'
          MACOS_NOTARIZATION_POLL_SECONDS: '20'
        run: |
          set -euo pipefail
          dmg="$(find desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          zip="$(find desktop/release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          app="$(find desktop/release -maxdepth 3 -type d -name '*.app' -print -quit)"
          test -n "$dmg"; test -n "$zip"; test -n "$app"
          bash .github/scripts/notarize-macos-dmg.sh "$dmg"
          bash .github/scripts/verify-electron-macos-package.sh "$app" "$dmg"
          node .github/scripts/verify-packaged-computer-control.mjs --release-root desktop/release --platform mac
          test -f desktop/release/latest-mac.yml
          find desktop/release -maxdepth 1 -type f -name '*.blockmap' | grep -q .
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
      - name: Hash assets and publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd desktop/release
          shasum -a 256 *.dmg *.zip latest-mac.yml *.blockmap > SHA256SUMS.txt
          assets=( *.dmg *.zip latest-mac.yml *.blockmap SHA256SUMS.txt )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to mutate an existing release." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --prerelease --latest=false --title "Fabushi $FABUSHI_RELEASE_VERSION macOS test" --notes "Mac-only test release from protected main $HEAD_SHA. Signed, notarized, stapled, updater assets included."
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,targetCommitish
      - name: Upload immutable Mac release evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac-test-release-${{ env.FABUSHI_RELEASE_VERSION }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/latest-mac.yml
            desktop/release/*.blockmap
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
