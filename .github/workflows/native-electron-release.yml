name: Native Electron application release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package and publish
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: native-electron-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify:
    name: Verify canonical release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify tag and canonical architecture
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG"
          bash .github/scripts/assert-native-electron-canonical.sh
      - name: Require green CI, Electron and native-mobile gates for the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tagged_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          checks_json="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$tagged_sha/check-runs?per_page=100")"
          for required in 'CI result' 'Electron desktop result' 'Native mobile result'; do
            conclusion="$(printf '%s' "$checks_json" | jq -r --arg required "$required" '[.[].check_runs[] | select(.name == $required)] | last | .conclusion // "missing"')"
            if [ "$conclusion" != "success" ]; then
              echo "Required release gate '$required' is $conclusion for $tagged_sha." >&2
              exit 1
            fi
          done
          echo "Tagged commit $tagged_sha has all canonical platform gates green."
      - id: version
        shell: bash
        run: echo "version=$(jq -r '.version' app-version.json)" >> "$GITHUB_OUTPUT"

  electron-quality:
    name: Electron release smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: release-electron-${{ runner.os }}-v2
      - working-directory: desktop
        run: npm ci --prefer-offline
      - working-directory: desktop
        run: npm run build
      - name: Playwright Electron smoke
        working-directory: desktop
        run: xvfb-run -a npm run test:e2e

  electron-package:
    name: Electron package (${{ matrix.label }})
    needs: [verify, electron-quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS
            target: mac
          - os: windows-latest
            label: Windows
            target: win
          - os: ubuntu-latest
            label: Linux
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: release-electron-${{ runner.os }}-v2
      - working-directory: desktop
        run: npm ci --prefer-offline
      - name: Build and stage release Mahayana Host
        working-directory: desktop
        run: npm run build:host
      - name: Build pinned offline ASR engine
        working-directory: ${{ github.workspace }}
        run: node .github/scripts/build-offline-asr-engine.mjs
      - name: Build release renderer
        working-directory: desktop
        run: npm run build:renderer
      - name: Install Developer ID Application identity
        if: matrix.target == 'mac'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CONFIGURED_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          cert="$RUNNER_TEMP/fabushi-developer-id.p12"
          keychain="$RUNNER_TEMP/fabushi-developer-id.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          identity="$CONFIGURED_IDENTITY"
          if [ -z "$identity" ]; then
            identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          fi
          case "$identity" in
            *'Developer ID Application:'*) ;;
            *) echo 'Developer ID Application identity is required for macOS release packaging.' >&2; exit 1 ;;
          esac
          security find-identity -v -p codesigning "$keychain" | grep -F -- "$identity" >/dev/null
          echo "MACOS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Sign bundled native macOS executables before app sealing
        if: matrix.target == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          host=desktop/resources/bin/mahayana-app-host
          test -x "$host"
          codesign --force --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "$host"
          while IFS= read -r binary; do
            codesign --force --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "$binary"
          done < <(find desktop/resources/asr -type f -name whisper-cli -print)
          codesign --verify --strict --verbose=2 "$host"

      - name: Package canonical Electron application
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.target == 'mac' && 'true' || 'false' }}
          FABUSHI_MACOS_NOTARIZE: ${{ matrix.target == 'mac' && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: npx electron-builder --${{ matrix.target }} --publish never
      - name: Notarize and staple macOS DMG
        if: matrix.target == 'mac'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          MACOS_NOTARIZATION_TIMEOUT_MINUTES: '60'
          MACOS_NOTARIZATION_POLL_SECONDS: '20'
        run: |
          set -euo pipefail
          dmg="$(find desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          bash .github/scripts/notarize-macos-dmg.sh "$dmg"
          app="$(find desktop/release -maxdepth 3 -type d -name '*.app' -print -quit)"
          test -n "$app"
          chmod +x .github/scripts/verify-electron-macos-package.sh
          bash .github/scripts/verify-electron-macos-package.sh "$app" "$dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.target }}
          path: desktop/release/**
          if-no-files-found: error
          retention-days: 14

  android-release:
    name: Signed native Android APK/AAB
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'
      - name: Install Android 17 SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          available_packages="$(sdkmanager --list --channel=3)"
          platform_package="$(printf '%s\n' "$available_packages" | awk -F'|' '/platforms;android-(37([.]0)?|CinnamonBun)/ && !found {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; found=1}')"
          build_tools_package="$(printf '%s\n' "$available_packages" | awk -F'|' '/build-tools;37[.]/ && !found {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; found=1}')"
          test -n "$platform_package" && test -n "$build_tools_package"
          sdkmanager --channel=3 "$platform_package" "$build_tools_package" 'ndk;28.2.13676358'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            installed_platform="$(find "$ANDROID_HOME/platforms" -maxdepth 1 -type d \( -name 'android-37*' -o -name 'android-CinnamonBun*' \) -print -quit)"
            test -n "$installed_platform"
            ln -s "$installed_platform" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: release-android-v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build native Rust JNI libraries
        working-directory: third_party/mahayana/mahayana-rs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: cargo ndk -t arm64-v8a -t x86_64 -o ../../../mobile/android/app/src/main/jniLibs build --release -p mahayana-app-host-mobile
      - name: Install Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fabushi-release.jks"
      - name: Restore Gradle dependency and build cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build signed Android release
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fabushi-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --build-cache bundleRelease assembleRelease -PversionName=${{ needs.verify.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  ios-release:
    name: Signed native iOS IPA
    needs: verify
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: release-ios-v2
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Build Rust static library for iOS device
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo build --release -p mahayana-app-host-mobile --target aarch64-apple-ios
      - name: Stage Rust static library
        shell: bash
        run: |
          mkdir -p mobile/ios/Frameworks
          cp third_party/mahayana/mahayana-rs/target/aarch64-apple-ios/release/libmahayana_app_host.a mobile/ios/Frameworks/
      - name: Install iOS signing identity and profile
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          cert="$RUNNER_TEMP/ios-distribution.p12"
          profile="$RUNNER_TEMP/Fabushi.mobileprovision"
          keychain="$RUNNER_TEMP/fabushi-signing.keychain-db"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$cert" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Archive native iOS application
        working-directory: mobile/ios
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: >-
          xcodebuild archive
          -project Fabushi.xcodeproj
          -scheme Fabushi
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Fabushi.xcarchive"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY='Apple Distribution'
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
      - name: Export signed iOS IPA
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>com.ombhrum.fabushi</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Fabushi.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: ${{ runner.temp }}/ios-export/*.ipa
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish native Electron GitHub Release
    needs: [verify, electron-package, android-release, ios-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          find release -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to mutate an existing release." >&2
            exit 1
          fi
          mapfile -d '' assets < <(find release -type f -print0)
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes
