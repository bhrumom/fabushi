name: Retired production MCP CI account provisioning
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Deny ordinary CI production account mutations
        run: |
          echo '::error::FCM-027 retired production D1 test-account provisioning. Use canonical fabushi-backend isolated Account Factory. Missing isolation is not-configured, never a production fallback.'
          exit 1
