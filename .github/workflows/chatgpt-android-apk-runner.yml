name: ChatGPT Android APK continuous runner

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: Logical Android account scope for isolated encrypted AVD state
        required: false
        default: default
        type: string
      smoke_only:
        description: Verify APK login and one real ChatGPT reply, then stop
        required: false
        default: false
        type: boolean
      continuous:
        description: Dispatch another run after checkpointing this run
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '.agents/plugins/plugins/chatgpt-android-controller/**'
      - '.github/workflows/chatgpt-android-apk-runner.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: chatgpt-android-apk-${{ inputs.account_id || 'default' }}
  cancel-in-progress: false

jobs:
  run:
    name: Run authenticated ChatGPT Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    environment:
      # Reuse the existing desktop credential environment only for the one-time
      # APK bootstrap. Secrets are injected on the minimum individual steps and
      # are never inherited by Appium/npm installation or third-party actions.
      name: chatgpt-auto-confirm-legacy
    env:
      AVD_NAME: mahayana-chatgpt
      AVD_PACKAGE: system-images;android-35;google_apis_playstore;x86_64
      CHATGPT_ANDROID_PACKAGE: com.openai.chatgpt
      CHATGPT_ANDROID_VERSION_NAME: '1.2026.216'
      CHATGPT_ANDROID_VERSION_CODE: '2621621'
      CHATGPT_ANDROID_CERT_SHA256: b24f4bfbb3cf293f938703b9d87027c1102cc36dc4fa206910e08927db40473c
      CHATGPT_ANDROID_REQUIRE_X86_64: 'true'
      STATE_SCOPE: ${{ inputs.account_id || 'default' }}
      SMOKE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_only }}
      CONTINUOUS: ${{ github.event_name == 'workflow_dispatch' && inputs.continuous || github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Checkout trusted implementation
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare private runtime paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          avd_root="$RUNNER_TEMP/chatgpt-android-avd"
          state_dir="$RUNNER_TEMP/chatgpt-android-state"
          diagnostics="$RUNNER_TEMP/chatgpt-android-diagnostics"
          mkdir -p "$avd_root" "$state_dir" "$diagnostics"
          chmod 700 "$avd_root" "$state_dir" "$diagnostics"
          {
            echo "avd_root=$avd_root"
            echo "state_file=$state_dir/state.enc"
            echo "diagnostics=$diagnostics"
            echo "controller_state=$avd_root/controller-state.json"
          } >> "$GITHUB_OUTPUT"
          echo "ANDROID_AVD_HOME=$avd_root" >> "$GITHUB_ENV"
          echo "CHATGPT_ANDROID_AVD_ROOT=$avd_root" >> "$GITHUB_ENV"
          echo "CHATGPT_ANDROID_STATE_FILE=$state_dir/state.enc" >> "$GITHUB_ENV"
          echo "CHATGPT_ANDROID_DIAGNOSTICS_DIR=$diagnostics" >> "$GITHUB_ENV"
          echo "CHATGPT_ANDROID_TRACE_PATH=$diagnostics/apk-trace.jsonl" >> "$GITHUB_ENV"
          echo "CHATGPT_ANDROID_CONTROLLER_STATE=$avd_root/controller-state.json" >> "$GITHUB_ENV"
          echo "CHATGPT_ANDROID_RUNNER_TRACE=$diagnostics/runner-trace.jsonl" >> "$GITHUB_ENV"

      - name: Restore latest encrypted Android state cache
        id: restore_state
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.paths.outputs.state_file }}
          key: chatgpt-android-avd-${{ runner.os }}-${{ env.STATE_SCOPE }}-${{ github.run_id }}
          restore-keys: |
            chatgpt-android-avd-${{ runner.os }}-${{ env.STATE_SCOPE }}-

      - name: Install Android emulator system image
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          sdkmanager_bin=$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -u+x -print \
            | sort -V | tail -n 1)
          if [[ -z "$sdkmanager_bin" || ! -x "$sdkmanager_bin" ]]; then
            echo "::error::No executable sdkmanager found under $sdk_root/cmdline-tools."
            find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print || true
            exit 1
          fi
          tools_bin=$(dirname "$sdkmanager_bin")
          test -x "$tools_bin/avdmanager"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
          } >> "$GITHUB_ENV"
          {
            echo "$tools_bin"
            echo "$sdk_root/platform-tools"
            echo "$sdk_root/emulator"
          } >> "$GITHUB_PATH"

          # Android Emulator's Linux launcher links PulseAudio even with
          # -noaudio. Install only the missing host runtime library.
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libpulse0

          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" 'platform-tools' 'emulator' 'build-tools;35.0.0' "$AVD_PACKAGE"

          emulator_bin="$sdk_root/emulator/emulator"
          test -x "$emulator_bin"
          if ! emulator_version=$("$emulator_bin" -version 2>&1); then
            printf '%s\n' "$emulator_version"
            exit 1
          fi
          printf '%s\n' "$emulator_version" | head -n 1
          "$sdk_root/platform-tools/adb" version | head -n 1

      - name: Restore or create AVD
        id: avd
        shell: bash
        working-directory: .agents/plugins/plugins/chatgpt-android-controller
        env:
          CHATGPT_ANDROID_STATE_KEY: ${{ secrets.CHATGPT_AUTO_CONFIRM_STATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CHATGPT_ANDROID_STATE_KEY"
          if [[ -s "$CHATGPT_ANDROID_STATE_FILE" ]]; then
            bash scripts/avd-state.sh restore
            echo 'restored=true' >> "$GITHUB_OUTPUT"
          else
            rm -rf "$CHATGPT_ANDROID_AVD_ROOT"
            mkdir -p "$CHATGPT_ANDROID_AVD_ROOT"
            printf 'no\n' | avdmanager create avd --force \
              --name "$AVD_NAME" --package "$AVD_PACKAGE" --device 'pixel_7'
            echo 'restored=false' >> "$GITHUB_OUTPUT"
          fi

          ini="$CHATGPT_ANDROID_AVD_ROOT/$AVD_NAME.ini"
          avd_dir="$CHATGPT_ANDROID_AVD_ROOT/$AVD_NAME.avd"
          test -f "$ini"
          test -d "$avd_dir"
          # The content directory is restored at the same logical location but
          # rewrite the absolute path defensively for a fresh hosted runner.
          sed -i "s|^path=.*|path=$avd_dir|" "$ini"
          grep -q '^path=' "$ini"

      - name: Prepare persistent ADB host identity
        shell: bash
        run: |
          set -euo pipefail
          # Keep the host key inside the encrypted AVD root. A restored guest
          # trusts the same key on the next hosted runner, so ADB access rolls
          # forward together with the Android login state instead of requiring
          # a fresh authorization dialog on every machine.
          adb_key_dir="$CHATGPT_ANDROID_AVD_ROOT/host-adb"
          mkdir -p "$adb_key_dir" "$HOME/.android"
          chmod 700 "$adb_key_dir" "$HOME/.android"
          if [[ ! -s "$adb_key_dir/adbkey" || ! -s "$adb_key_dir/adbkey.pub" ]]; then
            rm -f "$adb_key_dir/adbkey" "$adb_key_dir/adbkey.pub"
            adb keygen "$adb_key_dir/adbkey" >/dev/null
          fi
          chmod 600 "$adb_key_dir/adbkey"
          chmod 644 "$adb_key_dir/adbkey.pub"
          cp -f "$adb_key_dir/adbkey" "$HOME/.android/adbkey"
          cp -f "$adb_key_dir/adbkey.pub" "$HOME/.android/adbkey.pub"
          chmod 600 "$HOME/.android/adbkey"
          chmod 644 "$HOME/.android/adbkey.pub"
          echo "ADB_VENDOR_KEYS=$adb_key_dir" >> "$GITHUB_ENV"
          adb kill-server >/dev/null 2>&1 || true
          ADB_VENDOR_KEYS="$adb_key_dir" adb start-server >/dev/null

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '::error::/dev/kvm is unavailable on this runner.'
            exit 1
          fi

      - name: Boot persistent Android emulator
        id: emulator
        shell: bash
        run: |
          set -euo pipefail
          log="${{ steps.paths.outputs.diagnostics }}/emulator.log"
          nohup emulator -avd "$AVD_NAME" \
            -no-window -noaudio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 4096 \
            >"$log" 2>&1 &
          pid=$!
          echo "pid=$pid" >> "$GITHUB_OUTPUT"

          attached=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo '::error::Android emulator exited before ADB attached.'
              tail -n 160 "$log" || true
              exit 1
            fi
            state=$(adb devices | awk '$1 ~ /^emulator-/ {print $2; exit}')
            if [[ "$state" == 'device' ]]; then
              attached=true
              break
            fi
            sleep 2
          done
          if [[ "$attached" != true ]]; then
            echo '::error::Android emulator did not attach to ADB as an authorized device.'
            adb devices -l || true
            tail -n 160 "$log" || true
            exit 1
          fi

          booted=false
          for attempt in $(seq 1 180); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo '::error::Android emulator exited during boot.'
              tail -n 160 "$log" || true
              exit 1
            fi
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == '1' ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then
            echo '::error::Android emulator did not finish booting.'
            tail -n 160 "$log" || true
            exit 1
          fi

          # Headless hosted emulators can transiently ANR the Pixel launcher
          # during cold boot. Suppress system crash/ANR dialogs so they cannot
          # cover ChatGPT's own UI and create a false login failure.
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell input keyevent 82 || true
          adb devices -l

      - name: Ensure pinned ChatGPT APK is installed
        id: apk
        shell: bash
        working-directory: .agents/plugins/plugins/chatgpt-android-controller
        env:
          APK_URL: ${{ secrets.CHATGPT_ANDROID_APK_URL }}
          APK_SHA256: ${{ secrets.CHATGPT_ANDROID_APK_SHA256 }}
        run: |
          set -euo pipefail
          if adb shell pm path "$CHATGPT_ANDROID_PACKAGE" | grep -q '^package:'; then
            echo 'source=restored-avd' >> "$GITHUB_OUTPUT"
            echo 'ChatGPT APK already exists in restored Android state.'
            exit 0
          fi

          if [[ -z "${APK_URL:-}" || -z "${APK_SHA256:-}" ]]; then
            echo '::error::Fresh AVD has no ChatGPT APK and the verified bootstrap seed is unavailable.'
            exit 1
          fi
          printf '::add-mask::%s\n' "$APK_URL"
          apk_bundle="$RUNNER_TEMP/chatgpt-android-package.apks"
          curl --fail --location --silent --show-error --retry 3 \
            "$APK_URL" --output "$apk_bundle"
          actual=$(sha256sum "$apk_bundle" | awk '{print tolower($1)}')
          if [[ "$actual" != "${APK_SHA256,,}" ]]; then
            echo "::error::ChatGPT Android package SHA-256 mismatch: $actual"
            exit 1
          fi
          echo "Verified seed transport bytes=$(wc -c < "$apk_bundle" | tr -d ' ') sha256=$actual"

          # Transport origin is not trusted. Verify the real Android identity
          # before installation: package, pinned version, x86_64 split and the
          # Google Play App Signing certificate used by com.openai.chatgpt.
          bash scripts/verify-chatgpt-xapk.sh "$apk_bundle"
          set +e
          pairip_output=$(bash scripts/check-chatgpt-pairip.sh "$apk_bundle" 2>&1)
          pairip_status=$?
          set -e
          printf '%s\n' "$pairip_output"
          if [[ "$pairip_status" == 2 ]]; then
            echo '::error::Pinned ChatGPT package contains PAIRIP markers; refusing an unsupported protected sideload path.'
            exit 1
          elif [[ "$pairip_status" != 0 ]]; then
            echo "::error::PAIRIP inspection failed with status $pairip_status"
            exit "$pairip_status"
          fi

          bash scripts/install-chatgpt-xapk.sh "$apk_bundle"
          adb shell pm path "$CHATGPT_ANDROID_PACKAGE" | grep -q '^package:'
          adb shell dumpsys package "$CHATGPT_ANDROID_PACKAGE" \
            | grep -E 'versionName=|versionCode=|installerPackageName=|initiatingPackageName=' \
            | head -n 20 || true
          echo 'source=verified-pinned-xapk' >> "$GITHUB_OUTPUT"

      - name: Verify or bootstrap APK login state
        id: auth
        shell: bash
        working-directory: .agents/plugins/plugins/chatgpt-android-controller
        env:
          # This legacy desktop session is only an initial transport into the
          # APK's own official authentication flow. APK composer verification
          # is still the sole login success condition.
          CHATGPT_SESSION_COOKIES_B64: ${{ secrets.CHATGPT_SESSION_COOKIES_B64 }}
        run: |
          set -euo pipefail
          authenticated=false
          if node scripts/verify-apk-session.mjs; then
            authenticated=true
            echo 'Restored AVD already contains an authenticated ChatGPT APK session.'
          else
            echo 'Restored/fresh APK is not authenticated; trying the APK login flow with the existing ChatGPT session seed.'
            if [[ -z "${CHATGPT_SESSION_COOKIES_B64:-}" ]]; then
              echo '::error::CHATGPT_SESSION_COOKIES_B64 is unavailable for the one-time APK bootstrap.'
              exit 1
            fi
            node scripts/bootstrap-apk-login.mjs
            node scripts/verify-apk-session.mjs
            authenticated=true
          fi
          echo "authenticated=$authenticated" >> "$GITHUB_OUTPUT"

      - name: Install Appium UiAutomator2
        if: ${{ steps.auth.outputs.authenticated == 'true' }}
        shell: bash
        working-directory: .agents/plugins/plugins/chatgpt-android-controller
        run: npm run setup:appium

      - name: Start Appium
        if: ${{ steps.auth.outputs.authenticated == 'true' }}
        shell: bash
        working-directory: .agents/plugins/plugins/chatgpt-android-controller
        run: |
          set -euo pipefail
          log="${{ steps.paths.outputs.diagnostics }}/appium.log"
          nohup npx appium --log-timestamp --log-no-colors >"$log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4723/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 100 "$log" || true
          exit 1

      - name: Run real APK message smoke
        if: ${{ steps.auth.outputs.authenticated == 'true' }}
        shell: bash
        working-directory: .agents/plugins/plugins/chatgpt-android-controller
        run: node --experimental-strip-types --import ./runtime/safety-patches.ts scripts/apk-smoke.ts

      - name: Run dynamic persistent Android task queue
        if: ${{ steps.auth.outputs.authenticated == 'true' && env.SMOKE_ONLY != 'true' }}
        shell: bash
        working-directory: .
        env:
          CHATGPT_ANDROID_RUNNER_SECONDS: '18600'
          CHATGPT_ANDROID_RUNNER_POLL_SECONDS: '30'
        run: node --experimental-strip-types --import ./.agents/plugins/plugins/chatgpt-android-controller/runtime/safety-patches.ts ./.agents/plugins/plugins/chatgpt-android-controller/scripts/action-runner.ts

      - name: Capture final APK evidence
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: .agents/plugins/plugins/chatgpt-android-controller
        run: node scripts/verify-apk-session.mjs

      - name: Stop emulator cleanly
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          adb emu kill || true
          pid='${{ steps.emulator.outputs.pid }}'
          if [[ -n "$pid" ]]; then
            for attempt in $(seq 1 60); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
          fi

      - name: Checkpoint encrypted APK login and queue state
        id: checkpoint
        if: ${{ always() && steps.auth.outputs.authenticated == 'true' }}
        shell: bash
        working-directory: .agents/plugins/plugins/chatgpt-android-controller
        env:
          CHATGPT_ANDROID_STATE_KEY: ${{ secrets.CHATGPT_AUTO_CONFIRM_STATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CHATGPT_ANDROID_STATE_KEY"
          bash scripts/avd-state.sh pack
          test -s "$CHATGPT_ANDROID_STATE_FILE"
          bytes=$(wc -c < "$CHATGPT_ANDROID_STATE_FILE" | tr -d ' ')
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "Encrypted Android state bytes: $bytes"

      - name: Save encrypted Android state cache
        if: ${{ always() && steps.checkpoint.outputs.bytes != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.paths.outputs.state_file }}
          key: chatgpt-android-avd-${{ runner.os }}-${{ env.STATE_SCOPE }}-${{ github.run_id }}

      - name: Encrypt diagnostics
        id: diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CHATGPT_ANDROID_STATE_KEY: ${{ secrets.CHATGPT_AUTO_CONFIRM_STATE_KEY }}
        run: |
          set -euo pipefail
          diagnostics='${{ steps.paths.outputs.diagnostics }}'
          output="$RUNNER_TEMP/chatgpt-android-diagnostics.enc"
          if [[ -z "$CHATGPT_ANDROID_STATE_KEY" || ! -d "$diagnostics" ]]; then
            exit 0
          fi
          tar -C "$diagnostics" -czf - . \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
                -pass env:CHATGPT_ANDROID_STATE_KEY -out "$output"
          chmod 600 "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted screenshots and detailed traces
        if: ${{ always() && steps.diagnostics.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-android-diagnostics-${{ env.STATE_SCOPE }}-${{ github.run_id }}
          path: ${{ steps.diagnostics.outputs.path }}
          retention-days: 2
          if-no-files-found: error

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## ChatGPT Android APK runner'
            echo
            echo "- AVD restored from rolling encrypted cache: ${{ steps.avd.outputs.restored }}"
            echo "- APK source: ${{ steps.apk.outputs.source }}"
            echo "- APK authenticated: ${{ steps.auth.outputs.authenticated }}"
            echo "- Encrypted state checkpoint bytes: ${{ steps.checkpoint.outputs.bytes }}"
            echo "- Run id: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Continue on a fresh hosted runner
        if: ${{ success() && env.CONTINUOUS == 'true' && env.SMOKE_ONLY != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run chatgpt-android-apk-runner.yml \
            --ref main \
            -f account_id="$STATE_SCOPE" \
            -f smoke_only=false \
            -f continuous=true
