name: macOS desktop E2E

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Desktop GitHub Release tag to test. Use latest by default.
        required: false
        default: latest
        type: string
  release:
    types:
      - published

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-desktop-e2e-${{ github.event.inputs.release_tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  macos-release-e2e:
    name: macOS Release desktop E2E
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'desktop-')
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/macos-desktop-e2e-evidence
    steps:
      - name: Checkout updater test helpers only
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/verify-release-updater-ui.mjs
            desktop/package.json
            desktop/package-lock.json

      - name: Prepare evidence folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/logs" "$EVIDENCE_DIR/screenshots" "$EVIDENCE_DIR/json" "$EVIDENCE_DIR/release"
          {
            echo "# macOS desktop E2E"
            echo
            echo "- Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Runner: $(sw_vers -productName) $(sw_vers -productVersion) / $(uname -m)"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            sw_vers
            uname -a
            xcodebuild -version || true
            gh --version || true
          } > "$EVIDENCE_DIR/logs/00-environment.log" 2>&1

      - name: Resolve desktop release and updater ordering
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name || 'latest' }}
        run: |
          set -euo pipefail
          tag="$INPUT_RELEASE_TAG"
          if [ -z "$tag" ] || [ "$tag" = "latest" ]; then
            tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease --jq '[.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | startswith("desktop-")))][0].tagName // ""')"
          fi
          if [[ "$tag" != desktop-* ]]; then
            echo "Resolved release is not a desktop release: $tag" | tee "$EVIDENCE_DIR/logs/01-release-metadata.log"
            exit 1
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,name,publishedAt,isPrerelease,assets,targetCommitish,url > "$EVIDENCE_DIR/json/release.json"
          jq -r '. | "Release: \(.tagName)\nName: \(.name)\nPublished: \(.publishedAt)\nPrerelease: \(.isPrerelease)\nURL: \(.url)\nAssets:\n" + ([.assets[].name] | map("- " + .) | join("\n"))' "$EVIDENCE_DIR/json/release.json" | tee "$EVIDENCE_DIR/logs/01-release-metadata.log"

          current_version="${tag#desktop-}"
          highest_version="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease --jq '.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | startswith("desktop-"))) | .tagName' | sed 's/^desktop-//' | sort -V | tail -1)"
          is_highest=false
          if [ "$current_version" = "$highest_version" ]; then
            is_highest=true
          fi

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$current_version" >> "$GITHUB_OUTPUT"
          echo "is_highest=$is_highest" >> "$GITHUB_OUTPUT"
          {
            echo "- Release: \`$tag\`"
            echo "- Highest stable desktop version: \`${highest_version:-none}\`"
            echo "- Updater target: \`$is_highest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download macOS release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*macos-*.zip' --dir "$EVIDENCE_DIR/release" --clobber
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*macos-*.dmg' --dir "$EVIDENCE_DIR/release" --clobber || true
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'latest-mac.yml' --dir "$EVIDENCE_DIR/release" --clobber
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip.blockmap' --dir "$EVIDENCE_DIR/release" --clobber
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS.txt' --dir "$EVIDENCE_DIR/release" --clobber || true
          find "$EVIDENCE_DIR/release" -maxdepth 1 -type f -print | sort | tee "$EVIDENCE_DIR/logs/02-downloaded-assets.log"
          metadata_version="$(awk -F': ' '/^version:/ {gsub(/[[:space:]\r]/, "", $2); print $2; exit}' "$EVIDENCE_DIR/release/latest-mac.yml")"
          test "$metadata_version" = '${{ steps.release.outputs.release_version }}'

      - id: previous
        name: Resolve and launch the nearest lower desktop release
        if: steps.release.outputs.is_highest == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          CURRENT_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -uo pipefail
          status=0
          arch="$(uname -m)"
          case "$arch" in
            arm64) previous_zip_pattern='*macos-arm64.zip' ;;
            *) previous_zip_pattern='*macos-x64.zip' ;;
          esac

          previous_version=''
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            if [ "$candidate" = "$CURRENT_VERSION" ]; then
              continue
            fi
            newest="$(printf '%s\n%s\n' "$candidate" "$CURRENT_VERSION" | sort -V | tail -1)"
            if [ "$newest" = "$CURRENT_VERSION" ]; then
              previous_version="$candidate"
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease --jq '.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | startswith("desktop-"))) | .tagName' | sed 's/^desktop-//' | sort -V)

          if [ -z "$previous_version" ]; then
            echo "No lower desktop release found; updater compatibility smoke skipped." | tee "$EVIDENCE_DIR/logs/04-upgrade-compatibility.log"
            echo 'previous_tag=' >> "$GITHUB_OUTPUT"
            echo 'previous_app=' >> "$GITHUB_OUTPUT"
            echo 'previous_executable=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_tag="desktop-$previous_version"
          previous_dir="$RUNNER_TEMP/previous-release"
          previous_install="$RUNNER_TEMP/previous-installed"
          mkdir -p "$previous_dir" "$previous_install"
          echo "Previous desktop release: $previous_tag" | tee "$EVIDENCE_DIR/logs/04-upgrade-compatibility.log"
          gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern "$previous_zip_pattern" --dir "$previous_dir" --clobber >> "$EVIDENCE_DIR/logs/04-upgrade-compatibility.log" 2>&1 || status=1
          previous_zip="$(find "$previous_dir" -maxdepth 1 -name "$previous_zip_pattern" -print -quit)"
          if [ -z "$previous_zip" ]; then
            echo "Previous macOS ZIP asset not found for pattern $previous_zip_pattern" | tee -a "$EVIDENCE_DIR/logs/04-upgrade-compatibility.log"
            exit 1
          fi
          ditto -x -k "$previous_zip" "$previous_install" >> "$EVIDENCE_DIR/logs/04-upgrade-compatibility.log" 2>&1 || status=1
          previous_app="$(find "$previous_install" -maxdepth 3 -name '*.app' -type d -print -quit)"
          if [ -z "$previous_app" ]; then
            echo "Previous .app bundle not found after unzip" | tee -a "$EVIDENCE_DIR/logs/04-upgrade-compatibility.log"
            exit 1
          fi
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$previous_app/Contents/Info.plist")"
          previous_executable="$previous_app/Contents/MacOS/$executable_name"
          test -x "$previous_executable"
          echo "Previous app: $previous_app" >> "$EVIDENCE_DIR/logs/04-upgrade-compatibility.log"
          echo "Previous executable: $previous_executable" >> "$EVIDENCE_DIR/logs/04-upgrade-compatibility.log"
          xattr -dr com.apple.quarantine "$previous_app" 2>/dev/null || true
          screencapture -x "$EVIDENCE_DIR/screenshots/04-before-previous-launch.png" || true
          open -n "$previous_app" >> "$EVIDENCE_DIR/logs/04-upgrade-compatibility.log" 2>&1 || status=1
          sleep 8
          pgrep -fl "$executable_name" >> "$EVIDENCE_DIR/logs/04-upgrade-compatibility.log" 2>&1 || status=1
          screencapture -x "$EVIDENCE_DIR/screenshots/05-after-previous-launch.png" || true
          pkill -f "$previous_executable" >> "$EVIDENCE_DIR/logs/04-upgrade-compatibility.log" 2>&1 || true
          sleep 2
          if [ "$status" -ne 0 ]; then
            echo "Previous desktop release launch failed during upgrade compatibility smoke." >&2
            exit "$status"
          fi
          echo "Previous desktop release launch succeeded before current release validation." >> "$EVIDENCE_DIR/logs/04-upgrade-compatibility.log"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "previous_app=$previous_app" >> "$GITHUB_OUTPUT"
          echo "previous_executable=$previous_executable" >> "$GITHUB_OUTPUT"

      - name: Record non-latest release updater policy
        if: steps.release.outputs.is_highest != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'This release is not the highest stable desktop version. Package E2E still runs, but updater downgrade proof is intentionally skipped because installed clients must only move forward.' | tee "$EVIDENCE_DIR/logs/04-upgrade-compatibility.log"
          echo '- Updater downgrade proof: skipped for non-highest historical Release' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js for updater UI automation
        if: steps.release.outputs.is_highest == 'true' && steps.previous.outputs.previous_executable != ''
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Restore Playwright/Electron test dependencies from npm cache
        if: steps.release.outputs.is_highest == 'true' && steps.previous.outputs.previous_executable != ''
        working-directory: desktop
        run: npm ci --prefer-offline

      - name: Simulate old-version user clicking the profile update button
        if: steps.release.outputs.is_highest == 'true' && steps.previous.outputs.previous_executable != ''
        shell: bash
        env:
          PREVIOUS_EXECUTABLE: ${{ steps.previous.outputs.previous_executable }}
          EXPECTED_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          xattr -dr com.apple.quarantine '${{ steps.previous.outputs.previous_app }}' 2>/dev/null || true
          node .github/scripts/verify-release-updater-ui.mjs \
            "$PREVIOUS_EXECUTABLE" \
            "$EXPECTED_VERSION" \
            "$EVIDENCE_DIR/json/05-updater-ui.json"
          cat "$EVIDENCE_DIR/json/05-updater-ui.json" | tee "$EVIDENCE_DIR/logs/05-updater-ui.log"

      - name: Verify updater replaced the previous app bundle with the released version
        if: steps.release.outputs.is_highest == 'true' && steps.previous.outputs.previous_app != ''
        shell: bash
        env:
          PREVIOUS_APP: ${{ steps.previous.outputs.previous_app }}
          EXPECTED_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          actual=''
          for attempt in $(seq 1 60); do
            actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PREVIOUS_APP/Contents/Info.plist" 2>/dev/null || true)"
            if [ "$actual" = "$EXPECTED_VERSION" ]; then
              echo "Updater replaced previous bundle with version $actual" | tee "$EVIDENCE_DIR/logs/05-updater-install.log"
              screencapture -x "$EVIDENCE_DIR/screenshots/06-after-updater-install.png" || true
              exit 0
            fi
            sleep 2
          done
          echo "Updater did not replace previous bundle with $EXPECTED_VERSION; observed=${actual:-missing}" | tee "$EVIDENCE_DIR/logs/05-updater-install.log" >&2
          exit 1

      - name: Verify checksums and install app
        id: install
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$EVIDENCE_DIR/release/SHA256SUMS.txt" ]; then
            (cd "$EVIDENCE_DIR/release" && grep -E 'macos-' SHA256SUMS.txt | shasum -a 256 -c -) | tee "$EVIDENCE_DIR/logs/03-sha256.log"
          else
            echo "SHA256SUMS.txt was not present in release assets" | tee "$EVIDENCE_DIR/logs/03-sha256.log"
          fi
          arch="$(uname -m)"
          case "$arch" in
            arm64) zip_pattern='*macos-arm64.zip' ;;
            *) zip_pattern='*macos-x64.zip' ;;
          esac
          zip_path="$(find "$EVIDENCE_DIR/release" -maxdepth 1 -name "$zip_pattern" -print -quit)"
          if [ -z "$zip_path" ]; then
            zip_path="$(find "$EVIDENCE_DIR/release" -maxdepth 1 -name '*macos-*.zip' -print -quit)"
          fi
          if [ -z "$zip_path" ]; then
            echo "No macOS ZIP asset was downloaded" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/installed"
          ditto -x -k "$zip_path" "$RUNNER_TEMP/installed"
          app_path="$(find "$RUNNER_TEMP/installed" -maxdepth 3 -name '*.app' -type d -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No .app bundle found after unzip" >&2
            find "$RUNNER_TEMP/installed" -maxdepth 4 -print | sort
            exit 1
          fi
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          {
            echo "Installed app: $app_path"
            find "$app_path" -maxdepth 4 -print | sort | head -200
            /usr/libexec/PlistBuddy -c Print "$app_path/Contents/Info.plist" || true
          } > "$EVIDENCE_DIR/logs/06-installed-app-structure.log" 2>&1

      - name: Validate package CLI and gateway
        id: cli
        shell: bash
        run: |
          set -euo pipefail
          app_path='${{ steps.install.outputs.app_path }}'
          cli="$app_path/Contents/MacOS/global_dharma_sharing_cli"
          if [ ! -x "$cli" ]; then
            echo "CLI missing or not executable: $cli" >&2
            exit 1
          fi
          doctor_json="$($cli doctor --json)"
          echo "$doctor_json" | tee "$EVIDENCE_DIR/json/07-doctor.json"
          jq -e '.ok == true' <<<"$doctor_json" >/dev/null
          runtime_json="$($cli runtime-smoke --json)"
          echo "$runtime_json" | tee "$EVIDENCE_DIR/json/08-runtime-smoke.json"
          jq -e '.ok == true' <<<"$runtime_json" >/dev/null
          miniapp_json="$($cli miniapp-smoke --json)"
          echo "$miniapp_json" | tee "$EVIDENCE_DIR/json/09-miniapp-smoke.json"
          jq -e '.ok == true' <<<"$miniapp_json" >/dev/null

      - name: Launch desktop app and capture step screenshots
        if: always() && steps.install.outputs.app_path != ''
        shell: bash
        run: |
          set -uo pipefail
          app_path='${{ steps.install.outputs.app_path }}'
          status=0
          xattr -dr com.apple.quarantine "$app_path" 2>/dev/null || true
          screencapture -x "$EVIDENCE_DIR/screenshots/08-before-launch.png" || true
          open -n "$app_path" > "$EVIDENCE_DIR/logs/10-open-command.log" 2>&1 || status=1
          sleep 12
          osascript -e 'tell application "System Events" to get name of every process whose background only is false' > "$EVIDENCE_DIR/logs/11-visible-processes.log" 2>&1 || true
          screencapture -x "$EVIDENCE_DIR/screenshots/09-after-launch.png" || true
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist" 2>/dev/null || echo fabushi)"
          pgrep -fl "$executable_name" > "$EVIDENCE_DIR/logs/12-process-check.log" 2>&1 || status=1
          if [ "$status" -ne 0 ]; then
            echo "Desktop app launch/process check failed; see screenshots and logs." >&2
            exit "$status"
          fi

      - name: Record mini app coverage status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/logs/13-miniapp-coverage.log" <<'EOF'
          Mini app E2E chain required by the hourly guard:
          - enter
          - load
          - core interaction
          - return to desktop
          - exception recovery
          - desktop/mini-app state consistency

          Automated evidence in this workflow:
          - json/08-runtime-smoke.json validates the packaged Mahayana CLI and production defaults
          - json/09-miniapp-smoke.json validates the seven official Codex plugin registry entries
          - json/09-miniapp-smoke.json validates exact MCP Tool contracts and four-platform runtimeVariants
          - json/09-miniapp-smoke.json validates versioned MCP App home resources and their MIME type
          - json/09-miniapp-smoke.json rejects missing MCP servers, platform coverage, and non-versioned UI resources
          - json/09-miniapp-smoke.json verifies the packaged desktop entry uses the MCP plugin contract

          Remaining limitation:
          This is a packaged MCP contract smoke test, not pixel/coordinate-driven WebView clicking. It fails the workflow if the plugin contract breaks instead of recording a passive gap.
          EOF
          cat "$EVIDENCE_DIR/logs/13-miniapp-coverage.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Write result summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo "## Evidence"
            echo "- Artifact: macos-desktop-e2e-evidence"
            echo "- Logs: logs/*.log"
            echo "- JSON: json/*.json"
            echo "- Screenshots: screenshots/*.png"
            echo
            echo "## Coverage"
            echo "- Install/package/checksum: captured"
            echo "- Startup/process: captured when package checks permit launch"
            echo "- Upgrade compatibility: previous lower desktop Release launch captured when this Release is the highest stable version"
            echo "- Updater UX: for the highest stable Release, an older release must detect the new version, expose the profile update button, receive a real click, and replace its app bundle with the released version"
            echo "- Non-highest historical Releases: updater downgrade proof intentionally skipped; package E2E still required"
            echo "- Gateway core route: captured by packaged CLI"
            echo "- Mini-app host contract: captured by json/09-miniapp-smoke.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-e2e-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
