name: FBCP Human messaging backend

on:
  pull_request:
    branches: [main]
    paths:
      - 'fabushi/web/src/handlers/friends.js'
      - 'fabushi/web/worker-modular.js'
      - 'fabushi/web/wrangler.toml'
      - '.github/scripts/bootstrap-development-account-d1.sh'
      - 'fabushi/web/src/handlers/human-calls.js'
      - 'fabushi/web/src/utils/human-call-apns.js'
      - 'fabushi/web/src/routes/community-routes.js'
      - 'fabushi/web/migrations/*direct_message*.sql'
      - 'fabushi/web/migrations/*human_calls*.sql'
      - 'fabushi/web/migrations/*human_call_voip*.sql'
      - 'fabushi/web/tests/friends-and-messages-contract.test.js'
      - 'fabushi/web/tests/human-calls-contract.test.js'
      - 'chatgpt-vps-control/lib/protected-actions-device-id.js'
      - 'chatgpt-vps-control/lib/device-gateway.js'
      - 'chatgpt-vps-control/lib/fabushi-remote-mcp-server.js'
      - 'chatgpt-vps-control/tests/device-gateway-account.test.js'
      - 'chatgpt-vps-control/scripts/login-ci-test-account.mjs'
      - 'chatgpt-vps-control/scripts/export-ci-app-account-session.mjs'
      - 'chatgpt-vps-control/scripts/prepare-ci-human-peer.mjs'
      - 'chatgpt-vps-control/test/protected-actions-device-id.test.mjs'
      - '.github/workflows/fbcp-human-messaging-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Human messaging backend contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install device gateway test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix chatgpt-vps-control --ignore-scripts
      - name: Check Worker source syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check fabushi/web/src/handlers/friends.js
          node --check fabushi/web/worker-modular.js
          node --check fabushi/web/src/handlers/human-calls.js
          node --check fabushi/web/src/utils/human-call-apns.js
          node --check fabushi/web/src/routes/community-routes.js
          node --check chatgpt-vps-control/scripts/prepare-ci-human-peer.mjs
          node --check chatgpt-vps-control/lib/device-gateway.js
          node --check chatgpt-vps-control/lib/fabushi-remote-mcp-server.js
      - name: Run focused Human messaging contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test fabushi/web/tests/friends-and-messages-contract.test.js
          node --test fabushi/web/tests/human-calls-contract.test.js
          node --test chatgpt-vps-control/test/protected-actions-device-id.test.mjs
          node --test chatgpt-vps-control/tests/device-gateway-account.test.js
      - name: Apply Human messaging migrations to SQLite
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/fbcp-human-messaging.sqlite"
          sqlite3 "$db" 'PRAGMA foreign_keys=ON; CREATE TABLE users(id INTEGER PRIMARY KEY);'
          sqlite3 "$db" < fabushi/web/migrations/20260713_friends_and_direct_messages.sql
          sqlite3 "$db" < fabushi/web/migrations/20261005_direct_message_remote_semantics.sql
          sqlite3 "$db" < fabushi/web/migrations/20261009_direct_message_scheduling.sql
          sqlite3 "$db" < fabushi/web/migrations/20261006_human_calls.sql
          sqlite3 "$db" < fabushi/web/migrations/20261009_human_call_voip_push.sql
          count="$(sqlite3 "$db" "SELECT COUNT(*) FROM sqlite_schema WHERE type='table' AND name IN ('friend_requests','direct_messages','direct_message_resources','direct_message_reactions','human_calls','human_call_events','human_call_voip_devices','human_call_push_deliveries');")"
          test "$count" = "8"
          sqlite3 "$db" "INSERT INTO direct_messages(sender_user_id,sender_username,recipient_user_id,recipient_username,body,client_request_id,created_at,silent,scheduled_at_ms,delivery_state) VALUES(1,'sender',2,'recipient','scheduled','contract-1','2026-10-09T00:00:00.000Z',1,2000000000000,'scheduled');"
          test "$(sqlite3 "$db" "SELECT silent || ':' || scheduled_at_ms || ':' || delivery_state FROM direct_messages WHERE client_request_id='contract-1';")" = "1:2000000000000:scheduled"
          sqlite3 "$db" "UPDATE direct_messages SET delivery_state='delivered', delivered_at='2026-10-09T00:01:00.000Z' WHERE delivery_state='scheduled' AND scheduled_at_ms <= 2000000000000;"
          test "$(sqlite3 "$db" "SELECT delivery_state || ':' || delivered_at FROM direct_messages WHERE client_request_id='contract-1';")" = "delivered:2026-10-09T00:01:00.000Z"