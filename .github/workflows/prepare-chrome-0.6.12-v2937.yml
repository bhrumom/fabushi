name: Prepare Chrome 0.6.12 with userscript 2.9.37

on:
  push:
    branches:
      - release/chrome-0.6.12-v2937-20260918
    paths:
      - '.github/workflows/prepare-chrome-0.6.12-v2937.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/chrome-0.6.12-v2937-20260918
          fetch-depth: 0

      - name: Sync exact userscript and release metadata
        shell: bash
        run: |
          set -euo pipefail
          source_sha='c6cf4e3fce76c0e62ad2be4d409044d5b2486d0f'
          source_version='2.9.37'
          source_size='239555'
          source_digest='64af1493153cccc4c172b1d1092379e77ca8f662c30ab42e3ed5a610b5e391f5'
          extension_version='0.6.12'
          userscript='chatgpt-vps-control/chrome-platform/extension/userscript/chatgpt-auto-confirm.user.js'

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/bhrumom/fabushi-chatgpt-auto-confirm-userscript/${source_sha}/chatgpt-auto-confirm.user.js" \
            --output "$userscript"
          test "$(wc -c < "$userscript" | tr -d ' ')" = "$source_size"
          test "$(sha256sum "$userscript" | awk '{print $1}')" = "$source_digest"
          grep -Fq '// @version      2.9.37' "$userscript"

          python3 - <<'PY'
          import json
          from pathlib import Path

          source_sha = 'c6cf4e3fce76c0e62ad2be4d409044d5b2486d0f'
          source_digest = '64af1493153cccc4c172b1d1092379e77ca8f662c30ab42e3ed5a610b5e391f5'
          source_size = '239555'
          source_version = '2.9.37'
          extension_version = '0.6.12'

          manifest_path = Path('chatgpt-vps-control/chrome-platform/extension/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('version') != '0.6.11':
              raise SystemExit(f"unexpected Chrome baseline: {manifest.get('version')}")
          manifest['version'] = extension_version
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          app_path = Path('chatgpt-vps-control/chrome-platform/extension/app.js')
          app = app_path.read_text()
          required = {
              '42df09a39f4505418f13a4fab578c96ee03b9b37': source_sha,
              '4fc88a50a8bb5034d5ec41f262c333d83e83917b1e22f75b26bb04ae10f8602b': source_digest,
              'const MARKETPLACE_USERSCRIPT_SIZE = 235583;': f'const MARKETPLACE_USERSCRIPT_SIZE = {source_size};',
              '2.9.35': source_version,
          }
          for old, new in required.items():
              if old not in app:
                  raise SystemExit(f'missing app.js baseline token: {old}')
              app = app.replace(old, new)
          if '2.9.35' in app or '42df09a39f4505418f13a4fab578c96ee03b9b37' in app:
              raise SystemExit('stale userscript metadata remains in app.js')
          app_path.write_text(app)

          package_path = Path('chatgpt-vps-control/scripts/package-chrome-extension.mjs')
          package = package_path.read_text()
          if package.count('0.6.11') < 3:
              raise SystemExit('unexpected package script baseline')
          package_path.write_text(package.replace('0.6.11', extension_version))

          package_workflow_path = Path('.github/workflows/chrome-extension-web-store.yml')
          package_workflow = package_workflow_path.read_text()
          if '0.6.11' not in package_workflow:
              raise SystemExit('unexpected zero-test workflow baseline')
          package_workflow_path.write_text(package_workflow.replace('0.6.11', extension_version))

          publish_workflow_path = Path('.github/workflows/chrome-extension-web-store-publish.yml')
          publish_workflow = publish_workflow_path.read_text()
          if '0.6.11' not in publish_workflow:
              raise SystemExit('unexpected publish workflow baseline')
          publish_workflow = publish_workflow.replace('0.6.11', extension_version)
          publish_workflow = publish_workflow.replace('package/journey artifact', 'zero-test package artifact')
          publish_workflow_path.write_text(publish_workflow)
          PY

          cat > .github/workflows/publish-chrome-0.6.12-on-package.yml <<'YAML'
          name: Publish Chrome 0.6.12 after package

          on:
            workflow_run:
              workflows:
                - Chrome Extension Package (zero-test)
              types:
                - completed

          permissions:
            actions: write
            contents: read

          jobs:
            dispatch:
              if: >-
                github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.head_branch == 'main'
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - name: Checkout exact packaged source
                  uses: actions/checkout@v6
                  with:
                    ref: ${{ github.event.workflow_run.head_sha }}

                - name: Dispatch exact-source Web Store publication
                  shell: bash
                  env:
                    GH_TOKEN: ${{ github.token }}
                    SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
                  run: |
                    set -euo pipefail
                    test "$(jq -r '.version' chatgpt-vps-control/chrome-platform/extension/manifest.json)" = '0.6.12' || exit 0
                    grep -Fq '// @version      2.9.37' chatgpt-vps-control/chrome-platform/extension/userscript/chatgpt-auto-confirm.user.js
                    gh workflow run chrome-extension-web-store-publish.yml \
                      --ref main \
                      -f source_sha="$SOURCE_SHA" \
                      -f dry_run=false \
                      -f wait_for_published=false
                    echo "Dispatched Chrome Web Store publication for $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          YAML

          git diff --check
          grep -Fq '"version": "0.6.12"' chatgpt-vps-control/chrome-platform/extension/manifest.json
          grep -Fq 'latestVersion: "2.9.37"' chatgpt-vps-control/chrome-platform/extension/app.js
          grep -Fq 'c6cf4e3fce76c0e62ad2be4d409044d5b2486d0f' chatgpt-vps-control/chrome-platform/extension/app.js
          grep -Fq '64af1493153cccc4c172b1d1092379e77ca8f662c30ab42e3ed5a610b5e391f5' chatgpt-vps-control/chrome-platform/extension/app.js
          grep -Fq 'const MARKETPLACE_USERSCRIPT_SIZE = 239555;' chatgpt-vps-control/chrome-platform/extension/app.js
          grep -Fq '0.6.12' chatgpt-vps-control/scripts/package-chrome-extension.mjs
          grep -Fq '0.6.12' .github/workflows/chrome-extension-web-store.yml
          grep -Fq '0.6.12' .github/workflows/chrome-extension-web-store-publish.yml

      - name: Create immutable release commit object
        id: release-commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          paths=(
            'chatgpt-vps-control/chrome-platform/extension/userscript/chatgpt-auto-confirm.user.js'
            'chatgpt-vps-control/chrome-platform/extension/app.js'
            'chatgpt-vps-control/chrome-platform/extension/manifest.json'
            'chatgpt-vps-control/scripts/package-chrome-extension.mjs'
            '.github/workflows/chrome-extension-web-store.yml'
            '.github/workflows/chrome-extension-web-store-publish.yml'
            '.github/workflows/publish-chrome-0.6.12-on-package.yml'
          )

          tree_entries='[]'
          for path in "${paths[@]}"; do
            base64 -w0 "$path" > /tmp/blob.b64
            jq -n --rawfile content /tmp/blob.b64 '{content:$content,encoding:"base64"}' > /tmp/blob.json
            blob_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/blob.json --jq '.sha')"
            tree_entries="$(jq --arg path "$path" --arg sha "$blob_sha" '. + [{path:$path,mode:"100644",type:"blob",sha:$sha}]' <<<"$tree_entries")"
          done
          tree_entries="$(jq --arg path '.github/workflows/prepare-chrome-0.6.12-v2937.yml' '. + [{path:$path,mode:"100644",type:"blob",sha:null}]' <<<"$tree_entries")"

          base_tree="$(git rev-parse 'HEAD^{tree}')"
          jq -n --arg base_tree "$base_tree" --argjson tree "$tree_entries" '{base_tree:$base_tree,tree:$tree}' > /tmp/tree.json
          release_tree="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input /tmp/tree.json --jq '.sha')"

          parent="$(git rev-parse HEAD)"
          jq -n --arg message 'release(chrome): ship 0.6.12 with userscript 2.9.37' --arg tree "$release_tree" --arg parent "$parent" '{message:$message,tree:$tree,parents:[$parent]}' > /tmp/commit.json
          release_commit="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input /tmp/commit.json --jq '.sha')"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "PREPARED_RELEASE_COMMIT=$release_commit"
          echo "Prepared server-side commit object: $release_commit" >> "$GITHUB_STEP_SUMMARY"
