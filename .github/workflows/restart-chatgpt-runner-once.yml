name: Restart ChatGPT runner once

on:
  push:
    branches:
      - ops/restart-chatgpt-runner-31092969771

permissions:
  actions: write
  contents: read

jobs:
  restart:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel stuck runner
        run: gh api --method POST repos/$GITHUB_REPOSITORY/actions/runs/31092969771/cancel || true
      - name: Wait for continuation artifact
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/31092969771 --jq .status)
            echo "old runner status: $status"
            if [ "$status" = "completed" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "old runner did not finish cleanup" >&2
          exit 1
      - name: Dispatch repaired continuation runner
        shell: bash
        run: |
          gh api --method POST \
            repos/$GITHUB_REPOSITORY/actions/workflows/chatgpt-auto-confirm-runner.yml/dispatches \
            --input - <<'JSON'
          {"ref":"main","inputs":{"previous_run_id":"31092969771","account_id":"acct_6fe593e530e2","restore_latest_credentials":"true","smoke_only":"false","parallel_queue_smoke":"false"}}
          JSON
