name: Cancel duplicate ChatGPT runner once

on:
  push:
    branches:
      - ops/restart-chatgpt-runner-31092969771

permissions:
  actions: write
  contents: read

jobs:
  cancel-duplicate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel pending duplicate
        run: gh api --method POST repos/$GITHUB_REPOSITORY/actions/runs/31109733165/cancel || true
