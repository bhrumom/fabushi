name: MSR runtime one-shot format

on:
  push:
    branches:
      - feat/msr-native-runtime-parity
    paths:
      - .github/workflows/msr-runtime-one-shot-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime parity branch
        uses: actions/checkout@v5
        with:
          ref: feat/msr-native-runtime-parity
          fetch-depth: 0

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Mahayana workspace and self-delete
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all
          rm .github/workflows/msr-runtime-one-shot-format.yml
          git diff --check

      - name: Commit formatted runtime stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add third_party/mahayana/mahayana-rs .github/workflows/msr-runtime-one-shot-format.yml
          git commit -m 'style(mahayana): format native runtime parity stack'
          git push origin HEAD:feat/msr-native-runtime-parity
