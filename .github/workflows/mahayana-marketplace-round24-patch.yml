name: Mahayana Marketplace Round 24 Patch

on:
  push:
    branches:
      - codex/mahayana-marketplace-parallel-20260726-r16
    paths:
      - .github/workflows/mahayana-marketplace-round24-patch.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mahayana-marketplace-parallel-20260726-r16
          fetch-depth: 0
      - name: Apply focused runtime fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          ffi = Path('third_party/mahayana/mahayana-rs/mahayana-ffi/src/lib.rs')
          text = ffi.read_text(encoding='utf-8')
          old = '''        let settings = CodexAgentConfig {
              codex_home,
              bundled_plugin_marketplace: create.bundled_plugin_marketplace,
              bundled_plugin_ids: mini_apps.iter().map(|app| app.plugin_id.clone()).collect(),
              inherit_installed_plugins: create.inherit_installed_plugins.unwrap_or(
          '''
          new = '''        let bundled_plugin_ids = bundled_marketplace_plugin_ids(
              create.bundled_plugin_marketplace.as_deref(),
              &mini_apps,
          )?;
          let settings = CodexAgentConfig {
              codex_home,
              bundled_plugin_marketplace: create.bundled_plugin_marketplace,
              bundled_plugin_ids,
              inherit_installed_plugins: create.inherit_installed_plugins.unwrap_or(
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected CodexAgentConfig block')
          text = text.replace(old, new, 1)

          anchor = '''    definitions.into_values().collect()
          }

          fn discover_mini_apps(client: &MahayanaProductClient) -> Option<Vec<MiniAppDefinition>> {
          '''
          helper = '''    definitions.into_values().collect()
          }

          fn bundled_marketplace_plugin_ids(
              marketplace_root: Option<&std::path::Path>,
              mini_apps: &[MiniAppDefinition],
          ) -> Result<Vec<String>, String> {
              let Some(marketplace_root) = marketplace_root else {
                  return Ok(Vec::new());
              };
              let mut plugin_ids = Vec::new();
              for mini_app in mini_apps {
                  let plugin_id = mini_app.plugin_id.as_str();
                  if plugin_id.is_empty()
                      || !plugin_id
                          .bytes()
                          .all(|byte| byte.is_ascii_alphanumeric() || byte == b'-')
                  {
                      return Err(format!("invalid bundled plugin id: {plugin_id}"));
                  }
                  if marketplace_root
                      .join("plugins")
                      .join(plugin_id)
                      .join(".codex-plugin/plugin.json")
                      .is_file()
                  {
                      plugin_ids.push(plugin_id.to_string());
                  }
              }
              Ok(plugin_ids)
          }

          fn discover_mini_apps(client: &MahayanaProductClient) -> Option<Vec<MiniAppDefinition>> {
          '''
          if text.count(anchor) != 1:
              raise SystemExit('unexpected mini app helper anchor')
          text = text.replace(anchor, helper, 1)

          anchor = '''    #[test]
              fn lifecycle_abi_creates_executes_receives_and_closes() {
          '''
          test = '''    #[test]
              fn bundled_marketplace_enables_only_plugins_present_on_disk() {
                  let unique = std::time::SystemTime::now()
                      .duration_since(std::time::UNIX_EPOCH)
                      .expect("system time")
                      .as_nanos();
                  let root = std::env::temp_dir().join(format!(
                      "mahayana-ffi-marketplace-{}-{unique}",
                      std::process::id()
                  ));
                  let manifest = root.join("plugins/cloud-market-hello/.codex-plugin/plugin.json");
                  std::fs::create_dir_all(manifest.parent().expect("manifest parent"))
                      .expect("create plugin tree");
                  std::fs::write(&manifest, "{}").expect("write plugin manifest");

                  let mini_apps = vec![
                      MiniAppDefinition {
                          plugin_id: "cloud-market-hello".into(),
                          title: "Cloud Market Hello".into(),
                          pinned: false,
                      },
                      MiniAppDefinition {
                          plugin_id: "bot-father".into(),
                          title: "Bot Father".into(),
                          pinned: false,
                      },
                  ];
                  let plugin_ids = bundled_marketplace_plugin_ids(Some(&root), &mini_apps)
                      .expect("bundled plugin ids");
                  assert_eq!(plugin_ids, vec!["cloud-market-hello"]);

                  std::fs::remove_dir_all(root).expect("remove plugin tree");
              }

              #[test]
              fn lifecycle_abi_creates_executes_receives_and_closes() {
          '''
          if text.count(anchor) != 1:
              raise SystemExit('unexpected ffi test anchor')
          text = text.replace(anchor, test, 1)
          ffi.write_text(text, encoding='utf-8')

          product = Path('third_party/mahayana/mahayana-rs/mahayana-product/src/lib.rs')
          text = product.read_text(encoding='utf-8')
          old = '''    let message = serde_json::from_str::<Value>(&body)
              .ok()
              .and_then(|value| {
                  value
                      .get("error")
                      .or_else(|| value.get("message"))
                      .and_then(Value::as_str)
                      .map(str::to_string)
              })
              .unwrap_or(body);
          '''
          new = '''    let message = serde_json::from_str::<Value>(&body)
              .ok()
              .and_then(|value| {
                  let code = value.get("error").and_then(Value::as_str);
                  let detail = value.get("message").and_then(Value::as_str);
                  match (code, detail) {
                      (Some(code), Some(detail)) if code != detail => {
                          Some(format!("{code}: {detail}"))
                      }
                      (Some(code), _) => Some(code.to_string()),
                      (_, Some(detail)) => Some(detail.to_string()),
                      _ => None,
                  }
              })
              .unwrap_or(body);
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected product error block')
          product.write_text(text.replace(old, new, 1), encoding='utf-8')

          contract = Path('.github/workflows/plugin-marketplace-contract.yml')
          text = contract.read_text(encoding='utf-8')
          needle = "      - 'third_party/mahayana/mahayana-rs/mahayana-cli/**'\n"
          replacement = needle + "      - 'third_party/mahayana/mahayana-rs/mahayana-ffi/**'\n"
          if text.count(needle) != 2:
              raise SystemExit('unexpected marketplace path filters')
          contract.write_text(text.replace(needle, replacement), encoding='utf-8')

          e2e = Path('.github/workflows/mahayana-cloud-marketplace-e2e.yml')
          text = e2e.read_text(encoding='utf-8')
          old = 'cargo test --locked --manifest-path "$MAHAYANA_MANIFEST" --package mahayana-cli --package mahayana-platform-client'
          new = old + ' --package mahayana-ffi'
          if text.count(old) != 1:
              raise SystemExit('unexpected marketplace cargo test command')
          e2e.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit focused files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add third_party/mahayana/mahayana-rs/mahayana-ffi/src/lib.rs
          git add third_party/mahayana/mahayana-rs/mahayana-product/src/lib.rs
          git add .github/workflows/plugin-marketplace-contract.yml
          git add .github/workflows/mahayana-cloud-marketplace-e2e.yml
          git rm .github/workflows/mahayana-marketplace-round24-patch.yml
          git commit -m "Fix installed marketplace plugin runtime"
          git push origin HEAD:codex/mahayana-marketplace-parallel-20260726-r16
      - name: Dispatch marketplace verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/plugin-marketplace-contract.yml/dispatches \
            -d '{"ref":"codex/mahayana-marketplace-parallel-20260726-r16"}'
