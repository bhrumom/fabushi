name: Desktop installers

on:
  pull_request:
    branches:
      - main
    paths:
      - fabushi/**
      - .github/scripts/package-desktop-*
      - .github/scripts/build-desktop-cli.sh
      - .github/scripts/assert-openclaw-bundle.sh
      - .github/scripts/sync-openclaw-build-assets-v2.sh
      - .github/scripts/notarize-macos-dmg.sh
      - .github/scripts/fix-macos-bundled-dylibs.sh
      - .github/scripts/upload-macos-app-store.sh
      - .github/workflows/desktop-installers.yml
  push:
    branches:
      - main
    paths:
      - fabushi/**
      - .github/scripts/package-desktop-*
      - .github/scripts/build-desktop-cli.sh
      - .github/scripts/assert-openclaw-bundle.sh
      - .github/scripts/sync-openclaw-build-assets-v2.sh
      - .github/scripts/notarize-macos-dmg.sh
      - .github/scripts/fix-macos-bundled-dylibs.sh
      - .github/scripts/upload-macos-app-store.sh
      - .github/workflows/desktop-installers.yml
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA to package. Leave empty to use the selected ref.
        required: false
        type: string
      release_tag:
        description: Existing or new GitHub Release tag. Leave empty to generate one.
        required: false
        type: string
      publish_release:
        description: Publish packages to a GitHub Release after successful builds.
        required: false
        default: true
        type: boolean
      upload_macos_app_store:
        description: Upload the macOS App Store package to App Store Connect for TestFlight/App Store processing.
        required: false
        default: true
        type: boolean
      openclaw_version:
        description: OpenClaw npm version to vendor into desktop packages.
        required: false
        default: 2026.6.1
        type: string

concurrency:
  group: desktop-installers-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  FLUTTER_VERSION: '3.41.9'
  OPENCLAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.openclaw_version || '2026.6.1' }}

jobs:
  resolve-release-context:
    name: Resolve desktop release context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.context.outputs.source_sha }}
      app_version: ${{ steps.context.outputs.app_version }}
      version_slug: ${{ steps.context.outputs.version_slug }}
      release_build_number: ${{ steps.context.outputs.release_build_number }}
      release_tag: ${{ steps.context.outputs.release_tag }}
      publish_release: ${{ steps.context.outputs.publish_release }}
      upload_macos_app_store: ${{ steps.context.outputs.upload_macos_app_store }}
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            fabushi/pubspec.yaml

      - name: Resolve source, version, and release policy
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          INPUT_UPLOAD_MACOS_APP_STORE: ${{ inputs.upload_macos_app_store }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source_sha="${PR_HEAD_SHA:-${INPUT_SOURCE_SHA:-${GITHUB_SHA}}}"
          pubspec_version="$(awk '/^version:/ { print $2; exit }' fabushi/pubspec.yaml)"
          if [ -z "$pubspec_version" ]; then
            echo "Unable to read app version from fabushi/pubspec.yaml" >&2
            exit 1
          fi

          version_name="${pubspec_version%%+*}"
          pubspec_build_number="${pubspec_version##*+}"
          if [ "$pubspec_build_number" = "$pubspec_version" ] || ! [[ "$pubspec_build_number" =~ ^[0-9]+$ ]]; then
            pubspec_build_number=0
          fi

          highest_release_build_number="$pubspec_build_number"
          if command -v gh >/dev/null 2>&1 && [ -n "${GITHUB_REPOSITORY:-}" ]; then
            release_tag_build_number="$(
              gh api -H 'Accept: application/vnd.github+json'                 "/repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name' 2>/dev/null |
                awk -v highest="$highest_release_build_number" '
                  /^v[0-9].*-mobile(\.|$)/ || /^desktop-v[0-9]/ {
                    split($0, parts, "-")
                    build = ($0 ~ /^desktop-v[0-9]/) ? parts[3] : parts[2]
                    if (build ~ /^[0-9]+$/ && build + 0 > highest) {
                      highest = build + 0
                    }
                  }
                  END { print highest }
                '
            )"
            if [[ "$release_tag_build_number" =~ ^[0-9]+$ ]] && [ "$release_tag_build_number" -gt "$highest_release_build_number" ]; then
              highest_release_build_number="$release_tag_build_number"
            fi
          fi

          release_build_number="${GITHUB_RUN_NUMBER:-0}"
          if ! [[ "$release_build_number" =~ ^[0-9]+$ ]]; then
            release_build_number=0
          fi
          if [ "$release_build_number" -le "$highest_release_build_number" ]; then
            release_build_number=$((highest_release_build_number + 1))
          fi

          app_version="${version_name}+${release_build_number}"
          version_slug="${app_version//+/-}"
          short_sha="$(git rev-parse --short=12 HEAD)"
          release_tag="${INPUT_RELEASE_TAG:-desktop-v${version_slug}-${GITHUB_RUN_NUMBER}-${short_sha}}"

          publish_release=false
          upload_macos_app_store=false
          case "$EVENT_NAME" in
            pull_request)
              publish_release=false
              upload_macos_app_store=false
              ;;
            workflow_dispatch)
              case "${INPUT_PUBLISH_RELEASE:-true}" in
                true|TRUE|True|1|yes|YES) publish_release=true ;;
                *) publish_release=false ;;
              esac
              case "${INPUT_UPLOAD_MACOS_APP_STORE:-true}" in
                true|TRUE|True|1|yes|YES) upload_macos_app_store=true ;;
                *) upload_macos_app_store=false ;;
              esac
              ;;
            push)
              publish_release=true
              upload_macos_app_store=true
              ;;
          esac

          {
            echo "source_sha=$source_sha"
            echo "app_version=$app_version"
            echo "version_slug=$version_slug"
            echo "release_build_number=$release_build_number"
            echo "release_tag=$release_tag"
            echo "publish_release=$publish_release"
            echo "upload_macos_app_store=$upload_macos_app_store"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Desktop release context"
            echo ""
            echo "- Source SHA: \`$source_sha\`"
            echo "- App version: \`$app_version\`"
            echo "- Release build number: \`$release_build_number\`"
            echo "- Highest existing mobile/desktop build number: \`$highest_release_build_number\`"
            echo "- Release tag: \`$release_tag\`"
            echo "- Publish release: \`$publish_release\`"
            echo "- Upload macOS App Store Connect build: \`$upload_macos_app_store\`"
            echo "- OpenClaw version: \`${OPENCLAW_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-desktop-installers:
    name: Build ${{ matrix.label }} installer
    needs: resolve-release-context
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            target: macos
            os: macos-15
          - label: Linux
            target: linux
            os: ubuntu-latest
            openclaw_platform: linux-x64
            desktop_arch: x64
          - label: Windows
            target: windows
            os: windows-latest
            openclaw_platform: windows-x64
            desktop_arch: x64
    defaults:
      run:
        working-directory: fabushi
    env:
      APP_VERSION: ${{ needs.resolve-release-context.outputs.app_version }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - name: Checkout desktop source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-context.outputs.source_sha }}
          lfs: true
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/fabushi/assets/built_in/**
            !/fabushi/web/assets/built_in/**

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            fakeroot \
            libasound2-dev \
            libgtk-3-0 \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            ninja-build \
            pkg-config

      - name: Install Windows installer toolchain
        if: matrix.target == 'windows'
        shell: pwsh
        working-directory: .
        run: choco install nsis -y --no-progress

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Node.js for OpenClaw vendoring
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Flutter desktop target
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            macos) flutter config --enable-macos-desktop ;;
            linux) flutter config --enable-linux-desktop ;;
            windows) flutter config --enable-windows-desktop ;;
          esac

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Stabilize macOS native asset toolchain
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          developer_dir="$(xcode-select -p)"
          if [ ! -x "$developer_dir/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang" ]; then
            developer_app="$(
              find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print |
                while IFS= read -r app; do
                  if [ -x "$app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang" ]; then
                    echo "$app"
                  fi
                done |
                sort |
                tail -n 1
            )"
            if [ -z "$developer_app" ]; then
              echo "Unable to find a usable Xcode installation." >&2
              exit 1
            fi
            sudo xcode-select -s "$developer_app/Contents/Developer"
            developer_dir="$(xcode-select -p)"
          fi

          cc="$(xcrun --find clang)"
          cxx="$(xcrun --find clang++)"
          {
            echo "DEVELOPER_DIR=$developer_dir"
            echo "CC=$cc"
            echo "CXX=$cxx"
          } >> "$GITHUB_ENV"

          for package_dir in "$PUB_CACHE"/hosted/pub.dev/flutter_scene_importer-*; do
            [ -d "$package_dir" ] || continue
            find "$package_dir" -name CMakeCache.txt -delete
            find "$package_dir" -type d \( -name CMakeFiles -o -name 'cmake-build-*' -o -name build \) -prune -exec rm -rf {} +
          done

          xcodebuild -version
          "$cc" --version

      - name: Stabilize Windows native asset toolchain
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set -euo pipefail

          # Native asset hooks run their own CMake/MSVC builds from the pub
          # cache, so they do not inherit definitions from windows/CMakeLists.txt.
          echo "CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS ${CL:-}" >> "$GITHUB_ENV"

          for package_dir in "$PUB_CACHE"/hosted/pub.dev/flutter_scene_importer-*; do
            [ -d "$package_dir" ] || continue
            find "$package_dir" -name CMakeCache.txt -delete
            find "$package_dir" -type d \( -name CMakeFiles -o -name 'cmake-build-*' -o -name build \) -prune -exec rm -rf {} +
          done

      - name: Stabilize generated desktop plugin bindings
        shell: bash
        run: scripts/fix_desktop_generated_plugins.sh

      - name: Resolve OpenClaw bundle platform
        id: openclaw
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.openclaw_platform }}"
          arch="${{ matrix.desktop_arch }}"
          if [ "${{ matrix.target }}" = "macos" ]; then
            case "$(uname -m)" in
              arm64)
                platform="macos-arm64"
                arch="arm64"
                ;;
              *)
                platform="macos-x64"
                arch="x64"
                ;;
            esac
          fi
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "DESKTOP_ARCH=$arch" >> "$GITHUB_ENV"

      - name: Vendor embedded OpenClaw runtime
        shell: bash
        env:
          OPENCLAW_VERSION: ${{ env.OPENCLAW_VERSION }}
        run: scripts/build_openclaw_desktop_bundle.sh "${{ steps.openclaw.outputs.platform }}"

      - name: Refresh Flutter generated asset manifest
        run: flutter pub get

      - name: Restabilize generated desktop plugin bindings
        shell: bash
        run: scripts/fix_desktop_generated_plugins.sh

      - name: Build macOS release app
        if: matrix.target == 'macos'
        run: flutter build macos --release --no-pub

      - name: Sync macOS OpenClaw assets into release app
        if: matrix.target == 'macos'
        shell: bash
        run: ../.github/scripts/sync-openclaw-build-assets-v2.sh "${{ steps.openclaw.outputs.platform }}" build/macos/Build/Products/Release/global_dharma_sharing.app/Contents/Frameworks/App.framework/Resources/flutter_assets

      - name: Build macOS package CLI
        if: matrix.target == 'macos'
        shell: bash
        run: ../.github/scripts/build-desktop-cli.sh macos

      - name: Verify macOS OpenClaw bundle in release app
        if: matrix.target == 'macos'
        shell: bash
        run: ../.github/scripts/assert-openclaw-bundle.sh build/macos/Build/Products/Release/global_dharma_sharing.app "${{ steps.openclaw.outputs.platform }}"

      - name: Run macOS package CLI smoke
        if: matrix.target == 'macos'
        shell: bash
        run: build/macos/Build/Products/Release/global_dharma_sharing.app/Contents/MacOS/global_dharma_sharing_cli gateway-smoke --timeout-seconds 120 --json

      - name: Import macOS Developer ID certificate
        if: >-
          matrix.target == 'macos' &&
          github.event_name != 'pull_request' &&
          env.MACOS_CERTIFICATE_P12_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/macos_certificate.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$RUNNER_TEMP" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$keychain_path"

      - name: Fix bundled macOS dynamic library references
        if: matrix.target == 'macos'
        shell: bash
        run: ../.github/scripts/fix-macos-bundled-dylibs.sh build/macos/Build/Products/Release/global_dharma_sharing.app

      - name: Code sign macOS app
        if: >-
          matrix.target == 'macos' &&
          github.event_name != 'pull_request' &&
          env.MACOS_CERTIFICATE_P12_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          identity="$MACOS_CODESIGN_IDENTITY"
          if [ -z "$identity" ]; then
            identity="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          fi
          if [ -z "$identity" ]; then
            echo "Unable to resolve macOS code signing identity." >&2
            exit 1
          fi
          app_path="build/macos/Build/Products/Release/global_dharma_sharing.app"
          codesign --force --deep --timestamp --options runtime --sign "$identity" "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Package macOS installer
        if: matrix.target == 'macos'
        shell: bash
        env:
          OUT_DIR: ${{ github.workspace }}/desktop-artifacts
        run: ../.github/scripts/package-desktop-macos.sh

      - name: Install and smoke macOS package CLI
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find "$GITHUB_WORKSPACE/desktop-artifacts" -maxdepth 1 -name '*macos-*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "No macOS DMG artifact found" >&2
            exit 1
          fi
          mount_dir="$RUNNER_TEMP/gds-dmg"
          install_dir="$RUNNER_TEMP/gds-installed"
          rm -rf "$mount_dir" "$install_dir"
          mkdir -p "$mount_dir" "$install_dir"
          hdiutil attach "$dmg_path" -nobrowse -mountpoint "$mount_dir"
          cleanup() { hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ditto "$mount_dir/global_dharma_sharing.app" "$install_dir/global_dharma_sharing.app"
          cleanup
          trap - EXIT
          "$install_dir/global_dharma_sharing.app/Contents/MacOS/global_dharma_sharing_cli" doctor --json
          "$install_dir/global_dharma_sharing.app/Contents/MacOS/global_dharma_sharing_cli" gateway-smoke --timeout-seconds 120 --json

      - name: Notarize macOS DMG
        if: >-
          matrix.target == 'macos' &&
          github.event_name != 'pull_request' &&
          env.MACOS_CERTIFICATE_P12_BASE64 != ''
        shell: bash
        env:
          MACOS_NOTARIZATION_STATUS_DIR: ${{ github.workspace }}/macos-notarization-status
          MACOS_NOTARIZATION_TIMEOUT_MINUTES: 330
        run: |
          set -euo pipefail
          dmg_path="$(find "$GITHUB_WORKSPACE/desktop-artifacts" -maxdepth 1 -name '*macos-*.dmg' -print -quit)"
          ../.github/scripts/notarize-macos-dmg.sh "$dmg_path"

      - name: Upload macOS notarization status
        if: always() && matrix.target == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: macos-notarization-status
          path: macos-notarization-status
          if-no-files-found: ignore
          retention-days: 30

      - name: Build Linux release app
        if: matrix.target == 'linux'
        run: flutter build linux --release --no-pub

      - name: Sync Linux OpenClaw assets into release build
        if: matrix.target == 'linux'
        shell: bash
        run: ../.github/scripts/sync-openclaw-build-assets-v2.sh linux-x64 build/linux/x64/release/bundle/data/flutter_assets

      - name: Build Linux package CLI
        if: matrix.target == 'linux'
        shell: bash
        run: ../.github/scripts/build-desktop-cli.sh linux

      - name: Verify Linux OpenClaw bundle in release build
        if: matrix.target == 'linux'
        shell: bash
        run: ../.github/scripts/assert-openclaw-bundle.sh build/linux/x64/release/bundle linux-x64

      - name: Run Linux package CLI smoke
        if: matrix.target == 'linux'
        shell: bash
        run: build/linux/x64/release/bundle/global_dharma_sharing_cli gateway-smoke --timeout-seconds 120 --json

      - name: Package Linux installers
        if: matrix.target == 'linux'
        shell: bash
        env:
          OUT_DIR: ${{ github.workspace }}/desktop-artifacts
        run: ../.github/scripts/package-desktop-linux.sh

      - name: Install and smoke Linux package CLI
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          deb_path="$(find "$GITHUB_WORKSPACE/desktop-artifacts" -maxdepth 1 -name 'global-dharma-sharing_*.deb' -print -quit)"
          if [ -z "$deb_path" ]; then
            echo "No Linux DEB artifact found" >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y "$deb_path"
          global-dharma-sharing-cli doctor --json
          global-dharma-sharing-cli gateway-smoke --timeout-seconds 120 --json

      - name: Build Windows release app
        if: matrix.target == 'windows'
        run: flutter build windows --release --no-pub

      - name: Sync Windows OpenClaw assets into release build
        if: matrix.target == 'windows'
        shell: bash
        run: ../.github/scripts/sync-openclaw-build-assets-v2.sh windows-x64 build/windows/x64/runner/Release/data/flutter_assets

      - name: Build Windows package CLI
        if: matrix.target == 'windows'
        shell: bash
        run: ../.github/scripts/build-desktop-cli.sh windows

      - name: Verify Windows OpenClaw bundle in release build
        if: matrix.target == 'windows'
        shell: bash
        run: ../.github/scripts/assert-openclaw-bundle.sh build/windows/x64/runner/Release windows-x64

      - name: Run Windows package CLI smoke
        if: matrix.target == 'windows'
        shell: pwsh
        run: .\build\windows\x64\runner\Release\global_dharma_sharing_cli.exe gateway-smoke --timeout-seconds 120 --json

      - name: Package Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: ../.github/scripts/package-desktop-windows.ps1 -OutDir "$env:GITHUB_WORKSPACE\desktop-artifacts"

      - name: Install and smoke Windows zip package CLI
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\desktop-artifacts" -Filter "*windows-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "No Windows zip artifact found" }
          $installDir = Join-Path $env:RUNNER_TEMP "gds-installed"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $installDir -Force
          $cli = Join-Path $installDir "global_dharma_sharing_cli.exe"
          if (-not (Test-Path $cli)) { throw "Installed package CLI not found: $cli" }
          & $cli doctor --json
          & $cli gateway-smoke --timeout-seconds 120 --json

      - name: Upload desktop installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}-${{ steps.openclaw.outputs.arch }}
          path: desktop-artifacts/*
          if-no-files-found: error
          retention-days: 30

  upload-macos-app-store:
    name: Upload macOS build to App Store Connect
    needs:
      - resolve-release-context
    if: needs.resolve-release-context.outputs.upload_macos_app_store == 'true'
    runs-on: macos-15
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: fabushi
    env:
      APP_VERSION: ${{ needs.resolve-release-context.outputs.app_version }}
      RELEASE_BUILD_NUMBER: ${{ needs.resolve-release-context.outputs.release_build_number }}
      SOURCE_SHA: ${{ needs.resolve-release-context.outputs.source_sha }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      MACOS_APP_STORE_UPLOAD_ENABLED: ${{ needs.resolve-release-context.outputs.upload_macos_app_store }}
      MACOS_APP_STORE_UPLOAD_REQUIRED: ${{ needs.resolve-release-context.outputs.upload_macos_app_store }}
      MACOS_APP_STORE_TEAM_ID: ${{ vars.MACOS_APP_STORE_TEAM_ID || vars.APPLE_TEAM_ID || 'M4Q99K4UR4' }}
      MACOS_APP_STORE_BUNDLE_ID: ${{ vars.MACOS_APP_STORE_BUNDLE_ID || 'com.ombhrum.fabushi' }}
      MACOS_APP_STORE_INTERNAL_TESTING_ONLY: ${{ vars.MACOS_APP_STORE_INTERNAL_TESTING_ONLY || 'false' }}
      MACOS_APP_STORE_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_P12_BASE64 }}
      MACOS_APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_PASSWORD }}
      MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12_BASE64 }}
      MACOS_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD }}
      MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
      MACOS_APP_STORE_SIGNING_CERTIFICATE: ${{ vars.MACOS_APP_STORE_SIGNING_CERTIFICATE || 'Mac App Distribution' }}
      MACOS_APP_STORE_INSTALLER_SIGNING_CERTIFICATE: ${{ vars.MACOS_APP_STORE_INSTALLER_SIGNING_CERTIFICATE || 'Mac Installer Distribution' }}
      MACOS_APP_STORE_STATUS_DIR: ${{ github.workspace }}/macos-app-store-assets
    steps:
      - name: Checkout desktop source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release-context.outputs.source_sha }}
          lfs: true
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/fabushi/assets/built_in/**
            !/fabushi/web/assets/built_in/**

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Node.js for OpenClaw vendoring
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Flutter macOS desktop target
        run: flutter config --enable-macos-desktop

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Stabilize macOS native asset toolchain
        shell: bash
        run: |
          set -euo pipefail

          developer_dir="$(xcode-select -p)"
          if [ ! -x "$developer_dir/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang" ]; then
            developer_app="$(
              find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print |
                while IFS= read -r app; do
                  if [ -x "$app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang" ]; then
                    echo "$app"
                  fi
                done |
                sort |
                tail -n 1
            )"
            if [ -z "$developer_app" ]; then
              echo "Unable to find a usable Xcode installation." >&2
              exit 1
            fi
            sudo xcode-select -s "$developer_app/Contents/Developer"
            developer_dir="$(xcode-select -p)"
          fi

          cc="$(xcrun --find clang)"
          cxx="$(xcrun --find clang++)"
          {
            echo "DEVELOPER_DIR=$developer_dir"
            echo "CC=$cc"
            echo "CXX=$cxx"
          } >> "$GITHUB_ENV"

          for package_dir in "$PUB_CACHE"/hosted/pub.dev/flutter_scene_importer-*; do
            [ -d "$package_dir" ] || continue
            find "$package_dir" -name CMakeCache.txt -delete
            find "$package_dir" -type d \( -name CMakeFiles -o -name 'cmake-build-*' -o -name build \) -prune -exec rm -rf {} +
          done

          xcodebuild -version
          "$cc" --version

      - name: Stabilize generated desktop plugin bindings
        shell: bash
        run: scripts/fix_desktop_generated_plugins.sh

      - name: Vendor embedded OpenClaw runtime
        shell: bash
        env:
          OPENCLAW_VERSION: ${{ env.OPENCLAW_VERSION }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) platform="macos-arm64" ;;
            *) platform="macos-x64" ;;
          esac
          scripts/build_openclaw_desktop_bundle.sh "$platform"

      - name: Archive, export, and upload macOS App Store package
        shell: bash
        run: ../.github/scripts/upload-macos-app-store.sh

      - name: Upload macOS App Store package status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-app-store-status
          path: macos-app-store-assets
          if-no-files-found: warn
          retention-days: 30

  publish-github-release:
    name: Publish desktop installers to GitHub Release
    needs:
      - resolve-release-context
      - build-desktop-installers
    if: needs.resolve-release-context.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download desktop installer artifacts
        uses: actions/download-artifact@v5
        with:
          path: downloaded-desktop-artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Create checksums and release notes
        id: release-files
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-release-context.outputs.source_sha }}
          APP_VERSION: ${{ needs.resolve-release-context.outputs.app_version }}
          RELEASE_TAG: ${{ needs.resolve-release-context.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p desktop-release-artifacts
          find downloaded-desktop-artifacts -maxdepth 2 -type f -print0 |
            while IFS= read -r -d '' file; do
              cp "$file" "desktop-release-artifacts/$(basename "$file")"
            done

          if ! find desktop-release-artifacts -type f -print -quit | grep -q .; then
            echo "No desktop installer artifacts were downloaded." >&2
            exit 1
          fi

          (
            cd desktop-release-artifacts
            sha256sum * > SHA256SUMS.txt
          )

          cat > release-notes.md <<EOF
          Desktop installers for global_dharma_sharing $APP_VERSION.

          Source commit: $SOURCE_SHA
          OpenClaw version: ${OPENCLAW_VERSION}

          Artifacts include:
          - macOS DMG and ZIP
          - Linux DEB and TAR.GZ
          - Windows NSIS setup EXE and ZIP

          SHA256 checksums are attached as SHA256SUMS.txt.
          EOF

          echo "artifact_dir=$PWD/desktop-release-artifacts" >> "$GITHUB_OUTPUT"
          echo "notes_file=$PWD/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve-release-context.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve-release-context.outputs.source_sha }}
          APP_VERSION: ${{ needs.resolve-release-context.outputs.app_version }}
          NOTES_FILE: ${{ steps.release-files.outputs.notes_file }}
          ARTIFACT_DIR: ${{ steps.release-files.outputs.artifact_dir }}
        run: |
          set -euo pipefail

          release_assets=()
          while IFS= read -r -d '' artifact; do
            release_assets+=("$artifact")
          done < <(find "$ARTIFACT_DIR" -type f -print0 | sort -z)
          if [ "${#release_assets[@]}" -eq 0 ]; then
            echo "No release assets found in $ARTIFACT_DIR." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; recreating it for an idempotent installer publish."
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          fi

          gh release create "$RELEASE_TAG" \
            --draft \
            --target "$SOURCE_SHA" \
            --title "Desktop installers $APP_VERSION" \
            --notes-file "$NOTES_FILE"

          for artifact in "${release_assets[@]}"; do
            gh release upload "$RELEASE_TAG" "$artifact" --clobber
          done

          gh release edit "$RELEASE_TAG" --draft=false

          {
            echo "## Published desktop installers"
            echo ""
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
