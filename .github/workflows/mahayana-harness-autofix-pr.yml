name: Mahayana harness PR autofix once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mahayana-harness-autofix-pr.yml'

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply deterministic Rust fixes and refresh lockfile
        working-directory: third_party/mahayana/mahayana-rs
        run: |
          set -euo pipefail
          cargo clippy -p mahayana-harness --all-targets --fix --allow-dirty --allow-staged
          cargo fmt -p mahayana-harness
          cargo metadata --format-version 1 >/dev/null
      - name: Commit fixes and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mahayana-harness-autofix-pr.yml
          git add third_party/mahayana/mahayana-rs/mahayana-harness/src/lib.rs third_party/mahayana/mahayana-rs/Cargo.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'fix(mahayana): satisfy harness clippy and refresh lockfile'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
