name: GBF M4 one-shot cross-platform remediation

on:
  push:
    branches:
      - gbf/m4-computer-control-convergence-20260822
    paths:
      - '.github/workflows/gbf-m4-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gbf/m4-computer-control-convergence-20260822
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chatgpt-vps-control/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt
      - name: Apply canonical M4 remediation patch
        run: python3 .github/scripts/gbf-m4-remediate.py
      - name: Remediate production computer-control dependency graph
        working-directory: chatgpt-vps-control
        run: |
          npm ci --ignore-scripts
          npm audit fix --omit=dev
          npm test
          npm audit --omit=dev
      - name: Format and verify canonical protocol tests
        working-directory: third_party/mahayana/mahayana-rs
        run: |
          cargo fmt --all
          cargo test --locked -p mahayana-host-protocol --profile ci
      - name: Verify product remediation diff
        run: |
          ! grep -q 'action\.duration_ms' third_party/mahayana/mahayana-rs/mahayana-computer/src/lib.rs
          ! grep -q 'action\.scroll_amount' third_party/mahayana/mahayana-rs/mahayana-computer/src/lib.rs
          grep -q 'action\.wait_ms' third_party/mahayana/mahayana-rs/mahayana-computer/src/lib.rs
          grep -q 'action\.amount' third_party/mahayana/mahayana-rs/mahayana-computer/src/lib.rs
          git diff --check
      - name: Commit only product and lockfile remediation
        run: |
          git config user.name 'fabushi-ci'
          git config user.email 'fabushi-ci@users.noreply.github.com'
          git add chatgpt-vps-control/package.json chatgpt-vps-control/package-lock.json third_party/mahayana/mahayana-rs/mahayana-computer/src/lib.rs third_party/mahayana/mahayana-rs/mahayana-host-protocol/src/lib.rs
          git commit -m 'fix(gbf): close cross-platform computer-control product gates'
          git push origin HEAD:gbf/m4-computer-control-convergence-20260822
