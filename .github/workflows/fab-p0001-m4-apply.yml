name: FAB-P0001 M4 product patch

on:
  push:
    branches:
      - feat/fab-p0001-m4-media-closure
    paths:
      - .github/workflows/fab-p0001-m4-apply.yml
      - scripts/fab-p0001-m4-apply.py

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'bhrumom/fabushi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/fab-p0001-m4-media-closure
          fetch-depth: 1
      - name: Apply deterministic M4 patch
        run: python3 scripts/fab-p0001-m4-apply.py
      - name: Validate product-only patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              native/mahayana-messaging/src/engine.rs|native/mahayana-messaging/src/blob_store.rs) ;;
              *) echo "Unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Commit M4 product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fabushi-ci"
          git config user.email "fabushi-ci@users.noreply.github.com"
          git add native/mahayana-messaging/src/engine.rs native/mahayana-messaging/src/blob_store.rs
          git commit -m "feat(tfi): enforce M4 media integrity and permissions"
          git push origin HEAD:feat/fab-p0001-m4-media-closure
