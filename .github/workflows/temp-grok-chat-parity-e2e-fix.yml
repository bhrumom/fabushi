name: Temporary Grok chat parity E2E fix

on:
  push:
    branches:
      - fix/grok-chat-parity-bot-create

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/grok-chat-parity-bot-create
          fetch-depth: 0
      - name: Patch parity acceptance contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          regressions = 'desktop/e2e/messenger-regressions.spec.ts'
          replace_once(
              regressions,
              '''    const peers = page.locator('[data-testid^="peer-"]');
    await expect(peers.first()).toBeVisible();
    expect(await peers.count()).toBeGreaterThanOrEqual(2);
''',
              '''    let peers = page.locator('[data-testid^="peer-"]');
    await expect(peers.first()).toBeVisible();
    if (await peers.count() < 2) {
      await page.getByRole('button', { name: '新建', exact: true }).click();
      await expect(page.getByTestId('create-bot')).toBeVisible();
      await page.getByTestId('create-bot').click();
      await page.getByTestId('new-bot-name').fill('头像切换验收 Bot');
      await page.getByTestId('new-bot-description').fill('验证真实用户 Bot 的动态头像与会话切换。');
      await page.getByTestId('create-bot-submit').click();
      await expect(page.locator('[data-testid^="peer-legacy:bot:"]').filter({ hasText: '头像切换验收 Bot' }).first()).toBeVisible({ timeout: 10_000 });
      peers = page.locator('[data-testid^="peer-"]');
    }
    expect(await peers.count()).toBeGreaterThanOrEqual(2);
''')

          messenger = 'desktop/e2e/messenger.spec.ts'
          replace_once(
              messenger,
              '''    await page.getByTestId('messenger-input').fill('统一消息链路验收');
    await page.getByTestId('messenger-send').click();
    await expect(page.getByTestId('message-list').locator(':scope > article').getByText('收到：统一消息链路验收', { exact: true })).toBeVisible();
''',
              '''    await page.getByTestId('messenger-input').fill('统一消息链路验收');
    await page.getByTestId('messenger-send').click();
    await expect(page.getByTestId('message-list').locator(':scope > article').getByText('统一消息链路验收', { exact: true })).toBeVisible({ timeout: 1_500 });
    await expect(page.getByTestId('message-list').locator(':scope > article').getByText('收到：统一消息链路验收', { exact: true })).toBeVisible();
    await expect(page.locator('[data-testid="agent-step"]:visible')).toHaveCount(0);
''')

          replace_once(
              messenger,
              '''    await page.getByRole('button', { name: '新建', exact: true }).click();
    await page.getByRole('button', { name: '新建群组' }).click();
    await expect(page.getByText('现有 AI 群组 Host 会执行 Bot 多轮协作')).toBeVisible();
    await page.getByPlaceholder('群组名称').fill('人机协作验收群');

    const researchBot = page.getByTestId('group-bot-research-bot');
    await expect(researchBot).toBeVisible();
    await researchBot.click();
    await expect(researchBot).toHaveAttribute('data-selected', 'true');
''',
              '''    await expect(page.getByText('Research Bot', { exact: true })).toHaveCount(0);
    await expect(page.getByText('Incident Bot', { exact: true })).toHaveCount(0);

    await page.getByRole('button', { name: '新建', exact: true }).click();
    await expect(page.getByTestId('create-bot')).toBeVisible();
    await page.getByTestId('create-bot').click();
    await page.getByTestId('new-bot-name').fill('协作验收 Bot');
    await page.getByTestId('new-bot-description').fill('由用户创建，用于群组协作验收。');
    await page.getByTestId('create-bot-submit').click();
    await expect(page.locator('[data-testid^="peer-legacy:bot:"]').filter({ hasText: '协作验收 Bot' }).first()).toBeVisible({ timeout: 10_000 });

    await page.getByRole('button', { name: '新建', exact: true }).click();
    await page.getByRole('button', { name: '新建群组' }).click();
    await expect(page.getByText('现有 AI 群组 Host 会执行 Bot 多轮协作')).toBeVisible();
    await page.getByPlaceholder('群组名称').fill('人机协作验收群');

    const researchBot = page.locator('[data-testid^="group-bot-"]').filter({ hasText: '协作验收 Bot' }).first();
    await expect(researchBot).toBeVisible();
    await researchBot.click();
    await expect(researchBot).toHaveAttribute('data-selected', 'true');
''')

          workbench = 'desktop/e2e/mahayana-agent-workbench.spec.ts'
          replace_once(
              workbench,
              "test('bot runs through Mahayana as a visible multi-step task and restores its run journal'",
              "test('bot renders Mahayana work as natural chat while preserving its run journal'")
          replace_once(
              workbench,
              '''    const workbench = page.getByTestId('agent-workbench');
    await expect(workbench).toBeVisible({ timeout: 15_000 });
    const run = page.getByTestId('agent-run').last();
    await expect(run).toHaveAttribute('data-status', 'completed', { timeout: 15_000 });
    await expect.poll(async () => run.getByTestId('agent-step').count()).toBeGreaterThanOrEqual(3);
    await expect(page.getByRole('article').filter({ hasText: '收到：请分析这个任务' }).last()).toBeVisible();
''',
              '''    const workbench = page.getByTestId('agent-workbench');
    await expect(workbench).toHaveCount(1);
    const run = page.getByTestId('agent-run').last();
    await expect(run).toHaveAttribute('data-status', 'completed', { timeout: 15_000 });
    await expect.poll(async () => run.getByTestId('agent-step').count()).toBeGreaterThanOrEqual(3);
    await expect(page.getByRole('article').filter({ hasText: '请分析这个任务，规划步骤，调用工具并给出最终结果。' }).last()).toBeVisible();
    await expect(page.getByRole('article').filter({ hasText: '收到：请分析这个任务' }).last()).toBeVisible();
    await expect(page.locator('[data-testid="agent-step"]:visible')).toHaveCount(0);
''')
          replace_once(
              workbench,
              '''    const restoredRun = page.locator(`[data-testid="agent-run"][data-run-id="${persistedRunId}"]`);
    await expect(restoredRun).toBeVisible({ timeout: 15_000 });
    await expect(restoredRun).toHaveAttribute('data-status', 'completed');
''',
              '''    const restoredRun = page.locator(`[data-testid="agent-run"][data-run-id="${persistedRunId}"]`);
    await expect(restoredRun).toHaveCount(1);
    await expect(restoredRun).toHaveAttribute('data-status', 'completed');
''')
          replace_once(
              workbench,
              '''    const run = page.getByTestId('agent-run').last();
    await expect(run).toBeVisible({ timeout: 15_000 });
    await expect(run).toHaveAttribute('data-status', 'completed', { timeout: 15_000 });
''',
              '''    const run = page.getByTestId('agent-run').last();
    await expect(run).toHaveCount(1);
    await expect(run).toHaveAttribute('data-status', 'completed', { timeout: 15_000 });
''')
          replace_once(
              workbench,
              '''    const restoredRun = page.locator(`[data-testid="agent-run"][data-run-id="${persistedRunId}"]`);
    await expect(restoredRun).toBeVisible({ timeout: 15_000 });
    await expect(restoredRun).toHaveAttribute('data-status', 'completed');
''',
              '''    const restoredRun = page.locator(`[data-testid="agent-run"][data-run-id="${persistedRunId}"]`);
    await expect(restoredRun).toHaveCount(1);
    await expect(restoredRun).toHaveAttribute('data-status', 'completed');
''')

          runtime = 'desktop/src/grok-chat-parity-runtime.tsx'
          replace_once(
              runtime,
              '''    #mahayana-agent-inline-report-portal [data-agent-inline-testid="agent-inline-report"]:not(:has([data-testid="agent-inline-approval"][data-status="running"])),
    #mahayana-agent-inline-report-portal [data-testid="agent-inline-report"]:not(:has([data-testid="agent-inline-approval"][data-status="running"])) {
      position: absolute !important;
      left: -10000px !important;
      top: 0 !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
''',
              '''    #mahayana-agent-inline-report-portal [data-agent-inline-testid="agent-inline-report"]:not(:has([data-testid="agent-inline-approval"][data-status="running"])),
    #mahayana-agent-inline-report-portal [data-testid="agent-inline-report"]:not(:has([data-testid="agent-inline-approval"][data-status="running"])) {
      display: none !important;
    }
''')
          PY
      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          grep -q '头像切换验收 Bot' desktop/e2e/messenger-regressions.spec.ts
          grep -q '协作验收 Bot' desktop/e2e/messenger.spec.ts
          grep -q 'natural chat' desktop/e2e/mahayana-agent-workbench.spec.ts
          grep -q 'display: none !important' desktop/src/grok-chat-parity-runtime.tsx
      - name: Commit test and presentation fixes
        shell: bash
        run: |
          git rm .github/workflows/temp-grok-chat-parity-e2e-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/e2e/messenger-regressions.spec.ts desktop/e2e/messenger.spec.ts desktop/e2e/mahayana-agent-workbench.spec.ts desktop/src/grok-chat-parity-runtime.tsx
          git commit -m 'test: validate user-created Bot chat parity'
          git push origin HEAD:fix/grok-chat-parity-bot-create
