name: Apply TFI M2 sync E2E contract repair

on:
  push:
    branches:
      - fix/tfi-m2-sync-e2e-contract

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/tfi-m2-sync-e2e-contract
          fetch-depth: 1
      - name: Apply deterministic E2E repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_label = "Mini App · 已安装线上包 · 受控宿主容器"
          new_label = "Mini App · 已安装线上包 · 账号云同步"
          for name in ["desktop/e2e/messenger.spec.ts", "desktop/e2e/smoke.spec.ts", "desktop/e2e/miniapp-bot-parity.spec.ts"]:
              path = Path(name)
              text = path.read_text()
              if old_label not in text:
                  raise SystemExit(f"expected historical Mini App label missing in {name}")
              path.write_text(text.replace(old_label, new_label))

          mini = Path("desktop/e2e/miniapp-bot-parity.spec.ts")
          text = mini.read_text()
          old_helper = '''async function completeBrowserLogin(page: Page): Promise<void> {
            while (await page.getByTestId('onboarding-gate').isVisible().catch(() => false)) {
              await page.getByTestId('onboarding-next').click();
            }
            const loginGate = page.getByTestId('login-gate');
            if (await loginGate.isVisible().catch(() => false)) {
              await page.getByTestId('browser-login-start').click();
              await expect(loginGate).toBeHidden();
            }
            await expect(page.getByTestId('messenger-workspace')).toBeVisible({ timeout: 15_000 });
          }
          '''
          new_helper = '''async function completeBrowserLogin(page: Page): Promise<void> {
            await page.waitForLoadState('domcontentloaded');
            await expect.poll(async () => {
              const testIds = ['onboarding-gate', 'login-gate', 'host-status', 'open-messenger', 'messenger-workspace'];
              for (const testId of testIds) {
                if (await page.getByTestId(testId).isVisible().catch(() => false)) return true;
              }
              return false;
            }, { timeout: 15_000 }).toBe(true);

            while (await page.getByTestId('onboarding-gate').isVisible().catch(() => false)) {
              await page.getByTestId('onboarding-next').click();
            }
            const loginGate = page.getByTestId('login-gate');
            if (await loginGate.isVisible().catch(() => false)) {
              await page.getByTestId('browser-login-start').click();
              await expect(loginGate).toBeHidden();
            }
            await expect(page.getByTestId('messenger-workspace')).toBeVisible({ timeout: 15_000 });
          }
          '''
          if text.count(old_helper) != 1:
              raise SystemExit(f"expected exactly one Mini App login helper, got {text.count(old_helper)}")
          mini.write_text(text.replace(old_helper, new_helper))

          task = Path("projects/telegram-fabushi-integration/management/tasks/M2-SYNC-002-telegram-multidevice-account-sync.md")
          text = task.read_text()
          marker = "## Open-source-first decision\n"
          note = '''## Second exact-main acceptance result\n\nElectron exact-main run `33025670225` against `ab6e3eb4787f9570aaff00342362000e1e960973` again blocked release before Linux packaging. This run proved the native-edge repair itself is active: edge parity reported 184 methods, all 37 Electron main-process tests passed, including account-sync edge coverage and deterministic test-account restart persistence. The remaining failures were acceptance-test contract drift rather than a missing product edge:\n\n- the real UI successfully opened the Global Dharma iframe and displayed `Mini App · 已安装线上包 · 账号云同步`, while two older E2E assertions still expected the historical `受控宿主容器` copy;\n- `miniapp-bot-parity.spec.ts` checked onboarding/login selectors before the first DOM surface had stabilized, so the onboarding dialog could mount after the helper had already moved on to waiting for Messenger. Other long-lived E2E helpers already guard this race with an initial surface poll.\n\nDiagnostic artifact `9628343898` (`fabushi-electron-linux-e2e-diagnostics`) contains screenshots, traces and error contexts. The follow-up synchronizes assertions to the current product copy and uses the established deterministic first-surface wait before onboarding/login handling. Product sync semantics are unchanged.\n\n'''
          if "## Second exact-main acceptance result" not in text:
              if marker not in text:
                  raise SystemExit("task record insertion marker missing")
              task.write_text(text.replace(marker, note + marker, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-tfi-m2-sync-e2e-contract.yml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "bhrum"
          git config user.email "bhrumom@gmail.com"
          git add desktop/e2e/messenger.spec.ts desktop/e2e/smoke.spec.ts desktop/e2e/miniapp-bot-parity.spec.ts projects/telegram-fabushi-integration/management/tasks/M2-SYNC-002-telegram-multidevice-account-sync.md .github/workflows/apply-tfi-m2-sync-e2e-contract.yml
          git commit -m "test(tfi): align Mini App recovery E2E with shipping shell"
          git push origin HEAD:fix/tfi-m2-sync-e2e-contract
