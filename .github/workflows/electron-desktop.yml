name: Electron desktop quality gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'chatgpt-vps-control/**'
      - 'desktop/**'
      - 'frontend/apps/host/**'
      - 'frontend/apps/web/src/app/host/**'
      - 'frontend/apps/web/src/app/remote-computer/**'
      - 'frontend/apps/web/src/lib/fabushi-runtime/**'
      - 'frontend/apps/web/src/components/fabushi-app-agent-surface.tsx'
      - 'frontend/apps/web/src/lib/app-agent-surface/**'
      - 'frontend/packages/mcp-app-sdk/**'
      - 'frontend/apps/web/src/lib/mahayana-host/**'
      - 'frontend/apps/web/src/lib/remote-computer/**'
      - 'frontend/packages/shared/**'
      - 'contracts/automation/cross-platform-journeys.json'
      - 'third_party/mahayana/codex-rs/**'
      - 'third_party/mahayana/mahayana-rs/Cargo.toml'
      - 'third_party/mahayana/mahayana-rs/Cargo.lock'
      - 'third_party/mahayana/mahayana-rs/mahayana-agent-codex/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-app-host/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-app-host-desktop/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-feature-host/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-host/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-host-protocol/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-product/**'
      - '.github/scripts/assert-native-electron-canonical.sh'
      - '.github/scripts/assert-electron-feature-host-bridge.sh'
      - '.github/scripts/assert-fabushi-desktop-architecture.py'
      - '.github/scripts/assert-native-desktop-edge-parity.py'
      - '.github/workflows/electron-desktop.yml'
      - '.github/scripts/verify-packaged-computer-control.mjs'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: electron-desktop-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    name: ${{ matrix.check_name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","label":"Linux","target":"linux","check_name":"Electron Linux"}]' || '[{"os":"macos-15","label":"macOS","target":"mac","check_name":"Electron macOS"},{"os":"windows-latest","label":"Windows","target":"win","check_name":"Electron Windows"},{"os":"ubuntu-latest","label":"Linux","target":"linux","check_name":"Electron Linux"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce canonical application architecture before dependency install
        if: matrix.target == 'linux'
        shell: bash
        run: bash .github/scripts/assert-native-electron-canonical.sh

      - name: Verify Electron Feature Host bridge contract before dependency install
        if: matrix.target == 'linux'
        shell: bash
        run: bash .github/scripts/assert-electron-feature-host-bridge.sh

      - name: Run dependency-free architecture and UI contracts
        if: matrix.target == 'linux'
        shell: bash
        run: |
          python3 .github/scripts/assert-fabushi-desktop-architecture.py
          python3 .github/scripts/assert-native-desktop-edge-parity.py
          python3 .github/scripts/assert-auth-entry-flow.py
          python3 .github/scripts/assert-bot-mark-motion.py
          python3 .github/scripts/assert-product-ui-contracts.py
          python3 .github/scripts/assert-native-capability-semantics.py
          node --test chatgpt-vps-control/tests/fabushi-embedded-runtime-source.test.js

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            chatgpt-vps-control/package-lock.json

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci --prefer-offline

      - name: Install embedded Computer Use dependencies
        if: github.event_name != 'pull_request'
        working-directory: chatgpt-vps-control
        run: npm ci --ignore-scripts --prefer-offline

      - name: Install Playwright video diagnostics runtime
        working-directory: desktop
        run: npx playwright install ffmpeg

      - name: Run Electron main-process contract tests
        if: matrix.target == 'linux'
        shell: bash
        run: node --test desktop/scripts/prepare-desktop-window-branding.test.mjs desktop/electron/edge-ipc.test.cjs desktop/electron/host-process.test.cjs desktop/electron/remote-device-agent-supervisor.test.cjs desktop/electron/test-auth-session.test.cjs desktop/electron/native-capability-handlers.test.cjs desktop/electron/offline-asr.test.cjs desktop/electron/main-lifecycle.test.cjs desktop/electron/preload-runtime-replay.test.cjs

      - name: Verify renderer TypeScript
        if: matrix.target == 'linux'
        working-directory: desktop
        run: npx tsc --noEmit

      - name: Record PR fast-path completion
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo 'Electron PR contract checks passed; the Linux runner also executes the real Rust Host pre-package black-box journey before merge. Installer and packaged E2E remain post-main gates.' >> "$GITHUB_STEP_SUMMARY"

      - id: host-source-key
        name: Freeze Rust Host source cache key
        if: true
        shell: bash
        env:
          SOURCE_HASH: ${{ hashFiles('third_party/mahayana/mahayana-rs/Cargo.lock', 'third_party/mahayana/mahayana-rs/**/*.rs', 'third_party/mahayana/mahayana-rs/**/Cargo.toml', 'third_party/mahayana/codex-rs/**/*.rs', 'third_party/mahayana/codex-rs/**/Cargo.toml') }}
        run: echo "hash=$SOURCE_HASH" >> "$GITHUB_OUTPUT"

      - id: host-binary-cache
        name: Restore reusable native Host binary
        if: true
        uses: actions/cache/restore@v4
        with:
          path: desktop/resources/bin
          key: electron-host-${{ runner.os }}-${{ runner.arch }}-v9-rust-1.97.1-${{ steps.host-source-key.outputs.hash }}

      - name: Record native Host cache result
        if: true
        shell: bash
        run: echo "${{ matrix.label }} Host binary cache hit=${{ steps.host-binary-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Rust on Host cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Enable compiler-result cache on Host cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - name: Install Linux native Host dependencies on cache miss
        if: matrix.target == 'linux' && steps.host-binary-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libxfixes-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgbm-dev

      - name: Restore Rust dependency/target cache on Host cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: electron-platform-${{ runner.os }}-v8-rust-1.97.1

      - name: Build and stage CI native Host on cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        working-directory: desktop
        env:
          SCCACHE_GHA_ENABLED: 'true'
          RUSTC_WRAPPER: sccache
        run: npm run build:host:ci

      - name: Show Rust compiler cache stats
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        shell: bash
        run: sccache --show-stats >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save reusable native Host binary immediately
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: desktop/resources/bin
          key: electron-host-${{ runner.os }}-${{ runner.arch }}-v9-rust-1.97.1-${{ steps.host-source-key.outputs.hash }}

      - name: Build Electron renderer
        if: true
        working-directory: desktop
        run: npm run build:renderer

      - name: Diagnose real Linux desktop bootstrap before the full user journey
        if: matrix.target == 'linux'
        working-directory: desktop
        env:
          FABUSHI_FEATURE_HOST_MODE: test
          FABUSHI_E2E: '1'
          MAHAYANA_APP_HOST_BIN: ${{ github.workspace }}/desktop/resources/bin/mahayana-app-host
        run: xvfb-run -a node scripts/diagnose-desktop-bootstrap.mjs

      - name: Simulate a user against the real Linux Rust Host before packaging
        if: matrix.target == 'linux'
        working-directory: desktop
        env:
          FABUSHI_FEATURE_HOST_MODE: test
          FABUSHI_E2E: '1'
          MAHAYANA_APP_HOST_BIN: ${{ github.workspace }}/desktop/resources/bin/mahayana-app-host
        run: xvfb-run -a npm run test:e2e

      - name: Build pinned offline ASR engine
        if: github.event_name != 'pull_request'
        working-directory: ${{ github.workspace }}
        run: node .github/scripts/build-offline-asr-engine.mjs

      - name: Resolve canonical desktop version for main delivery
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('../app-version.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          test "$version" = "$package_version"
          echo "FABUSHI_DELIVERY_VERSION=$version" >> "$GITHUB_ENV"
          echo "Canonical main desktop version: $version (source $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Developer ID identity for canonical main macOS package
        if: matrix.target == 'mac' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CONFIGURED_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          cert="$RUNNER_TEMP/fabushi-developer-id.p12"
          keychain="$RUNNER_TEMP/fabushi-developer-id.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          identity="$CONFIGURED_IDENTITY"
          if [ -z "$identity" ]; then
            identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          fi
          case "$identity" in
            *'Developer ID Application:'*) ;;
            *) echo 'Developer ID Application identity is required for canonical macOS packaging.' >&2; exit 1 ;;
          esac
          security find-identity -v -p codesigning "$keychain" | grep -F -- "$identity" >/dev/null
          echo "MACOS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Sign canonical main native macOS payloads before app sealing
        if: matrix.target == 'mac' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          host=desktop/resources/bin/mahayana-app-host
          test -x "$host"
          codesign --force --options runtime --timestamp --identifier com.ombhrum.fabushi.mahayana-app-host --sign "$MACOS_CODESIGN_IDENTITY" "$host"
          while IFS= read -r binary; do
            codesign --force --options runtime --timestamp --identifier com.ombhrum.fabushi.whisper-cli --sign "$MACOS_CODESIGN_IDENTITY" "$binary"
          done < <(find desktop/resources/asr -type f -name whisper-cli -print)
          codesign --verify --strict --verbose=2 "$host"

      - name: Stage bundled cross-platform Computer Use runtime
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CHATGPT_COMPUTER_HOME: ${{ github.workspace }}/desktop/resources/computer-control
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # MACOS_CODESIGN_IDENTITY is discovered at runtime and written through
          # GITHUB_ENV; read it in the shell rather than expression evaluation.
          export CHATGPT_COMPUTER_CODESIGN_IDENTITY="${MACOS_CODESIGN_IDENTITY:-}"
          export CHATGPT_COMPUTER_TEAM_ID="${APPLE_TEAM_ID:-}"
          node chatgpt-vps-control/bin/prepare-fabushi-bundle.js

      - name: Package canonical Electron application from staged inputs
        if: github.event_name != 'pull_request'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.target == 'mac' && github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
          FABUSHI_MACOS_NOTARIZE: ${{ matrix.target == 'mac' && github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: npx electron-builder --${{ matrix.target }} --publish never

      - name: Write exact-SHA delivery manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FABUSHI_DELIVERY_VERSION:-}"
          printf '{"version":"%s","sha":"%s","electronRunId":"%s","electronRunNumber":"%s","platform":"%s"}\n' \
            "$FABUSHI_DELIVERY_VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "${{ matrix.target }}" \
            > release/fabushi-delivery-${{ matrix.target }}.json

      - name: Notarize, staple, and verify canonical main macOS package
        if: matrix.target == 'mac' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          MACOS_NOTARIZATION_TIMEOUT_MINUTES: '90'
          MACOS_NOTARIZATION_POLL_SECONDS: '20'
        run: |
          set -euo pipefail
          dmg="$(find desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          app="$(find desktop/release -maxdepth 3 -type d -name '*.app' -print -quit)"
          test -n "$dmg"
          test -n "$app"
          bash .github/scripts/notarize-macos-dmg.sh "$dmg"
          chmod +x .github/scripts/verify-electron-macos-package.sh
          bash .github/scripts/verify-electron-macos-package.sh "$app" "$dmg"

      - name: Locate runnable packaged Electron executable
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'desktop/release'
          switch ('${{ matrix.target }}') {
            'mac' {
              $candidate = Get-ChildItem -Path $release -Recurse -File -Filter 'fabushi' |
                Where-Object {
                  $normalized = $_.FullName.Replace('\', '/')
                  $normalized -like '*.app/Contents/MacOS/fabushi'
                } |
                Select-Object -First 1
            }
            'win' {
              $path = Join-Path $release 'win-unpacked/fabushi.exe'
              $candidate = if (Test-Path -LiteralPath $path -PathType Leaf) { Get-Item -LiteralPath $path }
            }
            'linux' {
              $path = Join-Path $release 'linux-unpacked/fabushi'
              $candidate = if (Test-Path -LiteralPath $path -PathType Leaf) { Get-Item -LiteralPath $path }
            }
          }
          if (-not $candidate) {
            Get-ChildItem -Path $release -Recurse | Select-Object -ExpandProperty FullName
            throw 'electron-builder did not leave a runnable unpacked application'
          }
          "FABUSHI_ELECTRON_EXECUTABLE=$($candidate.FullName)" >> $env:GITHUB_ENV
          "Packaged executable: $($candidate.FullName)" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify packaged Computer Use runtime, helper, and private MCP
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          FABUSHI_PACKAGE_TARGET: ${{ matrix.target }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          args=(
            --release-root desktop/release
            --platform "$FABUSHI_PACKAGE_TARGET"
          )
          if [ "$FABUSHI_PACKAGE_TARGET" = mac ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            args+=(--expected-mac-team "$APPLE_TEAM_ID")
          fi
          if [ "$FABUSHI_PACKAGE_TARGET" = mac ] && [ "$GITHUB_EVENT_NAME" != "push" ]; then
            # Manual full-matrix validation packages an unsigned outer app;
            # the embedded helper signatures are still verified strictly.
            args+=(--allow-unsigned-mac)
          fi
          node .github/scripts/verify-packaged-computer-control.mjs "${args[@]}"

      - name: Simulate the complete user journey in packaged Linux Electron
        if: github.event_name != 'pull_request' && matrix.target == 'linux'
        working-directory: desktop
        env:
          FABUSHI_FEATURE_HOST_MODE: test
          FABUSHI_E2E: '1'
        run: xvfb-run -a npm run test:e2e

      - name: Simulate the complete user journey in packaged macOS or Windows Electron
        if: github.event_name != 'pull_request' && matrix.target != 'linux'
        working-directory: desktop
        env:
          FABUSHI_FEATURE_HOST_MODE: test
          FABUSHI_E2E: '1'
        run: npm run test:e2e

      - name: Upload packaged Electron user-journey diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-electron-${{ matrix.target }}-e2e-diagnostics
          path: |
            desktop/playwright-report/**
            desktop/test-results/**
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload Electron packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-electron-${{ matrix.target }}
          path: desktop/release/**
          if-no-files-found: error
          retention-days: 90

  result:
    name: Electron desktop result
    if: always()
    needs: platform
    runs-on: ubuntu-latest
    steps:
      - name: Require every Electron desktop matrix job
        shell: bash
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          if [ "$PLATFORM_RESULT" != "success" ]; then
            echo "Electron desktop matrix result=$PLATFORM_RESULT" >&2
            exit 1
          fi
          echo 'Every Electron desktop matrix job succeeded.'
