name: Electron desktop quality gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/apps/web/src/app/host/**'
      - 'frontend/apps/web/src/lib/grok-agent/**'
      - 'frontend/apps/web/src/lib/grok-bot/**'
      - 'frontend/apps/web/src/lib/mahayana-host/**'
      - 'frontend/packages/shared/**'
      - 'third_party/mahayana/codex-rs/**'
      - 'third_party/mahayana/mahayana-rs/Cargo.toml'
      - 'third_party/mahayana/mahayana-rs/Cargo.lock'
      - 'third_party/mahayana/mahayana-rs/mahayana-app-host/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-app-host-desktop/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-feature-host/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-host/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-host-protocol/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-product/**'
      - '.github/scripts/assert-native-electron-canonical.sh'
      - '.github/scripts/assert-electron-feature-host-bridge.sh'
      - '.github/workflows/electron-desktop.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: electron-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify Electron changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      host: ${{ steps.classify.outputs.host }}
      renderer: ${{ steps.classify.outputs.renderer }}
      package: ${{ steps.classify.outputs.package }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - id: classify
        name: Select the minimum safe test surface
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "$FORCE_ALL" = "true" ] || [ -z "$BASE_SHA" ]; then
            host=true
            renderer=true
            package=true
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            changed="$(git diff --name-only "$BASE_SHA" HEAD)"
            printf '%s\n' "$changed" >> "$GITHUB_STEP_SUMMARY"
            host=false
            renderer=false
            package=false
            if printf '%s\n' "$changed" | grep -Eq '^third_party/mahayana/(codex-rs/|mahayana-rs/(Cargo\.toml|Cargo\.lock|mahayana-app-host/|mahayana-app-host-desktop/|mahayana-feature-host/|mahayana-host/|mahayana-host-protocol/|mahayana-product/))'; then
              host=true
            fi
            if printf '%s\n' "$changed" | grep -Eq '^(desktop/|frontend/apps/web/src/app/host/|frontend/apps/web/src/lib/(grok-agent|grok-bot|mahayana-host)/|frontend/packages/shared/|\.github/scripts/assert-(native-electron-canonical|electron-feature-host-bridge)\.sh$)'; then
              renderer=true
            fi
            if printf '%s\n' "$changed" | grep -Eq '^(desktop/(electron/|resources/|scripts/|package\.json$|package-lock\.json$)|\.github/workflows/electron-desktop\.yml$)'; then
              package=true
            fi
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "renderer=$renderer" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          printf 'host=%s renderer=%s package=%s\n' "$host" "$renderer" "$package" >> "$GITHUB_STEP_SUMMARY"

  runtime-smoke:
    name: Electron Host simulated user smoke
    needs: changes
    if: needs.changes.outputs.host == 'true' || needs.changes.outputs.renderer == 'true' || needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Enforce canonical application architecture
        shell: bash
        run: bash .github/scripts/assert-native-electron-canonical.sh

      - name: Verify Electron Feature Host bridge contract
        shell: bash
        run: bash .github/scripts/assert-electron-feature-host-bridge.sh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci --prefer-offline

      - id: host-binary-cache
        name: Restore reusable Linux Host binary
        uses: actions/cache/restore@v4
        with:
          path: desktop/resources/bin
          key: electron-host-${{ runner.os }}-${{ runner.arch }}-v5-${{ hashFiles('third_party/mahayana/mahayana-rs/Cargo.lock', 'third_party/mahayana/mahayana-rs/**/*.rs', 'third_party/mahayana/mahayana-rs/**/Cargo.toml', 'third_party/mahayana/codex-rs/**/*.rs', 'third_party/mahayana/codex-rs/**/Cargo.toml') }}

      - name: Set up Rust on Host cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust compiler cache on Host cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: electron-desktop-host-ci-v5

      - name: Build and stage CI Mahayana Host on cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm run build:host:ci

      - name: Save reusable Linux Host binary immediately
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: desktop/resources/bin
          key: electron-host-${{ runner.os }}-${{ runner.arch }}-v5-${{ hashFiles('third_party/mahayana/mahayana-rs/Cargo.lock', 'third_party/mahayana/mahayana-rs/**/*.rs', 'third_party/mahayana/mahayana-rs/**/Cargo.toml', 'third_party/mahayana/codex-rs/**/*.rs', 'third_party/mahayana/codex-rs/**/Cargo.toml') }}

      - name: Build Electron renderer
        working-directory: desktop
        run: npm run build:renderer

      - name: Simulate a user in the Electron sandbox and real Rust Host
        working-directory: desktop
        env:
          MAHAYANA_APP_HOST_BIN: ${{ github.workspace }}/desktop/resources/bin/mahayana-app-host
        run: xvfb-run -a npm run test:e2e

  package:
    name: Package Electron (${{ matrix.label }})
    needs: [changes, runtime-smoke]
    if: >-
      always() &&
      needs.runtime-smoke.result == 'success' &&
      (needs.changes.outputs.host == 'true' || needs.changes.outputs.package == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS
            target: mac
          - os: windows-latest
            label: Windows
            target: win
          - os: ubuntu-latest
            label: Linux
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci --prefer-offline

      - id: host-binary-cache
        name: Restore reusable native Host binary
        uses: actions/cache/restore@v4
        with:
          path: desktop/resources/bin
          key: electron-host-${{ runner.os }}-${{ runner.arch }}-v5-${{ hashFiles('third_party/mahayana/mahayana-rs/Cargo.lock', 'third_party/mahayana/mahayana-rs/**/*.rs', 'third_party/mahayana/mahayana-rs/**/Cargo.toml', 'third_party/mahayana/codex-rs/**/*.rs', 'third_party/mahayana/codex-rs/**/Cargo.toml') }}

      - name: Set up Rust on Host cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust compiler cache on Host cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: electron-package-ci-${{ runner.os }}-v5

      - name: Build and stage CI native Host on cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm run build:host:ci

      - name: Save reusable native Host binary immediately
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: desktop/resources/bin
          key: electron-host-${{ runner.os }}-${{ runner.arch }}-v5-${{ hashFiles('third_party/mahayana/mahayana-rs/Cargo.lock', 'third_party/mahayana/mahayana-rs/**/*.rs', 'third_party/mahayana/mahayana-rs/**/Cargo.toml', 'third_party/mahayana/codex-rs/**/*.rs', 'third_party/mahayana/codex-rs/**/Cargo.toml') }}

      - name: Build renderer once without rebuilding the Host
        working-directory: desktop
        run: npm run build:renderer

      - name: Package canonical Electron application from staged inputs
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.target }}

      - name: Upload Electron packages
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-electron-${{ matrix.target }}
          path: desktop/release/**
          if-no-files-found: error
          retention-days: 14

  result:
    name: Electron desktop result
    needs: [changes, runtime-smoke, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every selected Electron layer
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            "runtime:${{ needs.runtime-smoke.result }}" \
            "package:${{ needs.package.result }}"
          do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "$name failed: $result" >&2
              exit 1
            fi
          done
          echo 'Electron selected-surface checks passed.'
