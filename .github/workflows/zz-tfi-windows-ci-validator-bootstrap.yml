name: TFI Windows validator bootstrap

on:
  push:
    branches:
      - fix/tfi-windows-ci-session-validator-20260907

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/tfi-windows-ci-session-validator-20260907
          persist-credentials: true

      - name: Apply exact Windows App-owned validator patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('third_party/mahayana/mahayana-rs/mahayana-product/src/lib.rs')
          text = path.read_text()
          old = '        && (device_id.ends_with("-interactive") || device_id.ends_with("-macos-app"))'
          new = '''        && (device_id.ends_with("-interactive")
              || device_id.ends_with("-macos-app")
              || device_id.ends_with("-windows-app"))'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          old_test = '''        let mut with_refresh = session.clone();'''
          new_test = '''        let mut windows_app = session.clone();
          windows_app["deviceId"] = Value::String("gha-12345-1-windows-app".into());
          assert_eq!(
              validate_ci_account_session(windows_app.clone(), now),
              Ok(windows_app)
          );
          let mut with_refresh = session.clone();'''
          assert text.count(old_test) == 1, text.count(old_test)
          text = text.replace(old_test, new_test, 1)
          path.write_text(text)
          PY
          grep -F 'device_id.ends_with("-windows-app")' third_party/mahayana/mahayana-rs/mahayana-product/src/lib.rs
          grep -F 'gha-12345-1-windows-app' third_party/mahayana/mahayana-rs/mahayana-product/src/lib.rs
          git diff --check

      - name: Commit patch and delete bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-tfi-windows-ci-validator-bootstrap.yml
          git add third_party/mahayana/mahayana-rs/mahayana-product/src/lib.rs
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git commit -m 'fix(TFI): accept Windows App-owned CI sessions'
          git push origin HEAD:fix/tfi-windows-ci-session-validator-20260907
