name: Large-file hardening patch v3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/large-file-hardening-v3.yml'
      - '.github/large-file-hardening-v3-trigger'
      - '.github/scripts/apply-large-file-hardening.py'
      - '.github/scripts/commit-large-file-hardening.sh'

permissions:
  contents: write

concurrency:
  group: large-file-hardening-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply asserted hardening patch
        run: python3 .github/scripts/apply-large-file-hardening.py
      - name: Validate focused changes
        shell: bash
        run: |
          set -euo pipefail
          node --check ai-backend/src/server.js
          printf '{"type":"module"}\n' > fabushi/web/package.json
          node --check fabushi/web/alipay-login-functions.js
          node --check fabushi/web/src/handlers/meditation.js
          node --check fabushi/web/src/routes/meditation-routes.js
          node --check fabushi/web/src/router.js
          node fabushi/web/tests/router-meditation-auth.test.js
          rm fabushi/web/package.json
          ! grep -q 'dacheng-codex-local-dev-secret' ai-backend/src/server.js
          ! grep -q 'mock_alipay_user_' fabushi/web/alipay-login-functions.js
          ! grep -q 'createLegacyMeditationToken' fabushi/web/src/router.js
          grep -q 'rust-toolchain@1.98.0' .github/workflows/native-mobile.yml
          grep -q 'cargo install cargo-ndk --version 4.1.2 --locked' .github/workflows/native-mobile.yml
      - name: Commit hardened files to PR branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/commit-large-file-hardening.sh
