name: Computer control security gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'chatgpt-vps-control/**'
      - '.github/workflows/computer-control-security.yml'
  push:
    branches: [main]
    paths:
      - 'chatgpt-vps-control/**'
      - '.github/workflows/computer-control-security.yml'
  workflow_dispatch:

concurrency:
  group: computer-control-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check JavaScript syntax
        working-directory: chatgpt-vps-control
        run: npm run check
      - name: Verify OAuth and credential boundary
        working-directory: chatgpt-vps-control
        run: node security-gate.mjs
