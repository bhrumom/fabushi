name: Computer control security gate

on:
  pull_request:
    paths:
      - 'chatgpt-vps-control/**'
      - 'frontend/apps/web/src/lib/remote-computer/**'
      - 'frontend/apps/web/src/lib/mahayana-host/contracts.ts'
      - 'third_party/mahayana/mahayana-rs/mahayana-computer/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-host-protocol/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-feature-host/**'
      - 'third_party/mahayana/mahayana-rs/Cargo.lock'
      - '.github/workflows/computer-control-security.yml'
  push:
    branches: [main]
    paths:
      - 'chatgpt-vps-control/**'
      - 'frontend/apps/web/src/lib/remote-computer/**'
      - 'frontend/apps/web/src/lib/mahayana-host/contracts.ts'
      - 'third_party/mahayana/mahayana-rs/mahayana-computer/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-host-protocol/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-feature-host/**'
      - 'third_party/mahayana/mahayana-rs/Cargo.lock'
      - '.github/workflows/computer-control-security.yml'
  workflow_dispatch:

concurrency:
  group: computer-control-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  remediate-m4-once:
    if: github.event_name == 'pull_request' && github.head_ref == 'gbf/m4-computer-control-convergence-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chatgpt-vps-control/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt
      - name: Patch canonical Rust fields and Linux native CI dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          computer = Path('third_party/mahayana/mahayana-rs/mahayana-computer/src/lib.rs')
          text = computer.read_text(encoding='utf-8')
          text = text.replace('action.duration_ms.unwrap_or(300)', 'action.wait_ms.unwrap_or(300)')
          text = text.replace('action.scroll_amount.unwrap_or(1)', 'action.amount.unwrap_or(1)')
          if 'action.duration_ms' in text or 'action.scroll_amount' in text:
              raise SystemExit('stale portable ComputerAction field remains')
          computer.write_text(text, encoding='utf-8')

          protocol = Path('third_party/mahayana/mahayana-rs/mahayana-host-protocol/src/lib.rs')
          text = protocol.read_text(encoding='utf-8')
          if 'computer_action_duration_and_scroll_amount_match_the_react_contract' not in text:
              anchor = '''    #[test]\n    fn event_json_uses_camel_case_fields() {\n'''
              test = r'''    #[test]
    fn computer_action_duration_and_scroll_amount_match_the_react_contract() {
        let action: ComputerAction = serde_json::from_str(
            r#"{"action":"drag","x":1,"y":2,"x2":3,"y2":4,"durationMs":375,"amount":7}"#,
        )
        .expect("decode computer action");
        assert_eq!(action.wait_ms, Some(375));
        assert_eq!(action.amount, Some(7));
        let value = serde_json::to_value(&action).expect("encode computer action");
        assert_eq!(value["durationMs"], 375);
        assert_eq!(value["amount"], 7);
        assert!(value.get("waitMs").is_none());
    }

    #[test]
    fn legacy_wait_ms_alias_remains_accepted() {
        let action: ComputerAction = serde_json::from_str(
            r#"{"action":"wait","waitMs":250}"#,
        )
        .expect("decode legacy wait action");
        assert_eq!(action.wait_ms, Some(250));
    }

'''
              if text.count(anchor) != 1:
                  raise SystemExit('protocol test anchor is not unique')
              text = text.replace(anchor, test + anchor, 1)
          protocol.write_text(text, encoding='utf-8')

          fast = Path('.github/workflows/mahayana-fast-checks.yml')
          text = fast.read_text(encoding='utf-8')
          if 'Install Linux native capture/input dependencies' not in text:
              marker = '''      - name: Restore targeted Cargo cache\n'''
              step = '''      - name: Install Linux native capture/input dependencies\n        shell: bash\n        run: |\n          sudo apt-get update\n          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \\\n            pkg-config libclang-dev libxcb1-dev libxrandr-dev libxfixes-dev \\\n            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev\n\n'''
              if text.count(marker) != 1:
                  raise SystemExit('Mahayana cache anchor is not unique')
              text = text.replace(marker, step + marker, 1)
          fast.write_text(text, encoding='utf-8')
          PY
      - name: Remediate vulnerable production dependencies
        working-directory: chatgpt-vps-control
        run: |
          npm ci --ignore-scripts
          npm audit fix --omit=dev
          npm test
          npm audit --omit=dev
      - name: Format and verify protocol contract
        working-directory: third_party/mahayana/mahayana-rs
        run: |
          cargo fmt --all
          cargo test --locked -p mahayana-host-protocol --profile ci
      - name: Commit product/CI remediation
        shell: bash
        run: |
          git rm -f .github/workflows/gbf-m4-remediation.yml || true
          git config user.name 'fabushi-ci'
          git config user.email 'fabushi-ci@users.noreply.github.com'
          git add .github/workflows/mahayana-fast-checks.yml chatgpt-vps-control/package.json chatgpt-vps-control/package-lock.json third_party/mahayana/mahayana-rs/mahayana-computer/src/lib.rs third_party/mahayana/mahayana-rs/mahayana-host-protocol/src/lib.rs
          if git diff --cached --quiet; then
            echo 'M4 remediation already applied.'
            exit 0
          fi
          git commit -m 'fix(gbf): close cross-platform computer-control gates'
          git push origin HEAD:gbf/m4-computer-control-convergence-20260822

  node-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: chatgpt-vps-control
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chatgpt-vps-control/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run check
      - name: Verify OAuth and credential boundary
        run: node security-gate.mjs
      - name: Run browser, target, sensitive-input and native broker tests
        run: node --test tests/browser-extension.test.js tests/browser-session.test.js tests/secure-input.test.js tests/native-request-service.test.js tests/tool-descriptors.test.js tests/semantic-computer.test.js tests/linux-helper-source.test.js tests/macos-helper-source.test.js
      - name: Audit production dependencies
        run: npm audit --omit=dev

  rust-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          cache-on-failure: true
      - name: Install Linux native capture/input dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libxfixes-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev
      - name: Check computer-control crates
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo check --locked -p mahayana-host-protocol -p mahayana-computer -p mahayana-feature-host
      - name: Run protocol and computer-control unit tests
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo test --locked -p mahayana-host-protocol -p mahayana-computer

  linux-managed-semantic-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: chatgpt-vps-control
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chatgpt-vps-control/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install X11 and AT-SPI test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xdotool wmctrl ffmpeg x11-utils x11-xserver-utils xvfb x11vnc xfwm4 dbus-x11 \
            at-spi2-core python3-pyatspi gir1.2-atspi-2.0 libglib2.0-bin python3-gi gir1.2-gtk-3.0
      - name: Verify Linux helper and managed-desktop contracts
        shell: bash
        run: |
          node --test tests/linux-helper-source.test.js tests/semantic-computer.test.js tests/browser-session.test.js
          xvfb-run -a node scripts/check.mjs
