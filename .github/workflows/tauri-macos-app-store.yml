name: Upload Tauri macOS package to Apple

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: GitHub Actions run ID from "Tauri macOS package and functional tests".
        required: true
        type: string
      app_version:
        description: App Store version, for example 1.0.0.
        required: true
        default: "1.0.0"
        type: string
      build_number:
        description: App Store build number. Leave empty to use this workflow run number.
        required: false
        type: string

concurrency:
  group: tauri-macos-app-store-upload
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  upload-to-apple:
    name: Sign package and upload to App Store Connect
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ inputs.app_version }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      SOURCE_SHA: ${{ github.sha }}
      MACOS_APP_STORE_TEAM_ID: ${{ vars.MACOS_APP_STORE_TEAM_ID || vars.APPLE_TEAM_ID || 'M4Q99K4UR4' }}
      MACOS_APP_STORE_BUNDLE_ID: ${{ vars.MACOS_APP_STORE_BUNDLE_ID || 'com.ombhrum.fabushi' }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      MACOS_APP_STORE_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_P12_BASE64 }}
      MACOS_APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_PASSWORD }}
      MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_STORE_INSTALLER_CERTIFICATE_P12_BASE64 }}
      MACOS_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD }}
      MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
      MACOS_APP_STORE_STATUS_DIR: ${{ github.workspace }}/macos-app-store-assets
    steps:
      - name: Checkout upload scripts and entitlements
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download previously tested Mac package
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run_id }}
          name: fabushi-macos-package
          path: macos-package-artifacts

      - name: Restore packaged .app
        shell: bash
        run: |
          set -euo pipefail
          test -f macos-package-artifacts/Fabushi.app.zip
          mkdir -p macos-app-store-input
          ditto -x -k macos-package-artifacts/Fabushi.app.zip macos-app-store-input
          app_path="$(find macos-app-store-input -maxdepth 1 -type d -name '*.app' -print | sort | head -n 1)"
          test -n "$app_path"
          test ! -e "$app_path/Contents/Resources/fabushi-official"
          echo "TAURI_APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Sign, package, validate and upload
        shell: bash
        run: bash .github/scripts/upload-tauri-macos-app-store.sh

      - name: Upload App Store package and status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tauri-macos-app-store-${{ github.run_number }}
          path: macos-app-store-assets
          if-no-files-found: warn
          retention-days: 30
