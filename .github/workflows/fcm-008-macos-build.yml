name: FCM-008 latest main macOS package

on:
  push:
    branches:
      - chore/fcm-008-build-latest-macos-20260823
    paths:
      - '.github/workflows/fcm-008-macos-build.yml'

permissions:
  contents: write

env:
  SOURCE_SHA: 67b70fffa0720fa549fe6c1cc20f1f30bf1a3d2c
  RELEASE_TAG: macos-main-67b70fff-20260823

jobs:
  package-macos:
    name: Package latest canonical macOS Electron
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout exact canonical main source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Building canonical main $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - id: host-source-key
        name: Freeze Rust Host source cache key
        shell: bash
        env:
          SOURCE_HASH: ${{ hashFiles('third_party/mahayana/mahayana-rs/Cargo.lock', 'third_party/mahayana/mahayana-rs/**/*.rs', 'third_party/mahayana/mahayana-rs/**/Cargo.toml', 'third_party/mahayana/codex-rs/**/*.rs', 'third_party/mahayana/codex-rs/**/Cargo.toml') }}
        run: echo "hash=$SOURCE_HASH" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci --prefer-offline

      - id: host-binary-cache
        name: Restore reusable native Host binary
        uses: actions/cache/restore@v4
        with:
          path: desktop/resources/bin
          key: electron-host-${{ runner.os }}-${{ runner.arch }}-v7-rust-1.97.1-${{ steps.host-source-key.outputs.hash }}

      - name: Set up Rust on Host cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Restore Rust compiler cache on Host cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: electron-package-ci-${{ runner.os }}-v6-rust-1.97.1

      - name: Build and stage CI native Host on cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm run build:host:ci

      - name: Save reusable native Host binary immediately
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: desktop/resources/bin
          key: electron-host-${{ runner.os }}-${{ runner.arch }}-v7-rust-1.97.1-${{ steps.host-source-key.outputs.hash }}

      - name: Build pinned offline ASR engine
        run: node .github/scripts/build-offline-asr-engine.mjs

      - name: Build Electron renderer
        working-directory: desktop
        run: npm run build:renderer

      - name: Package canonical Electron application for macOS
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac

      - name: Verify packaged application and installers
        shell: bash
        run: |
          set -euo pipefail
          find desktop/release -maxdepth 4 -type f -print | sort >> "$GITHUB_STEP_SUMMARY"
          test -n "$(find desktop/release -type d -name '*.app' -print -quit)"
          test -n "$(find desktop/release -type f -name '*.dmg' -print -quit)"
          test -n "$(find desktop/release -type f -name '*.zip' -print -quit)"

      - name: Publish immutable macOS prerelease assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to mutate it." >&2
            exit 1
          fi
          dmg="$(find desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          zip="$(find desktop/release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$dmg" && test -n "$zip"
          shasum -a 256 "$dmg" "$zip" > desktop/release/SHA256SUMS.txt
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "Fabushi macOS latest main 67b70fff" \
            --notes "Built from canonical main $SOURCE_SHA by FCM-008. This is a build-only prerelease. The full Electron Messenger E2E gate on run 32619314508 exposed separate Messaging regressions that remain tracked under FAB-P0001; this package is not claimed as fully E2E-accepted." \
            "$dmg" "$zip" desktop/release/SHA256SUMS.txt

      - name: Upload latest macOS package
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-macos-main-67b70fff
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
