name: ChatGPT auto-confirm runtime validation

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    paths:
      - '.agents/plugins/plugins/chatgpt-auto-confirm/**'
      - '.github/workflows/chatgpt-auto-confirm-runtime.yml'

jobs:
  runtime-validation:
    name: Validate bundled ChatGPT auto-confirm runtime
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .agents/plugins/plugins/chatgpt-auto-confirm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build and test runtime
        run: npm test

      - name: Upload macOS runtime evidence
        uses: actions/upload-artifact@v7
        with:
          name: chatgpt-auto-confirm-macos-runtime
          path: runtime/macos/chatgpt-auto-confirm
