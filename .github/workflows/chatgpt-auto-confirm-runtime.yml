name: ChatGPT auto-confirm runtime validation

on:
  workflow_dispatch:
    inputs:
      cloud_session_smoke:
        description: Restore the ChatGPT session on a hosted macOS runner
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    paths:
      - '.agents/plugins/plugins/chatgpt-auto-confirm/**'
      - '.github/workflows/chatgpt-auto-confirm-runtime.yml'
      - '.github/workflows/chatgpt-auto-confirm-runner.yml'

jobs:
  runtime-validation:
    name: Validate bundled ChatGPT auto-confirm runtime
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .agents/plugins/plugins/chatgpt-auto-confirm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build and test runtime
        run: npm test

      - name: Upload macOS runtime and generated miniapp evidence
        uses: actions/upload-artifact@v7
        with:
          name: chatgpt-auto-confirm-macos-runtime
          if-no-files-found: error
          path: |
            .agents/plugins/plugins/chatgpt-auto-confirm/runtime/macos/chatgpt-auto-confirm
            .agents/plugins/plugins/chatgpt-auto-confirm/worker/src/content.generated.ts

  hosted-session-smoke:
    name: Verify hosted ChatGPT login restoration
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cloud_session_smoke }}
    runs-on: macos-15
    timeout-minutes: 15
    env:
      CHATGPT_CDP_PORT: "9324"
      CHATGPT_CODEX_AUTH_B64: ${{ secrets.CHATGPT_CODEX_AUTH_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore ChatGPT login credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CHATGPT_CODEX_AUTH_B64"
          mkdir -p "$HOME/.codex"
          printf '%s' "$CHATGPT_CODEX_AUTH_B64" | base64 --decode > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"

      - name: Install official ChatGPT desktop app
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://persistent.oaistatic.com/codex-app-prod/ChatGPT.dmg \
            --output "$RUNNER_TEMP/ChatGPT.dmg"
          mount_dir="$RUNNER_TEMP/chatgpt-mount"
          profile_dir="$RUNNER_TEMP/chatgpt-profile"
          mkdir -p "$mount_dir" "$profile_dir"
          chmod 700 "$profile_dir"
          hdiutil attach "$RUNNER_TEMP/ChatGPT.dmg" \
            -nobrowse -readonly -mountpoint "$mount_dir"
          ditto "$mount_dir/ChatGPT.app" /Applications/ChatGPT.app
          hdiutil detach "$mount_dir"
          xattr -dr com.apple.quarantine /Applications/ChatGPT.app || true
          open -na /Applications/ChatGPT.app --args \
            --user-data-dir="$profile_dir" \
            --remote-debugging-port="$CHATGPT_CDP_PORT"

      - name: Verify ChatGPT login
        env:
          CHATGPT_SESSION_MODE: verify
        run: node .agents/plugins/plugins/chatgpt-auto-confirm/scripts/restore-session-cookies.mjs
