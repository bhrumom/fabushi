name: Release 1.2.14 metadata sync

on:
  push:
    branches:
      - release/1.2.14
    paths:
      - .github/workflows/release-1.2.14-metadata-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lock = Path('desktop/package-lock.json')
          text = lock.read_text()
          old = '"version": "1.2.13"'
          if text.count(old) < 2:
              raise SystemExit('expected desktop root lock versions not found')
          text = text.replace(old, '"version": "1.2.14"', 2)
          lock.write_text(text)

          changelog = Path('fabushi/CHANGELOG.md')
          text = changelog.read_text()
          header = '# 更新日志\n\n'
          if not text.startswith(header):
              raise SystemExit('unexpected changelog header')
          if '## [1.2.14]' not in text:
              entry = '''## [1.2.14] - 2026-09-03

### 全新正式版本发布
- 以当前 canonical `main` 为唯一来源启动全新 `1.2.14` 正式发布列车；当前开放 PR #2287 已审阅，但仍为 Draft，且其 iOS marketplace live-official 安装门禁缺少兼容 `global-dharma` artifact，因此按仓库验收约束继续隔离，不提前并入正式主线。
- 桌面、Android 与 iOS 产品版本统一提升到 `1.2.14`，Android `versionCode` 与 iOS `CURRENT_PROJECT_VERSION` 统一提升到 `20`，确保所有正式渠道使用全新且严格递增的发布身份。
- 继续使用仓库现有 `[full-platform-release]` exact-main GitHub Actions 完成 macOS/Windows/Linux 桌面产物、Android/iOS、Apple/Google Play 渠道、生产部署、不可变 GitHub Release、全新安装与上一正式版本升级验收；重型构建和测试仅在 GitHub Actions 执行。

---

'''
              changelog.write_text(header + entry + text[len(header):])
          PY
          rm -f fabushi/CHANGELOG-1.2.14.md RELEASE_NOTES_1.2.14.md
          git rm .github/workflows/release-1.2.14-metadata-sync.yml
          git add desktop/package-lock.json fabushi/CHANGELOG.md
          git add -u fabushi/CHANGELOG-1.2.14.md RELEASE_NOTES_1.2.14.md || true
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: finalize 1.2.14 metadata'
          git push origin HEAD:release/1.2.14
