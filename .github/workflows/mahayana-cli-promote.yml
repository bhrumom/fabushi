name: Mahayana CLI protected-main promotion (no tests)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main CLI package source SHA to promote without rebuilding
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mahayana-cli-promote-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote existing immutable CLI package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout protected main metadata
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact reusable protected-main package
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha='${{ inputs.source_sha }}'
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be a full lowercase commit SHA' >&2; exit 1; }
          git fetch origin main --depth=1
          main_sha="$(git rev-parse origin/main)"
          compare_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$source_sha...$main_sha" --jq .status)"
          case "$compare_status" in
            ahead|identical) ;;
            *) echo "Refusing promotion: $source_sha is not on the protected-main lineage of $main_sha (status=$compare_status)" >&2; exit 1 ;;
          esac
          git fetch origin "$source_sha" --depth=1
          if ! git diff --quiet "$source_sha" "$main_sha" -- third_party/mahayana; then
            echo 'Refusing artifact reuse: Mahayana CLI payload changed after the packaged source.' >&2
            git diff --name-only "$source_sha" "$main_sha" -- third_party/mahayana >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "test_tag=mahayana-cli-test-${source_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "channel_tag=mahayana-cli-main-${source_sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Download existing immutable no-test package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha='${{ steps.meta.outputs.source_sha }}'
          test_tag='${{ steps.meta.outputs.test_tag }}'
          target="$(gh release view "$test_tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          test "$target" = "$source_sha"
          mkdir -p packages
          gh release download "$test_tag" --repo "$GITHUB_REPOSITORY" --dir packages
          test -f packages/SHA256SUMS.txt
          test -f packages/mahayana-linux-x86_64.tar.gz
          test -f packages/mahayana-linux-aarch64.tar.gz
          test -f packages/mahayana-macos-x86_64.tar.gz
          test -f packages/mahayana-macos-aarch64.tar.gz
          test -f packages/mahayana-windows-x86_64.zip
          (cd packages && sha256sum -c SHA256SUMS.txt)

      - name: Publish immutable protected-main installer channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha='${{ steps.meta.outputs.source_sha }}'
          channel_tag='${{ steps.meta.outputs.channel_tag }}'
          if gh release view "$channel_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            target="$(gh release view "$channel_tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            test "$target" = "$source_sha"
            echo "Already promoted: $channel_tag"
            exit 0
          fi
          gh release create "$channel_tag" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$source_sha" \
            --title "Mahayana CLI protected main ${source_sha:0:12}" \
            --notes "Immutable one-line-installer channel promoted from ${{ steps.meta.outputs.test_tag }}. Current protected main at promotion: ${{ steps.meta.outputs.main_sha }}. The Mahayana payload tree is byte-identical between package source and current main. No product tests were run by this promotion." \
            --latest=false
