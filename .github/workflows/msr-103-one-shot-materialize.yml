name: MSR-103 one-shot materializer

on:
  push:
    branches:
      - feat/msr-103-native-auth-secrets-clean
    paths:
      - .github/workflows/msr-103-one-shot-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: feat/msr-103-native-auth-secrets-clean
          fetch-depth: 0

      - name: Apply deterministic source and lock repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('third_party/mahayana/mahayana-rs/mahayana-secrets/src/lib.rs')
          text = path.read_text()
          old = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum LocalSecretsNamespace {
              ManagedSecrets,
              MahayanaAuth,
          }

          impl Default for LocalSecretsNamespace {
              fn default() -> Self {
                  Self::ManagedSecrets
              }
          }
          '''
          new = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]
          pub enum LocalSecretsNamespace {
              #[default]
              ManagedSecrets,
              MahayanaAuth,
          }
          '''
          if old not in text:
              raise SystemExit('expected LocalSecretsNamespace Default block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo update --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml -p rama-macros --precise 0.3.0-alpha.4
          cargo update --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml -p rama-utils --precise 0.3.0-alpha.4
          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all
          rm .github/workflows/msr-103-one-shot-materialize.yml

      - name: Verify exact compatibility pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lock = Path('third_party/mahayana/mahayana-rs/Cargo.lock').read_text()
          for name in ('rama-error', 'rama-macros', 'rama-utils'):
              marker = f'name = "{name}"\nversion = "0.3.0-alpha.4"'
              if marker not in lock:
                  raise SystemExit(f'{name} is not locked to 0.3.0-alpha.4')
          PY
          git diff --check

      - name: Commit materialized repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add third_party/mahayana/mahayana-rs/mahayana-secrets/src/lib.rs third_party/mahayana/mahayana-rs/Cargo.lock .github/workflows/msr-103-one-shot-materialize.yml
          git commit -m 'fix(mahayana): materialize MSR-103 compatibility repairs'
          git push origin HEAD:feat/msr-103-native-auth-secrets-clean
