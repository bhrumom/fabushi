name: FCM-008 signed notarized macOS replacement

on:
  push:
    branches:
      - chore/fcm-008-build-latest-macos-20260823
    paths:
      - '.github/workflows/fcm-008-macos-signed-release.yml'

permissions:
  contents: write
  actions: read

env:
  SOURCE_SHA: 67b70fffa0720fa549fe6c1cc20f1f30bf1a3d2c
  RELEASE_TAG: macos-main-67b70fff-20260823-signed
  RELEASE_NAME: Fabushi macOS signed notarized main 67b70fff

jobs:
  signed-notarized-macos:
    name: Developer ID sign, notarize, staple and publish
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout exact canonical product source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Building canonical main $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - id: host-source-key
        name: Freeze Rust Host source cache key
        shell: bash
        env:
          SOURCE_HASH: ${{ hashFiles('third_party/mahayana/mahayana-rs/Cargo.lock', 'third_party/mahayana/mahayana-rs/**/*.rs', 'third_party/mahayana/mahayana-rs/**/Cargo.toml', 'third_party/mahayana/codex-rs/**/*.rs', 'third_party/mahayana/codex-rs/**/Cargo.toml') }}
        run: echo "hash=$SOURCE_HASH" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci --prefer-offline

      - id: host-binary-cache
        name: Restore reusable native Host binary
        uses: actions/cache/restore@v4
        with:
          path: desktop/resources/bin
          key: electron-host-${{ runner.os }}-${{ runner.arch }}-v7-rust-1.97.1-${{ steps.host-source-key.outputs.hash }}

      - name: Set up Rust on Host cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Restore Rust compiler cache on Host cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: electron-package-ci-${{ runner.os }}-v6-rust-1.97.1

      - name: Build and stage native Host on cache miss
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm run build:host:ci

      - name: Save reusable native Host binary
        if: steps.host-binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: desktop/resources/bin
          key: electron-host-${{ runner.os }}-${{ runner.arch }}-v7-rust-1.97.1-${{ steps.host-source-key.outputs.hash }}

      - name: Build pinned offline ASR engine
        run: node .github/scripts/build-offline-asr-engine.mjs

      - name: Build Electron renderer
        working-directory: desktop
        run: npm run build:renderer

      - name: Install Developer ID Application identity
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CONFIGURED_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          cert="$RUNNER_TEMP/fabushi-developer-id.p12"
          keychain="$RUNNER_TEMP/fabushi-developer-id.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          identity="$CONFIGURED_IDENTITY"
          if [ -z "$identity" ]; then
            identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          fi
          test -n "$identity"
          case "$identity" in
            *'Developer ID Application:'*) ;;
            *) echo 'Configured signing identity is not a Developer ID Application certificate.' >&2; exit 1 ;;
          esac
          security find-identity -v -p codesigning "$keychain" | grep -F -- "$identity" >/dev/null
          echo "EFFECTIVE_MACOS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MACOS_BUILD_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "Developer ID Application identity installed in ephemeral keychain." >> "$GITHUB_STEP_SUMMARY"

      - name: Package signed canonical Electron application for macOS arm64
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          export CSC_IDENTITY_AUTO_DISCOVERY=true
          npx --no-install electron-builder --mac --arm64 --publish never

      - id: package
        name: Verify real Developer ID app signature
        shell: bash
        run: |
          set -euo pipefail
          app="$(find desktop/release -type d -name '*.app' -print -quit)"
          dmg="$(find desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$app" && test -n "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature" | grep -F 'Authority=Developer ID Application:' >/dev/null
          team="$(printf '%s\n' "$signature" | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
          test -n "$team" && test "$team" != 'not set'
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "team=$team" >> "$GITHUB_OUTPUT"
          {
            echo '## Developer ID signature'
            echo "- TeamIdentifier: \`$team\`"
            echo '- App signature: Developer ID Application'
            echo '- Deep strict verification: passed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notarize and staple DMG with Apple
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          MACOS_NOTARIZATION_TIMEOUT_MINUTES: '60'
          MACOS_NOTARIZATION_POLL_SECONDS: '20'
          MACOS_NOTARIZATION_STATUS_DIR: ${{ github.workspace }}/macos-notarization-status
        run: bash .github/scripts/notarize-macos-dmg.sh '${{ steps.package.outputs.dmg }}'

      - name: Require stapled ticket and Gatekeeper acceptance
        shell: bash
        run: |
          set -euo pipefail
          dmg='${{ steps.package.outputs.dmg }}'
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg" 2>&1 | tee "$RUNNER_TEMP/spctl-dmg.txt"
          mount_dir="$(hdiutil attach -nobrowse -readonly "$dmg" | awk '/\/Volumes\// {sub(/^.*\/Volumes\//,"/Volumes/"); print; exit}')"
          mounted_app="$(find "$mount_dir" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$mounted_app"
          codesign --verify --deep --strict --verbose=2 "$mounted_app"
          spctl -a -vvv -t exec "$mounted_app" 2>&1 | tee "$RUNNER_TEMP/spctl-app.txt"
          hdiutil detach "$mount_dir" >/dev/null
          {
            echo '## Gatekeeper verification'
            echo '- stapler validate: passed'
            echo '- DMG primary-signature spctl: accepted'
            echo '- mounted app spctl: accepted'
          } >> "$GITHUB_STEP_SUMMARY"

      - id: assets
        name: Stage immutable signed release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-release
          final='signed-release/Fabushi-1.0.2-arm64-signed-notarized.dmg'
          cp '${{ steps.package.outputs.dmg }}' "$final"
          shasum -a 256 "$final" > signed-release/SHA256SUMS.txt
          echo "dmg=$final" >> "$GITHUB_OUTPUT"

      - name: Publish immutable signed notarized prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to mutate it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            signed-release/Fabushi-1.0.2-arm64-signed-notarized.dmg \
            signed-release/SHA256SUMS.txt \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_NAME" \
            --prerelease \
            --notes $'Replacement for the rejected ad-hoc-signed FCM-008 package.\n\nThis DMG is signed with Developer ID Application, notarized by Apple, stapled, and required to pass Gatekeeper spctl checks before publication.\n\nProduct source: 67b70fffa0720fa549fe6c1cc20f1f30bf1a3d2c.'

      - name: Upload notarization evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fcm-008-macos-notarization-evidence
          path: |
            macos-notarization-status/**
            signed-release/**
          if-no-files-found: warn
          retention-days: 30
