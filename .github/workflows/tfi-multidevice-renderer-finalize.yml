name: TFI multi-device renderer finalizer

on:
  push:
    branches:
      - feat/tfi-multidevice-account-sync
    paths:
      - .github/workflows/tfi-multidevice-renderer-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/apply-tfi-multidevice-renderer.py
            .github/workflows/tfi-multidevice-finalize.yml
            .github/workflows/tfi-multidevice-renderer-finalize.yml
            desktop
            frontend/apps/web/src
            frontend/packages/shared/src
            frontend/packages/widgets/src
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply desktop account sync coordinator and CloudStorage bridge
        run: python3 .github/scripts/apply-tfi-multidevice-renderer.py
      - name: Verify generated diff
        run: git diff --check
      - name: Verify native account bridge remains green
        run: node --test desktop/electron/native-capability-handlers.test.cjs
      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci
      - name: Verify Electron renderer TypeScript and bundle
        working-directory: desktop
        run: npm run build:renderer
      - name: Commit verified renderer synchronization
        env:
          BRANCH: feat/tfi-multidevice-account-sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/scripts/apply-tfi-multidevice-renderer.py .github/workflows/tfi-multidevice-finalize.yml .github/workflows/tfi-multidevice-renderer-finalize.yml
          git add desktop/src/messaging-shell-v2.tsx
          git commit -m "feat(sync): synchronize Mini App bots and cloud state across devices"
          git push origin "HEAD:${BRANCH}"
