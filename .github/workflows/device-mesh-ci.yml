name: Device mesh integration

on:
  push:
    branches:
      - codex/tailscale-mobile-device-mesh
    paths:
      - .github/workflows/device-mesh-ci.yml
      - scripts/apply-device-mesh-integration.mjs
      - chatgpt-vps-control/lib/device-agent.js
      - chatgpt-vps-control/lib/device-gateway.js
      - chatgpt-vps-control/lib/device-mesh.js
      - chatgpt-vps-control/tests/device-mesh*.test.js
      - desktop/electron/remote-device-agent-supervisor.cjs
      - mobile/**
      - projects/grok-bot-fabushi-integration/**
  pull_request:
    paths:
      - .github/workflows/device-mesh-ci.yml
      - scripts/apply-device-mesh-integration.mjs
      - chatgpt-vps-control/lib/device-agent.js
      - chatgpt-vps-control/lib/device-gateway.js
      - chatgpt-vps-control/lib/device-mesh.js
      - chatgpt-vps-control/tests/device-mesh*.test.js
      - desktop/electron/remote-device-agent-supervisor.cjs
      - mobile/**

permissions:
  contents: write

concurrency:
  group: device-mesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-device-mesh:
    name: Signed device mesh protocol and gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chatgpt-vps-control/package-lock.json

      - name: Apply idempotent integration patch
        run: node scripts/apply-device-mesh-integration.mjs

      - name: Reject whitespace and patch damage
        run: git diff --check

      - name: Install remote MCP dependencies
        run: npm ci --prefix chatgpt-vps-control

      - name: Syntax-check mesh sources
        run: |
          node --check chatgpt-vps-control/lib/device-mesh.js
          node --check chatgpt-vps-control/lib/device-agent.js
          node --check chatgpt-vps-control/lib/device-gateway.js
          node --check scripts/apply-device-mesh-integration.mjs

      - name: Run complete remote MCP test suite
        run: npm test --prefix chatgpt-vps-control

      - name: Commit generated integration on task branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Device mesh integration is already committed."
            exit 0
          fi
          git config user.name "fabushi-ci[bot]"
          git config user.email "fabushi-ci[bot]@users.noreply.github.com"
          git add \
            chatgpt-vps-control/lib/device-agent.js \
            chatgpt-vps-control/lib/device-gateway.js \
            desktop/electron/remote-device-agent-supervisor.cjs
          git commit -m "feat(mesh): integrate signed device mesh into remote control"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Require committed integration in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

  android-device-mesh:
    name: Android signed device agent compile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'

      - name: Install Android 17 preview SDK
        shell: bash
        run: |
          set -euo pipefail
          available_packages="$(sdkmanager --list --channel=3)"
          platform_package="$(printf '%s\n' "$available_packages" | awk -F'|' '
            /platforms;android-(37([.]0)?|CinnamonBun)/ && !found {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1);
              print $1;
              found = 1;
            }
          ')"
          build_tools_package="$(printf '%s\n' "$available_packages" | awk -F'|' '
            /build-tools;37[.]/ && !found {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1);
              print $1;
              found = 1;
            }
          ')"
          test -n "$platform_package"
          test -n "$build_tools_package"
          sdkmanager --channel=3 "$platform_package" "$build_tools_package"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            installed_platform="$(find "$ANDROID_HOME/platforms" -maxdepth 1 -type d \( -name 'android-37*' -o -name 'android-CinnamonBun*' \) | head -n 1)"
            test -n "$installed_platform"
            ln -s "$installed_platform" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and lint Android mobile mesh
        working-directory: mobile/android
        run: ./gradlew --no-daemon --build-cache :app:compileDebugKotlin :app:lintDebug
