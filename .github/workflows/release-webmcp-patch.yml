name: Release WebMCP patch

on:
  push:
    branches:
      - codex/release-close-hydration-20260829
    paths:
      - .github/workflows/release-webmcp-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/release-close-hydration-20260829
          fetch-depth: 0
      - name: Apply explicit Mini App WebMCP injection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          host = Path('desktop/src/miniapp-webmcp-host.ts')
          source = host.read_text()
          needle = """function injectWebMcp(html: string, pluginId: string, nonce: string): string {\n  if (html.includes('fabushi.miniapp.webmcp.v1')) return html;\n  const bootstrap = webMcpBootstrap(pluginId, nonce);\n  return html.includes('</head>') ? html.replace('</head>', `${bootstrap}</head>`) : `${bootstrap}${html}`;\n}\n\n"""
          addition = needle + """export function prepareDesktopMiniAppWebMcpDocument(pluginId: string, html: string): string {\n  const normalizedPluginId = safePluginId(pluginId);\n  if (!normalizedPluginId) throw new Error(`Invalid MiniApp plugin id ${pluginId}`);\n  if (html.includes(protocol)) return html;\n  const nonce = crypto.randomUUID();\n  validBridgeNonces.set(nonce, normalizedPluginId);\n  return injectWebMcp(html, normalizedPluginId, nonce);\n}\n\n"""
          if needle not in source:
              raise SystemExit('WebMCP inject helper target not found')
          source = source.replace(needle, addition, 1)
          old = """    const document = await originalPluginUiDocument.call(this, pluginId);\n    const nonce = crypto.randomUUID();\n    validBridgeNonces.set(nonce, pluginId);\n    return { ...document, html: injectWebMcp(document.html, pluginId, nonce) };\n"""
          new = """    const document = await originalPluginUiDocument.call(this, pluginId);\n    return { ...document, html: prepareDesktopMiniAppWebMcpDocument(pluginId, document.html) };\n"""
          if old not in source:
              raise SystemExit('WebMCP prototype wrapper target not found')
          host.write_text(source.replace(old, new, 1))

          shell = Path('desktop/src/messaging-shell-v2.tsx')
          source = shell.read_text()
          anchor = "import { MiniAppCallDialog } from './miniapp-call-dialog';\n"
          if anchor not in source:
              raise SystemExit('Mini App import anchor not found')
          source = source.replace(anchor, anchor + "import { prepareDesktopMiniAppWebMcpDocument } from './miniapp-webmcp-host';\n", 1)
          call_old = '          html = document.html;'
          call_new = '          html = prepareDesktopMiniAppWebMcpDocument(activePeer.miniAppId, document.html);'
          if call_old not in source:
              raise SystemExit('Mini App call surface target not found')
          source = source.replace(call_old, call_new, 1)
          open_old = '      setMiniApp({ id, title, html: document.html });'
          open_new = '      setMiniApp({ id, title, html: prepareDesktopMiniAppWebMcpDocument(id, document.html) });'
          if open_old not in source:
              raise SystemExit('Mini App open target not found')
          shell.write_text(source.replace(open_old, open_new, 1))
          PY
          git diff --check
      - name: Commit WebMCP fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/src/miniapp-webmcp-host.ts desktop/src/messaging-shell-v2.tsx
          git commit -m 'fix(desktop): make Mini App WebMCP injection explicit'
          git push origin HEAD:codex/release-close-hydration-20260829
