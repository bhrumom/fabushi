name: MSR-204 gateway workspace integration

on:
  push:
    branches:
      - feat/msr-204-hermes-gateway-transcript

permissions:
  contents: write

jobs:
  verify-and-record:
    if: ${{ contains(github.event.head_commit.message, '[msr-204-gateway-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/msr-204-hermes-gateway-transcript
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt

      - name: Apply MSR-204 Hermes transcript repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one repair anchor, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'desktop/src/mahayana-assistant-turn.ts',
              """    case 'chat.message':
              if (event.role !== 'assistant') return turn;
              return {
                ...turn,
                updatedAtMs: now,
                parts: reconcileLegacyFinalText(turn, event.text),
              };""",
              """    case 'chat.message':
              if (event.role !== 'assistant') return turn;
              return {
                ...turn,
                updatedAtMs: now,
                status: 'completed',
                parts: reconcileLegacyFinalText(turn, event.text),
              };""",
          )

          replace_once(
              'desktop/src/messaging-shell-v2.tsx',
              "import { ElectronMahayanaHostTransport, isElectronMahayanaHostAvailable, MAHAYANA_ACCOUNT_SESSION_RESET_EVENT, readCachedConversationMessages } from '../../frontend/apps/web/src/lib/mahayana-host/electron-transport';",
              """import {
            ElectronMahayanaHostTransport,
            isElectronMahayanaHostAvailable,
            MAHAYANA_ACCOUNT_SESSION_RESET_EVENT,
            MAHAYANA_COMMAND_EVENT_NAME,
            readCachedConversationMessages,
            type MahayanaCommandBridgeDetail,
          } from '../../frontend/apps/web/src/lib/mahayana-host/electron-transport';""",
          )

          replace_once(
              'desktop/src/messaging-shell-v2.tsx',
              """    const unsubscribe = transport.subscribe((event) => {
                if (!closed) handleRuntimeEvent(event);
              });""",
              """    const unsubscribe = transport.subscribe((event) => {
                if (!closed) handleRuntimeEvent(event);
              });
              const onCommandBridge = (event: Event) => {
                const detail = (event as CustomEvent<MahayanaCommandBridgeDetail>).detail;
                if (!detail || detail.command.type !== 'chat.send') return;
                const conversationKey = detail.context?.conversationKey;
                if (!conversationKey || activePeerKeyRef.current !== conversationKey) return;

                if (detail.phase === 'dispatch') {
                  agentRequestPendingRef.current = true;
                  setPendingSend(true);
                  return;
                }
                if (detail.phase === 'accepted') {
                  const operationId = detail.accepted.operationId;
                  if (!operationId || !claimAgentOperation(operationId)) return;
                  appendAssistantTurnEvent({
                    type: 'operation.started',
                    timestamp: new Date().toISOString(),
                    operationId,
                    label: '正在思考',
                    interruptible: true,
                  });
                  return;
                }
                agentRequestPendingRef.current = false;
                setPendingSend(false);
                setError(detail.error);
              };
              window.addEventListener(MAHAYANA_COMMAND_EVENT_NAME, onCommandBridge);""",
          )

          replace_once(
              'desktop/src/messaging-shell-v2.tsx',
              """      closed = true;
                unsubscribe();
                const remoteComputer = remoteComputerControllerRef.current;""",
              """      closed = true;
                unsubscribe();
                window.removeEventListener(MAHAYANA_COMMAND_EVENT_NAME, onCommandBridge);
                const remoteComputer = remoteComputerControllerRef.current;""",
          )
          PY

      - name: Format canonical Rust workspace
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo fmt --all

      - name: Let Cargo generate the canonical lock update
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo check -p mahayana-gateway -p mahayana-gateway-protocol -p mahayana-cli --bin mahayana-gateway

      - name: Test gateway projection, replay and protocol
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo test -p mahayana-gateway -p mahayana-gateway-protocol --locked

      - name: Recheck gateway CLI under the generated lock
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo check -p mahayana-cli --bin mahayana-gateway --locked

      - name: Commit verified repair and restore workflow
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout HEAD^ -- .github/workflows/msr-204-gateway-build.yml
          git add .github/workflows/msr-204-gateway-build.yml \
            desktop/src/mahayana-assistant-turn.ts \
            desktop/src/messaging-shell-v2.tsx \
            third_party/mahayana/mahayana-rs/Cargo.lock \
            third_party/mahayana/mahayana-rs/mahayana-gateway \
            third_party/mahayana/mahayana-rs/mahayana-gateway-protocol \
            third_party/mahayana/mahayana-rs/mahayana-cli/src/bin/mahayana-gateway.rs
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
            exit 0
          fi
          git commit -m "fix(msr): complete Hermes assistant turns and Bot routing"
          git push origin HEAD:feat/msr-204-hermes-gateway-transcript
