name: Device direct gateway

on:
  push:
    branches:
      - codex/tailscale-mobile-device-mesh
    paths:
      - .github/workflows/device-direct-gateway-ci.yml
      - scripts/apply-device-direct-gateway.mjs
      - chatgpt-vps-control/lib/device-direct-path.js
      - chatgpt-vps-control/lib/device-gateway.js
      - chatgpt-vps-control/tests/device-direct-path.test.js
  pull_request:
    paths:
      - .github/workflows/device-direct-gateway-ci.yml
      - scripts/apply-device-direct-gateway.mjs
      - chatgpt-vps-control/lib/device-direct-path.js
      - chatgpt-vps-control/lib/device-gateway.js
      - chatgpt-vps-control/tests/device-direct-path.test.js

permissions:
  contents: write

concurrency:
  group: device-direct-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chatgpt-vps-control/package-lock.json
      - name: Apply direct gateway integration
        run: |
          node scripts/apply-device-direct-gateway.mjs
          git diff --check
      - name: Install dependencies
        run: npm ci --prefix chatgpt-vps-control
      - name: Syntax check
        run: |
          node --check scripts/apply-device-direct-gateway.mjs
          node --check chatgpt-vps-control/lib/device-direct-path.js
          node --check chatgpt-vps-control/lib/device-gateway.js
      - name: Direct path tests
        run: node --test chatgpt-vps-control/tests/device-direct-path.test.js
      - name: Complete remote MCP regression
        run: npm test --prefix chatgpt-vps-control

  persist:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified integration
        run: |
          node scripts/apply-device-direct-gateway.mjs
          git diff --check
      - name: Commit generated gateway
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "fabushi-ci[bot]"
          git config user.email "fabushi-ci[bot]@users.noreply.github.com"
          git add chatgpt-vps-control/lib/device-gateway.js
          git commit -m "feat(mesh): enable direct path rendezvous"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  generated-clean:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node scripts/apply-device-direct-gateway.mjs
          git diff --check
          git diff --exit-code
