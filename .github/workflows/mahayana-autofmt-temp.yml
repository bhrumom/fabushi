name: Mahayana temporary rustfmt

on:
  push:
    branches:
      - feat/mahayana-fusion-mainline

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Mahayana workspace
        run: cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/mahayana/mahayana-rs
          git commit -m "style(mahayana): apply canonical rustfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
