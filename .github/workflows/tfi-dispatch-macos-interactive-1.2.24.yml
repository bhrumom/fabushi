name: TFI dispatch macOS interactive 1.2.24

on:
  push:
    branches:
      - ops/tfi-dispatch-macos-interactive-1.2.24
    paths:
      - '.github/workflows/tfi-dispatch-macos-interactive-1.2.24.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch canonical macOS interactive workflow
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/actions/workflows/macos-interactive-app-e2e.yml/dispatches \
            -f ref='main'
