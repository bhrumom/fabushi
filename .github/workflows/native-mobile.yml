name: Native mobile build entry (no automatic tests)

on:
  workflow_dispatch:
    inputs:
      note:
        description: Manual build/debug invocation only; no product tests run here
        required: false
        type: string

permissions:
  contents: read

jobs:
  policy:
    name: Native mobile automatic tests disabled
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - shell: bash
        run: |
          {
            echo '## FCM-024 native mobile policy'
            echo
            echo 'Automatic native-mobile quality/unit/simulator/emulator/E2E testing is disabled.'
            echo 'iOS/Android test builds are produced by the store-delivery workflows without behavioral tests.'
            echo 'Formal behavioral validation is performed only through manually started App-owned MCP runners controlled by the Fabushi official MCP.'
          } >> "$GITHUB_STEP_SUMMARY"
