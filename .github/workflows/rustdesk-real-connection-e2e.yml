name: RustDesk real managed connection E2E

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  RUSTDESK_SERVER_TEST_COMMIT: "a7736be5e40f85bfc141120dce587e836e5d4b80"

on:
  pull_request:
    paths:
      - '.github/scripts/rustdesk-real-connection-e2e.py'
      - '.github/scripts/rustdesk-managed-infrastructure.py'
      - '.github/workflows/rustdesk-real-connection-e2e.yml'
      - 'integrations/rustdesk-sidecar/**'
      - 'desktop/electron/rustdesk-*.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustdesk-real-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  real-managed-relay:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/rustdesk-fusion-route-negotiation
          fetch-depth: 0
      - name: Verify pinned AGPL test-server provenance
        run: |
          grep -Fx 'repository=https://github.com/rustdesk/rustdesk-server.git' integrations/rustdesk-sidecar/RUSTDESK_SERVER_TEST_UPSTREAM.lock
          grep -Fx "commit=${RUSTDESK_SERVER_TEST_COMMIT}" integrations/rustdesk-sidecar/RUSTDESK_SERVER_TEST_UPSTREAM.lock
          grep -Fx 'license=AGPL-3.0-only' integrations/rustdesk-sidecar/RUSTDESK_SERVER_TEST_UPSTREAM.lock
          grep -Fx 'purpose=ephemeral-github-actions-rendezvous-relay-e2e' integrations/rustdesk-sidecar/RUSTDESK_SERVER_TEST_UPSTREAM.lock
      - uses: actions/checkout@v5
        with:
          repository: rustdesk/rustdesk-server
          ref: ${{ env.RUSTDESK_SERVER_TEST_COMMIT }}
          path: rustdesk-server-test
          submodules: recursive
          fetch-depth: 1
      - name: Verify RustDesk Server license at the pinned source
        run: |
          grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' rustdesk-server-test/LICENSE
          test "$(git -C rustdesk-server-test rev-parse HEAD)" = "$RUSTDESK_SERVER_TEST_COMMIT"
      - name: Install Linux native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc git g++ libasound2-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev \
            libpulse-dev libva-dev libvdpau-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev \
            nasm wget xvfb x11-utils
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned ephemeral RustDesk rendezvous and relay
        working-directory: rustdesk-server-test
        run: cargo build --locked --release --bin hbbs --bin hbbr
      - name: Materialize fail-closed Fabushi managed-network overlay
        run: python .github/scripts/rustdesk-managed-infrastructure.py
      - name: Prepare pinned RustDesk client corresponding source
        run: bash integrations/rustdesk-sidecar/prepare-source.sh "$RUNNER_TEMP/rustdesk-sidecar"
      - name: Export Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
      - name: Install pinned RustDesk client dependencies
        working-directory: ${{ runner.temp }}/rustdesk-sidecar
        run: $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"
      - name: Build real Fabushi RustDesk host/controller binaries
        working-directory: ${{ runner.temp }}/rustdesk-sidecar
        run: |
          cargo build --locked --release --bin fabushi-sidecar
          cargo build --locked --release --bin fabushi-host-bootstrap
          cargo build --locked --release --bin fabushi-host-daemon
      - name: Start isolated X11 desktop for real frame capture
        run: |
          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xvfb.pid"
          for i in $(seq 1 40); do
            DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/xvfb.log"
          exit 1
      - name: Run real host-controller session through ephemeral managed relay
        env:
          DISPLAY: ':99'
          HBBS_BIN: ${{ github.workspace }}/rustdesk-server-test/target/release/hbbs
          HBBR_BIN: ${{ github.workspace }}/rustdesk-server-test/target/release/hbbr
          FABUSHI_HOST_DAEMON_BIN: ${{ runner.temp }}/rustdesk-sidecar/target/release/fabushi-host-daemon
          FABUSHI_HOST_BOOTSTRAP_BIN: ${{ runner.temp }}/rustdesk-sidecar/target/release/fabushi-host-bootstrap
          FABUSHI_SIDECAR_BIN: ${{ runner.temp }}/rustdesk-sidecar/target/release/fabushi-sidecar
        run: |
          python .github/scripts/rustdesk-real-connection-e2e.py | tee "$RUNNER_TEMP/rustdesk-real-e2e.jsonl"
          grep -F '"result": "pass"' "$RUNNER_TEMP/rustdesk-real-e2e.jsonl"
          grep -F '"relay": true' "$RUNNER_TEMP/rustdesk-real-e2e.jsonl"
          grep -F '"displayFrame": true' "$RUNNER_TEMP/rustdesk-real-e2e.jsonl"
          grep -F '"inputCommands": true' "$RUNNER_TEMP/rustdesk-real-e2e.jsonl"
      - name: Verify no Fabushi account credential crossed AGPL process boundary
        run: |
          ! grep -R -E 'FABUSHI_ACCOUNT_TOKEN|Authorization: Bearer|accountToken|deviceToken' "$RUNNER_TEMP/fabushi-rustdesk-real-e2e" || false
      - name: Upload real E2E evidence and exact test-server source lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-real-managed-e2e-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/rustdesk-real-e2e.jsonl
            ${{ runner.temp }}/fabushi-rustdesk-real-e2e/*.log
            integrations/rustdesk-sidecar/UPSTREAM.lock
            integrations/rustdesk-sidecar/RUSTDESK_SERVER_TEST_UPSTREAM.lock
            rustdesk-server-test/LICENSE
            .github/scripts/rustdesk-real-connection-e2e.py
