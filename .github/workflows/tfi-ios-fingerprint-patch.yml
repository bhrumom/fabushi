name: TFI iOS fingerprint patch executor

on:
  push:
    branches:
      - fix/tfi-ios-fingerprint-compile-20260905

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: fix/tfi-ios-fingerprint-compile-20260905

      - name: Apply atomic fingerprint compile fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path("mobile/ios/Fabushi/ContentView.swift")
          source = source_path.read_text()
          function_start = source.index("    private var appAgentSurfaceFingerprint: String {")
          function_end = source.index("\n    @MainActor", function_start)
          body = source[function_start:function_end]
          literal_start = body.index("        return [")
          literal_end_marker = '        ].joined(separator: "|")'
          literal_end = body.index(literal_end_marker, literal_start) + len(literal_end_marker)
          old_block = body[literal_start:literal_end]

          expected_values = '''
          destinationRevision
          String(isSearching)
          homeQuery
          String(profileMenuPresented)
          String(composeMenuPresented)
          composeKind?.rawValue ?? ""
          composeName
          composeDescription
          composeParticipantIds.sorted().joined(separator: ",")
          activeSection?.rawValue ?? ""
          String(contactGroupsPresented)
          String(folderEditorPresented)
          folderTitle
          folderConversationIds.sorted().joined(separator: ",")
          String(folderIncludeGroups)
          String(folderIncludeChannels)
          String(agentChatPresented)
          model.chatDraft
          String(model.chatBusy)
          agentRevision
          selectedConversation?.id ?? ""
          messageDraft
          replyTarget?.id ?? ""
          editingMessage?.id ?? ""
          forwardMessage?.id ?? ""
          mediaViewerMessage?.id ?? ""
          String(conversationInfoPresented)
          String(chatSearchPresented)
          chatSearchQuery
          String(attachmentPickerPresented)
          String(locationSharePresented)
          String(contactSharePresented)
          String(pollComposerPresented)
          pollQuestion
          pollOption1
          pollOption2
          pollOption3
          String(voiceRecorder.isRecording)
          model.query
          model.message
          String(model.loading)
          model.installingPluginId ?? ""
          model.permissionRequest?.pluginId ?? ""
          openedMiniApp?.pluginId ?? ""
          pluginRevision
          conversationRevision
          contactRevision
          folderRevision
          selectedMessagesRevision
          String(messaging.loading)
          messaging.errorMessage ?? ""
          '''.strip().splitlines()
          expected_values = [value.strip() for value in expected_values]
          actual_values = [line.strip().removesuffix(",") for line in old_block.splitlines()[1:-1] if line.strip()]
          if actual_values != expected_values:
              raise SystemExit(f"fingerprint contract changed before patch: expected 51 original values in order, got {len(actual_values)}")

          replacement = '''        let fingerprintChunk1: [String] = [
              destinationRevision,
              String(isSearching),
              homeQuery,
              String(profileMenuPresented),
              String(composeMenuPresented),
              composeKind?.rawValue ?? "",
              composeName,
              composeDescription,
              composeParticipantIds.sorted().joined(separator: ","),
              activeSection?.rawValue ?? "",
              String(contactGroupsPresented),
              String(folderEditorPresented),
              folderTitle,
              folderConversationIds.sorted().joined(separator: ","),
              String(folderIncludeGroups),
              String(folderIncludeChannels),
              String(agentChatPresented),
          ]
          let fingerprintChunk2: [String] = [
              model.chatDraft,
              String(model.chatBusy),
              agentRevision,
              selectedConversation?.id ?? "",
              messageDraft,
              replyTarget?.id ?? "",
              editingMessage?.id ?? "",
              forwardMessage?.id ?? "",
              mediaViewerMessage?.id ?? "",
              String(conversationInfoPresented),
              String(chatSearchPresented),
              chatSearchQuery,
              String(attachmentPickerPresented),
              String(locationSharePresented),
              String(contactSharePresented),
              String(pollComposerPresented),
              pollQuestion,
          ]
          let fingerprintChunk3: [String] = [
              pollOption1,
              pollOption2,
              pollOption3,
              String(voiceRecorder.isRecording),
              model.query,
              model.message,
              String(model.loading),
              model.installingPluginId ?? "",
              model.permissionRequest?.pluginId ?? "",
              openedMiniApp?.pluginId ?? "",
              pluginRevision,
              conversationRevision,
              contactRevision,
              folderRevision,
              selectedMessagesRevision,
              String(messaging.loading),
              messaging.errorMessage ?? "",
          ]
          var fingerprintParts: [String] = []
          fingerprintParts.reserveCapacity(fingerprintChunk1.count + fingerprintChunk2.count + fingerprintChunk3.count)
          fingerprintParts.append(contentsOf: fingerprintChunk1)
          fingerprintParts.append(contentsOf: fingerprintChunk2)
          fingerprintParts.append(contentsOf: fingerprintChunk3)
          return fingerprintParts.joined(separator: "|")'''

          patched_body = body[:literal_start] + replacement + body[literal_end:]
          source_path.write_text(source[:function_start] + patched_body + source[function_end:])
          PY

      - name: Write narrow fingerprint contract check
        shell: bash
        run: |
          cat > chatgpt-vps-control/tests/ios-contentview-fingerprint-compile-contract.test.js <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const root = new URL("../../", import.meta.url);
          const read = (path) => readFile(new URL(path, root), "utf8");

          test("iOS app-agent fingerprint stays explicitly typed and order-stable", async () => {
            const source = await read("mobile/ios/Fabushi/ContentView.swift");
            const start = source.indexOf("    private var appAgentSurfaceFingerprint: String {");
            const end = source.indexOf("\n    @MainActor", start);
            assert.ok(start >= 0 && end > start, "missing appAgentSurfaceFingerprint body");
            const fingerprint = source.slice(start, end);

            const expectedValues = [
              'destinationRevision',
              'String(isSearching)',
              'homeQuery',
              'String(profileMenuPresented)',
              'String(composeMenuPresented)',
              'composeKind?.rawValue ?? ""',
              'composeName',
              'composeDescription',
              'composeParticipantIds.sorted().joined(separator: ",")',
              'activeSection?.rawValue ?? ""',
              'String(contactGroupsPresented)',
              'String(folderEditorPresented)',
              'folderTitle',
              'folderConversationIds.sorted().joined(separator: ",")',
              'String(folderIncludeGroups)',
              'String(folderIncludeChannels)',
              'String(agentChatPresented)',
              'model.chatDraft',
              'String(model.chatBusy)',
              'agentRevision',
              'selectedConversation?.id ?? ""',
              'messageDraft',
              'replyTarget?.id ?? ""',
              'editingMessage?.id ?? ""',
              'forwardMessage?.id ?? ""',
              'mediaViewerMessage?.id ?? ""',
              'String(conversationInfoPresented)',
              'String(chatSearchPresented)',
              'chatSearchQuery',
              'String(attachmentPickerPresented)',
              'String(locationSharePresented)',
              'String(contactSharePresented)',
              'String(pollComposerPresented)',
              'pollQuestion',
              'pollOption1',
              'pollOption2',
              'pollOption3',
              'String(voiceRecorder.isRecording)',
              'model.query',
              'model.message',
              'String(model.loading)',
              'model.installingPluginId ?? ""',
              'model.permissionRequest?.pluginId ?? ""',
              'openedMiniApp?.pluginId ?? ""',
              'pluginRevision',
              'conversationRevision',
              'contactRevision',
              'folderRevision',
              'selectedMessagesRevision',
              'String(messaging.loading)',
              'messaging.errorMessage ?? ""',
            ];

            const chunks = [...fingerprint.matchAll(/let fingerprintChunk\d+: \[String\] = \[\n([\s\S]*?)\n\s*\]/gu)];
            assert.equal(chunks.length, 3, "fingerprint must stay split into three explicitly typed String chunks");
            const actualValues = chunks.flatMap((match) => match[1]
              .split("\n")
              .map((line) => line.trim())
              .filter(Boolean)
              .map((line) => line.endsWith(",") ? line.slice(0, -1) : line));
            assert.equal(actualValues.length, 51, "fingerprint must contain exactly 51 values");
            assert.deepEqual(actualValues, expectedValues, "all 51 fingerprint values and their order must remain identical");
            assert.match(fingerprint, /var fingerprintParts: \[String\] = \[\]/u);
            assert.match(fingerprint, /fingerprintParts\.append\(contentsOf: fingerprintChunk1\)[\s\S]*fingerprintParts\.append\(contentsOf: fingerprintChunk2\)[\s\S]*fingerprintParts\.append\(contentsOf: fingerprintChunk3\)/u);
            assert.ok(fingerprint.includes('return fingerprintParts.joined(separator: "|")'));
            assert.doesNotMatch(fingerprint, /return\s+\[\s*destinationRevision/u, "do not restore the monolithic literal");
          });
          EOF

      - name: Run narrow fingerprint contract check
        run: node --test chatgpt-vps-control/tests/ios-contentview-fingerprint-compile-contract.test.js

      - name: Commit atomic fix
        shell: bash
        run: |
          rm .github/workflows/tfi-ios-fingerprint-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/ios/Fabushi/ContentView.swift chatgpt-vps-control/tests/ios-contentview-fingerprint-compile-contract.test.js .github/workflows/tfi-ios-fingerprint-patch.yml
          git commit -m "fix(tfi): split iOS fingerprint type inference"
          git push origin HEAD:fix/tfi-ios-fingerprint-compile-20260905
