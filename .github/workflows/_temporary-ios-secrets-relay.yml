name: TEMP iOS Actions secrets relay
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ios-secrets-relay
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Set the six iOS secrets on target repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.IOS_MIGRATION_TARGET_ACTIONS_TOKEN }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          names=(
            APP_STORE_CONNECT_API_KEY_ID
            APP_STORE_CONNECT_API_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_BASE64
            IOS_CERTIFICATE_P12_BASE64
            IOS_CERTIFICATE_PASSWORD
            IOS_PROVISIONING_PROFILE_BASE64
          )
          for name in "${names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Source Actions secret is unavailable: ${name}"
              exit 1
            fi
            if ! printf '%s' "${!name}" | gh secret set "$name" --repo fabushi-ios/fabushi-ios --app actions; then
              echo "::error::Failed to set target Actions secret: ${name}"
              exit 1
            fi
          done
          echo "Migrated all six required iOS Actions secrets by name only."
