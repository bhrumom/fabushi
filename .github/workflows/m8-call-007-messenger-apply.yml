name: M8-CALL-007 Messenger integration

on:
  push:
    branches:
      - feat/tfi-miniapp-call-program-teleprompter
    paths:
      - .github/workflows/m8-call-007-messenger-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed Messenger edit
        run: node .github/scripts/apply-m8-call-007-messenger.mjs
      - name: Verify marketplace contracts and diff hygiene
        run: |
          node --check ai-backend/src/miniapp_call_program.js
          node --test ai-backend/test/miniapp_call_program.test.js
          git diff --check
      - name: Commit product integration and remove one-shot helpers
        run: |
          rm -f .github/scripts/apply-m8-call-007-messenger.mjs
          rm -f .github/workflows/m8-call-007-messenger-apply.yml
          rm -f .github/workflows/m8-call-007-domain-apply.yml
          rm -f .github/patches/m8-call-007-domain.patch
          git config user.name "fabushi-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(tfi): wire MiniApp-owned Bot calls into Messenger [M8-CALL-007]"
          git push origin HEAD:${GITHUB_REF_NAME}
