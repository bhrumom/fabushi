name: Mahayana Recovery Conformance

on:
  pull_request:
    paths:
      - third_party/mahayana/mahayana-rs/mahayana-kernel/**
      - third_party/mahayana/mahayana-rs/mahayana-orchestrator/**
      - third_party/mahayana/mahayana-rs/mahayana-native-engine/**
      - .github/workflows/mahayana-recovery-conformance.yml
  push:
    branches:
      - feat/msr-sovereign-runtime-final
      - main
    paths:
      - .github/workflows/mahayana-recovery-conformance.yml
      - third_party/mahayana/mahayana-rs/mahayana-orchestrator/**
      - third_party/mahayana/mahayana-rs/mahayana-native-engine/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  land-feature-recovery:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/msr-sovereign-runtime-final'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/msr-sovereign-runtime-final
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Install Linux native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libxfixes-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgbm-dev
      - name: Land provider-neutral recovery and supervision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          orchestrator = Path('third_party/mahayana/mahayana-rs/mahayana-orchestrator/src/lib.rs')
          text = orchestrator.read_text()
          if 'pub fn requeue(&mut self, id: &str)' not in text:
              marker = '    pub fn complete(&mut self, id: &str) -> Result<(), OrchestratorError> {\n'
              addition = '''    pub fn requeue(&mut self, id: &str) -> Result<(), OrchestratorError> {
        let entry = self
            .entries
            .iter_mut()
            .find(|entry| entry.id == id)
            .ok_or_else(|| OrchestratorError::PromptNotFound(id.to_string()))?;
        if entry.state != PromptState::Running {
            return Err(OrchestratorError::InvalidInput(format!(
                "prompt {id} cannot be requeued from {:?}",
                entry.state
            )));
        }
        entry.state = PromptState::Pending;
        Ok(())
    }

    pub fn reclaim(&mut self, id: &str) -> Result<PromptEntry, OrchestratorError> {
        let entry = self
            .entries
            .iter_mut()
            .find(|entry| entry.id == id)
            .ok_or_else(|| OrchestratorError::PromptNotFound(id.to_string()))?;
        if entry.state != PromptState::Pending {
            return Err(OrchestratorError::InvalidInput(format!(
                "prompt {id} cannot be reclaimed from {:?}",
                entry.state
            )));
        }
        entry.state = PromptState::Running;
        Ok(entry.clone())
    }

