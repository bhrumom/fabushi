  verify-recovery-conformance:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Install Linux native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libxfixes-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgbm-dev
      - name: Verify recovery, snapshot, and supervision contracts
        shell: bash
        run: |
          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all -- --check
          cargo test --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml \
            -p mahayana-orchestrator -p mahayana-kernel -p mahayana-native-engine
          cargo clippy --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml \
            -p mahayana-orchestrator -p mahayana-native-engine --all-targets -- -D warnings
