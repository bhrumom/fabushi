name: iOS interactive app device E2E (disabled; MCP-only formal policy)

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: Manual legacy investigation only; this workflow does not run product tests under FCM-023
        required: false
        type: string

permissions:
  contents: read

jobs:
  disabled:
    name: Legacy iOS E2E disabled
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - shell: bash
        run: |
          echo 'FCM-023 disables legacy iOS E2E and all automatic triggers.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use an App-owned Action runner plus Fabushi official MCP for formal behavioral validation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Historical workflow: .github/workflows-disabled/ios-interactive-app-e2e.yml' >> "$GITHUB_STEP_SUMMARY"