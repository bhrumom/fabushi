name: MSR-204 peer repair

on:
  push:
    branches:
      - feat/msr-204-hermes-gateway-transcript

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical MSR-204 branch
        uses: actions/checkout@v5
        with:
          ref: feat/msr-204-hermes-gateway-transcript
          fetch-depth: 0

      - name: Set up stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Repair Rust-owned clarify lock semantics and add regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('third_party/mahayana/mahayana-rs/mahayana-gateway-peer/src/lib.rs')
          text = path.read_text()
          old = (
              '    let mut answers = request.locked_answers.clone();\n'
              '    if let Some(client_answers) = object.get("answers").and_then(Value::as_object) {\n'
              '        for (question_id, answer) in client_answers {\n'
              '            if let Some(answer) = answer.as_str() {\n'
              '                answers.insert(question_id.clone(), answer.to_string());\n'
              '            }\n'
              '        }\n'
              '    }\n'
          )
          new = (
              '    let mut answers = BTreeMap::new();\n'
              '    if let Some(client_answers) = object.get("answers").and_then(Value::as_object) {\n'
              '        for (question_id, answer) in client_answers {\n'
              '            if let Some(answer) = answer.as_str() {\n'
              '                answers.insert(question_id.clone(), answer.to_string());\n'
              '            }\n'
              '        }\n'
              '    }\n'
              '    // Rust owns locked clarify answers across reconnects; stale client\n'
              '    // responses may fill unlocked answers but cannot overwrite sealed ones.\n'
              '    answers.extend(request.locked_answers.clone());\n'
          )
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          marker = '    #[test]\n    fn exported_state_round_trips_for_future_canonical_restart_store() {\n'
          test = (
              '    #[test]\n'
              '    fn locked_clarify_answer_wins_over_stale_client_response() {\n'
              '        let mut registry = ServerRequestRegistry::default();\n'
              '        registry.issue_with_id(\n'
              '            "srq-clarify0003".to_string(),\n'
              '            "session-3".to_string(),\n'
              '            "clarify".to_string(),\n'
              '            json!({}),\n'
              '            vec!["q1".to_string(), "q2".to_string()],\n'
              '            30,\n'
              '        ).unwrap();\n'
              '        registry.lock_answer("srq-clarify0003", "q1", "server-locked").unwrap();\n'
              '        let resolved = registry.resolve_response(&json!({\n'
              '            "jsonrpc": "2.0",\n'
              '            "id": "srq-clarify0003",\n'
              '            "result": {"answers": {"q1": "stale-client", "q2": "client-open"}}\n'
              '        })).unwrap();\n'
              '        assert_eq!(\n'
              '            resolved.response,\n'
              '            ServerRequestResponse::Result(json!({\n'
              '                "answers": {"q1": "server-locked", "q2": "client-open"}\n'
              '            }))\n'
              '        );\n'
              '    }\n\n'
          )
          assert marker in text
          text = text.replace(marker, test + marker, 1)
          path.write_text(text)
          PY

      - name: Format canonical Mahayana workspace
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo fmt --all

      - name: Verify peer regression test
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo test -p mahayana-gateway-peer --locked

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/msr-204-peer-repair.yml
          git add third_party/mahayana/mahayana-rs/mahayana-cli/src/bin/mahayana-gateway.rs
          git add third_party/mahayana/mahayana-rs/mahayana-gateway-peer/src/lib.rs
          git diff --cached --check
          git commit -m 'fix(msr): preserve locked clarify answers'
          git push origin HEAD:feat/msr-204-hermes-gateway-transcript
