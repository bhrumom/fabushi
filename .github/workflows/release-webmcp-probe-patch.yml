name: Release WebMCP probe patch

on:
  push:
    branches:
      - codex/release-close-hydration-20260829
    paths:
      - .github/workflows/release-webmcp-probe-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/release-close-hydration-20260829
          fetch-depth: 0
      - name: Make WebMCP readiness polling non-throwing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('desktop/e2e/miniapp-bot-parity.spec.ts')
          source = path.read_text()
          old = "    if (!registry?.list) throw new Error('Fabushi WebMCP registry is unavailable');"
          new = "    if (!registry?.list) return [];"
          if old not in source:
              raise SystemExit('WebMCP readiness probe target not found')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit readiness probe fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/e2e/miniapp-bot-parity.spec.ts
          git commit -m 'test(desktop): wait for Mini App WebMCP readiness'
          git push origin HEAD:codex/release-close-hydration-20260829
