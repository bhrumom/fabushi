name: RustDesk RDF-004 permission enforcement

on:
  push:
    branches:
      - codex/rustdesk-fusion-route-negotiation
    paths:
      - '.github/workflows/rustdesk-rdf004-permission-enforcement.yml'

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rustdesk-fusion-route-negotiation
          fetch-depth: 2

      - name: Execute persisted RDF-004 implementation recipe
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = '.github/workflows/rustdesk-rdf004-permission-enforcement.yml'
          previous = subprocess.check_output(['git', 'show', f'HEAD^:{workflow}'], text=True)
          marker = '      - name: Enforce session grants in API and desktop control path\n        shell: python\n        run: |\n'
          start = previous.index(marker) + len(marker)
          end = previous.index('\n      - name: Format Rust', start)
          block = previous[start:end]
          lines = block.splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, workflow, 'exec'), {'__name__': '__main__'})

      - name: Format Rust
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo fmt --all

      - name: Verify permission and RustDesk contracts
        run: |
          node --test \
            chatgpt-vps-control/tests/rustdesk-session-permission-enforcement.test.js \
            chatgpt-vps-control/tests/rustdesk-session-grants-audit-contract.test.js \
            chatgpt-vps-control/tests/rustdesk-route-negotiation-contract.test.js

      - name: Typecheck shared web remote-control package
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @fabushi/web typecheck

      - name: Test platform worker
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo test -p mahayana-platform-worker

      - name: Record RDF-004 permission slice and restore canonical workflow
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          p = Path('projects/rustdesk-fabushi-fusion/management/01-WBS原子任务.md')
          text = p.read_text()
          text = text.replace(
              '| RDF-004 | Desktop/display/input provider parity | RDF-003 | cross-platform conformance | planned | capability inventory |',
              '| RDF-004 | Desktop/display/input provider parity | RDF-003 | cross-platform conformance | in-progress | session grants now reach clients and gate display/input host actions; provider runtime parity remains |',
          )
          p.write_text(text)
          workflow = '.github/workflows/rustdesk-rdf004-permission-enforcement.yml'
          Path(workflow).write_text(subprocess.check_output(['git', 'show', f'HEAD^:{workflow}'], text=True))

      - name: Commit verified permission enforcement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/rustdesk-rdf004-permission-enforcement.yml \
            third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/remote_computer.rs \
            frontend/apps/web/src/lib/mahayana-host/contracts.ts \
            frontend/apps/web/src/lib/remote-computer/desktop-peer.ts \
            frontend/apps/web/src/lib/remote-computer/remote-api.ts \
            chatgpt-vps-control/tests/rustdesk-session-permission-enforcement.test.js \
            projects/rustdesk-fabushi-fusion/management/01-WBS原子任务.md
          git commit -m 'feat(remote): enforce session grants for display and input'
          git push origin HEAD:codex/rustdesk-fusion-route-negotiation
