name: Android interactive app device E2E (disabled; MCP-only formal policy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Legacy Android E2E disabled
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - shell: bash
        run: |
          echo 'FCM-023 disables legacy Android E2E/self-drive testing.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Formal behavioral validation must use a manually started App-owned runner and Fabushi official MCP.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Historical workflow: .github/workflows-disabled/android-interactive-app-e2e.yml' >> "$GITHUB_STEP_SUMMARY"