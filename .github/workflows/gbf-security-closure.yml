name: GBF security closure

on:
  pull_request:
    paths:
      - '.github/scripts/assert-gbf-security-closure.py'
      - '.github/workflows/gbf-security-closure.yml'
      - 'projects/grok-bot-fabushi-integration/**'
      - 'desktop/electron/**'
      - 'chatgpt-vps-control/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-app-host/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-host-protocol/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-feature-host/**'
  push:
    branches: [main]
    paths:
      - '.github/scripts/assert-gbf-security-closure.py'
      - '.github/workflows/gbf-security-closure.yml'
      - 'projects/grok-bot-fabushi-integration/**'
      - 'desktop/electron/**'
      - 'chatgpt-vps-control/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-app-host/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-host-protocol/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-feature-host/**'
  merge_group:
  workflow_dispatch:

concurrency:
  group: gbf-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Detect affected GBF security scope
    runs-on: ubuntu-latest
    outputs:
      global: ${{ steps.filter.outputs.global }}
      gbf: ${{ steps.filter.outputs.gbf }}
    steps:
      - name: Checkout full history for changed-path detection
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed GBF scope
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          token: ''
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          predicate-quantifier: some-with-excludes
          filters: |
            global:
              - '.github/workflows/gbf-security-closure.yml'
              - '.github/scripts/assert-gbf-security-closure.py'
            gbf:
              - 'projects/grok-bot-fabushi-integration/**'
              - 'desktop/electron/**'
              - 'chatgpt-vps-control/**'
              - '!chatgpt-vps-control/chrome-platform/**'
              - '!chatgpt-vps-control/tests/browser-extension.test.js'
              - '!chatgpt-vps-control/tests/chrome-platform.test.js'
              - '!chatgpt-vps-control/tests/extension-entry.test.js'
              - 'third_party/mahayana/mahayana-rs/mahayana-app-host/**'
              - 'third_party/mahayana/mahayana-rs/mahayana-host-protocol/**'
              - 'third_party/mahayana/mahayana-rs/mahayana-feature-host/**'
      - name: Summarize detected GBF scope
        shell: bash
        env:
          GLOBAL_SCOPE: ${{ steps.filter.outputs.global }}
          GBF_SCOPE: ${{ steps.filter.outputs.gbf }}
        run: |
          {
            echo '### GBF security changed scope'
            echo "- global: $GLOBAL_SCOPE"
            echo "- gbf: $GBF_SCOPE"
          } >> "$GITHUB_STEP_SUMMARY"

  closure:
    needs: scope
    if: ${{ github.event_name == 'workflow_dispatch' || needs.scope.outputs.global == 'true' || needs.scope.outputs.gbf == 'true' }}
    name: Threat provenance secret denial closure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify threat, provenance and privacy boundaries
        run: python3 .github/scripts/assert-gbf-security-closure.py
      - name: Verify Electron denial, redaction and trace secrecy
        run: node --test desktop/electron/edge-ipc.test.cjs desktop/electron/native-capability-handlers.test.cjs
      - name: Install clean-room computer-control test dependencies
        working-directory: chatgpt-vps-control
        run: npm ci --ignore-scripts
      - name: Verify browser target, reconnect and one-time sensitive input
        working-directory: chatgpt-vps-control
        run: node --test tests/browser-extension.test.js tests/browser-session.test.js tests/native-request-service.test.js tests/secure-input.test.js
      - name: Audit production computer-control dependencies
        working-directory: chatgpt-vps-control
        run: npm audit --omit=dev
