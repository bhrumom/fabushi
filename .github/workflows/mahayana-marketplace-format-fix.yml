name: Mahayana Marketplace Format Fix

on:
  push:
    branches:
      - codex/mahayana-marketplace-parallel-20260726-r16
    paths:
      - .github/workflows/mahayana-marketplace-format-fix.yml

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mahayana-marketplace-parallel-20260726-r16
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Mahayana Rust workspace
        run: cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api.rs
          git commit -m "Format marketplace worker"
          git push origin HEAD:codex/mahayana-marketplace-parallel-20260726-r16
