name: Developer Fiat Commerce

on:
  push:
    branches:
      - main
      - feat/fab-p0001-dynamic-fiat-commerce
    paths:
      - 'third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0008_dynamic_fiat_developer_commerce.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0009_global_dharma_dynamic_fiat_seed.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0010_global_cn_developer_payouts.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payment_api.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payout_orchestration.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/reconciled_refund.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/developer_commerce_proxy.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/Cargo.toml'
      - 'third_party/mahayana/mahayana-rs/mahayana-pay-worker/**'
      - '.github/scripts/apply-dynamic-commerce-platform-patch.mjs'
      - '.github/scripts/apply-google-global-pricing-patch.mjs'
      - '.github/scripts/apply-commerce-active-rail-gate.mjs'
      - '.github/scripts/apply-global-cn-payout-patch.mjs'
      - '.github/scripts/apply-reconciled-refund-patch.mjs'
      - '.github/workflows/developer-fiat-commerce.yml'
      - 'projects/telegram-fabushi-integration/**'
  pull_request:
    paths:
      - 'third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0008_dynamic_fiat_developer_commerce.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0009_global_dharma_dynamic_fiat_seed.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0010_global_cn_developer_payouts.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payment_api.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payout_orchestration.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/reconciled_refund.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/developer_commerce_proxy.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/Cargo.toml'
      - 'third_party/mahayana/mahayana-rs/mahayana-pay-worker/**'
      - '.github/scripts/apply-global-cn-payout-patch.mjs'
      - '.github/scripts/apply-reconciled-refund-patch.mjs'
      - '.github/scripts/apply-commerce-active-rail-gate.mjs'
      - '.github/workflows/developer-fiat-commerce.yml'
      - 'projects/telegram-fabushi-integration/**'

permissions:
  contents: write

jobs:
  format-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/fab-p0001-dynamic-fiat-commerce'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fab-p0001-dynamic-fiat-commerce
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply deterministic integration patches
        run: |
          node .github/scripts/apply-dynamic-commerce-platform-patch.mjs
          node .github/scripts/apply-google-global-pricing-patch.mjs
          node .github/scripts/apply-commerce-active-rail-gate.mjs
          node .github/scripts/apply-global-cn-payout-patch.mjs
          node .github/scripts/apply-reconciled-refund-patch.mjs
      - name: Apply rustfmt
        run: |
          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker/Cargo.toml
          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/mahayana-platform-worker/Cargo.toml
          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/mahayana-pay-worker/Cargo.toml
          rustfmt --edition 2024 third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payout_orchestration.rs
          rustfmt --edition 2024 third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/reconciled_refund.rs
      - name: Commit generated integration if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'fabushi-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker \
                  third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payment_api.rs \
                  third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payout_orchestration.rs \
                  third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/reconciled_refund.rs \
                  third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api.rs \
                  third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/developer_commerce_proxy.rs \
                  third_party/mahayana/mahayana-rs/mahayana-pay-worker/src/lib.rs
          git commit -m 'style(pay): integrate and format developer commerce payouts'
          git push origin HEAD:feat/fab-p0001-dynamic-fiat-commerce

  control-plane-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo fmt --check

  control-plane-wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown

  platform-worker-wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs/mahayana-platform-worker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown
      - run: cargo fmt --check

  pay-worker-wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs/mahayana-pay-worker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown
      - run: cargo fmt --check

  schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dynamic-fiat schema and generic ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          schema = Path('third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0008_dynamic_fiat_developer_commerce.sql').read_text()
          seed = Path('third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0009_global_dharma_dynamic_fiat_seed.sql').read_text()
          required = [
              'developer_commerce_profiles', 'mini_app_commerce_owners',
              'mini_app_commerce_members', 'payment_product_catalog',
              'payment_price_revisions', 'payment_provider_bindings',
              'developer_commerce_audit_events', "'global-dharma'", "'official.fabushi'"
          ]
          for item in required:
              assert item in schema or item in seed, item
          assert 'amount INTEGER' in schema
          assert 'REAL' not in schema and 'FLOAT' not in schema
          assert "'CNY', 3000" in seed
          assert "'CNY', 108000" in seed
          assert "'web_provider'" in seed
          assert "'pending_configuration'" in seed
          PY
      - name: Verify global and China payout schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          schema = Path('third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0010_global_cn_developer_payouts.sql').read_text()
          for item in [
              'developer_payout_profiles', 'payout_provider_routes',
              'developer_settlement_reconciliations', 'store_settlement_batches',
              'developer_payout_attempts', 'kyc_status', 'payouts_enabled',
              'stripe_connect', 'adyen_platform', 'paypal_multiparty',
              'wechat_platform', 'alipay_platform', 'lianlian_account_plus', 'huifu_dougong'
          ]:
              assert item in schema, item
          assert 'pending_configuration' in schema
          assert 'REAL' not in schema and 'FLOAT' not in schema
          payout = Path('third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker/src/payout.rs').read_text()
          assert 'net_receipts' in payout
          assert 'platform_fee_amount' in payout
          assert 'NoEligibleProvider' in payout
          orchestration = Path('third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payout_orchestration.rs').read_text()
          assert 'developer_settlement_reconciliations' in orchestration
          assert 'payout_provider_routes' in orchestration
          assert 'kyc_status' in orchestration and 'payouts_enabled' in orchestration
          assert 'PAYOUT_PROVIDER_EXECUTOR_TOKEN' in orchestration
          refund = Path('third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/reconciled_refund.rs').read_text()
          assert 'developer-reserved:' in refund
          assert 'platform:refund-loss:' in refund
          assert 'available balance may become negative' in refund.lower()
          PY
      - name: Verify server pricing authority and active provider gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          domain = Path('third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker/src/domain.rs').read_text()
          draft = domain[domain.index('pub struct DeveloperProductDraft'):domain.index('pub struct ProviderBindingPlan')]
          assert 'developer_id' not in draft
          assert 'owner_user_id' not in draft
          assert 'platform_fee_bps' not in draft
          assert 'currency' in draft and 'amount' in draft

          pay = Path('third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payment_api.rs').read_text()
          request = pay[pay.index('struct CreateIntentRequest'):pay.index('struct AppleVerifyRequest')]
          assert 'sku:' in request and 'rail:' in request and 'idempotency_key:' in request
          assert 'amount:' not in request and 'currency:' not in request and 'platform_fee' not in request
          create = pay[pay.index('pub async fn create_intent'):pay.index('pub async fn get_intent')]
          assert 'product.amount' in create and 'product.currency' in create and 'product.platform_fee_bps' in create
          assert 'advancedCommercePath' in pay
          assert 'include!("reconciled_refund.rs")' in pay
          assert 'reconciled_refund_row(database, &payment.payment_id)' in pay

          worker = Path('third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker/src/worker_v2.rs').read_text()
          rails = worker[worker.index('fn pay_rails_json'):worker.index('async fn persist_product')]
          assert 'p.sync_state != "active"' in rails
          assert 'activate_google_pay_rail' in worker
          assert 'google_play_billing' in worker

          proxy = Path('third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/developer_commerce_proxy.rs').read_text()
          assert '/v1/pay/admin/products' in proxy
          assert '/v1/developer/commerce/payout/request' in proxy
          assert 'assert!(!allowed_commerce_proxy_path' in proxy
          google = Path('third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker/src/google.rs').read_text()
          assert 'pricing:convertRegionPrices' in google
          assert 'converted_region_prices' in google
          PY
