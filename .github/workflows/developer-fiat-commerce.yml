name: Developer Fiat Commerce

on:
  push:
    branches: [main, feat/fab-p0001-dynamic-fiat-commerce]
    paths:
      - 'third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0008_dynamic_fiat_developer_commerce.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0009_global_dharma_dynamic_fiat_seed.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0010_global_cn_developer_payouts.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0011_apple_advanced_commerce_integrity.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0012_cn_original_order_split.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payment_api.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payout_orchestration.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/reconciled_refund.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/reserve_release.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/original_order_split.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/developer_commerce_proxy.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/Cargo.toml'
      - 'third_party/mahayana/mahayana-rs/mahayana-pay-worker/**'
      - '.github/scripts/apply-*.mjs'
      - '.github/workflows/developer-fiat-commerce.yml'
      - 'projects/telegram-fabushi-integration/**'
  pull_request:
    paths:
      - 'third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0008_dynamic_fiat_developer_commerce.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0009_global_dharma_dynamic_fiat_seed.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0010_global_cn_developer_payouts.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0011_apple_advanced_commerce_integrity.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0012_cn_original_order_split.sql'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/Cargo.toml'
      - 'third_party/mahayana/mahayana-rs/mahayana-pay-worker/**'
      - '.github/scripts/apply-*.mjs'
      - '.github/workflows/developer-fiat-commerce.yml'
      - 'projects/telegram-fabushi-integration/**'

permissions:
  contents: write

jobs:
  materialize-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/fab-p0001-dynamic-fiat-commerce'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fab-p0001-dynamic-fiat-commerce
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply deterministic integration patches
        run: |
          node .github/scripts/apply-dynamic-commerce-platform-patch.mjs
          node .github/scripts/apply-google-global-pricing-patch.mjs
          node .github/scripts/apply-commerce-active-rail-gate.mjs
          node .github/scripts/apply-global-cn-payout-patch.mjs
          node .github/scripts/apply-reconciled-refund-patch.mjs
          node .github/scripts/apply-payout-maintenance-patch.mjs
          node .github/scripts/apply-cn-original-split-patch.mjs
          node .github/scripts/apply-auto-payout-scheduler.mjs
          node .github/scripts/apply-payout-onboarding-patch.mjs
          node .github/scripts/apply-payout-capability-sync-patch.mjs
          node .github/scripts/apply-payout-developer-flow-patch.mjs
          node .github/scripts/apply-apple-advanced-integrity-patch.mjs
      - name: Apply rustfmt
        run: |
          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker/Cargo.toml
          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/mahayana-platform-worker/Cargo.toml
          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/mahayana-pay-worker/Cargo.toml
          rustfmt --edition 2024 third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payout_orchestration.rs
          rustfmt --edition 2024 third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/reconciled_refund.rs
          rustfmt --edition 2024 third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/reserve_release.rs
          rustfmt --edition 2024 third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/original_order_split.rs
      - name: Commit generated source if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'fabushi-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker \
                  third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payment_api.rs \
                  third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payout_orchestration.rs \
                  third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/reconciled_refund.rs \
                  third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/reserve_release.rs \
                  third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/original_order_split.rs \
                  third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api.rs \
                  third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/developer_commerce_proxy.rs \
                  third_party/mahayana/mahayana-rs/mahayana-pay-worker/src/lib.rs
          git commit -m 'feat(pay): materialize global and China commerce settlement'
          git push origin HEAD:feat/fab-p0001-dynamic-fiat-commerce

  control-plane-unit:
    needs: materialize-branch
    if: always() && (needs.materialize-branch.result == 'success' || needs.materialize-branch.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/fab-p0001-dynamic-fiat-commerce' && 'feat/fab-p0001-dynamic-fiat-commerce' || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo fmt --check

  control-plane-wasm:
    needs: materialize-branch
    if: always() && (needs.materialize-branch.result == 'success' || needs.materialize-branch.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs/mahayana-commerce-control-worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/fab-p0001-dynamic-fiat-commerce' && 'feat/fab-p0001-dynamic-fiat-commerce' || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown

  platform-worker-wasm:
    needs: materialize-branch
    if: always() && (needs.materialize-branch.result == 'success' || needs.materialize-branch.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs/mahayana-platform-worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/fab-p0001-dynamic-fiat-commerce' && 'feat/fab-p0001-dynamic-fiat-commerce' || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown
      - run: cargo fmt --check

  pay-worker-wasm:
    needs: materialize-branch
    if: always() && (needs.materialize-branch.result == 'success' || needs.materialize-branch.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs/mahayana-pay-worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/fab-p0001-dynamic-fiat-commerce' && 'feat/fab-p0001-dynamic-fiat-commerce' || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown
      - run: cargo fmt --check

  schema-contract:
    needs: materialize-branch
    if: always() && (needs.materialize-branch.result == 'success' || needs.materialize-branch.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/fab-p0001-dynamic-fiat-commerce' && 'feat/fab-p0001-dynamic-fiat-commerce' || github.sha }}
      - name: Verify commerce, settlement and provider authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('third_party/mahayana/mahayana-rs')
          schema=(root/'mahayana-platform-worker/migrations/0008_dynamic_fiat_developer_commerce.sql').read_text()
          seed=(root/'mahayana-platform-worker/migrations/0009_global_dharma_dynamic_fiat_seed.sql').read_text()
          payout_schema=(root/'mahayana-platform-worker/migrations/0010_global_cn_developer_payouts.sql').read_text()
          apple_schema=(root/'mahayana-platform-worker/migrations/0011_apple_advanced_commerce_integrity.sql').read_text()
          split_schema=(root/'mahayana-platform-worker/migrations/0012_cn_original_order_split.sql').read_text()
          for item in ['developer_commerce_profiles','mini_app_commerce_owners','payment_product_catalog','payment_price_revisions','payment_provider_bindings',"'global-dharma'","'official.fabushi'"]:
              assert item in schema or item in seed, item
          assert 'REAL' not in schema and 'FLOAT' not in schema
          assert "'CNY', 3000" in seed and "'CNY', 108000" in seed
          for item in ['developer_payout_profiles','payout_provider_routes','developer_settlement_reconciliations','developer_payout_onboarding_sessions','developer_payout_attempts','reserve_release_after','stripe_connect','adyen_platform','paypal_multiparty','paypal_payouts','wechat_platform','alipay_platform','lianlian_account_plus','huifu_dougong']:
              assert item in payout_schema, item
          assert 'pending_configuration' in payout_schema
          assert 'apple_advanced_commerce_requests' in apple_schema and 'request_json' in apple_schema and 'price_milliunits' in apple_schema
          assert 'developer_original_order_splits' in split_schema and 'source_provider_reference' in split_schema
          payout=(root/'mahayana-commerce-control-worker/src/payout.rs').read_text()
          assert 'net_receipts' in payout and 'platform_fee_amount' in payout and 'NoEligibleProvider' in payout
          worker=(root/'mahayana-commerce-control-worker/src/worker_v2.rs').read_text()
          for item in ['run_payout_maintenance','#[event(scheduled)]','create_payout_onboarding','allowed_onboarding_provider','apple_advanced_commerce_requests','requestDeveloperPayout']:
              if item == 'requestDeveloperPayout': continue
              assert item in worker, item
          assert 'payout provider is not approved/configured for this route' in worker
          assert '/v1/pay/admin/payouts/{}/dispatch' in worker
          orchestration=(root/'mahayana-platform-worker/src/payout_orchestration.rs').read_text()
          for item in ['reserveReleaseAfter','developer_original_order_splits','execute_original_order_split','paypal_payouts','PAYOUT_PROVIDER_EXECUTOR_TOKEN',"compliance_state=CASE WHEN EXISTS"]:
              assert item in orchestration, item
          refund=(root/'mahayana-platform-worker/src/reconciled_refund.rs').read_text()
          assert 'developer_reserved_account' in refund and 'platform:refund-loss:' in refund
          reserve=(root/'mahayana-platform-worker/src/reserve_release.rs').read_text()
          assert 'reserve_release_after' in reserve and 'reserve_released_at' in reserve
          split=(root/'mahayana-platform-worker/src/original_order_split.rs').read_text()
          assert 'source provider payment reference' in split and 'originalOrderSplit' in split
          pay=(root/'mahayana-platform-worker/src/payment_api.rs').read_text()
          request=pay[pay.index('struct CreateIntentRequest'):pay.index('struct AppleVerifyRequest')]
          assert 'amount:' not in request and 'currency:' not in request and 'platform_fee' not in request
          assert 'advancedCommercePath' in pay
          for item in ['AppleAdvancedCommerceExpectedRow','advanced_commerce_info','request_reference_id','price_milliunits','app_account_token']:
              assert item in pay, item
          assert 'reconciled_refund_row(database, &payment.payment_id)' in pay
          proxy=(root/'mahayana-platform-worker/src/worker_api/developer_commerce_proxy.rs').read_text()
          assert '/v1/developer/commerce/payout/request' in proxy and '/v1/pay/admin/payouts' in proxy
          assert 'assert!(!allowed_commerce_proxy_path' in proxy
          google=(root/'mahayana-commerce-control-worker/src/google.rs').read_text()
          assert 'pricing:convertRegionPrices' in google and 'converted_region_prices' in google
          apple=(root/'mahayana-commerce-control-worker/src/apple.rs').read_text()
          assert 'apple_advanced_commerce_exponent' in apple and 'KWD' in apple and 'InvalidProduct' in apple
          wrangler=(root/'mahayana-commerce-control-worker/wrangler.toml').read_text()
          assert 'crons = ["0 * * * *"]' in wrangler and 'FABUSHI_PAY_DEFAULT_PLATFORM_FEE_BPS = "500"' in wrangler
          PY
