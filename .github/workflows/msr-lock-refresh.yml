name: MSR one-shot lock refresh

on:
  push:
    branches:
      - feat/msr-103-native-auth-secrets-clean
    paths:
      - .github/workflows/msr-lock-refresh.yml
      - third_party/mahayana/mahayana-rs/Cargo.toml
      - third_party/mahayana/mahayana-rs/Cargo.lock
      - third_party/mahayana/mahayana-rs/mahayana-auth/Cargo.toml
      - third_party/mahayana/mahayana-rs/mahayana-secrets/Cargo.toml
      - third_party/mahayana/mahayana-rs/mahayana-product/Cargo.toml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/msr-103-native-auth-secrets-clean
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate and validate Mahayana lock
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --format-version 1 >/dev/null
          cargo metadata --locked --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --format-version 1 >/dev/null
          rm -f .github/workflows/msr-lock-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add third_party/mahayana/mahayana-rs/Cargo.lock .github/workflows/msr-lock-refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'chore(msr): refresh Mahayana lock on current main'
          git push origin HEAD:feat/msr-103-native-auth-secrets-clean
