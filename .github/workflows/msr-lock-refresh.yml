name: MSR lock refresh

on:
  push:
    branches:
      - feat/msr-sovereign-runtime-final
    paths:
      - .github/workflows/msr-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/msr-sovereign-runtime-final
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Refresh and validate lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml
          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all -- --check
          cargo metadata --locked --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --no-deps >/dev/null
          git diff --check
      - name: Commit refreshed lockfile and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/msr-lock-refresh.yml
          git config user.name 'fabushi-msr-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add third_party/mahayana/mahayana-rs/Cargo.lock .github/workflows/msr-lock-refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(msr): refresh sovereign runtime lockfile'
          git push origin HEAD:feat/msr-sovereign-runtime-final
