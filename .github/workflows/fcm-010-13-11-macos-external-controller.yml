name: FCM-010.13.11 macOS external controller

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fcm-010-13-11-macos-external-controller.yml'
      - 'chatgpt-vps-control/scripts/fcm-010-13-generation-sensitive-action.mjs'
      - 'chatgpt-vps-control/scripts/fcm-010-13-protected-account-preflight.mjs'
      - 'chatgpt-vps-control/scripts/fcm-010-13-macos-external-controller-v2.mjs'
      - 'chatgpt-vps-control/scripts/fcm-010-13-macos-live-journey.mjs'
      - 'chatgpt-vps-control/tests/fcm-010-13-macos-external-controller-contract.test.js'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: fcm-010-13-11-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_WORKFLOW_ID: '350936009'
  FABUSHI_MCP_ORIGIN: https://fabushi-mcp.ombhrum.com

jobs:
  contract:
    name: External controller contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Parse controller scripts and enforce fail-closed contract
        run: |
          set -euo pipefail
          node --check chatgpt-vps-control/scripts/fcm-010-13-generation-sensitive-action.mjs
          node --check chatgpt-vps-control/scripts/fcm-010-13-protected-account-preflight.mjs
          node --check chatgpt-vps-control/scripts/fcm-010-13-macos-external-controller-v2.mjs
          node --check chatgpt-vps-control/scripts/fcm-010-13-macos-live-journey.mjs
          node --test chatgpt-vps-control/tests/fcm-010-13-macos-external-controller-contract.test.js

  protected-account-preflight:
    name: Protected account production MCP preflight
    if: github.event_name != 'pull_request' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'desktop-'))
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
      FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
    steps:
      - name: Checkout controller source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chatgpt-vps-control/package-lock.json

      - name: Install MCP client dependencies
        working-directory: chatgpt-vps-control
        run: npm ci --ignore-scripts --prefer-offline

      - name: Verify protected CI account can authenticate to production Fabushi MCP
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/protected-account-preflight
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node chatgpt-vps-control/scripts/fcm-010-13-protected-account-preflight.mjs
          jq -e '.schema == "fcm-010.13.11.protected-account-preflight.v1" and .ok == true' \
            "$EVIDENCE_DIR/protected-account-preflight.json" >/dev/null

      - name: Upload account preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fcm-010-13-11-protected-account-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/protected-account-preflight/
          if-no-files-found: error
          retention-days: 90

  dispatch-and-control:
    name: Bind immutable Release, dispatch frozen lane, and externally control run-owned App
    if: github.event_name != 'pull_request' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'desktop-'))
    needs: protected-account-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
      FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
    steps:
      - name: Checkout external controller source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chatgpt-vps-control/package-lock.json

      - name: Install MCP client dependencies
        working-directory: chatgpt-vps-control
        run: npm ci --ignore-scripts --prefer-offline

      - id: binding
        name: Resolve immutable exact-source macOS Release binding
        env:
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          release_tag="${EVENT_RELEASE_TAG:-}"
          if test -z "$release_tag"; then
            expected_source="$GITHUB_SHA"
            releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
            release_tag="$(jq -r --arg source "$expected_source" '[.[] | select(.draft == false and .immutable == true and .target_commitish == $source and (.tag_name | startswith("desktop-")))] | sort_by(.published_at // .created_at) | last | .tag_name // empty' <<<"$releases")"
            test -n "$release_tag"
          fi
          [[ "$release_tag" == desktop-* ]]
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag")"
          test "$(jq -r '.draft' <<<"$release")" = false
          test "$(jq -r '.immutable' <<<"$release")" = true
          target="$(jq -r '.target_commitish // empty' <<<"$release")"
          test -n "$target"
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq .sha)"
          test -n "$source_sha"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq '.object.sha')"
          test "$tag_sha" = "$source_sha"
          asset_name="$(jq -r '[.assets[] | select(.state == "uploaded" and (.name | test("^fabushi-[0-9]+\\.[0-9]+\\.[0-9]+-macos-arm64\\.zip$")) and (.digest | startswith("sha256:")))] | if length == 1 then .[0].name else empty end' <<<"$release")"
          test -n "$asset_name"
          short_source="${source_sha:0:12}"
          [[ "$release_tag" == *"-$short_source" ]]
          {
            echo "source_sha=$source_sha"
            echo "release_tag=$release_tag"
            echo "asset_name=$asset_name"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$release" > "$RUNNER_TEMP/bound-immutable-release.json"
          echo "Bound production controller to exact immutable Release $release_tag at $source_sha"

      - id: dispatch
        name: Dispatch a new exact-source macOS interactive run
        env:
          FROZEN_SOURCE_SHA: ${{ steps.binding.outputs.source_sha }}
          IMMUTABLE_RELEASE_TAG: ${{ steps.binding.outputs.release_tag }}
        run: |
          set -euo pipefail
          marker="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW_ID/dispatches" \
            -f ref="$IMMUTABLE_RELEASE_TAG"

          target_run_id=''
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW_ID/runs?event=workflow_dispatch&branch=$IMMUTABLE_RELEASE_TAG&per_page=30")"
            target_run_id="$(jq -r --arg sha "$FROZEN_SOURCE_SHA" --arg branch "$IMMUTABLE_RELEASE_TAG" --arg marker "$marker" \
              '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch and .created_at >= $marker)] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            if test -n "$target_run_id"; then break; fi
            sleep 2
          done
          test -n "$target_run_id"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target_run_id")"
          target_run_attempt="$(jq -r '.run_attempt' <<<"$run")"
          test "$(jq -r '.head_sha' <<<"$run")" = "$FROZEN_SOURCE_SHA"
          test "$(jq -r '.head_branch' <<<"$run")" = "$IMMUTABLE_RELEASE_TAG"
          test "$(jq -r '.event' <<<"$run")" = workflow_dispatch
          test "$target_run_attempt" -ge 1
          expected_device_id="gha-${target_run_id}-${target_run_attempt}-macos-app"
          {
            echo "target_run_id=$target_run_id"
            echo "target_run_attempt=$target_run_attempt"
            echo "expected_device_id=$expected_device_id"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$run" > "$RUNNER_TEMP/dispatched-target-run.json"
          echo "Dispatched exact-source run $target_run_id attempt $target_run_attempt; expected App-owned device $expected_device_id"

      - name: Execute external full semantic journey against only the new App-owned device
        env:
          FROZEN_SOURCE_SHA: ${{ steps.binding.outputs.source_sha }}
          IMMUTABLE_RELEASE_TAG: ${{ steps.binding.outputs.release_tag }}
          TARGET_RUN_ID: ${{ steps.dispatch.outputs.target_run_id }}
          TARGET_RUN_ATTEMPT: ${{ steps.dispatch.outputs.target_run_attempt }}
          TARGET_HEAD_SHA: ${{ steps.binding.outputs.source_sha }}
          TARGET_HEAD_BRANCH: ${{ steps.binding.outputs.release_tag }}
          EXPECTED_DEVICE_ID: ${{ steps.dispatch.outputs.expected_device_id }}
          EVIDENCE_DIR: ${{ runner.temp }}/external-controller-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/dispatched-target-run.json" "$EVIDENCE_DIR/dispatched-target-run.json"
          cp "$RUNNER_TEMP/bound-immutable-release.json" "$EVIDENCE_DIR/bound-immutable-release.json"
          node chatgpt-vps-control/scripts/fcm-010-13-macos-external-controller-v2.mjs 2>&1 | tee "$EVIDENCE_DIR/controller.log"
          jq -e --arg run "$TARGET_RUN_ID" --arg device "$EXPECTED_DEVICE_ID" --arg source "$FROZEN_SOURCE_SHA" --arg tag "$IMMUTABLE_RELEASE_TAG" \
            '.schema == "fcm-010.13.11.external-controller.v2" and .status == "passed" and .source == $source and .tag == $tag and .runId == $run and .deviceId == $device and .finalAction.agentId == "settings-logout" and .finalAction.action == "invoke"' \
            "$EVIDENCE_DIR/external-controller-summary.json" >/dev/null

      - name: Require the exact target run to finish green
        env:
          FROZEN_SOURCE_SHA: ${{ steps.binding.outputs.source_sha }}
          IMMUTABLE_RELEASE_TAG: ${{ steps.binding.outputs.release_tag }}
          TARGET_RUN_ID: ${{ steps.dispatch.outputs.target_run_id }}
        run: |
          set -euo pipefail
          final=''
          for attempt in $(seq 1 240); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID")"
            status="$(jq -r '.status' <<<"$run")"
            if test "$status" = completed; then
              final="$run"
              break
            fi
            sleep 5
          done
          test -n "$final"
          test "$(jq -r '.head_sha' <<<"$final")" = "$FROZEN_SOURCE_SHA"
          test "$(jq -r '.head_branch' <<<"$final")" = "$IMMUTABLE_RELEASE_TAG"
          test "$(jq -r '.conclusion' <<<"$final")" = success
          printf '%s\n' "$final" > "$RUNNER_TEMP/external-controller-evidence/final-target-run.json"

      - name: Require target evidence artifact to exist
        env:
          TARGET_RUN_ID: ${{ steps.dispatch.outputs.target_run_id }}
          TARGET_RUN_ATTEMPT: ${{ steps.dispatch.outputs.target_run_attempt }}
        run: |
          set -euo pipefail
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts?per_page=100")"
          expected="fabushi-macos-interactive-evidence-${TARGET_RUN_ID}-${TARGET_RUN_ATTEMPT}"
          jq -e --arg expected "$expected" '.artifacts[] | select(.name == $expected and .expired == false and (.digest | startswith("sha256:")))' <<<"$artifacts" >/dev/null
          printf '%s\n' "$artifacts" > "$RUNNER_TEMP/external-controller-evidence/target-artifacts.json"

      - name: Upload external controller evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fcm-010-13-11-external-controller-${{ steps.dispatch.outputs.target_run_id || github.run_id }}-${{ steps.dispatch.outputs.target_run_attempt || github.run_attempt }}
          path: ${{ runner.temp }}/external-controller-evidence/
          if-no-files-found: warn
          retention-days: 90
