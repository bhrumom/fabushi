name: MSR-204 peer authority repair

on:
  push:
    branches:
      - feat/msr-204-hermes-gateway-transcript

permissions:
  contents: write

jobs:
  repair:
    if: "github.event.head_commit.message == 'chore(msr): apply peer authority repair'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical MSR-204 branch
        uses: actions/checkout@v5
        with:
          ref: feat/msr-204-hermes-gateway-transcript
          fetch-depth: 0

      - name: Set up stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply Rust-owned clarify authority repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('third_party/mahayana/mahayana-rs/mahayana-gateway-peer/src/lib.rs')
          text = path.read_text()
          old = (
              '    let mut answers = request.locked_answers.clone();\n'
              '    if let Some(client_answers) = object.get("answers").and_then(Value::as_object) {\n'
              '        for (question_id, answer) in client_answers {\n'
              '            if let Some(answer) = answer.as_str() {\n'
              '                answers.insert(question_id.clone(), answer.to_string());\n'
              '            }\n'
              '        }\n'
              '    }\n'
          )
          new = (
              '    let mut answers = BTreeMap::new();\n'
              '    if let Some(client_answers) = object.get("answers").and_then(Value::as_object) {\n'
              '        for (question_id, answer) in client_answers {\n'
              '            if let Some(answer) = answer.as_str() {\n'
              '                answers.insert(question_id.clone(), answer.to_string());\n'
              '            }\n'
              '        }\n'
              '    }\n'
              '    // Rust owns locked clarify answers across reconnects; stale client\n'
              '    // responses may fill unlocked answers but cannot overwrite sealed ones.\n'
              '    answers.extend(request.locked_answers.clone());\n'
          )
          if old not in text:
              raise SystemExit('clarify merge block did not match expected canonical state')
          text = text.replace(old, new, 1)

          marker = '    #[test]\n    fn exported_state_round_trips_for_future_canonical_restart_store() {\n'
          if 'fn locked_clarify_answer_wins_over_stale_client_response()' not in text:
              test = (
                  '    #[test]\n'
                  '    fn locked_clarify_answer_wins_over_stale_client_response() {\n'
                  '        let mut registry = ServerRequestRegistry::default();\n'
                  '        registry.issue_with_id(\n'
                  '            "srq-clarify0003".to_string(),\n'
                  '            "session-3".to_string(),\n'
                  '            "clarify".to_string(),\n'
                  '            json!({}),\n'
                  '            vec!["q1".to_string(), "q2".to_string()],\n'
                  '            30,\n'
                  '        ).unwrap();\n'
                  '        registry.lock_answer("srq-clarify0003", "q1", "server-locked").unwrap();\n'
                  '        let resolved = registry.resolve_response(&json!({\n'
                  '            "jsonrpc": "2.0",\n'
                  '            "id": "srq-clarify0003",\n'
                  '            "result": {"answers": {"q1": "stale-client", "q2": "client-open"}}\n'
                  '        })).unwrap();\n'
                  '        assert_eq!(\n'
                  '            resolved.response,\n'
                  '            ServerRequestResponse::Result(json!({\n'
                  '                "answers": {"q1": "server-locked", "q2": "client-open"}\n'
                  '            }))\n'
                  '        );\n'
                  '    }\n\n'
              )
              if marker not in text:
                  raise SystemExit('peer regression insertion marker missing')
              text = text.replace(marker, test + marker, 1)
          path.write_text(text)
          PY

      - name: Format and verify peer crate
        working-directory: third_party/mahayana/mahayana-rs
        run: |
          cargo fmt -p mahayana-gateway-peer
          cargo fmt -p mahayana-gateway-peer -- --check
          cargo test -p mahayana-gateway-peer
          cargo test -p mahayana-gateway-peer --locked

      - name: Remove temporary repair plumbing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/mahayana-fast-checks.yml')
          text = path.read_text()
          text = text.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          start = text.index('  msr204-repair:\n')
          end = text.index('  protocol-and-bridge:\n')
          text = text[:start] + text[end:]
          path.write_text(text)
          PY
          git rm .github/workflows/msr-204-peer-authority-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/mahayana-fast-checks.yml
          git add third_party/mahayana/mahayana-rs/mahayana-gateway-peer/src/lib.rs
          git diff --cached --check
          git commit -m 'fix(msr): enforce Rust-owned clarify answers'
          git push origin HEAD:feat/msr-204-hermes-gateway-transcript
