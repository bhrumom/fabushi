name: Mahayana CLI live device (manual MCP validation)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source ref/SHA to build and expose as an ephemeral CLI device
        required: true
        default: main
        type: string
      hold_minutes:
        description: Maximum time to keep the ephemeral device online for official MCP validation
        required: true
        default: '60'
        type: choice
        options: ['15', '30', '60', '90', '120']

permissions:
  contents: read

concurrency:
  group: mahayana-cli-live-device-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  live-device:
    name: Ephemeral Mahayana CLI device
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DEVICE_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-interactive
      DEVICE_NAME: Mahayana CLI GitHub Actions ${{ github.run_id }}
      FABUSHI_API_BASE_URL: ${{ vars.FABUSHI_API_BASE_URL || 'https://api.ombhrum.com' }}
      MAHAYANA_API_BASE_URL: ${{ vars.FABUSHI_API_BASE_URL || 'https://api.ombhrum.com' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact source and private runtime paths
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MAHAYANA_HOME=$RUNNER_TEMP/mahayana-home" >> "$GITHUB_ENV"
          echo "FABUSHI_ACCOUNT_SESSION_FILE=$RUNNER_TEMP/mahayana-account-session.json" >> "$GITHUB_ENV"
          echo "FABUSHI_CI_ACCOUNT_SESSION_FILE=$RUNNER_TEMP/mahayana-ci-session.json" >> "$GITHUB_ENV"
          echo "FABUSHI_CI_FINISH_FILE=$RUNNER_TEMP/mahayana-home/device-agent/remote-finished.json" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Restore Mahayana Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: mahayana-cli-live-rust-1.98.0
          cache-on-failure: true

      - name: Install Linux CLI build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libxfixes-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgbm-dev libdrm-dev

      - name: Build exact standalone CLI without tests
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml \
            --locked \
            --profile ci \
            --features codex-compat \
            --package mahayana-cli
          mkdir -p "$RUNNER_TEMP/bin" "$MAHAYANA_HOME"
          install -m 0755 third_party/mahayana/mahayana-rs/target/ci/mahayana "$RUNNER_TEMP/bin/mahayana"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Login to the dedicated Fabushi test account and bind Mahayana CLI
        env:
          FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
          FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FABUSHI_CI_TEST_USERNAME"
          test -n "$FABUSHI_CI_TEST_PASSWORD"
          node chatgpt-vps-control/scripts/login-ci-test-account.mjs
          node chatgpt-vps-control/scripts/export-ci-app-account-session.mjs
          rm -f "$FABUSHI_ACCOUNT_SESSION_FILE"
          mahayana auth
          mahayana device start
          mahayana device status

      - name: Wait for CLI-owned official device registration
        shell: bash
        run: |
          set -euo pipefail
          log="$MAHAYANA_HOME/device-agent/agent.log"
          for attempt in $(seq 1 90); do
            if grep -q 'Mahayana controllable device online:' "$log" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          grep -q "Mahayana controllable device online: $DEVICE_ID" "$log"
          {
            echo '## Mahayana CLI live device'
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Device ID: \`$DEVICE_ID\`"
            echo '- Account: dedicated Fabushi CI test account (credentials never printed)'
            echo '- Use the official Fabushi MCP: list_devices -> describe_device_tool(vps_status) -> device_call(vps_status) -> ci_session_finish.'
            echo '- After ci_session_finish, this GitHub-hosted device exits and must disappear from list_devices.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hold ephemeral device for official MCP validation
        shell: bash
        run: |
          set -euo pipefail
          seconds=$(( ${{ inputs.hold_minutes }} * 60 ))
          started="$(date +%s)"
          while (( $(date +%s) - started < seconds )); do
            if test -f "$FABUSHI_CI_FINISH_FILE"; then
              echo 'Remote MCP validation requested finish.'
              mahayana device stop || true
              exit 0
            fi
            mahayana device status | grep -q '"running": true'
            sleep 5
          done
          echo 'Live-device window expired without ci_session_finish.' >&2
          exit 1

      - name: Logout and stop CLI device
        if: always()
        shell: bash
        run: |
          mahayana logout || true
          mahayana device stop || true
          rm -f "$FABUSHI_ACCOUNT_SESSION_FILE" "$FABUSHI_CI_ACCOUNT_SESSION_FILE"
          sleep 2
