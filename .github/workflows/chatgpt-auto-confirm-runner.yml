name: ChatGPT auto-confirm continuous runner

on:
  workflow_dispatch:
    inputs:
      previous_run_id:
        description: Previous runner workflow run containing encrypted continuation state
        required: false
        type: string
      smoke_only:
        description: Verify installation and restored login without running or continuing tasks
        required: false
        default: false
        type: boolean
      parallel_queue_smoke:
        description: Dynamically enqueue two tasks and require real isolated Chat overlap
        required: false
        default: false
        type: boolean
      cancel_task_id:
        description: Remove one logical task from restored persistent state without launching Chat
        required: false
        type: string
      account_id:
        description: Opaque account id captured by the local account registry; empty keeps legacy repo secrets
        required: false
        type: string
      restore_latest_credentials:
        description: Restore the latest authenticated credential bundle for account_id before falling back to Environment secrets
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  # Parallel smoke creates its own ephemeral queue state, so it can validate
  # the hosted Chat surface without waiting behind the persistent runner.
  # Persistent runners keep the shared-state serialization guard.
  group: ${{ inputs.parallel_queue_smoke && format('chatgpt-auto-confirm-parallel-smoke-{0}-{1}', github.ref, inputs.account_id) || (inputs.account_id != '' && format('chatgpt-auto-confirm-account-{0}', inputs.account_id) || 'chatgpt-auto-confirm-fix-test-runner') }}
  cancel-in-progress: false

jobs:
  run:
    name: Run ChatGPT auto-confirm for up to six hours${{ inputs.account_id != '' && format(' ({0})', inputs.account_id) || '' }}
    runs-on: macos-15
    timeout-minutes: 355
    environment:
      # Account environments resolve to chatgpt-auto-confirm-${{ inputs.account_id }};
      # the legacy branch keeps the pre-existing repository-secret fallback.
      name: ${{ inputs.account_id != '' && format('chatgpt-auto-confirm-{0}', inputs.account_id) || 'chatgpt-auto-confirm-legacy' }}
    env:
      CHATGPT_CDP_PORT: "9324"
      GH_TOKEN: ${{ github.token }}
      CHATGPT_ACCOUNT_ID: ${{ inputs.account_id }}
      # Hosted macOS runners have no user-facing desktop page. Dedicated
      # workers may stay visible while they bootstrap their copied profile.
      CHATGPT_AUTO_CONFIRM_HEADLESS: "1"
    steps:
      - name: Checkout trusted runner implementation
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare private runtime directories
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/chatgpt-auto-confirm"
          profile_dir="$runtime_dir/profile"
          state_path="$runtime_dir/queue-state.json"
          mkdir -p "$runtime_dir" "$profile_dir"
          chmod 700 "$runtime_dir" "$profile_dir"
          {
            echo "runtime_dir=$runtime_dir"
            echo "profile_dir=$profile_dir"
            echo "state_path=$state_path"
            echo "account_id=${CHATGPT_ACCOUNT_ID:-}"
          } >> "$GITHUB_OUTPUT"
          mkdir -p "$runtime_dir/diagnostics"
          touch "$runtime_dir/diagnostics/.keep"

      - name: Restore encrypted continuation state
        shell: bash
        env:
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
          STATE_PATH: ${{ steps.paths.outputs.state_path }}
          STATE_ARTIFACT_NAME: ${{ inputs.account_id != '' && format('chatgpt-auto-confirm-state-{0}', inputs.account_id) || 'chatgpt-auto-confirm-state' }}
          CHATGPT_AUTO_CONFIRM_STATE_KEY: ${{ secrets.CHATGPT_AUTO_CONFIRM_STATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$PREVIOUS_RUN_ID" ]]; then
            [[ "$PREVIOUS_RUN_ID" =~ ^[0-9]+$ ]]
            mkdir -p "$RUNNER_TEMP/previous-state"
            gh run download "$PREVIOUS_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$STATE_ARTIFACT_NAME" \
              --dir "$RUNNER_TEMP/previous-state"
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -pass env:CHATGPT_AUTO_CONFIRM_STATE_KEY \
              -in "$RUNNER_TEMP/previous-state/queue-state.enc" \
              -out "$STATE_PATH"
            if [[ -d "$RUNNER_TEMP/previous-state/diagnostics" ]]; then
              ditto "$RUNNER_TEMP/previous-state/diagnostics" \
                "$(dirname "$STATE_PATH")/diagnostics"
            fi
          else
            # Task goals live in the versioned inbox and task documents. A
            # fresh runner starts from empty execution state and lets the
            # dynamic controller reconcile the current repository definition.
            printf '%s\n' '{"automationTasks":[]}' > "$STATE_PATH"
          fi
          chmod 600 "$STATE_PATH"

      - name: Restore latest account credential bundle
        if: ${{ inputs.cancel_task_id == '' && inputs.account_id != '' && inputs.restore_latest_credentials }}
        shell: bash
        env:
          ACCOUNT_ID: ${{ inputs.account_id }}
          STATE_KEY: ${{ secrets.CHATGPT_AUTO_CONFIRM_STATE_KEY }}
          RUNTIME_DIR: ${{ steps.paths.outputs.runtime_dir }}
        run: |
          set -euo pipefail
          [[ "$ACCOUNT_ID" =~ ^acct_[0-9a-f]{12}$ ]]
          if [[ -z "$STATE_KEY" ]]; then
            echo 'Account state key is not configured yet; using Environment seed secrets.'
            exit 0
          fi
          mkdir -p "$RUNTIME_DIR/latest-credential"
          artifact_id=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=chatgpt-auto-confirm-credentials-$ACCOUNT_ID&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last // empty | .id')
          if [[ -n "$artifact_id" ]]; then
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNTIME_DIR/latest-credential/bundle.zip"
            ditto -x -k "$RUNTIME_DIR/latest-credential/bundle.zip" "$RUNTIME_DIR/latest-credential/unpacked"
            bundle=$(find "$RUNTIME_DIR/latest-credential/unpacked" -type f -name '*.enc.json' -print -quit)
            if [[ -n "$bundle" ]]; then
              node .agents/plugins/plugins/chatgpt-auto-confirm/scripts/credential-bundle.mjs unpack \
                --account-id "$ACCOUNT_ID" --state-key "$STATE_KEY" --input "$bundle" \
                --auth-output "$RUNTIME_DIR/latest-credential/auth.json" \
                --cookies-output "$RUNTIME_DIR/latest-credential/cookies.json"
              auth_b64=$(base64 < "$RUNTIME_DIR/latest-credential/auth.json" | tr -d '\r\n')
              cookies_b64=$(base64 < "$RUNTIME_DIR/latest-credential/cookies.json" | tr -d '\r\n')
              printf '::add-mask::%s\n' "$auth_b64"
              printf '::add-mask::%s\n' "$cookies_b64"
              printf 'CHATGPT_CODEX_AUTH_B64=%s\n' "$auth_b64" >> "$GITHUB_ENV"
              printf 'CHATGPT_SESSION_COOKIES_B64=%s\n' "$cookies_b64" >> "$GITHUB_ENV"
              echo 'Restored latest authenticated account bundle.'
            fi
          else
            echo 'No rolling credential bundle found; using Environment or legacy repository secrets.'
          fi

      - name: Resolve account credential seed
        if: ${{ inputs.cancel_task_id == '' }}
        shell: bash
        env:
          SEED_CODEX_AUTH_B64: ${{ secrets.CHATGPT_CODEX_AUTH_B64 }}
          SEED_SESSION_COOKIES_B64: ${{ secrets.CHATGPT_SESSION_COOKIES_B64 }}
        run: |
          set -euo pipefail
          if [[ -n "${SEED_CODEX_AUTH_B64:-}" ]]; then
            printf '::add-mask::%s\n' "$SEED_CODEX_AUTH_B64"
          fi
          if [[ -n "${SEED_SESSION_COOKIES_B64:-}" ]]; then
            printf '::add-mask::%s\n' "$SEED_SESSION_COOKIES_B64"
          fi
          if [[ -z "${CHATGPT_CODEX_AUTH_B64:-}" ]]; then
            test -n "${SEED_CODEX_AUTH_B64:-}"
            printf 'CHATGPT_CODEX_AUTH_B64=%s\n' "$SEED_CODEX_AUTH_B64" >> "$GITHUB_ENV"
          fi
          if [[ -z "${CHATGPT_SESSION_COOKIES_B64:-}" ]]; then
            test -n "${SEED_SESSION_COOKIES_B64:-}"
            printf 'CHATGPT_SESSION_COOKIES_B64=%s\n' "$SEED_SESSION_COOKIES_B64" >> "$GITHUB_ENV"
          fi

      - name: Remove stale local worker bindings
        env:
          CHATGPT_AUTO_CONFIRM_QUEUE_STATE: ${{ steps.paths.outputs.state_path }}
          CHATGPT_ACCOUNT_ID: ${{ inputs.account_id }}
        run: node .agents/plugins/plugins/chatgpt-auto-confirm/scripts/prepare-action-state.mjs

      - name: Cancel persisted task without launching Chat
        if: ${{ inputs.cancel_task_id != '' }}
        env:
          CHATGPT_AUTO_CONFIRM_QUEUE_STATE: ${{ steps.paths.outputs.state_path }}
          CHATGPT_AUTO_CONFIRM_CANCEL_TASK_ID: ${{ inputs.cancel_task_id }}
          ACTION_RESULT_PATH: ${{ steps.paths.outputs.runtime_dir }}/action-result.json
        run: node .agents/plugins/plugins/chatgpt-auto-confirm/scripts/cancel-persisted-task.mjs

      - name: Restore ChatGPT login credentials
        if: ${{ inputs.cancel_task_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CHATGPT_CODEX_AUTH_B64"
          mkdir -p "$HOME/.codex"
          printf '%s' "$CHATGPT_CODEX_AUTH_B64" | base64 --decode > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"

      - name: Record account-scoped runtime metadata
        if: ${{ inputs.cancel_task_id == '' && inputs.account_id != '' }}
        shell: bash
        env:
          ACCOUNT_ID: ${{ inputs.account_id }}
          STATE_PATH: ${{ steps.paths.outputs.state_path }}
        run: |
          set -euo pipefail
          [[ "$ACCOUNT_ID" =~ ^acct_[0-9a-f]{12}$ ]]
          jq --arg accountId "$ACCOUNT_ID" '.accountId = $accountId' "$STATE_PATH" > "$STATE_PATH.tmp"
          mv "$STATE_PATH.tmp" "$STATE_PATH"
          chmod 600 "$STATE_PATH"

      - name: Install official ChatGPT desktop app
        if: ${{ inputs.cancel_task_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://persistent.oaistatic.com/codex-app-prod/ChatGPT.dmg \
            --output "$RUNNER_TEMP/ChatGPT.dmg"
          mount_dir="$RUNNER_TEMP/chatgpt-mount"
          mkdir -p "$mount_dir"
          mounted=false
          detach_mount() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if hdiutil detach "$mount_dir"; then
                mounted=false
                return 0
              fi
              echo "::warning::ChatGPT DMG detach attempt $attempt failed; waiting for open handles to close."
              sleep "$((attempt * 2))"
            done

            echo "::warning::ChatGPT DMG is still busy; attempting a forced detach."
            if hdiutil detach "$mount_dir" -force; then
              mounted=false
              return 0
            fi

            echo "::error::Unable to detach ChatGPT DMG mount after bounded retries."
            hdiutil info || true
            return 1
          }
          cleanup_mount() {
            local exit_status=$?
            if [[ "$mounted" == true ]]; then
              detach_mount || true
            fi
            return "$exit_status"
          }
          trap cleanup_mount EXIT
          hdiutil attach "$RUNNER_TEMP/ChatGPT.dmg" \
            -nobrowse -readonly -mountpoint "$mount_dir"
          mounted=true
          ditto "$mount_dir/ChatGPT.app" /Applications/ChatGPT.app
          detach_mount
          trap - EXIT
          xattr -dr com.apple.quarantine /Applications/ChatGPT.app || true

      - name: Build native queue runtime
        if: ${{ inputs.cancel_task_id == '' }}
        shell: bash
        run: sh .agents/plugins/plugins/chatgpt-auto-confirm/scripts/build-macos-runtime.sh

      - name: Launch authenticated desktop shell
        if: ${{ inputs.cancel_task_id == '' }}
        timeout-minutes: 6
        shell: bash
        env:
          PROFILE_DIR: ${{ steps.paths.outputs.profile_dir }}
        run: |
          set -euo pipefail
          test -n "$CHATGPT_SESSION_COOKIES_B64"
          open -na /Applications/ChatGPT.app --args \
            --user-data-dir="$PROFILE_DIR" \
            --remote-debugging-port="$CHATGPT_CDP_PORT"
          shell_ready=false
          for attempt in 1 2; do
            if CHATGPT_SESSION_MODE=restore-and-verify \
              node .agents/plugins/plugins/chatgpt-auto-confirm/scripts/restore-session-cookies.mjs; then
              shell_ready=true
              break
            fi
            if [[ "$attempt" -lt 2 ]]; then
              echo "::warning::Authenticated Chat shell attempt $attempt failed; restarting the app before retrying."
              pkill -f "user-data-dir=$PROFILE_DIR" || true
              for _ in {1..20}; do
                pgrep -f "user-data-dir=$PROFILE_DIR" >/dev/null || break
                sleep 1
              done
              rm -f \
                "$PROFILE_DIR/SingletonCookie" \
                "$PROFILE_DIR/SingletonLock" \
                "$PROFILE_DIR/SingletonSocket"
              open -na /Applications/ChatGPT.app --args \
                --user-data-dir="$PROFILE_DIR" \
                --remote-debugging-port="$CHATGPT_CDP_PORT"
            fi
          done
          test "$shell_ready" = true

      - name: Verify authenticated ChatGPT session
        if: ${{ inputs.cancel_task_id == '' }}
        id: auth_verify
        timeout-minutes: 6
        env:
          CHATGPT_AUTO_CONFIRM_STATE: ${{ steps.paths.outputs.state_path }}
          CHATGPT_AUTO_CONFIRM_QUEUE_STATE: ${{ steps.paths.outputs.state_path }}
          CHATGPT_AUTO_CONFIRM_CDP_PORT: ${{ env.CHATGPT_CDP_PORT }}
          CHATGPT_AUTO_CONFIRM_BACKGROUND_PORT: ${{ env.CHATGPT_CDP_PORT }}
          CHATGPT_AUTO_CONFIRM_PROFILE_PATH: ${{ steps.paths.outputs.profile_dir }}
        run: .agents/plugins/plugins/chatgpt-auto-confirm/runtime/macos/chatgpt-auto-confirm verify_chatgpt_login

      - name: Export and encrypt refreshed account credentials
        if: ${{ inputs.cancel_task_id == '' && inputs.account_id != '' && steps.auth_verify.outcome == 'success' }}
        id: credential_bundle
        shell: bash
        env:
          ACCOUNT_ID: ${{ inputs.account_id }}
          STATE_KEY: ${{ secrets.CHATGPT_AUTO_CONFIRM_STATE_KEY }}
          RUNTIME_DIR: ${{ steps.paths.outputs.runtime_dir }}
          AUTH_PATH: ${{ github.workspace }}/.codex/action-auth.json
          CHATGPT_CDP_PORT: ${{ env.CHATGPT_CDP_PORT }}
        run: |
          set -euo pipefail
          # credential-bundle.mjs uses authenticated AES-256-GCM (aes-256-gcm).
          mkdir -p "$RUNTIME_DIR/refreshed-credential" "$(dirname "$AUTH_PATH")"
          cp "$HOME/.codex/auth.json" "$AUTH_PATH"
          chmod 600 "$AUTH_PATH"
          node .agents/plugins/plugins/chatgpt-auto-confirm/scripts/export-live-chatgpt-session.mjs \
            --output "$RUNTIME_DIR/refreshed-credential/cookies.json" \
            --auth "$AUTH_PATH" --port "$CHATGPT_CDP_PORT"
          node .agents/plugins/plugins/chatgpt-auto-confirm/scripts/credential-bundle.mjs pack \
            --account-id "$ACCOUNT_ID" --state-key "$STATE_KEY" \
            --auth "$AUTH_PATH" --cookies "$RUNTIME_DIR/refreshed-credential/cookies.json" \
            --output "$RUNTIME_DIR/chatgpt-auto-confirm-credentials-$ACCOUNT_ID.enc.json"
          rm -f "$AUTH_PATH" "$RUNTIME_DIR/refreshed-credential/cookies.json"
          echo "bundle=$RUNTIME_DIR/chatgpt-auto-confirm-credentials-$ACCOUNT_ID.enc.json" >> "$GITHUB_OUTPUT"

      - name: Mark account authentication failure
        if: ${{ always() && inputs.cancel_task_id == '' && inputs.account_id != '' && steps.auth_verify.outcome != 'success' }}
        shell: bash
        env:
          ACCOUNT_ID: ${{ inputs.account_id }}
          RUNTIME_DIR: ${{ steps.paths.outputs.runtime_dir }}
        run: |
          set -euo pipefail
          printf '%s\n' "{\"accountId\":\"$ACCOUNT_ID\",\"status\":\"needs_login\",\"recordedAt\":\"$(date -u +%FT%TZ)\"}" \
            > "$RUNTIME_DIR/account-health.json"

      - name: Verify dynamic parallel task queue
        if: ${{ inputs.cancel_task_id == '' && inputs.parallel_queue_smoke }}
        env:
          CHATGPT_AUTO_CONFIRM_PARALLEL_STATE: ${{ steps.paths.outputs.runtime_dir }}/parallel-smoke-state.json
          CHATGPT_AUTO_CONFIRM_PARALLEL_EVIDENCE: ${{ steps.paths.outputs.runtime_dir }}/parallel-queue-evidence.json
          CHATGPT_AUTO_CONFIRM_CDP_PORT: ${{ env.CHATGPT_CDP_PORT }}
          CHATGPT_AUTO_CONFIRM_PROFILE_PATH: ${{ steps.paths.outputs.profile_dir }}
        run: node .agents/plugins/plugins/chatgpt-auto-confirm/scripts/verify-parallel-actions-queue.mjs

      - name: Run dynamic persistent task queue
        if: ${{ inputs.cancel_task_id == '' && !inputs.smoke_only && !inputs.parallel_queue_smoke }}
        id: controller
        continue-on-error: true
        env:
          CHATGPT_AUTO_CONFIRM_STATE: ${{ steps.paths.outputs.state_path }}
          CHATGPT_AUTO_CONFIRM_QUEUE_STATE: ${{ steps.paths.outputs.state_path }}
          CHATGPT_AUTO_CONFIRM_CDP_PORT: ${{ env.CHATGPT_CDP_PORT }}
          CHATGPT_AUTO_CONFIRM_PROFILE_PATH: ${{ steps.paths.outputs.profile_dir }}
          CHATGPT_AUTO_CONFIRM_TASK_CONTROL_REF: main
          CHATGPT_AUTO_CONFIRM_TASK_CONTROL_PATH: .agents/plugins/plugins/chatgpt-auto-confirm/tasks/actions-inbox.json
          CHATGPT_AUTO_CONFIRM_TASK_CONTROL_POLL_SECONDS: "30"
          ACTION_SESSION_SECONDS: "20100"
          ACTION_RESULT_PATH: ${{ steps.paths.outputs.runtime_dir }}/action-result.json
        run: node .agents/plugins/plugins/chatgpt-auto-confirm/scripts/run-dynamic-actions-controller.mjs

      - name: Record successful hosted verification
        if: ${{ inputs.cancel_task_id == '' && (inputs.smoke_only || inputs.parallel_queue_smoke) }}
        shell: bash
        env:
          VERIFICATION_REASON: ${{ inputs.parallel_queue_smoke && 'dynamic_parallel_queue_verified' || 'chatgpt_login_smoke_verified' }}
        run: |
          printf '%s\n' \
            "{\"status\":\"complete\",\"reason\":\"$VERIFICATION_REASON\"}" \
            > "${{ steps.paths.outputs.runtime_dir }}/action-result.json"

      - name: Prepare encrypted continuation snapshot
        if: always()
        shell: bash
        env:
          STATE_PATH: ${{ steps.paths.outputs.state_path }}
          RESULT_PATH: ${{ steps.paths.outputs.runtime_dir }}/action-result.json
          CHATGPT_AUTO_CONFIRM_STATE_KEY: ${{ secrets.CHATGPT_AUTO_CONFIRM_STATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CHATGPT_AUTO_CONFIRM_STATE_KEY"
          if [[ ! -s "$RESULT_PATH" ]]; then
            printf '%s\n' '{"status":"incomplete","reason":"controller_failed_before_result"}' > "$RESULT_PATH"
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:CHATGPT_AUTO_CONFIRM_STATE_KEY \
            -in "$STATE_PATH" \
            -out "${{ steps.paths.outputs.runtime_dir }}/queue-state.enc"

      - name: Upload encrypted continuation state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.account_id != '' && format('chatgpt-auto-confirm-state-{0}', inputs.account_id) || 'chatgpt-auto-confirm-state' }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.paths.outputs.runtime_dir }}/queue-state.enc
            ${{ steps.paths.outputs.runtime_dir }}/action-result.json
            ${{ steps.paths.outputs.runtime_dir }}/parallel-queue-evidence.json
            ${{ steps.paths.outputs.runtime_dir }}/*-screenshot.png
            ${{ steps.paths.outputs.runtime_dir }}/task-queue/watcher-trace.log
            ${{ steps.paths.outputs.runtime_dir }}/diagnostics

      - name: Upload rolling account credential bundle
        if: ${{ inputs.cancel_task_id == '' && inputs.account_id != '' && steps.credential_bundle.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: chatgpt-auto-confirm-credentials-${{ inputs.account_id }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ steps.credential_bundle.outputs.bundle }}

      - name: Upload account health evidence
        if: ${{ always() && inputs.cancel_task_id == '' && inputs.account_id != '' && steps.auth_verify.outcome != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: chatgpt-auto-confirm-health-${{ inputs.account_id }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ steps.paths.outputs.runtime_dir }}/account-health.json

      - name: Continue incomplete work or report terminal failure
        if: success() || failure()
        shell: bash
        env:
          RESULT_PATH: ${{ steps.paths.outputs.runtime_dir }}/action-result.json
          VERIFICATION_ONLY: ${{ inputs.smoke_only || inputs.parallel_queue_smoke }}
          AUTHENTICATION_VERIFIED: ${{ steps.auth_verify.outcome == 'success' }}
          CANCELLATION_ONLY: ${{ inputs.cancel_task_id != '' }}
          ACCOUNT_ID: ${{ inputs.account_id }}
        run: |
          set -euo pipefail
          status=$(jq -r '.status // "incomplete"' "$RESULT_PATH")
          if [[ "$CANCELLATION_ONLY" == "true" ]]; then
            [[ "$status" == "complete" ]]
            jq '{status, reason, requestedTaskId, cancelledTaskIds, remainingTaskIds}' "$RESULT_PATH"
            echo "Persisted task cancellation completed; no Chat was launched and no continuation was dispatched."
            exit 0
          fi
          if [[ "$AUTHENTICATION_VERIFIED" != "true" ]]; then
            echo "::error::ChatGPT authentication preflight failed; no continuation was dispatched."
            exit 1
          fi
          if [[ "$status" == "complete" ]]; then
            echo "All queued tasks completed; no continuation was dispatched."
            exit 0
          fi
          if [[ "$VERIFICATION_ONLY" == "true" ]]; then
            echo "::error::Hosted verification did not complete; no continuation was dispatched."
            jq '{status, reason, counts, tasks}' "$RESULT_PATH"
            exit 1
          fi
          if [[ "$status" != "incomplete" ]]; then
            echo "::error::Task queue ended with status $status."
            jq '{status, reason, counts, tasks}' "$RESULT_PATH"
            exit 1
          fi
          gh workflow run chatgpt-auto-confirm-runner.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f previous_run_id="$GITHUB_RUN_ID" \
            -f account_id="$ACCOUNT_ID" \
            -f restore_latest_credentials=true
          echo "Dispatched continuation from run $GITHUB_RUN_ID."
