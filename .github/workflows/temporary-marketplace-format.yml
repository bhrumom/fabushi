name: Temporary marketplace formatter

on:
  push:
    branches:
      - codex/mahayana-marketplace-parallel-20260726-r16

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mahayana-marketplace-parallel-20260726-r16
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Mahayana workspace and push
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- third_party/mahayana/mahayana-rs/mahayana-ffi/src/lib.rs
          git commit -m "Format marketplace runtime changes"
          git push origin HEAD:codex/mahayana-marketplace-parallel-20260726-r16
