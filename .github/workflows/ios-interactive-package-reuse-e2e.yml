name: iOS interactive package reuse E2E

on:
  workflow_dispatch:
    inputs:
      origin_run_id:
        description: Exact Actions run that uploaded the Simulator package and UI harness
        required: true
        type: string
      package_source_sha:
        description: Exact 40-character source SHA of the packaged iOS app
        required: true
        type: string

concurrency:
  group: ios-interactive-package-reuse-${{ inputs.package_source_sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  reuse-global-dharma-journey:
    name: Reuse exact iOS package and rerun Global Dharma journey
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVICE_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-interactive
      ORIGIN_RUN_ID: ${{ inputs.origin_run_id }}
      PACKAGE_SOURCE_SHA: ${{ inputs.package_source_sha }}
      FABUSHI_API_BASE_URL: ${{ vars.FABUSHI_API_BASE_URL || 'https://api.ombhrum.com' }}
    steps:
      - name: Checkout workflow and protected account helpers
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Initialize evidence paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "FABUSHI_ACCOUNT_SESSION_FILE=$RUNNER_TEMP/fabushi-account/session.json"
            echo "FABUSHI_CI_ACCOUNT_SESSION_FILE=$RUNNER_TEMP/fabushi-ci-app/session.json"
            echo "EVIDENCE_DIR=$GITHUB_WORKSPACE/ios-interactive-reuse-evidence"
            echo "PACKAGE_DIR=$GITHUB_WORKSPACE/ios-reused-package"
            echo "DERIVED_DATA=$RUNNER_TEMP/fabushi-ios-derived"
          } >> "$GITHUB_ENV"
          mkdir -p ios-interactive-reuse-evidence/steps ios-reused-package

      - id: provenance
        name: Verify exact origin run and reusable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ORIGIN_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PACKAGE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          origin_json="$EVIDENCE_DIR/origin-run.json"
          artifacts_json="$EVIDENCE_DIR/origin-artifacts.json"
          compare_json="$EVIDENCE_DIR/package-to-workflow-compare.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGIN_RUN_ID" > "$origin_json"
          test "$(jq -r '.head_sha' "$origin_json")" = "$PACKAGE_SOURCE_SHA"
          test "$(jq -r '.repository.full_name' "$origin_json")" = "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGIN_RUN_ID/artifacts?per_page=100" > "$artifacts_json"
          artifact_name="fabushi-ios-simulator-test-$PACKAGE_SOURCE_SHA"
          test "$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' "$artifacts_json")" = 1
          artifact_id="$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name == $name and .expired == false) | .id' "$artifacts_json")"
          gh api "repos/$GITHUB_REPOSITORY/compare/$PACKAGE_SOURCE_SHA...$GITHUB_SHA" > "$compare_json"
          incompatible="$(jq -r '[.files[].filename | select(startswith("mobile/ios/") or startswith("third_party/mahayana/mahayana-rs/") or startswith("native/mahayana-messaging/"))] | .[]' "$compare_json")"
          if [ -n "$incompatible" ]; then printf '%s\n' "$incompatible" >&2; exit 1; fi
          printf 'workflow_sha=%s\npackage_source_sha=%s\norigin_run_id=%s\norigin_artifact_id=%s\ndevice_id=%s\n' \
            "$GITHUB_SHA" "$PACKAGE_SOURCE_SHA" "$ORIGIN_RUN_ID" "$artifact_id" "$DEVICE_ID" > "$EVIDENCE_DIR/source.env"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chatgpt-vps-control/package-lock.json

      - name: Install protected account helper dependencies
        working-directory: chatgpt-vps-control
        run: npm ci --ignore-scripts --prefer-offline

      - id: simulator
        name: Boot isolated Simulator and start recording before package download
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes available -j > "$EVIDENCE_DIR/simulator-runtimes.json"
          xcrun simctl list devices available -j > "$EVIDENCE_DIR/simulator-devices.json"
          pair="$({
            jq -r '[.runtimes[] | select(.isAvailable == true and (.identifier | contains("SimRuntime.iOS-")))] | sort_by(.version | split(".") | map(tonumber)) | reverse | .[].identifier' "$EVIDENCE_DIR/simulator-runtimes.json" | while IFS= read -r runtime; do
              udid="$(jq -r --arg runtime "$runtime" '.devices[$runtime] // [] | map(select(.isAvailable == true)) | first | .udid // empty' "$EVIDENCE_DIR/simulator-devices.json")"
              if [ -n "$udid" ]; then printf '%s|%s\n' "$runtime" "$udid"; break; fi
            done
          } || true)"
          runtime="${pair%%|*}"
          udid="${pair#*|}"
          test -n "$runtime" && test -n "$udid" && test "$runtime" != "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          printf 'runtime=%s\nudid=%s\n' "$runtime" "$udid" > "$EVIDENCE_DIR/simulator-selection.env"
          xcrun simctl shutdown "$udid" 2>/dev/null || true
          xcrun simctl erase "$udid"
          xcrun simctl rename "$udid" "Fabushi-iOS-Reuse-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl io "$udid" screenshot "$EVIDENCE_DIR/steps/000-simulator-booted.png"
          xcrun simctl io "$udid" recordVideo --codec=h264 "$EVIDENCE_DIR/ios-session.mp4" > "$EVIDENCE_DIR/video-recorder.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/video-recorder.pid"

      - name: Download exact existing Simulator package and UI harness
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ steps.provenance.outputs.artifact_name }}
          path: ios-reused-package
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.origin_run_id }}
          digest-mismatch: error

      - id: package
        name: Verify package checksum and exact UI harness identity
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${PACKAGE_SOURCE_SHA:0:12}"
          archive="$PACKAGE_DIR/Fabushi-iOS-Simulator-${short_sha}.zip"
          test -f "$archive" && test -f "$PACKAGE_DIR/SHA256SUMS.txt"
          expected="$(awk 'NF { print $1 }' "$PACKAGE_DIR/SHA256SUMS.txt")"
          actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$expected" = "$actual"
          app_root="$RUNNER_TEMP/fabushi-ios-reused-app"
          rm -rf "$app_root" "$DERIVED_DATA"
          mkdir -p "$app_root" "$DERIVED_DATA/Build/Products"
          ditto -x -k "$archive" "$app_root"
          app="$app_root/Fabushi.app"
          test -d "$app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = com.ombhrum.fabushi
          test -d "$PACKAGE_DIR/ui-harness/Debug-iphonesimulator/Fabushi.app"
          test -d "$PACKAGE_DIR/ui-harness/Debug-iphonesimulator/FabushiUITests-Runner.app"
          xctestrun="$(find "$PACKAGE_DIR/ui-harness" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          test -f "$xctestrun"
          test "$(shasum -a 256 "$app/Fabushi" | awk '{print $1}')" = "$(shasum -a 256 "$PACKAGE_DIR/ui-harness/Debug-iphonesimulator/Fabushi.app/Fabushi" | awk '{print $1}')"
          cp "$xctestrun" "$DERIVED_DATA/Build/Products/"
          ditto "$PACKAGE_DIR/ui-harness/Debug-iphonesimulator" "$DERIVED_DATA/Build/Products/Debug-iphonesimulator"
          portable_xctestrun="$(find "$DERIVED_DATA/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          printf '%s  %s\n' "$actual" "$(basename "$archive")" > "$EVIDENCE_DIR/reused-package-sha256.txt"
          echo "app_path=$app" >> "$GITHUB_OUTPUT"
          echo "xctestrun=$portable_xctestrun" >> "$GITHUB_OUTPUT"

      - id: install
        name: Install reused package before protected account login
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          APP_PATH: ${{ steps.package.outputs.app_path }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl install "$UDID" "$APP_PATH"
          app_container="$(xcrun simctl get_app_container "$UDID" com.ombhrum.fabushi data)"
          test -d "$app_container"
          echo "app_container=$app_container" >> "$GITHUB_OUTPUT"
          xcrun simctl spawn "$UDID" defaults write com.ombhrum.fabushi fabushi.mobile.onboarding-complete.v1 -bool YES
          xcrun simctl io "$UDID" screenshot "$EVIDENCE_DIR/steps/001-app-installed.png"

      - name: Login protected Fabushi account after exact package installation
        env:
          FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
          FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FABUSHI_CI_TEST_USERNAME" && test -n "$FABUSHI_CI_TEST_PASSWORD"
          mkdir -p "$(dirname "$FABUSHI_ACCOUNT_SESSION_FILE")" "$(dirname "$FABUSHI_CI_ACCOUNT_SESSION_FILE")"
          chmod 700 "$(dirname "$FABUSHI_ACCOUNT_SESSION_FILE")" "$(dirname "$FABUSHI_CI_ACCOUNT_SESSION_FILE")"
          node chatgpt-vps-control/scripts/login-ci-test-account.mjs
          node chatgpt-vps-control/scripts/export-ci-app-account-session.mjs
          chmod 600 "$FABUSHI_CI_ACCOUNT_SESSION_FILE"

      - id: launch
        name: Inject bounded session and require reused App-owned registration
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          APP_CONTAINER: ${{ steps.install.outputs.app_container }}
        shell: bash
        run: |
          set -euo pipefail
          app_session="$APP_CONTAINER/Documents/fabushi-ci-session.json"
          cp "$FABUSHI_CI_ACCOUNT_SESSION_FILE" "$app_session"
          chmod 600 "$app_session"
          trace="$APP_CONTAINER/Library/Application Support/com.ombhrum.fabushi/device-gateway-trace.jsonl"
          mkdir -p "$(dirname "$trace")"
          : > "$trace"
          echo "app_session=$app_session" >> "$GITHUB_OUTPUT"
          echo "trace_path=$trace" >> "$GITHUB_OUTPUT"
          export SIMCTL_CHILD_GITHUB_ACTIONS=true
          export SIMCTL_CHILD_FABUSHI_CI_ACCOUNT_SESSION_FILE="$app_session"
          export SIMCTL_CHILD_GITHUB_REPOSITORY="$GITHUB_REPOSITORY"
          export SIMCTL_CHILD_GITHUB_WORKFLOW="$GITHUB_WORKFLOW"
          export SIMCTL_CHILD_GITHUB_JOB="$GITHUB_JOB"
          export SIMCTL_CHILD_GITHUB_RUN_ID="$GITHUB_RUN_ID"
          export SIMCTL_CHILD_GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
          export SIMCTL_CHILD_GITHUB_SHA="$PACKAGE_SOURCE_SHA"
          export SIMCTL_CHILD_RUNNER_NAME="$RUNNER_NAME"
          export SIMCTL_CHILD_RUNNER_OS="$RUNNER_OS"
          export SIMCTL_CHILD_RUNNER_ARCH="$RUNNER_ARCH"
          export SIMCTL_CHILD_FABUSHI_DEVICE_NAME="Fabushi Test iOS Reused Package $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          xcrun simctl launch --terminate-running-process --stdout="$EVIDENCE_DIR/app.stdout.log" --stderr="$EVIDENCE_DIR/app.stderr.log" \
            "$UDID" com.ombhrum.fabushi | tee "$EVIDENCE_DIR/app-launch.txt"
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if grep -q '"phase":"registered"' "$trace" 2>/dev/null; then
              xcrun simctl io "$UDID" screenshot "$EVIDENCE_DIR/steps/002-app-registered.png"
              exit 0
            fi
            sleep 2
          done
          cat "$trace" >&2 || true
          exit 1

      - name: Run autonomous journey against the exact reused package
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          XCTESTRUN: ${{ steps.package.outputs.xctestrun }}
          FABUSHI_CI_APP_SESSION_IN_SIMULATOR: ${{ steps.launch.outputs.app_session }}
          FABUSHI_E2E_SOURCE_SHA: ${{ env.PACKAGE_SOURCE_SHA }}
          FABUSHI_E2E_SCREENSHOT_DIR: ${{ github.workspace }}/ios-interactive-reuse-evidence/steps
          FABUSHI_E2E_STATE_FILE: ${{ github.workspace }}/ios-interactive-reuse-evidence/global-dharma-ui-state.json
          FABUSHI_DEVICE_NAME: Fabushi Test iOS Reused Package ${{ github.run_id }}/${{ github.run_attempt }}
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$EVIDENCE_DIR/GlobalDharmaReuseJourney.xcresult"
          xcodebuild -xctestrun "$XCTESTRUN" -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:FabushiUITests/GlobalDharmaJourneyUITests/testGlobalDharmaMarketplaceBotWebMcpCommerceJourney \
            -resultBundlePath "$EVIDENCE_DIR/GlobalDharmaReuseJourney.xcresult" \
            test-without-building | tee "$EVIDENCE_DIR/xcode-global-dharma-reuse.log"

      - name: Verify canonical restore ledger and entitlement again
        shell: bash
        run: |
          set -euo pipefail
          access_token="$(jq -r '.accessToken // empty' "$FABUSHI_CI_ACCOUNT_SESSION_FILE")"
          test ${#access_token} -ge 24
          auth=(-H "Authorization: Bearer $access_token" -H 'Accept: application/json')
          entitlement="$FABUSHI_API_BASE_URL/v1/plugins/global-dharma/entitlements/local.prayer-wheel.start"
          curl --fail-with-body --silent --show-error "${auth[@]}" "$entitlement" > "$EVIDENCE_DIR/entitlement-before-restore.json"
          jq -e '.purchaseOptions[] | select(.sku == "local-prayer-wheel.lifetime" and .currency == "CNY" and .amount == 108000 and .productKind == "digital_durable")' "$EVIDENCE_DIR/entitlement-before-restore.json" >/dev/null
          curl --fail-with-body --silent --show-error -X POST "${auth[@]}" -H 'Content-Type: application/json' --data '{}' \
            "$FABUSHI_API_BASE_URL/v1/purchases/restore" > "$EVIDENCE_DIR/purchase-restore.json"
          jq -e '.restored == true and any(.purchases[]?; .pluginId == "global-dharma" and .sku == "local-prayer-wheel.lifetime" and .currency == "CNY" and .amount == 108000 and .status == "fulfilled")' "$EVIDENCE_DIR/purchase-restore.json" >/dev/null
          curl --fail-with-body --silent --show-error "${auth[@]}" "$entitlement" > "$EVIDENCE_DIR/entitlement-after-restore.json"
          jq -e '.access.allowed == true and .entitlement.status == "active"' "$EVIDENCE_DIR/entitlement-after-restore.json" >/dev/null
          echo passed > "$EVIDENCE_DIR/canonical-commerce-status.txt"

      - name: Observe optional external fabushi test evidence without blocking
        if: always() && steps.launch.outcome == 'success'
        continue-on-error: true
        env:
          TRACE_PATH: ${{ steps.launch.outputs.trace_path }}
        shell: bash
        run: |
          set -euo pipefail
          required=(fabushi.app.status fabushi.app.snapshot fabushi.app.find fabushi.app.action fabushi.app.wait fabushi.app.assert)
          missing=0
          for tool in "${required[@]}"; do jq -e --arg tool "$tool" 'select(.phase == "call-completed" and .ok == true and .toolName == $tool)' "$TRACE_PATH" >/dev/null 2>&1 || missing=1; done
          if [ "$missing" -eq 0 ]; then echo passed > "$EVIDENCE_DIR/external-control-status.txt"; else echo optional-not-observed > "$EVIDENCE_DIR/external-control-status.txt"; fi

      - name: Collect complete reused-package evidence
        if: always()
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          TRACE_PATH: ${{ steps.launch.outputs.trace_path }}
        shell: bash
        run: |
          set +e
          if [ -f "$EVIDENCE_DIR/video-recorder.pid" ]; then video_pid="$(cat "$EVIDENCE_DIR/video-recorder.pid")"; kill -INT "$video_pid" 2>/dev/null || true; wait "$video_pid" 2>/dev/null || true; fi
          xcrun simctl io "$UDID" screenshot "$EVIDENCE_DIR/steps/1000-final.png" 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --style compact --last 20m --predicate 'process == "Fabushi"' > "$EVIDENCE_DIR/fabushi-system.log" 2>&1 || true
          if [ -n "${TRACE_PATH:-}" ] && [ -f "$TRACE_PATH" ]; then cp "$TRACE_PATH" "$EVIDENCE_DIR/device-gateway-trace.jsonl"; else : > "$EVIDENCE_DIR/device-gateway-trace.jsonl"; fi
          ui_status=failed
          test -f "$EVIDENCE_DIR/global-dharma-ui-state.json" && jq -e '.autoLogin and .searchedMiniApps and .globalDharmaVisible and .installedOrAlreadyInstalled and .botVisible and .naturalLanguageSent and .webMcpReady and .sharedRuntimeSynced and .entitlementAllowed and .restoreTapped' "$EVIDENCE_DIR/global-dharma-ui-state.json" >/dev/null 2>&1 && ui_status=passed
          commerce_status="$(cat "$EVIDENCE_DIR/canonical-commerce-status.txt" 2>/dev/null || echo failed)"
          external_status="$(cat "$EVIDENCE_DIR/external-control-status.txt" 2>/dev/null || echo optional-not-observed)"
          jq -n --arg workflowSha "$GITHUB_SHA" --arg packageSourceSha "$PACKAGE_SOURCE_SHA" --arg originRunId "$ORIGIN_RUN_ID" \
            --arg runId "$GITHUB_RUN_ID" --arg deviceId "$DEVICE_ID" --arg uiStatus "$ui_status" --arg commerceStatus "$commerce_status" --arg externalStatus "$external_status" \
            '{schema:"fabushi.ios.global-dharma-reuse-evidence.v2",workflowSha:$workflowSha,packageSourceSha:$packageSourceSha,originRunId:$originRunId,runId:$runId,deviceId:$deviceId,uiJourney:$uiStatus,canonicalCommerce:$commerceStatus,externalFabushiTest:$externalStatus}' \
            > "$EVIDENCE_DIR/report.json"

      - name: Upload complete evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabushi-ios-global-dharma-reuse-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ios-interactive-reuse-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Delete isolated Simulator
        if: always()
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        shell: bash
        run: |
          set +e
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl delete "$UDID" 2>/dev/null || true
