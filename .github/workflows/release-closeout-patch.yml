name: Release closeout patch

on:
  push:
    branches:
      - codex/release-close-hydration-20260829
    paths:
      - .github/workflows/release-closeout-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message != 'chore: apply release closeout patch'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/release-close-hydration-20260829
          fetch-depth: 0
      - name: Apply verified release fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('desktop/src/messaging-shell-v2.tsx')
          source = path.read_text()
          old = """    } catch (cause) {\n      updateComposer(text);\n      setPendingSend(false);\n      setError(cause instanceof Error ? cause.message : String(cause));\n    }\n  }\n"""
          new = """    } catch (cause) {\n      updateComposer(text);\n      setError(cause instanceof Error ? cause.message : String(cause));\n    } finally {\n      setPendingSend(false);\n    }\n  }\n"""
          if old not in source:
              raise SystemExit('pendingSend release patch target not found')
          path.write_text(source.replace(old, new, 1))

          workflow = Path('.github/workflows/interactive-runner-mcp.yml')
          source = workflow.read_text()
          old_runner = '$' + '{{ runner.temp }}/fabushi-interactive'
          new_runner = '$' + '{{ github.workspace }}/.fabushi-interactive'
          if old_runner not in source:
              raise SystemExit('runner.temp release patch target not found')
          workflow.write_text(source.replace(old_runner, new_runner))
          PY
          rm .github/workflows/release-closeout-patch.yml
          git diff --check
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/src/messaging-shell-v2.tsx .github/workflows/interactive-runner-mcp.yml .github/workflows/release-closeout-patch.yml
          git commit -m 'chore: apply release closeout patch'
          git push origin HEAD:codex/release-close-hydration-20260829
