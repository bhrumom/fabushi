name: Mahayana Harness marker finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/mahayana-harness-finalize.marker'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Correct deterministic patch anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/mahayana_harness_finalize.py')
          text = path.read_text()
          text = text.replace(
              'pub fn register_service(&self, id: impl Into<String>)',
              'pub fn register_service(&self, name: impl Into<String>)',
          )
          path.write_text(text)
          PY

      - name: Apply deterministic source patch
        run: python3 scripts/mahayana_harness_finalize.py

      - name: Format Harness stack
        working-directory: third_party/mahayana/mahayana-rs
        run: |
          cargo fmt \
            -p mahayana-harness \
            -p mahayana-harness-services \
            -p mahayana-harness-advanced \
            -p mahayana-harness-adapters \
            -p mahayana-harness-agent \
            -p mahayana-harness-protocol \
            -p mahayana-unified-app-host

      - name: Refresh workspace lockfile
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo generate-lockfile

      - name: Test Harness stack and persist diagnostics on failure
        shell: bash
        run: |
          set +e
          cd third_party/mahayana/mahayana-rs
          cargo test --profile ci \
            -p mahayana-harness \
            -p mahayana-harness-services \
            -p mahayana-harness-advanced \
            -p mahayana-harness-adapters \
            -p mahayana-harness-agent \
            -p mahayana-harness-protocol \
            -p mahayana-unified-app-host \
            > "$GITHUB_WORKSPACE/.github/harness-test-failure.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cd "$GITHUB_WORKSPACE"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m 'chore(mahayana): capture harness test failure'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            exit "$status"
          fi
          rm -f "$GITHUB_WORKSPACE/.github/harness-test-failure.log"

      - name: Clippy Harness stack
        working-directory: third_party/mahayana/mahayana-rs
        run: >-
          cargo clippy
          -p mahayana-harness
          -p mahayana-harness-services
          -p mahayana-harness-advanced
          -p mahayana-harness-adapters
          -p mahayana-harness-agent
          -p mahayana-harness-protocol
          -p mahayana-unified-app-host
          --all-targets -- -D warnings

      - name: Commit verified integration and clean one-shot helpers
        run: |
          set -euo pipefail
          rm -f .github/mahayana-harness-finalize.marker
          rm -f .github/workflows/mahayana-harness-marker-finalize.yml
          rm -f .github/workflows/mahayana-harness-schedule-bridge-once.yml
          rm -f .github/workflows/mahayana-harness-finalize-once.yml
          rm -f .github/workflows/mahayana-harness-finalize-pr-once.yml
          rm -f scripts/mahayana_harness_finalize.py
          rm -f .github/harness-test-failure.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(mahayana): finalize Rust-native Harness product integration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}