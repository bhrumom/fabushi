name: Mahayana Harness marker finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/mahayana-harness-finalize.marker'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Restore Harness Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: mahayana-harness-final-v1
          cache-all-crates: true

      - name: Correct deterministic patch template
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/mahayana_harness_finalize.py')
          text = path.read_text()
          text = text.replace(
              'pub fn register_service(&self, id: impl Into<String>)',
              'pub fn register_service(&self, name: impl Into<String>)',
          )
          text = text.replace(
              'Ok(self.state()?.schedules.values().cloned().collect())',
              'Ok(self.lock_state()?.schedules.values().cloned().collect())',
          )
          text = text.replace(
              '        self.state()?\n            .schedules\n            .get',
              '        self.lock_state()?\n            .schedules\n            .get',
          )
          text = text.replace(
              '        self.state()?\n            .schedules\n            .remove',
              '        self.lock_state()?\n            .schedules\n            .remove',
          )
          text = text.replace(
              'harness.shares_state_with(services.harness())',
              'harness.shares_state_with(&services.harness())',
          )
          path.write_text(text)
          PY

      - name: Apply deterministic source patch
        run: python3 scripts/mahayana_harness_finalize.py

      - name: Reconcile Services with current Harness API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('third_party/mahayana/mahayana-rs')

          core = root / 'mahayana-harness/src/lib.rs'
          text = core.read_text()
          if 'NotFound(String),' not in text:
              anchor = '    #[error("state mutex is poisoned")]\n    StatePoisoned,\n'
              extra = '''    #[error("not found: {0}")]
    NotFound(String),
    #[error("invalid request: {0}")]
    InvalidRequest(String),
    #[error("policy denied: {0}")]
    PolicyDenied(String),
    #[error("serialization failed: {0}")]
    Serialization(String),
    #[error("invalid state: {0}")]
    InvalidState(String),
'''
              if anchor not in text:
                  raise SystemExit('missing core error anchor')
              text = text.replace(anchor, extra + anchor, 1)
          if 'impl Default for MahayanaHarness' not in text:
              anchor = 'impl MahayanaHarness {\n'
              default_impl = '''impl Default for MahayanaHarness {
    fn default() -> Self {
        Self::new(BuildProfile::DesktopFull)
    }
}

'''
              if anchor not in text:
                  raise SystemExit('missing harness impl anchor')
              text = text.replace(anchor, default_impl + anchor, 1)
          if 'pub fn sessions(&self)' not in text:
              anchor = '    pub fn snapshot(&self) -> HarnessResult<RuntimeSnapshot> {\n'
              method = '''    pub fn sessions(&self) -> HarnessResult<Vec<SessionRecord>> {
        Ok(self.state()?.sessions.values().cloned().collect())
    }

'''
              if anchor not in text:
                  raise SystemExit('missing snapshot anchor')
              text = text.replace(anchor, method + anchor, 1)
          core.write_text(text)

          services = root / 'mahayana-harness-services/src/lib.rs'
          text = services.read_text()
          text = text.replace(
              'use mahayana_tool_host::{ToolRequest, ToolResult};',
              'use mahayana_tool_host::ToolResult;',
          )
          text = text.replace('use std::path::PathBuf;\n', '')
          text = text.replace(
              '    pub fn runtime_snapshot(&self) -> RuntimeSnapshot {\n        self.harness.snapshot()\n    }',
              '    pub fn runtime_snapshot(&self) -> HarnessResult<RuntimeSnapshot> {\n        self.harness.snapshot()\n    }',
          )
          if 'pub fn snapshot(&self) -> HarnessResult<Value>' not in text:
              anchor = '    pub fn providers(&self) -> Arc<Mutex<ProviderSet>> {\n'
              method = '''    pub fn snapshot(&self) -> HarnessResult<Value> {
        let state = self.lock_state()?;
        Ok(serde_json::json!({
            "runtime": self.harness.snapshot()?,
            "promptSections": state.prompt_sections.values().cloned().collect::<Vec<_>>(),
            "workspaces": state.workspaces.values().cloned().collect::<Vec<_>>(),
            "settings": state.settings.values().cloned().collect::<Vec<_>>(),
            "attachments": state.attachments.values().cloned().collect::<Vec<_>>(),
            "spills": state.spills.values().cloned().collect::<Vec<_>>(),
            "todos": state.todos.values().cloned().collect::<Vec<_>>(),
            "plans": state.plans.values().cloned().collect::<Vec<_>>(),
            "schedules": state.schedules.values().cloned().collect::<Vec<_>>(),
            "feedback": state.feedback.values().cloned().collect::<Vec<_>>(),
            "identity": state.identity.clone(),
            "teams": state.teams.values().cloned().collect::<Vec<_>>(),
            "skills": state.skills.values().cloned().collect::<Vec<_>>(),
            "commands": state.commands.values().cloned().collect::<Vec<_>>(),
            "contextFragments": state.context_fragments.values().cloned().collect::<Vec<_>>()
        }))
    }

'''
              if anchor not in text:
                  raise SystemExit('missing providers anchor')
              text = text.replace(anchor, method + anchor, 1)
          text = text.replace(
              '    pub fn search_sessions(&self, query: &str) -> HarnessResult<Vec<SessionSearchHit>> {',
              '    pub fn search_sessions(&self, query: &str, limit: usize) -> HarnessResult<Vec<SessionSearchHit>> {',
          )
          search_start = text.find('    pub fn search_sessions(&self, query: &str, limit: usize)')
          if search_start != -1:
              search_end = text.find('    pub fn hash_bytes', search_start)
              block = text[search_start:search_end]
              if 'hits.truncate(limit);' not in block:
                  block = block.replace('        Ok(hits)\n', '        hits.truncate(limit);\n        Ok(hits)\n', 1)
                  text = text[:search_start] + block + text[search_end:]
          text = text.replace('services.search_sessions("lotus").unwrap()', 'services.search_sessions("lotus", 20).unwrap()')
          text = text.replace('MahayanaHarness::new()', 'MahayanaHarness::default()')
          services.write_text(text)
          PY

      - name: Format Harness stack
        working-directory: third_party/mahayana/mahayana-rs
        run: |
          cargo fmt \
            -p mahayana-harness \
            -p mahayana-harness-services \
            -p mahayana-harness-advanced \
            -p mahayana-harness-adapters \
            -p mahayana-harness-agent \
            -p mahayana-harness-protocol \
            -p mahayana-unified-app-host

      - name: Test Harness stack
        id: harness_test
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cd third_party/mahayana/mahayana-rs
          cargo test --profile ci \
            -p mahayana-harness \
            -p mahayana-harness-services \
            -p mahayana-harness-advanced \
            -p mahayana-harness-adapters \
            -p mahayana-harness-agent \
            -p mahayana-harness-protocol \
            -p mahayana-unified-app-host \
            > "$GITHUB_WORKSPACE/.github/harness-test.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/.github/harness-test-status.txt"
          exit 0

      - name: Upload Harness test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-test-diagnostics-${{ github.run_id }}
          path: |
            .github/harness-test.log
            .github/harness-test-status.txt
          if-no-files-found: error
          retention-days: 3

      - name: Fail if Harness tests failed
        shell: bash
        run: |
          status="$(cat .github/harness-test-status.txt)"
          if [ "$status" -ne 0 ]; then
            tail -n 250 .github/harness-test.log
            exit "$status"
          fi

      - name: Clippy Harness stack
        working-directory: third_party/mahayana/mahayana-rs
        run: >-
          cargo clippy
          -p mahayana-harness
          -p mahayana-harness-services
          -p mahayana-harness-advanced
          -p mahayana-harness-adapters
          -p mahayana-harness-agent
          -p mahayana-harness-protocol
          -p mahayana-unified-app-host
          --all-targets -- -D warnings

      - name: Commit verified Rust product sources
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            third_party/mahayana/mahayana-rs/Cargo.lock \
            third_party/mahayana/mahayana-rs/mahayana-harness \
            third_party/mahayana/mahayana-rs/mahayana-harness-services \
            third_party/mahayana/mahayana-rs/mahayana-harness-advanced \
            third_party/mahayana/mahayana-rs/mahayana-harness-adapters \
            third_party/mahayana/mahayana-rs/mahayana-harness-agent \
            third_party/mahayana/mahayana-rs/mahayana-harness-protocol \
            third_party/mahayana/mahayana-rs/mahayana-unified-app-host
          if git diff --cached --quiet; then
            echo 'Verified Harness sources already match the branch.'
          else
            git commit -m 'feat(mahayana): finalize verified Rust-native Harness semantics'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Export verified patch
        if: success()
        shell: bash
        run: |
          git diff --binary > .github/harness-final.patch

      - name: Upload verified patch
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: harness-verified-patch-${{ github.run_id }}
          path: .github/harness-final.patch
          if-no-files-found: warn
          retention-days: 3
