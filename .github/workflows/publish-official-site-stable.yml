name: Publish official site stable download state

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to publish as the official site stable version.
        required: true
        type: string
      android_asset_name:
        description: Optional APK asset name. Leave empty to use the first APK in the release.
        required: false
        type: string
      summary_override:
        description: Optional one-line summary to prepend to the stable release update notes.
        required: false
        type: string

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  publish-stable-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sync stable Android APK to R2
        id: sync_android_r2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ANDROID_ASSET_NAME: ${{ inputs.android_asset_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN || vars.WRANGLER_API_TOKEN || vars.CLOUDFLARE_TOKEN || vars.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CF_ACCOUNT || secrets.CLOUDFLARE_ACCOUNT || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || vars.CF_ACCOUNT || vars.CLOUDFLARE_ACCOUNT }}
          OFFICIAL_SITE_R2_BUCKET: ${{ vars.OFFICIAL_SITE_R2_BUCKET || 'bushi' }}
          OFFICIAL_SITE_ANDROID_STABLE_R2_OBJECT_KEY: ${{ vars.OFFICIAL_SITE_ANDROID_STABLE_R2_OBJECT_KEY || 'downloads/android/fabushi-android-stable.apk' }}
          OFFICIAL_SITE_R2_PUBLIC_BASE_URL: ${{ vars.OFFICIAL_SITE_R2_PUBLIC_BASE_URL || '' }}
        run: |
          set -euo pipefail
          apk_dir="$RUNNER_TEMP/android-stable-r2"
          mkdir -p "$apk_dir"

          if [ -n "${ANDROID_ASSET_NAME:-}" ]; then
            gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" --pattern "$ANDROID_ASSET_NAME" --dir "$apk_dir" --clobber
          else
            gh release download "$RELEASE_TAG" --repo "$RELEASE_REPO" --pattern '*.apk' --dir "$apk_dir" --clobber
          fi

          mapfile -t apk_files < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' | sort)
          apk_path=""
          for file in "${apk_files[@]}"; do
            if basename "$file" | grep -qi 'arm64'; then
              apk_path="$file"
              break
            fi
          done
          if [ -z "$apk_path" ] && [ "${#apk_files[@]}" -gt 0 ]; then
            apk_path="${apk_files[0]}"
          fi
          if [ -z "$apk_path" ]; then
            echo "No APK asset was found in the selected release." >&2
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare credentials are required to sync the stable Android APK to R2." >&2
            exit 1
          fi

          bucket="${OFFICIAL_SITE_R2_BUCKET:-bushi}"
          object_key="${OFFICIAL_SITE_ANDROID_STABLE_R2_OBJECT_KEY:-downloads/android/fabushi-android-stable.apk}"
          public_base="${OFFICIAL_SITE_R2_PUBLIC_BASE_URL:-}"

          npx --yes wrangler@latest r2 object put "$bucket/$object_key" \
            --file "$apk_path" \
            --content-type application/vnd.android.package-archive \
            --cache-control no-store \
            --force \
            --remote

          if [ -z "$public_base" ]; then
            dev_url_output="$(npx --yes wrangler@latest r2 bucket dev-url get "$bucket" 2>&1 || true)"
            public_base="$(printf '%s\n' "$dev_url_output" | sed -nE "s/.*'(https:\/\/[^']+)'.*/\1/p" | tail -n 1)"
          fi

          if [ -z "$public_base" ]; then
            echo "Could not resolve an R2 public URL for bucket $bucket. Set OFFICIAL_SITE_R2_PUBLIC_BASE_URL." >&2
            exit 1
          fi

          android_r2_href="${public_base%/}/${object_key}"
          echo "android_r2_href=$android_r2_href" >> "$GITHUB_OUTPUT"

      - name: Generate stable state asset for the official site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ANDROID_ASSET_NAME: ${{ inputs.android_asset_name }}
          SUMMARY_OVERRIDE: ${{ inputs.summary_override }}
          ANDROID_APK_PUBLIC_HREF: ${{ steps.sync_android_r2.outputs.android_r2_href }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          release_repo = os.environ["RELEASE_REPO"]
          release_tag = os.environ["RELEASE_TAG"]
          requested_asset_name = os.environ.get("ANDROID_ASSET_NAME", "").strip()
          summary_override = os.environ.get("SUMMARY_OVERRIDE", "").strip()
          android_apk_public_href = os.environ.get("ANDROID_APK_PUBLIC_HREF", "").strip()
          if not android_apk_public_href:
              raise SystemExit("ANDROID_APK_PUBLIC_HREF is required after syncing the stable APK to R2.")

          release = json.loads(
              subprocess.check_output(
                  ["gh", "api", f"repos/{release_repo}/releases/tags/{release_tag}"],
                  text=True,
              )
          )
          assets = release.get("assets", [])

          apk_assets = [asset for asset in assets if asset.get("name", "").endswith(".apk")]
          if not apk_assets:
              raise SystemExit("No APK asset was found in the selected release.")

          if requested_asset_name:
              apk_asset = next(
                  (asset for asset in apk_assets if asset.get("name") == requested_asset_name),
                  None,
              )
              if apk_asset is None:
                  raise SystemExit(f"APK asset '{requested_asset_name}' was not found in the selected release.")
          else:
              apk_asset = next((asset for asset in apk_assets if "arm64" in asset.get("name", "")), apk_assets[0])

          def extract_summary(body: str | None, fallback: str) -> list[str]:
              text = body or ""
              marker = "## Included changes"
              if marker in text:
                  tail = text.split(marker, 1)[1]
                  section = tail.split("\n## ", 1)[0]
              else:
                  section = text
              lines = []
              for raw_line in section.splitlines():
                  line = raw_line.strip()
                  if line.startswith("- "):
                      cleaned = line[2:].strip()
                      if cleaned:
                          lines.append(cleaned)
              return lines[:6] if lines else [fallback]

          summary = extract_summary(release.get("body"), release.get("name") or release_tag)
          if summary_override:
              summary = [summary_override, *summary]

          state = {
              "generatedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "release": {
                  "tag": release_tag,
                  "title": release.get("name") or release_tag,
                  "publishedAt": release.get("published_at"),
              },
              "channels": [
                  {
                      "platform": "Android",
                      "audience": "stable",
                      "status": "人工验证通过",
                      "title": "Android 正式版",
                      "description": "这个入口由人工验证后手动发布到官网，并直接下载 R2 中的正式版 APK。",
                      "primaryLabel": "下载 Android 正式版",
                      "primaryHref": android_apk_public_href,
                      "version": release_tag,
                      "publishedAt": release.get("published_at"),
                      "updateSummary": summary,
                      "mirrorLinks": [],
                      "note": "每次发布新的正式版 Android APK 后，R2 中的安装包会被覆盖为最新版本。",
                  }
              ],
              "notes": [
                  "正式版入口只会在人工验收通过后手动发布到官网，并指向 R2 中的 APK。",
                  "如果后续需要切换到新的正式版，只需要再次运行这个 workflow 并指定新的 release_tag。",
              ],
          }

          with open("OFFICIAL_SITE_STABLE_RELEASE_STATE.json", "w", encoding="utf-8") as handle:
              json.dump(state, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Upload stable state asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" OFFICIAL_SITE_STABLE_RELEASE_STATE.json --repo "$RELEASE_REPO" --clobber

      - name: Write summary
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          {
            echo "## Official site stable state published"
            echo ""
            echo "- Release tag: $RELEASE_TAG"
            echo "- Asset: OFFICIAL_SITE_STABLE_RELEASE_STATE.json"
            echo "- This release is now eligible to appear as the stable download on the official site."
          } >> "$GITHUB_STEP_SUMMARY"

  notify-stable-publish-failure:
    name: Notify official site stable publish failure
    needs:
      - publish-stable-state
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout failure notifier
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/**

      - name: Create or update official site stable publish failure issue
        uses: actions/github-script@v8
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ANDROID_ASSET_NAME: ${{ inputs.android_asset_name || '' }}
        with:
          script: |
            const { createOrUpdateFailureIssue } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/create-failure-issue.js`);
            await createOrUpdateFailureIssue({
              github,
              context,
              core,
              kind: 'official site stable publish',
              titlePrefix: 'Official site stable publish failed for',
              sourceSha: process.env.SOURCE_SHA || context.sha,
              sourceRef: 'workflow_dispatch',
              labelName: 'release-failure',
              labelColor: 'b60205',
              labelDescription: 'Official site release sync failed',
              notifyJobName: 'Notify official site stable publish failure',
              extraSections: [
                '### Official site impact',
                '',
                '- 官网正式版下载入口不会切到这次人工验收通过的安装包。',
                '- 正式版更新说明和 Android R2 下载入口也不会随这次手动发布刷新。',
                '',
                '### Release context',
                '',
                `- Release tag: ${process.env.RELEASE_TAG || 'unknown'}`,
                `- Requested Android asset: ${process.env.ANDROID_ASSET_NAME || 'auto-select first APK'}`,
                '- Check whether the target release contains the intended APK asset and whether the manual inputs match the release assets.',
                '- If metadata generation fails, also verify OFFICIAL_SITE_R2_PUBLIC_BASE_URL formatting.',
              ],
            });
