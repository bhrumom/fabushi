name: Grok native Electron branch bootstrap

on:
  push:
    branches:
      - fix/grok-native-electron-ci-20260815

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format migrated Rust workspace
        run: cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate deterministic Electron lockfile
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit normalized sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -f desktop/package-lock.json ] && git ls-files --error-unmatch desktop/package-lock.json >/dev/null 2>&1; then
            echo 'No normalization changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add third_party/mahayana/mahayana-rs apps/fabushi-tauri/src-tauri/src/lib.rs desktop/package-lock.json
          if git diff --cached --quiet; then
            echo 'No normalization changes were staged.'
            exit 0
          fi
          git commit -m 'style: normalize Rust and Electron lockfile'
          git push origin HEAD:${{ github.ref_name }}
