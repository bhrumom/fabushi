name: Delivery governance contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/CODEOWNERS'
      - '.github/BRANCH_PROTECTION.md'
      - '.github/scripts/require-release-source-gates.sh'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'projects/fabushi-cicd-merge-governance/**'
  push:
    branches: [main]
    paths:
      - '.github/CODEOWNERS'
      - '.github/BRANCH_PROTECTION.md'
      - '.github/scripts/require-release-source-gates.sh'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'projects/fabushi-cicd-merge-governance/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate sensitive delivery governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout governance inputs
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate FCM-023 release isolation and E2E policy
        shell: bash
        run: |
          set -euo pipefail
          fast=.github/workflows/electron-desktop.yml
          reusable=.github/workflows/release-desktop-platform.yml
          for required in release-macos.yml release-windows.yml release-linux.yml native-android-release.yml release-ios.yml; do
            test -s ".github/workflows/$required"
            grep -Fq 'workflow_dispatch:' ".github/workflows/$required"
            grep -Fq 'release_kind:' ".github/workflows/$required"
            grep -Fq 'options: [test, formal]' ".github/workflows/$required"
          done
          ! grep -Fq 'npm run test:e2e' "$fast"
          ! grep -Fq 'npx electron-builder' "$fast"
          grep -Fq 'Electron desktop result' "$fast"
          grep -Fq "inputs.release_kind == 'formal'" "$reusable"
          grep -Fq 'npm run test:e2e' "$reusable"
          grep -Fq -- '--prerelease --latest=false' "$reusable"
          grep -Fq 'Legacy combined release (disabled)' .github/workflows/native-electron-release.yml
          ! grep -Eq '^  (push|pull_request):' .github/workflows/gbf-release-candidate.yml
          ! grep -Eq '^  push:' .github/workflows/native-mobile.yml
          ! grep -Eq '^  release:' .github/workflows/macos-desktop-e2e.yml
          ! grep -Eq '^  workflow_run:' .github/workflows/apple-store-delivery.yml
          ! grep -Eq '^  workflow_run:' .github/workflows/formal-store-delivery-orchestrator.yml
          grep -Fq 'run_e2e:' .github/workflows/native-mobile.yml
          grep -Fq 'inputs.run_e2e == true' .github/workflows/native-mobile.yml

      - name: Validate formal release source gate remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          gate=.github/scripts/require-release-source-gates.sh
          test -s "$gate"
          grep -Fq 'compare/main...$SOURCE_SHA' "$gate"
          grep -Fq 'Required release gate' "$gate"
          for workflow in .github/workflows/apple-store-delivery.yml .github/workflows/google-play-delivery.yml; do
            grep -Fq 'checks: read' "$workflow"
            grep -Fq 'actions: read' "$workflow"
            grep -Fq 'Require canonical release source gates' "$workflow"
            grep -Fq 'require-release-source-gates.sh' "$workflow"
          done

      - name: Validate narrow CODEOWNERS coverage
        shell: bash
        run: |
          set -euo pipefail
          owners=.github/CODEOWNERS
          test -s "$owners"
          if grep -Eq '^\*+[[:space:]]+@' "$owners"; then
            echo 'A repository-wide CODEOWNERS catch-all would add review tax to low-risk changes.' >&2
            exit 1
          fi
          for required in \
            '/.github/workflows/ @bhrum' \
            '/.github/scripts/ @bhrum' \
            '/.github/CODEOWNERS @bhrum' \
            '/projects/fabushi-cicd-merge-governance/ @bhrum' \
            '/third_party/mahayana/mahayana-rs/mahayana-pay-worker/ @bhrum'
          do
            grep -Fqx "$required" "$owners"
          done

      - name: Validate merge-queue invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'CI result' .github/BRANCH_PROTECTION.md
          grep -Fq 'merge queue' .github/BRANCH_PROTECTION.md
          grep -Fq "'.github/workflows/'" .github/workflows/automerge.yml
          grep -Fq "'.github/scripts/'" .github/workflows/automerge.yml

      - name: Summarize governance contract
        run: |
          {
            echo '## FAB-P0003 delivery governance contract'
            echo '- Automatic CI: fast, no long App E2E'
            echo '- Releases: one manual workflow per platform'
            echo '- Test releases: prerelease, no long App E2E'
            echo '- Formal releases: fail-closed E2E/trust gates'
            echo '- Merge queue and sensitive CODEOWNERS: retained'
          } >> "$GITHUB_STEP_SUMMARY"
