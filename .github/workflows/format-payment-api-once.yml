name: Format Payment API Once

on:
  push:
    branches: [feat/fab-p0001-dynamic-fiat-commerce]
    paths:
      - '.github/workflows/format-payment-api-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/fab-p0001-dynamic-fiat-commerce
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Format canonical payment source
        run: rustfmt --edition 2024 third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payment_api.rs
      - name: Commit formatting only
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'fabushi-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/payment_api.rs
          git commit -m 'style(pay): format canonical payment API'
          git push origin HEAD:feat/fab-p0001-dynamic-fiat-commerce
