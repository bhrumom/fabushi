name: Platform Control Plane

on:
  pull_request:
    branches: [main]
    paths:
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-core/**'
      - 'third_party/mahayana/mahayana-rs/Cargo.toml'
      - 'third_party/mahayana/mahayana-rs/Cargo.lock'
      - 'fabushi/web/src/router.js'
      - 'fabushi/web/src/routes/**'
      - 'fabushi/web/src/security/request-gate.js'
      - 'fabushi/web/tests/platform-control-plane.test.js'
      - 'frontend/packages/api-client/src/endpoints.ts'
      - '.github/workflows/platform-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-core/**'
      - 'third_party/mahayana/mahayana-rs/Cargo.toml'
      - 'third_party/mahayana/mahayana-rs/Cargo.lock'
      - 'fabushi/web/src/router.js'
      - 'fabushi/web/src/routes/**'
      - 'fabushi/web/src/security/request-gate.js'
      - 'fabushi/web/tests/platform-control-plane.test.js'
      - 'frontend/packages/api-client/src/endpoints.ts'
      - '.github/workflows/platform-control-plane.yml'
  workflow_dispatch:

concurrency:
  group: platform-control-plane-${{ github.event.pull_request.number || github.ref }}
  # PR checks may be superseded. A main deployment must never be cancelled
  # after a D1 migration has started.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  architecture:
    name: Platform architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs
          cache-on-failure: true
      - name: Test Platform Worker schema and account invariants
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo test -p mahayana-platform-worker --locked
      - name: Compile the production Worker target
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo check -p mahayana-platform-worker --target wasm32-unknown-unknown --locked
      - name: Guard one-control-plane architecture
        working-directory: fabushi/web
        run: node tests/platform-control-plane.test.js

  deploy-production:
    name: Deploy production control plane
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN || vars.WRANGLER_API_TOKEN || vars.CLOUDFLARE_TOKEN || vars.CF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CF_ACCOUNT || secrets.CLOUDFLARE_ACCOUNT || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || vars.CF_ACCOUNT || vars.CLOUDFLARE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "Cloudflare API token is not configured." >&2; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "Cloudflare account id is not configured." >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Cloudflare Worker build tool
        run: cargo install worker-build --locked
      - name: Build the exact main Worker before remote mutation
        working-directory: third_party/mahayana/mahayana-rs/mahayana-platform-worker
        shell: bash
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/mahayana-platform-worker"
      - name: Capture production platform D1 recovery bookmark
        working-directory: third_party/mahayana/mahayana-rs/mahayana-platform-worker
        shell: bash
        run: npx --yes wrangler@4 d1 time-travel info PLATFORM_DB --json | tee "$RUNNER_TEMP/platform-db-recovery-bookmark.json"
      - name: Upload pre-migration recovery bookmark
        uses: actions/upload-artifact@v4
        with:
          name: platform-db-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/platform-db-recovery-bookmark.json
          if-no-files-found: error
          retention-days: 14
      - name: Apply production platform migrations
        working-directory: third_party/mahayana/mahayana-rs/mahayana-platform-worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply PLATFORM_DB --remote 2>&1 | tee "$RUNNER_TEMP/platform-migrations.log"
      - name: Deploy production Mahayana platform Worker
        working-directory: third_party/mahayana/mahayana-rs/mahayana-platform-worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/platform-deploy.log"
      - name: Verify production health and fail-closed remote-control routes
        shell: bash
        run: |
          set -euo pipefail
          direct='https://mahayana-platform.bhrumom.workers.dev'
          public='https://api.ombhrum.com'
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5             "$direct/health" | tee "$RUNNER_TEMP/platform-health.json" | jq -e '.ok == true' >/dev/null
          for endpoint in             "$direct/v1/computers"             "$public/v1/computers"; do
            name="$(printf '%s' "$endpoint" | tr -cs 'A-Za-z0-9' '_')"
            status="$(curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 3               --output "$RUNNER_TEMP/${name}.json" --write-out '%{http_code}' "$endpoint")"
            [ "$status" = 401 ] || { echo "Unauthenticated remote-control route failed closed: $endpoint -> $status" >&2; cat "$RUNNER_TEMP/${name}.json" >&2; exit 1; }
          done
          for endpoint in             "$direct/v1/marketplace/added"             "$public/v1/marketplace/added"; do
            name="$(printf '%s' "$endpoint" | tr -cs 'A-Za-z0-9' '_')"
            status="$(curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 3               --output "$RUNNER_TEMP/${name}.json" --write-out '%{http_code}' "$endpoint")"
            [ "$status" = 401 ] || { echo "Unauthenticated marketplace projection route failed closed: $endpoint -> $status" >&2; cat "$RUNNER_TEMP/${name}.json" >&2; exit 1; }
          done
          for endpoint in             "$direct/v1/marketplace/plugins/global-dharma/add"             "$public/v1/marketplace/plugins/global-dharma/add"; do
            name="$(printf '%s' "$endpoint" | tr -cs 'A-Za-z0-9' '_')"
            status="$(curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 3               --request POST --header 'Content-Type: application/json' --data '{"platform":"smoke"}'               --output "$RUNNER_TEMP/${name}.json" --write-out '%{http_code}' "$endpoint")"
            [ "$status" = 401 ] || { echo "Unauthenticated marketplace install route failed closed: $endpoint -> $status" >&2; cat "$RUNNER_TEMP/${name}.json" >&2; exit 1; }
          done
          for endpoint in             "$direct/v1/ci/runner-session"             "$public/v1/ci/runner-session"; do
            name="$(printf '%s' "$endpoint" | tr -cs 'A-Za-z0-9' '_')"
            status="$(curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 3               --request POST --header 'Content-Type: application/json'               --data '{"deviceId":"gha-smoke-1-interactive","sourceSha":"0000000000000000000000000000000000000000"}'               --output "$RUNNER_TEMP/${name}.json" --write-out '%{http_code}' "$endpoint")"
            [ "$status" = 401 ] || { echo "Unauthenticated CI Runner route failed closed: $endpoint -> $status" >&2; cat "$RUNNER_TEMP/${name}.json" >&2; exit 1; }
          done
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "worker_url=${direct}"
            echo "public_url=${public}"
            echo "health=ok"
            echo "unauthenticated_remote_routes=401"
            echo "unauthenticated_marketplace_account_routes=401"
          } > "$RUNNER_TEMP/platform-deployment-evidence.txt"
      - name: Upload production deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-production-${{ github.sha }}
          path: |
            ${{ runner.temp }}/platform-db-recovery-bookmark.json
            ${{ runner.temp }}/platform-migrations.log
            ${{ runner.temp }}/platform-deploy.log
            ${{ runner.temp }}/platform-health.json
            ${{ runner.temp }}/platform-deployment-evidence.txt
          if-no-files-found: error
          retention-days: 30
