name: GBF-508 apply sidebar groups

on:
  push:
    branches:
      - feat/gbf-508-sidebar-contact-groups
    paths:
      - desktop/scripts/apply-gbf-508-sidebar-groups.mjs
      - .github/workflows/gbf-508-apply-sidebar-groups.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gbf-508-sidebar-contact-groups
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source patch
        run: node desktop/scripts/apply-gbf-508-sidebar-groups.mjs
      - name: Commit patched renderer
        run: |
          if git diff --quiet -- desktop/src/messaging-shell-v2.tsx; then
            echo "No renderer changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/messaging-shell-v2.tsx
          git commit -m "feat(gbf): integrate sidebar contact groups"
          git push origin HEAD:feat/gbf-508-sidebar-contact-groups
