name: Developer Fiat Commerce UI

on:
  push:
    branches: [main, feat/fab-p0001-dynamic-fiat-commerce]
    paths:
      - 'desktop/electron/native-edge.cjs'
      - 'desktop/electron/native-capability-handlers.cjs'
      - 'frontend/apps/web/src/app/miniapps/[id]/commerce/**'
      - '.github/workflows/developer-fiat-commerce-ui.yml'
      - 'projects/telegram-fabushi-integration/management/tasks/M9-PAY-003-global-cn-developer-payouts.md'
  pull_request:
    paths:
      - 'desktop/electron/native-edge.cjs'
      - 'desktop/electron/native-capability-handlers.cjs'
      - 'frontend/apps/web/src/app/miniapps/[id]/commerce/**'
      - '.github/workflows/developer-fiat-commerce-ui.yml'
      - 'projects/telegram-fabushi-integration/management/tasks/M9-PAY-003-global-cn-developer-payouts.md'

permissions:
  contents: read

jobs:
  native-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check desktop/electron/native-edge.cjs
      - run: node --check desktop/electron/native-capability-handlers.cjs
      - name: Verify narrow commerce bridge and no caller authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          edge=Path('desktop/electron/native-edge.cjs').read_text()
          handlers=Path('desktop/electron/native-capability-handlers.cjs').read_text()
          commerce=['getDeveloperCommerceProfile','upsertDeveloperCommerceProfile','listDeveloperCommerceMiniApps','registerDeveloperCommerceMiniApp','listDeveloperCommerceProducts','createDeveloperCommerceProduct','updateDeveloperCommerceProduct','syncDeveloperCommerceGoogleProduct']
          payout=['getDeveloperPayoutOverview','upsertDeveloperPayoutProfile','requestDeveloperPayout','createDeveloperPayoutOnboarding']
          for name in commerce + payout:
              assert name in edge, name
              assert name in handlers, name
          create=handlers[handlers.index('async createDeveloperCommerceProduct'):handlers.index('async updateDeveloperCommerceProduct')]
          payout_request=handlers[handlers.index('async requestDeveloperPayout'):handlers.index('async createDeveloperPayoutOnboarding')]
          onboarding=handlers[handlers.index('async createDeveloperPayoutOnboarding'):handlers.index('async getSharingState')]
          for forbidden in ['developerId','ownerUserId','platformFeeBps']:
              assert forbidden not in create, forbidden
              assert forbidden not in payout_request, forbidden
              assert forbidden not in onboarding, forbidden
          assert 'Number.isSafeInteger(amount)' in create and '2592000' in create
          assert '/v1/developer/commerce/payout/request' in payout_request
          assert 'Number.isSafeInteger(amount)' in payout_request
          assert 'payoutAccountId, currency, amount, idempotencyKey' in payout_request
          assert '/v1/developer/commerce/payout/onboarding' in onboarding
          assert 'lianlian_account_plus' in onboarding and 'stripe_connect' in onboarding
          PY

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build web app with Bot Father Commerce and payouts
        working-directory: frontend
        run: pnpm build:web
