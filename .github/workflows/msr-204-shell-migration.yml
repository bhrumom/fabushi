name: MSR-204 guarded shell migration

on:
  push:
    branches:
      - feat/msr-204-hermes-gateway-transcript
    paths:
      - .github/workflows/msr-204-shell-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[msr-204-shell-migrate]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/msr-204-hermes-gateway-transcript
          fetch-depth: 0

      - name: Apply assertion-guarded AssistantTurn migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('desktop/src/messaging-shell-v2.tsx')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              "import {\n  SidebarContactGroupManager,\n  projectSidebarContactGroups,\n  useSidebarContactGroups,\n} from './sidebar-contact-groups';\n",
              "import {\n  SidebarContactGroupManager,\n  projectSidebarContactGroups,\n  useSidebarContactGroups,\n} from './sidebar-contact-groups';\nimport { MahayanaAssistantTurnView } from './mahayana-assistant-turn-view';\nimport {\n  assistantTurnPlainText,\n  createAssistantTurn,\n  reduceAssistantTurn,\n  type AssistantTurn,\n} from './mahayana-assistant-turn';\n",
              'assistant turn imports',
          )

          replace_once(
              "  kind?: 'message' | 'action' | 'thinking';\n",
              "  kind?: 'message' | 'assistant-turn' | 'action' | 'thinking';\n",
              'display message kind',
          )
          replace_once(
              "  actionStatus?: 'running' | 'completed' | 'failed';\n",
              "  actionStatus?: 'running' | 'completed' | 'failed';\n  assistantTurn?: AssistantTurn;\n",
              'assistant turn payload',
          )

          old_helpers = '''  function clearAgentOperation(operationId: string, terminalStatus: 'completed' | 'failed' = 'completed') {
    if (agentOperationIdRef.current !== operationId) return;
    agentOperationIdRef.current = null;
    setAgentOperationId(null);
    agentRequestPendingRef.current = false;
    setMessages((current) => current
      .filter((message) => !(message.kind === 'thinking' && message.operationId === operationId))
      .map((message) => message.kind === 'action' &&
        message.operationId === operationId &&
        message.actionStatus === 'running'
        ? { ...message, actionStatus: terminalStatus }
        : message));
  }

  function appendAgentThinking(operationId: string, label: string) {
    setMessages((current) => [
      ...current.filter((message) => !(message.kind === 'thinking' && message.operationId === operationId)),
      {
        id: `${operationId}:thinking`,
        source: 'legacy',
        role: 'peer',
        text: '',
        createdAtMs: Date.now(),
        kind: 'thinking',
        operationId,
        actionTitle: label || '正在思考',
        actionStatus: 'running',
      },
    ]);
  }

  function upsertAgentAction(input: {
    id: string;
    operationId: string;
    title: string;
    detail?: string;
    status: 'running' | 'completed' | 'failed';
  }) {
    setMessages((current) => {
      const next: DisplayMessage = {
        id: input.id,
        source: 'legacy',
        role: 'peer',
        text: '',
        createdAtMs: Date.now(),
        kind: 'action',
        operationId: input.operationId,
        actionTitle: input.title,
        actionDetail: input.detail,
        actionStatus: input.status,
      };
      const index = current.findIndex((message) => message.kind === 'action' && message.id === input.id);
      if (index < 0) return [...current, next];
      return current.map((message, messageIndex) => messageIndex === index ? { ...message, ...next } : message);
    });
  }
'''
          new_helpers = '''  function clearAgentOperation(operationId: string) {
    if (agentOperationIdRef.current !== operationId) return;
    agentOperationIdRef.current = null;
    setAgentOperationId(null);
    agentRequestPendingRef.current = false;
  }

  function appendAssistantTurnEvent(event: RuntimeEvent) {
    const operationId = 'operationId' in event && typeof event.operationId === 'string'
      ? event.operationId
      : undefined;
    if (!operationId) return;
    setMessages((current) => {
      const index = current.findIndex((message) =>
        message.kind === 'assistant-turn' && message.operationId === operationId,
      );
      const existingTurn = index >= 0 ? current[index]?.assistantTurn : undefined;
      const assistantTurn = reduceAssistantTurn(existingTurn ?? createAssistantTurn(operationId), event);
      const next: DisplayMessage = {
        id: `${operationId}:assistant-turn`,
        source: 'legacy',
        role: 'peer',
        text: assistantTurnPlainText(assistantTurn),
        createdAtMs: assistantTurn.createdAtMs,
        kind: 'assistant-turn',
        operationId,
        streaming: assistantTurn.status === 'running',
        assistantTurn,
      };
      if (index < 0) return [...current, next];
      return current.map((message, messageIndex) => messageIndex === index ? next : message);
    });
  }
'''
          replace_once(old_helpers, new_helpers, 'legacy agent row helpers')

          old_chat_message = '''      case 'chat.message':
        if (event.role === 'assistant' && claimAgentOperation(event.operationId)) {
          setMessages((current) => current.filter((message) => !(message.kind === 'thinking' && message.operationId === event.operationId)));
        }
        setMessages((current) => {
          const existingIndex = event.role === 'assistant' && event.operationId
            ? current.findIndex((message) => message.kind === 'message' && message.operationId === event.operationId && message.streaming)
            : -1;
          if (existingIndex >= 0) {
            return current.map((message, messageIndex) => messageIndex === existingIndex
              ? { ...message, kind: 'message', text: event.text, streaming: false }
              : message);
          }
          if (event.role === 'user') {
            const optimisticIndex = current.findIndex((message) =>
              message.role === 'me' && message.optimistic === true && message.text === event.text,
            );
            if (optimisticIndex >= 0) {
              return current.map((message, messageIndex) => messageIndex === optimisticIndex
                ? { ...message, optimistic: false, operationId: event.operationId ?? message.operationId }
                : message);
            }
            if (current.some((message) =>
              message.role === 'me' && message.text === event.text &&
              (!event.operationId || message.operationId === event.operationId))) return current;
          }
          return [...current, {
            id: nextRequestId('message'),
            source: 'legacy',
            role: event.role === 'user' ? 'me' : 'peer',
            text: event.text,
            createdAtMs: Date.now(),
            kind: 'message',
            operationId: event.operationId,
            streaming: false,
          }];
        });
        break;
'''
          new_chat_message = '''      case 'chat.message':
        if (event.role === 'assistant' && event.operationId && claimAgentOperation(event.operationId)) {
          appendAssistantTurnEvent(event);
          break;
        }
        setMessages((current) => {
          if (event.role === 'user') {
            const optimisticIndex = current.findIndex((message) =>
              message.role === 'me' && message.optimistic === true && message.text === event.text,
            );
            if (optimisticIndex >= 0) {
              return current.map((message, messageIndex) => messageIndex === optimisticIndex
                ? { ...message, optimistic: false, operationId: event.operationId ?? message.operationId }
                : message);
            }
            if (current.some((message) =>
              message.role === 'me' && message.text === event.text &&
              (!event.operationId || message.operationId === event.operationId))) return current;
          }
          return [...current, {
            id: nextRequestId('message'),
            source: 'legacy',
            role: event.role === 'user' ? 'me' : 'peer',
            text: event.text,
            createdAtMs: Date.now(),
            kind: 'message',
            operationId: event.operationId,
            streaming: false,
          }];
        });
        break;
'''
          replace_once(old_chat_message, new_chat_message, 'chat.message projection')

          old_delta = '''      case 'chat.delta':
        claimAgentOperation(event.operationId);
        setMessages((current) => current.filter((message) => !(message.kind === 'thinking' && message.operationId === event.operationId)));
        setMessages((current) => {
          const index = current.findIndex((message) => message.kind === 'message' && message.operationId === event.operationId && message.streaming);
          if (index < 0) return [...current, { id: `${event.operationId}:stream`, source: 'legacy', role: 'peer', text: event.delta, createdAtMs: Date.now(), kind: 'message', operationId: event.operationId, streaming: true }];
          return current.map((message, messageIndex) => messageIndex === index ? { ...message, text: `${message.text}${event.delta}`, kind: 'message', streaming: true } : message);
        });
        break;
'''
          new_delta = '''      case 'chat.delta':
        if (claimAgentOperation(event.operationId)) {
          appendAssistantTurnEvent(event);
          break;
        }
        setMessages((current) => {
          const index = current.findIndex((message) => message.kind === 'message' && message.operationId === event.operationId && message.streaming);
          if (index < 0) return [...current, { id: `${event.operationId}:stream`, source: 'legacy', role: 'peer', text: event.delta, createdAtMs: Date.now(), kind: 'message', operationId: event.operationId, streaming: true }];
          return current.map((message, messageIndex) => messageIndex === index ? { ...message, text: `${message.text}${event.delta}`, kind: 'message', streaming: true } : message);
        });
        break;
'''
          replace_once(old_delta, new_delta, 'chat.delta projection')

          replace_once(
              "'''".strip("'"),
              "'''".strip("'"),
              'noop sentinel',
          ) if False else None

          replace_once(
              '''      case 'operation.started':
        if (claimAgentOperation(event.operationId)) {
          setPendingSend(true);
          appendAgentThinking(event.operationId, event.label || '正在思考');
        }
        break;
''',
              '''      case 'operation.started':
        if (claimAgentOperation(event.operationId)) {
          setPendingSend(true);
          appendAssistantTurnEvent(event);
        }
        break;
''',
              'operation.started projection',
          )

          replace_once(
              '''      case 'model.routed':
        if (claimAgentOperation(event.operationId)) {
          upsertAgentAction({
            id: `${event.operationId}:model`,
            operationId: event.operationId,
            title: event.model === 'auto' ? '选择模型' : `模型：${event.model}`,
            detail: `${event.provider} · ${event.mode}`,
            status: 'completed',
          });
        }
        break;
''',
              '''      case 'model.routed':
        if (claimAgentOperation(event.operationId)) appendAssistantTurnEvent(event);
        break;
''',
              'model.routed metadata projection',
          )

          replace_once(
              '''      case 'agent.step':
        if (claimAgentOperation(event.operationId)) {
          upsertAgentAction({
            id: `${event.operationId}:${event.stepId}`,
            operationId: event.operationId!,
            title: event.title,
            detail: event.detail,
            status: event.status,
          });
        }
        break;
''',
              '''      case 'agent.step':
        if (claimAgentOperation(event.operationId)) appendAssistantTurnEvent(event);
        break;
''',
              'agent.step projection',
          )

          replace_once(
              '''      case 'operation.interrupted':
        clearAgentOperation(event.operationId, 'failed');
        setPendingSend(false);
        break;
      case 'operation.completed':
        clearAgentOperation(event.operationId);
        setPendingSend(false);
        break;
''',
              '''      case 'operation.interrupted':
        if (agentOperationIdRef.current === event.operationId) appendAssistantTurnEvent(event);
        clearAgentOperation(event.operationId);
        setPendingSend(false);
        break;
      case 'operation.completed':
        if (agentOperationIdRef.current === event.operationId) appendAssistantTurnEvent(event);
        clearAgentOperation(event.operationId);
        setPendingSend(false);
        break;
''',
              'terminal operation projection',
          )

          replace_once(
              '''      case 'operation.failed':
        clearAgentOperation(event.operationId, 'failed');
        setPendingSend(false);
        setError(event.message);
        break;
''',
              '''      case 'operation.failed':
        if (agentOperationIdRef.current === event.operationId) appendAssistantTurnEvent(event);
        clearAgentOperation(event.operationId);
        setPendingSend(false);
        setError(event.message);
        break;
''',
              'failed operation projection',
          )

          replace_once(
              "          appendAgentThinking(accepted.operationId, '正在思考');\n",
              "          appendAssistantTurnEvent({ type: 'operation.started', timestamp: new Date().toISOString(), operationId: accepted.operationId, label: '正在思考', interruptible: true });\n",
              'optimistic assistant turn',
          )

          old_render = '''              {renderedMessages.map((message) => message.kind === 'thinking' ? (
                <article key={`${message.source}:${message.id}`} className={styles.agentThinkingRow} data-testid="agent-thinking" data-operation-id={message.operationId}>
                  <BotMark botId={`peer:${activePeer.kind}:${activePeer.actorId ?? activePeer.id}`} state="thinking" size={30} className={styles.agentStreamAvatar} label={activePeer.title} />
                  <div><strong>{message.actionTitle ?? '正在思考'}</strong><span>大乘助手正在处理这条消息…</span></div>
                </article>
              ) : message.kind === 'action' ? (
                <article key={`${message.source}:${message.id}`} className={styles.agentActionRow} data-testid="agent-step" data-operation-id={message.operationId} data-status={message.actionStatus}>
                  <BotMark botId={`peer:${activePeer.kind}:${activePeer.actorId ?? activePeer.id}`} state={message.actionStatus === 'running' ? 'working' : message.actionStatus === 'failed' ? 'error' : 'result'} size={25} className={styles.agentStreamAvatar} label={activePeer.title} />
                  <div><strong>{message.actionTitle}</strong>{message.actionDetail ? <span>{message.actionDetail}</span> : null}</div>
                  <small>{message.actionStatus === 'running' ? '进行中' : message.actionStatus === 'failed' ? '失败' : '完成'}</small>
                </article>
              ) : (
                <article
                  key={`${message.source}:${message.id}`}
                  className={message.role === 'me' ? styles.messageMine : styles.messagePeer}
                  data-agent-id={`message-actions:${message.source}:${message.id}`}
                  data-agent-invoke="contextmenu"
                  data-agent-message-role={message.role}
                  onContextMenu={(event) => {
                    if (message.kind === 'action' || message.kind === 'thinking') return;
                    event.preventDefault();
                    event.stopPropagation();
                    setMessageMenu({ message, x: event.clientX, y: event.clientY });
                  }}
                >
                  {message.pinned ? <Pin size={11} /> : null}
                  {message.mediaType === 'photo' && blobMediaUrl(message.media) ? <img className={extra.messageMedia} src={blobMediaUrl(message.media)} alt={message.media?.fileName ?? '图片'} /> : null}
                  {message.mediaType === 'video' && blobMediaUrl(message.media) ? <video className={extra.messageMedia} controls playsInline autoPlay={desktopPreferences.autoPlayMedia} src={blobMediaUrl(message.media)} /> : null}
                  {message.mediaType === 'document' && blobMediaUrl(message.media) ? <a className={extra.messageFile} href={blobMediaUrl(message.media)} download={message.media?.fileName}><FileText size={17} />{message.media?.fileName ?? '文件'}</a> : null}
                  <p>{message.text}</p>
                  {message.reactions?.length ? <div className={extra.reactions}>{message.reactions.map((reaction) => <span key={reaction}>{reaction}</span>)}</div> : null}
                  <small>{formatTime(message.createdAtMs)} {message.role === 'me' ? <Check size={12} /> : null}</small>
                </article>
              ))}
'''
          new_render = '''              {renderedMessages.map((message) => message.kind === 'assistant-turn' && message.assistantTurn ? (
                <MahayanaAssistantTurnView
                  key={`${message.source}:${message.id}`}
                  turn={message.assistantTurn}
                  label={activePeer.title}
                  avatar={<BotMark
                    botId={`peer:${activePeer.kind}:${activePeer.actorId ?? activePeer.id}`}
                    state={message.assistantTurn.status === 'running' ? 'thinking' : message.assistantTurn.status === 'failed' ? 'error' : 'result'}
                    size={30}
                    className={styles.agentStreamAvatar}
                    label={activePeer.title}
                  />}
                />
              ) : (
                <article
                  key={`${message.source}:${message.id}`}
                  className={message.role === 'me' ? styles.messageMine : styles.messagePeer}
                  data-agent-id={`message-actions:${message.source}:${message.id}`}
                  data-agent-invoke="contextmenu"
                  data-agent-message-role={message.role}
                  onContextMenu={(event) => {
                    if (message.kind === 'assistant-turn' || message.kind === 'action' || message.kind === 'thinking') return;
                    event.preventDefault();
                    event.stopPropagation();
                    setMessageMenu({ message, x: event.clientX, y: event.clientY });
                  }}
                >
                  {message.pinned ? <Pin size={11} /> : null}
                  {message.mediaType === 'photo' && blobMediaUrl(message.media) ? <img className={extra.messageMedia} src={blobMediaUrl(message.media)} alt={message.media?.fileName ?? '图片'} /> : null}
                  {message.mediaType === 'video' && blobMediaUrl(message.media) ? <video className={extra.messageMedia} controls playsInline autoPlay={desktopPreferences.autoPlayMedia} src={blobMediaUrl(message.media)} /> : null}
                  {message.mediaType === 'document' && blobMediaUrl(message.media) ? <a className={extra.messageFile} href={blobMediaUrl(message.media)} download={message.media?.fileName}><FileText size={17} />{message.media?.fileName ?? '文件'}</a> : null}
                  <p>{message.text}</p>
                  {message.reactions?.length ? <div className={extra.reactions}>{message.reactions.map((reaction) => <span key={reaction}>{reaction}</span>)}</div> : null}
                  <small>{formatTime(message.createdAtMs)} {message.role === 'me' ? <Check size={12} /> : null}</small>
                </article>
              ))}
'''
          replace_once(old_render, new_render, 'message transcript renderer')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify removed split lifecycle rows
        shell: bash
        run: |
          if grep -q "appendAgentThinking\|upsertAgentAction" desktop/src/messaging-shell-v2.tsx; then
            echo 'legacy split agent row helpers remain' >&2
            exit 1
          fi
          grep -q "MahayanaAssistantTurnView" desktop/src/messaging-shell-v2.tsx
          grep -q "kind: 'assistant-turn'" desktop/src/messaging-shell-v2.tsx

      - name: Commit migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/src/messaging-shell-v2.tsx
          git diff --cached --check
          git commit -m "feat(msr): render Mahayana as one Hermes assistant turn"
          git push origin HEAD:feat/msr-204-hermes-gateway-transcript
