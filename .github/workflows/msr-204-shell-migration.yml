name: MSR-204 guarded shell migration

on:
  push:
    branches:
      - feat/msr-204-hermes-gateway-transcript

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ contains(github.event.head_commit.message, '[msr-204-shell-migrate]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/msr-204-hermes-gateway-transcript
          fetch-depth: 0

      - name: Apply assertion-guarded migration
        run: python3 .github/scripts/msr_204_shell_migrate.py

      - name: Verify and commit product migration
        shell: bash
        run: |
          git diff --check
          grep -q "MahayanaAssistantTurnView" desktop/src/messaging-shell-v2.tsx
          grep -q "kind: 'assistant-turn'" desktop/src/messaging-shell-v2.tsx
          if grep -q "appendAgentThinking\|upsertAgentAction" desktop/src/messaging-shell-v2.tsx; then
            echo 'legacy split agent rows remain' >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/src/messaging-shell-v2.tsx
          git commit -m "feat(msr): render Mahayana as one Hermes assistant turn"
          git push origin HEAD:feat/msr-204-hermes-gateway-transcript
