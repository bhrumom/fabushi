name: M8-CALL-007 domain patch

on:
  push:
    branches:
      - feat/tfi-miniapp-call-program-teleprompter
    paths:
      - .github/workflows/m8-call-007-domain-apply.yml

permissions:
  contents: write

jobs:
  apply-domain-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        run: |
          git apply --check .github/patches/m8-call-007-domain.patch
          git apply .github/patches/m8-call-007-domain.patch
          git diff --check
      - name: Verify MiniApp call-program contracts
        run: node --test ai-backend/test/miniapp_call_program.test.js
      - name: Commit product changes and remove one-shot helper
        run: |
          rm .github/patches/m8-call-007-domain.patch
          rm .github/workflows/m8-call-007-domain-apply.yml
          git config user.name "fabushi-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(tfi): add MiniApp-owned Bot call programs [M8-CALL-007]"
          git push origin HEAD:${GITHUB_REF_NAME}
