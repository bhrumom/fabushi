name: TFI OpenMaus dense avatar one-shot

on:
  push:
    branches: [feat/tfi-m8-openmaus-avatar-miniapp-bot-parity]
    paths:
      - .github/workflows/tfi-avatar-dense-static.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/tfi-m8-openmaus-avatar-miniapp-bot-parity
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            desktop/src
          sparse-checkout-cone-mode: true
      - name: Apply dense-surface static avatar policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('desktop/src/messaging-shell-v2.tsx')
          text = path.read_text()
          replacements = [
            ('<BotMark botId={`story:${story.ownerId}`} state="idle" size={40} label={name} />', '<BotMark botId={`story:${story.ownerId}`} state="idle" size={40} animated={false} label={name} />'),
            ('<BotMark botId={`peer:${peer.kind}:${peer.actorId ?? peer.id}`} state="idle" size={46} label={peer.title} />', '<BotMark botId={`peer:${peer.kind}:${peer.actorId ?? peer.id}`} state="idle" size={46} animated={false} label={peer.title} />'),
            ('<BotMark botId={`peer:channel:${peer.id}`} state="idle" size={46} label={peer.title} />', '<BotMark botId={`peer:channel:${peer.id}`} state="idle" size={46} animated={false} label={peer.title} />'),
            ('<BotMark botId={`miniapp:${app.pluginId}`} state={installed ? \'idle\' : \'sleeping\'} size={52} label={app.displayName} />', '<BotMark botId={`miniapp:${app.pluginId}`} state={installed ? \'idle\' : \'sleeping\'} size={52} animated={false} label={app.displayName} />'),
            ('<BotMark botId={`search-message:${message.id}`} state="idle" size={38} label="消息" />', '<BotMark botId={`search-message:${message.id}`} state="idle" size={38} animated={false} label="消息" />'),
          ]
          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected one dense-avatar marker, got {count}: {old[:80]}')
            text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tfi-avatar-dense-static.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(avatar): park dense list mascots"
          git push origin HEAD:feat/tfi-m8-openmaus-avatar-miniapp-bot-parity
