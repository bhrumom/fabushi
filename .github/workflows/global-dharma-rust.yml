name: Global Dharma Rust

on:
  pull_request:
    paths:
      - native/global-dharma/**
      - native/mahayana-cli/**
      - native/mahayana-wrapper/**
      - native/fabushi-miniapp-runtime/**
      - scripts/install-mahayana.sh
      - scripts/test-install-mahayana.sh
      - .github/workflows/global-dharma-rust.yml
  push:
    tags: ["global-dharma-v*", "mahayana-v*"]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/global-dharma
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      - run: cargo test --workspace

  mahayana-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/mahayana-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path ../mahayana-wrapper/Cargo.toml --check
      - run: cargo test --manifest-path ../mahayana-wrapper/Cargo.toml
      - run: cargo test --manifest-path ../fabushi-miniapp-runtime/Cargo.toml
      - run: cargo test
      - run: sh ../../scripts/test-install-mahayana.sh

  linux-release:
    if: startsWith(github.ref, 'refs/tags/global-dharma-v') || startsWith(github.ref, 'refs/tags/mahayana-v')
    needs: [test, mahayana-test]
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cross
      - name: Fetch verified Codex source for the Mahayana bundle
        run: native/mahayana-cli/sync-upstream.sh "${RUNNER_TEMP}/mahayana-codex"
      - name: Build the Codex executable embedded in Mahayana
        run: cross build --release --target ${{ matrix.target }} --manifest-path "${RUNNER_TEMP}/mahayana-codex/codex-rs/Cargo.toml" -p codex-cli
      - run: cross build --release --target ${{ matrix.target }} --manifest-path native/global-dharma/Cargo.toml -p global-dharma-daemon -p global-dharmactl -p global-dharma-mcp
      - run: cross build --release --target ${{ matrix.target }} --manifest-path native/mahayana-cli/Cargo.toml
      - run: cross build --release --target ${{ matrix.target }} --manifest-path native/mahayana-wrapper/Cargo.toml
      - run: |
          mkdir -p dist/${{ matrix.target }}/bin
          cp native/global-dharma/target/${{ matrix.target }}/release/global-dharma-daemon dist/${{ matrix.target }}/bin/
          cp native/global-dharma/target/${{ matrix.target }}/release/global-dharmactl dist/${{ matrix.target }}/bin/
          cp native/global-dharma/target/${{ matrix.target }}/release/global-dharma-mcp dist/${{ matrix.target }}/bin/
          cp native/mahayana-cli/target/${{ matrix.target }}/release/mahayana dist/${{ matrix.target }}/bin/
          mkdir -p dist/${{ matrix.target }}/lib/mahayana dist/${{ matrix.target }}/share/licenses/codex dist/${{ matrix.target }}/share/mahayana
          cp "${RUNNER_TEMP}/mahayana-codex/codex-rs/target/${{ matrix.target }}/release/codex" dist/${{ matrix.target }}/lib/mahayana/codex
          cp "${RUNNER_TEMP}/mahayana-codex/LICENSE" dist/${{ matrix.target }}/share/licenses/codex/LICENSE
          printf 'Codex source: %s at %s\n' "$(awk -F= '/^CODEX_UPSTREAM_TAG/ { gsub(/\"/, "", $2); print $2 }' native/mahayana-cli/codex-upstream.env)" "$(awk -F= '/^CODEX_UPSTREAM_COMMIT/ { gsub(/\"/, "", $2); print $2 }' native/mahayana-cli/codex-upstream.env)" > dist/${{ matrix.target }}/share/mahayana/codex-upstream.txt
          cp native/mahayana-wrapper/target/${{ matrix.target }}/release/libmahayana_wrapper.so dist/${{ matrix.target }}/libmahayana_wrapper.so
          cp -R native/global-dharma/deploy native/global-dharma/config dist/${{ matrix.target }}/
          mkdir -p dist/${{ matrix.target }}/share/global-dharma
          cp native/global-dharma/deploy/install-systemd.sh dist/${{ matrix.target }}/share/global-dharma/
          cp native/global-dharma/deploy/global-dharma.service dist/${{ matrix.target }}/share/global-dharma/
          sha256sum dist/${{ matrix.target }}/bin/* > dist/${{ matrix.target }}/SHA256SUMS
          tar -C dist/${{ matrix.target }} -czf global-dharma-${{ matrix.target }}.tar.gz .
          sha256sum global-dharma-${{ matrix.target }}.tar.gz > global-dharma-${{ matrix.target }}.tar.gz.sha256
          tar -C dist/${{ matrix.target }} -czf mahayana-${{ matrix.target }}.tar.gz .
          sha256sum mahayana-${{ matrix.target }}.tar.gz > mahayana-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rust-linux-${{ matrix.target }}
          path: |
            global-dharma-${{ matrix.target }}.tar.gz
            global-dharma-${{ matrix.target }}.tar.gz.sha256
            mahayana-${{ matrix.target }}.tar.gz
            mahayana-${{ matrix.target }}.tar.gz.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/global-dharma-v') || startsWith(github.ref, 'refs/tags/mahayana-v')
    needs: linux-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - run: |
          for file in release/*.tar.gz; do
            cosign sign-blob --yes --bundle "${file}.bundle" "$file"
          done
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes
