name: Global Dharma Rust

on:
  pull_request:
    paths:
      - native/global-dharma/**
      - third_party/mahayana
      - third_party/mahayana/**
      - scripts/install-mahayana.sh
      - scripts/test-install-mahayana.sh
      - .github/workflows/global-dharma-rust.yml
  push:
    tags: ["global-dharma-v*", "mahayana-v*"]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/global-dharma
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      - run: cargo test --workspace

  mahayana-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all -- --check
      - run: >-
          cargo test --locked
          --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml
          --package mahayana-core
          --package mahayana-agent-codex
          --package mahayana-agent-responses
          --package mahayana-runtime
          --package mahayana-ffi
          --package mahayana-cli
      - run: sh scripts/test-install-mahayana.sh

  linux-release:
    if: startsWith(github.ref, 'refs/tags/global-dharma-v') || startsWith(github.ref, 'refs/tags/mahayana-v')
    needs: [test, mahayana-test]
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: taiki-e/install-action@cross
      - run: cross build --release --target ${{ matrix.target }} --manifest-path native/global-dharma/Cargo.toml -p global-dharma-daemon -p global-dharmactl -p global-dharma-mcp
      - run: >-
          cross build --release --locked
          --target ${{ matrix.target }}
          --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml
          --package mahayana-cli
          --package mahayana-ffi
      - run: |
          mkdir -p dist/${{ matrix.target }}/bin
          cp native/global-dharma/target/${{ matrix.target }}/release/global-dharma-daemon dist/${{ matrix.target }}/bin/
          cp native/global-dharma/target/${{ matrix.target }}/release/global-dharmactl dist/${{ matrix.target }}/bin/
          cp native/global-dharma/target/${{ matrix.target }}/release/global-dharma-mcp dist/${{ matrix.target }}/bin/
          cp third_party/mahayana/mahayana-rs/target/${{ matrix.target }}/release/mahayana dist/${{ matrix.target }}/bin/
          mkdir -p dist/${{ matrix.target }}/lib dist/${{ matrix.target }}/share/licenses/codex dist/${{ matrix.target }}/share/mahayana
          cp third_party/mahayana/mahayana-rs/target/${{ matrix.target }}/release/libmahayana_runtime.so dist/${{ matrix.target }}/lib/libmahayana_runtime.so
          cp third_party/mahayana/LICENSE dist/${{ matrix.target }}/share/licenses/codex/LICENSE
          cp third_party/mahayana/mahayana-rs/UPSTREAM.md dist/${{ matrix.target }}/share/mahayana/UPSTREAM.md
          cp third_party/mahayana/mahayana-rs/UPSTREAM.lock dist/${{ matrix.target }}/share/mahayana/UPSTREAM.lock
          cp -R native/global-dharma/deploy native/global-dharma/config dist/${{ matrix.target }}/
          mkdir -p dist/${{ matrix.target }}/share/global-dharma
          cp native/global-dharma/deploy/install-systemd.sh dist/${{ matrix.target }}/share/global-dharma/
          cp native/global-dharma/deploy/global-dharma.service dist/${{ matrix.target }}/share/global-dharma/
          sha256sum dist/${{ matrix.target }}/bin/* > dist/${{ matrix.target }}/SHA256SUMS
          tar -C dist/${{ matrix.target }} -czf global-dharma-${{ matrix.target }}.tar.gz .
          sha256sum global-dharma-${{ matrix.target }}.tar.gz > global-dharma-${{ matrix.target }}.tar.gz.sha256
          tar -C dist/${{ matrix.target }} -czf mahayana-${{ matrix.target }}.tar.gz .
          sha256sum mahayana-${{ matrix.target }}.tar.gz > mahayana-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rust-linux-${{ matrix.target }}
          path: |
            global-dharma-${{ matrix.target }}.tar.gz
            global-dharma-${{ matrix.target }}.tar.gz.sha256
            mahayana-${{ matrix.target }}.tar.gz
            mahayana-${{ matrix.target }}.tar.gz.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/global-dharma-v') || startsWith(github.ref, 'refs/tags/mahayana-v')
    needs: linux-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - run: |
          for file in release/*.tar.gz; do
            cosign sign-blob --yes --bundle "${file}.bundle" "$file"
          done
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes
