name: One-shot Rama alpha compatibility repair

on:
  push:
    branches:
      - security/full-repo-hardening-20260821
    paths:
      - '.github/workflows/repair-rama-alpha-lock-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/full-repo-hardening-20260821
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin Rama alpha compatibility dependencies
        run: |
          cargo update --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml -p rama-utils --precise 0.3.0-alpha.4
          cargo update --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml -p rama-macros --precise 0.3.0-alpha.4
      - name: Commit compatible lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-rama-alpha-lock-once.yml
          git add third_party/mahayana/mahayana-rs/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "fix(mahayana): align Rama alpha dependencies"
          git push origin HEAD:security/full-repo-hardening-20260821
