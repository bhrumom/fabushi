name: TFI OpenMaus MiniApp one-shot patch

on:
  push:
    branches:
      - feat/tfi-m8-openmaus-avatar-miniapp-bot-parity
    paths:
      - .github/patches/tfi-openmaus-miniapp.patch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/tfi-m8-openmaus-avatar-miniapp-bot-parity
      - name: Apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/patches/tfi-openmaus-miniapp.patch
          git apply .github/patches/tfi-openmaus-miniapp.patch
          rm .github/patches/tfi-openmaus-miniapp.patch
          rm .github/workflows/tfi-openmaus-miniapp-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(tfi): project installed Mini Apps into bot contacts"
          git push origin HEAD:feat/tfi-m8-openmaus-avatar-miniapp-bot-parity
