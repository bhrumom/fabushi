# One-shot reviewed integration applicator; the job deletes this workflow after success.
name: TFI OpenMaus MiniApp one-shot integration

on:
  push:
    branches:
      - feat/tfi-m8-openmaus-avatar-miniapp-bot-parity
    paths:
      - .github/scripts/tfi-openmaus-miniapp-transform.mjs
      - .github/workflows/tfi-openmaus-miniapp-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: feat/tfi-m8-openmaus-avatar-miniapp-bot-parity
          filter: blob:none
          sparse-checkout: |
            .github/scripts
            .github/patches
            .github/workflows
            desktop
            frontend/apps/web/src/app/host
          sparse-checkout-cone-mode: true

      - name: Vendor pinned OpenMaus CursorAvatar
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha=667af71ae7e93640ba4b1a5f3b38a1ad342025da
          target=frontend/apps/web/src/app/host/openmaus-cursor-avatar.tsx
          temp="$(mktemp)"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/milind-soni/OpenMausBot/${upstream_sha}/src/components/CursorAvatar.tsx" \
            --output "$temp"
          {
            printf '%s\n' '/* SPDX-License-Identifier: Apache-2.0 */'
            printf '%s\n' "/* Vendored from milind-soni/OpenMausBot@${upstream_sha}: src/components/CursorAvatar.tsx */"
            cat "$temp"
          } > "$target"
          rm -f "$temp"

      - name: Scope the open-peer transform marker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/scripts/tfi-openmaus-miniapp-transform.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const oldNeedle = `    "    if (peer.source === 'selfhosted' && peer.conversationId) {",`;
          const newNeedle = `    "    setConversationSearchOpen(false);\\n    if (peer.source === 'selfhosted' && peer.conversationId) {",`;
          const oldReplacement = `    "    if (peer.miniAppId) {\\n      setMessages(miniAppBotThreadsRef.current[peer.miniAppId] ?? []);\\n      return;\\n    }\\n    if (peer.source === 'selfhosted' && peer.conversationId) {",`;
          const newReplacement = `    "    setConversationSearchOpen(false);\\n    if (peer.miniAppId) {\\n      setMessages(miniAppBotThreadsRef.current[peer.miniAppId] ?? []);\\n      return;\\n    }\\n    if (peer.source === 'selfhosted' && peer.conversationId) {",`;
          if (!source.includes(oldNeedle)) throw new Error('open-peer needle source marker missing');
          if (!source.includes(oldReplacement)) throw new Error('open-peer replacement source marker missing');
          source = source.replace(oldNeedle, newNeedle).replace(oldReplacement, newReplacement);
          fs.writeFileSync(path, source);
          NODE

      - name: Apply deterministic integration edits
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node .github/scripts/tfi-openmaus-miniapp-transform.mjs > /tmp/tfi-transform.log 2>&1
          status=$?
          cat /tmp/tfi-transform.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          set -e
          node --test desktop/electron/native-capability-handlers.test.cjs

      - name: Commit generated integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/tfi-openmaus-miniapp.patch
          rm -f .github/scripts/tfi-openmaus-miniapp-transform.mjs
          rm -f .github/workflows/tfi-openmaus-miniapp-apply.yml
          rm -f .github/tfi-transform-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(tfi): integrate OpenMaus avatar and Mini App bot lifecycle"
          git push origin HEAD:feat/tfi-m8-openmaus-avatar-miniapp-bot-parity
