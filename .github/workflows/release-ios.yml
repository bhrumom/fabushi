name: Release iOS

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: Fast test build skips long App E2E; formal is blocked until the recalibrated E2E gate is restored
        required: true
        type: choice
        default: test
        options: [test, formal]

permissions:
  contents: write

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: iOS ${{ inputs.release_kind }} release
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Reject formal release until E2E is recalibrated
        if: inputs.release_kind == 'formal'
        run: |
          echo 'Formal iOS release is intentionally blocked until the app-driving E2E gate is recalibrated against a current test build.' >&2
          exit 2

      - name: Checkout selected iOS source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - id: version
        name: Resolve iOS test identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' app-version.json)"
          build="$(date -u +%y%j%H%M)"
          short="$(git rev-parse --short=12 HEAD)"
          tag="ios-test-v${version}-${build}-${short}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Rust for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Restore iOS Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: release-ios-test-v1

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Build Rust static library for iOS device
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo build --release -p mahayana-app-host-mobile --target aarch64-apple-ios

      - name: Stage Rust static library
        shell: bash
        run: |
          mkdir -p mobile/ios/Frameworks
          cp third_party/mahayana/mahayana-rs/target/aarch64-apple-ios/release/libmahayana_app_host.a mobile/ios/Frameworks/

      - name: Install iOS signing identity and profile
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_CERTIFICATE_P12_BASE64"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          cert="$RUNNER_TEMP/ios-distribution.p12"
          profile="$RUNNER_TEMP/Fabushi.mobileprovision"
          keychain="$RUNNER_TEMP/fabushi-signing.keychain-db"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security create-keychain -p actions "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$cert" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "IOS_TEAM_ID=$team_id" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Archive iOS test application
        working-directory: mobile/ios
        run: >-
          xcodebuild archive
          -project Fabushi.xcodeproj
          -scheme Fabushi
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Fabushi.xcarchive"
          MARKETING_VERSION='${{ steps.version.outputs.version }}'
          CURRENT_PROJECT_VERSION='${{ steps.version.outputs.build }}'
          DEVELOPMENT_TEAM="$IOS_TEAM_ID"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY='Apple Distribution'
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export signed IPA
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict><key>com.ombhrum.fabushi</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Fabushi.xcarchive" -exportPath "$RUNNER_TEMP/ios-export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload iOS test artifact
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-ios-test-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: ${{ runner.temp }}/ios-export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish iOS test prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "Fabushi iOS test ${{ steps.version.outputs.version }}" --notes 'Test build: long application-driving E2E intentionally skipped pending recalibration.' --prerelease --latest=false "$RUNNER_TEMP"/ios-export/*.ipa
