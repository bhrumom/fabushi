name: Fabushi Pay Rust

on:
  pull_request:
    paths:
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-core/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-miniapp-bridge/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-miniapp-protocol/**'
      - 'docs/fabushi-pay-rust.md'
      - '.github/workflows/fabushi-pay.yml'
  push:
    branches: [main]
    paths:
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-core/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-miniapp-bridge/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-miniapp-protocol/**'
      - 'docs/fabushi-pay-rust.md'
      - '.github/workflows/fabushi-pay.yml'
  workflow_dispatch:

concurrency:
  group: fabushi-pay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rust:
    name: Payment core and Mini App contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format Rust sources
        run: cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all
      - name: Commit formatter output for same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/mahayana/mahayana-rs
          git commit -m "style(pay): format payment infrastructure contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: fabushi-pay-v1
          cache-all-crates: true
      - name: Test payment and Mini App contracts
        run: >-
          cargo test --locked
          --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml
          -p mahayana-platform-core
          -p mahayana-miniapp-protocol
          -p mahayana-miniapp-bridge
      - name: Clippy payment and Mini App contracts
        run: >-
          cargo clippy --locked
          --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml
          -p mahayana-platform-core
          -p mahayana-miniapp-protocol
          -p mahayana-miniapp-bridge
          --all-targets -- -D warnings
      - name: Check workspace formatting
        run: cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all -- --check
