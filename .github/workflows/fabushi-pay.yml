name: Fabushi Pay Rust

on:
  pull_request:
    paths:
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-core/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-miniapp-bridge/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-miniapp-protocol/**'
      - 'docs/fabushi-pay-rust.md'
      - '.github/workflows/fabushi-pay.yml'
  push:
    branches: [main]
    paths:
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-core/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-miniapp-bridge/**'
      - 'third_party/mahayana/mahayana-rs/mahayana-miniapp-protocol/**'
      - 'docs/fabushi-pay-rust.md'
      - '.github/workflows/fabushi-pay.yml'
  workflow_dispatch:

concurrency:
  group: fabushi-pay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rust:
    name: Payment core and Mini App contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Apply payment ledger edge-case hardening
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('third_party/mahayana/mahayana-rs/mahayana-platform-core/src/payment.rs')
          text = path.read_text()

          if 'filter(|line| line.amount != 0)' not in text:
              anchor = '    let entry = PaymentLedgerEntry {\n'
              replacement = '''    let lines = lines
              .into_iter()
              .filter(|line| line.amount != 0)
              .collect::<Vec<_>>();
              let entry = PaymentLedgerEntry {
          '''
              if anchor not in text:
                  raise SystemExit('PaymentLedgerEntry construction anchor not found')
              text = text.replace(anchor, replacement, 1)

          test_name = 'zero_value_split_lines_are_not_posted'
          if test_name not in text:
              marker = '    #[test]\n    fn mutation_idempotency_cannot_cross_payments_or_operations() {'
              test = '''    #[test]
          fn zero_value_split_lines_are_not_posted() {
              for fee_bps in [0, 10_000] {
                  let mut engine = PayEngine::new();
                  let mut create = request(&format!("fee-{fee_bps}"));
                  create.platform_fee_bps = fee_bps;
                  let payment = engine.create_payment(create).unwrap();
                  let mutation = engine
                      .succeed(
                          &payment.payment_id,
                          ProviderOutcome {
                              provider_reference: format!("provider-{fee_bps}"),
                              occurred_at_ms: 20,
                          },
                      )
                      .unwrap();
                  let entry = mutation.ledger_entry.unwrap();
                  entry.validate().unwrap();
                  assert_eq!(entry.lines.len(), 2);
                  assert!(entry.lines.iter().all(|line| line.amount != 0));
              }
          }

          #[test]
          fn mutation_idempotency_cannot_cross_payments_or_operations() {'''
              if marker not in text:
                  raise SystemExit('test insertion anchor not found')
              text = text.replace(marker, test, 1)

          path.write_text(text)
          PY
      - name: Format Rust sources
        run: cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all
      - name: Commit formatter and hardening output for same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/mahayana/mahayana-rs
          git commit -m "fix(pay): harden zero-split ledger entries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: fabushi-pay-v1
          cache-all-crates: true
      - name: Test payment and Mini App contracts
        run: >-
          cargo test --locked
          --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml
          -p mahayana-platform-core
          -p mahayana-miniapp-protocol
          -p mahayana-miniapp-bridge
      - name: Clippy payment and Mini App contracts
        run: >-
          cargo clippy --locked
          --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml
          -p mahayana-platform-core
          -p mahayana-miniapp-protocol
          -p mahayana-miniapp-bridge
          --all-targets -- -D warnings
      - name: Check workspace formatting
        run: cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all -- --check
