name: Mahayana native engine prepare

on:
  pull_request:
    paths:
      - .github/workflows/mahayana-native-engine-prepare.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format native Rust workspace
        run: cargo fmt --all

      - name: Refresh workspace lockfile
        run: cargo generate-lockfile

      - name: Commit generated changes
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Native engine sources are already prepared."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/mahayana/mahayana-rs
          git commit -m "style(mahayana): format native engine and refresh lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
