# Branch-local one-shot formatter; remove after it commits the exact rustfmt delta.
name: FAB-P0001 M4 rustfmt fix

on:
  push:
    branches:
      - feat/fab-p0001-m4-media-closure
    paths:
      - .github/workflows/fab-p0001-m4-fmt.yml
  pull_request:
    branches:
      - fix/fab-p0001-m3-e2e-closure
    paths:
      - .github/workflows/fab-p0001-m4-fmt.yml

permissions:
  contents: write

jobs:
  fmt:
    if: github.repository == 'bhrumom/fabushi' && (github.event_name == 'push' || github.head_ref == 'feat/fab-p0001-m4-media-closure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/fab-p0001-m4-media-closure
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format messaging crate
        run: cargo fmt --manifest-path native/mahayana-messaging/Cargo.toml
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            case "$path" in
              native/mahayana-messaging/src/engine.rs|native/mahayana-messaging/src/media_cache.rs|native/mahayana-messaging/src/blob_store.rs|native/mahayana-messaging/src/lib.rs|native/mahayana-messaging/tests/m4_media_contract.rs|native/mahayana-messaging/tests/typing_contract.rs) ;;
              *) echo "Unexpected formatted path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          if git diff --quiet; then exit 0; fi
          git config user.name "fabushi-ci"
          git config user.email "fabushi-ci@users.noreply.github.com"
          git add native/mahayana-messaging
          git commit -m "style(tfi): format M4 media closure"
          git push origin HEAD:feat/fab-p0001-m4-media-closure
