    async fn accept_is_consumed_after_one_tool_execution() {
        let harness = MahayanaHarness::new(BuildProfile::DesktopFull);
        let session = harness.create_session("one-shot").unwrap();
        harness
            .register_tool(guarded_tool(), Arc::new(EchoToolHost))
