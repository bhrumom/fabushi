      - name: Format, refresh lockfile, test and lint Harness stack
        shell: bash
        working-directory: third_party/mahayana/mahayana-rs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          cargo test --profile ci \
            -p mahayana-harness \
            -p mahayana-harness-services \
            -p mahayana-harness-advanced \
            -p mahayana-harness-adapters \
            -p mahayana-harness-agent \
            -p mahayana-harness-protocol \
            -p mahayana-unified-app-host
          cargo clippy \
            -p mahayana-harness \
            -p mahayana-harness-services \
            -p mahayana-harness-advanced \
            -p mahayana-harness-adapters \
            -p mahayana-harness-agent \
            -p mahayana-harness-protocol \
            -p mahayana-unified-app-host \
            --all-targets -- -D warnings

      - name: Commit finalized runtime and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mahayana-harness-schedule-bridge.yml
          rm -f .github/workflows/mahayana-harness-finalize-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat(mahayana): finalize Rust-native Harness product integration'
          git push origin HEAD:feat/mahayana-deepseek-harness-rust
