name: Mahayana Harness finalize once

on:
  push:
    branches:
      - feat/mahayana-deepseek-harness-rust
    paths:
      - .github/workflows/mahayana-harness-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mahayana-deepseek-harness-rust
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Finalize Harness semantics and product bridges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
