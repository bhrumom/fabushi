name: Ops - bhrum2 mail DNS

on:
  push:
    branches:
      - ops/bhrum2-registration-mail-20260816
    paths:
      - .github/workflows/ops-bhrum2-mail-dns.yml

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - name: Configure self-hosted mail DNS
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'Cloudflare API token missing' >&2; exit 1; }
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zone_id="$(curl -fsS "${auth[@]}" "$api/zones?name=ombhrum.com" | jq -er '.result[0].id')"

          upsert_record() {
            local type="$1" name="$2" content="$3" proxied="${4:-false}"
            local records id body response
            records="$(curl -fsS "${auth[@]}" --get --data-urlencode "type=$type" --data-urlencode "name=$name" "$api/zones/$zone_id/dns_records")"
            id="$(jq -r --arg content "$content" '.result[]? | select(.content == $content) | .id' <<<"$records" | head -n1)"
            if [ -n "$id" ]; then
              echo "$type $name already exact"
              return
            fi
            id="$(jq -r '.result[0].id // empty' <<<"$records")"
            body="$(jq -nc --arg type "$type" --arg name "$name" --arg content "$content" --argjson proxied "$proxied" '{type:$type,name:$name,content:$content,ttl:1,proxied:$proxied}')"
            if [ -n "$id" ]; then
              response="$(curl -fsS -X PUT "${auth[@]}" --data "$body" "$api/zones/$zone_id/dns_records/$id")"
            else
              response="$(curl -fsS -X POST "${auth[@]}" --data "$body" "$api/zones/$zone_id/dns_records")"
            fi
            jq -e '.success == true' <<<"$response" >/dev/null
            echo "$type $name configured"
          }

          upsert_spf() {
            local name='ombhrum.com'
            local content='v=spf1 ip4:144.24.17.21 include:_spf.mx.cloudflare.net ~all'
            local records id body response
            records="$(curl -fsS "${auth[@]}" --get --data-urlencode 'type=TXT' --data-urlencode "name=$name" "$api/zones/$zone_id/dns_records")"
            id="$(jq -r '.result[]? | select(.content | startswith("v=spf1")) | .id' <<<"$records" | head -n1)"
            [ -n "$id" ] || { echo 'Existing SPF record not found' >&2; exit 1; }
            body="$(jq -nc --arg name "$name" --arg content "$content" '{type:"TXT",name:$name,content:$content,ttl:1}')"
            response="$(curl -fsS -X PUT "${auth[@]}" --data "$body" "$api/zones/$zone_id/dns_records/$id")"
            jq -e '.success == true' <<<"$response" >/dev/null
            echo 'SPF configured'
          }

          consolidate_dmarc() {
            local name='_dmarc.ombhrum.com'
            local content='v=DMARC1; p=none; rua=mailto:29feecad810843379e4f366001f622cd@dmarc-reports.cloudflare.net,mailto:amitabha@ombhrum.com'
            local records ids keep body response id
            records="$(curl -fsS "${auth[@]}" --get --data-urlencode 'type=TXT' --data-urlencode "name=$name" "$api/zones/$zone_id/dns_records")"
            mapfile -t ids < <(jq -r '.result[]? | select(.content | startswith("v=DMARC1")) | .id' <<<"$records")
            if [ "${#ids[@]}" -eq 0 ]; then
              body="$(jq -nc --arg name "$name" --arg content "$content" '{type:"TXT",name:$name,content:$content,ttl:1}')"
              response="$(curl -fsS -X POST "${auth[@]}" --data "$body" "$api/zones/$zone_id/dns_records")"
              jq -e '.success == true' <<<"$response" >/dev/null
            else
              keep="${ids[0]}"
              body="$(jq -nc --arg name "$name" --arg content "$content" '{type:"TXT",name:$name,content:$content,ttl:1}')"
              response="$(curl -fsS -X PUT "${auth[@]}" --data "$body" "$api/zones/$zone_id/dns_records/$keep")"
              jq -e '.success == true' <<<"$response" >/dev/null
              if [ "${#ids[@]}" -gt 1 ]; then
                for id in "${ids[@]:1}"; do
                  response="$(curl -fsS -X DELETE "${auth[@]}" "$api/zones/$zone_id/dns_records/$id")"
                  jq -e '.success == true' <<<"$response" >/dev/null
                done
              fi
            fi
            echo 'DMARC consolidated'
          }

          dkim='v=DKIM1; h=sha256; k=rsa; '
          upsert_record A mail.ombhrum.com 144.24.17.21 false
          upsert_spf
          upsert_record TXT bhrum2._domainkey.ombhrum.com "$dkim" false
          consolidate_dmarc
