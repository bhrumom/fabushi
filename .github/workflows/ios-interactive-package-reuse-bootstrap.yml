name: iOS interactive package reuse bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-interactive-package-reuse-bootstrap.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-exact-existing-package:
    name: Dispatch exact current package reuse run once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact existing iOS package reuse journey
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN_ID: '34030851007'
          PACKAGE_SOURCE_SHA: '6872793daf727c118510e818e3cd689c09101594'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ios-interactive-package-reuse-e2e.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "origin_run_id=$ORIGIN_RUN_ID" \
            -f "package_source_sha=$PACKAGE_SOURCE_SHA"
          echo "Dispatched exact package reuse: origin_run=$ORIGIN_RUN_ID package_source_sha=$PACKAGE_SOURCE_SHA"
