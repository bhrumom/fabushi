name: Mahayana lockfile refresh

on:
  pull_request:
    paths:
      - .github/workflows/mahayana-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mahayana-lock-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Refresh Mahayana Cargo lockfile
        run: cargo generate-lockfile

      - name: Commit lockfile if changed
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- third_party/mahayana/mahayana-rs/Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/mahayana/mahayana-rs/Cargo.lock
          git commit -m "chore(mahayana): refresh sovereign workspace lockfile"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
