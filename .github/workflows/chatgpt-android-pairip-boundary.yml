name: ChatGPT Android PairIP Boundary

on:
  pull_request:
    paths:
      - '.agents/plugins/plugins/chatgpt-android-controller/scripts/fetch-chatgpt-apkpure.sh'
      - '.agents/plugins/plugins/chatgpt-android-controller/scripts/fetch-chatgpt-apkmirror-0016.sh'
      - '.agents/plugins/plugins/chatgpt-android-controller/scripts/verify-chatgpt-xapk.sh'
      - '.agents/plugins/plugins/chatgpt-android-controller/scripts/check-chatgpt-pairip.sh'
      - '.github/workflows/chatgpt-android-pairip-boundary.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: .agents/plugins/plugins/chatgpt-android-controller
    steps:
      - uses: actions/checkout@v5
      - name: Scan signed ChatGPT builds around Play protection boundary
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          aapt=$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x -print | sort -V | tail -n 1)
          test -x "$aapt"

          echo '=== 1.0.0016 (16) from APKMirror ==='
          first_bundle="$RUNNER_TEMP/chatgpt-16.apkm"
          if bash scripts/fetch-chatgpt-apkmirror-0016.sh "$first_bundle"; then
            bash scripts/verify-chatgpt-xapk.sh "$first_bundle"
            set +e
            first_pairip_output=$(bash scripts/check-chatgpt-pairip.sh "$first_bundle" 2>&1)
            first_pairip_status=$?
            set -e
            printf '%s\n' "$first_pairip_output"
            case "$first_pairip_status" in
              0) echo 'UNPROTECTED_CANDIDATE=1.0.0016:16' ;;
              2) echo 'PAIRIP_PROTECTED=1.0.0016:16' ;;
              *) echo "pairip_scan=failed version=1.0.0016 status=$first_pairip_status" ;;
            esac
          else
            echo 'APKMirror 1.0.0016 download=failed'
          fi

          candidates=(
            '1.2024.366:2436601'
            '1.2024.324:439'
            '1.2024.310:421'
            '1.2024.282:387'
          )
          found_unprotected=false
          for entry in "${candidates[@]}"; do
            version=${entry%%:*}
            code=${entry##*:}
            bundle="$RUNNER_TEMP/chatgpt-$code.xapk"
            rm -f "$bundle"
            echo "=== $version ($code) ==="
            if ! CHATGPT_ANDROID_VERSION_NAME="$version" CHATGPT_ANDROID_VERSION_CODE="$code" \
                bash scripts/fetch-chatgpt-apkpure.sh "$bundle"; then
              echo "download=failed"
              continue
            fi
            if ! CHATGPT_ANDROID_REQUIRE_X86_64=false bash scripts/verify-chatgpt-xapk.sh "$bundle"; then
              echo "identity=failed"
              continue
            fi
            set +e
            pairip_output=$(bash scripts/check-chatgpt-pairip.sh "$bundle" 2>&1)
            pairip_status=$?
            set -e
            printf '%s\n' "$pairip_output"
            case "$pairip_status" in
              0)
                echo "UNPROTECTED_CANDIDATE=$version:$code"
                found_unprotected=true
                ;;
              2)
                echo "PAIRIP_PROTECTED=$version:$code"
                ;;
              *)
                echo "pairip_scan=failed status=$pairip_status"
                ;;
            esac
          done
          if [[ "$found_unprotected" == false ]]; then
            echo 'No downloadable unprotected candidate was found in the scanned boundary set.'
          fi
