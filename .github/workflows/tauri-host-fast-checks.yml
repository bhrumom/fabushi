name: Tauri Host fast checks

on:
  pull_request:
    paths:
      - apps/fabushi-tauri/**
      - frontend/apps/web/src/lib/mahayana-host/**
      - third_party/mahayana/mahayana-rs/Cargo.toml
      - third_party/mahayana/mahayana-rs/mahayana-feature-host/**
      - third_party/mahayana/mahayana-rs/mahayana-host/**
      - third_party/mahayana/mahayana-rs/mahayana-host-protocol/**
      - third_party/mahayana/mahayana-rs/mahayana-core/**
      - third_party/mahayana/mahayana-rs/mahayana-runtime/**
      - .github/workflows/tauri-host-fast-checks.yml
  push:
    branches: [main]
    paths:
      - apps/fabushi-tauri/**
      - frontend/apps/web/src/lib/mahayana-host/**
      - third_party/mahayana/mahayana-rs/Cargo.toml
      - third_party/mahayana/mahayana-rs/mahayana-feature-host/**
      - third_party/mahayana/mahayana-rs/mahayana-host/**
      - third_party/mahayana/mahayana-rs/mahayana-host-protocol/**
      - .github/workflows/tauri-host-fast-checks.yml
  workflow_dispatch:

concurrency:
  group: tauri-host-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  headless-contract:
    name: Headless Tauri command contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CARGO_INCREMENTAL: "1"
    steps:
      - name: Checkout shell and Rust core
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/fabushi-tauri/**
            /third_party/mahayana/**

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Restore Tauri Host Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: tauri-host-headless-v3
          cache-all-crates: true

      - name: Verify formatting
        run: cargo fmt --manifest-path apps/fabushi-tauri/src-tauri/Cargo.toml -- --check

      - name: Test command contract under execution budget
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          cargo test \
            --manifest-path apps/fabushi-tauri/src-tauri/Cargo.toml \
            --profile ci \
            --locked \
            --no-default-features \
            --features headless
          elapsed="$(( $(date +%s) - started_at ))"
          echo "Headless Tauri command contract elapsed: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt 90 ]; then
            echo "Headless Tauri contract exceeded the 90-second cold budget." >&2
            exit 1
          fi

      - name: Verify the shared Rust dependency graph is locked
        run: >-
          cargo metadata
          --manifest-path apps/fabushi-tauri/src-tauri/Cargo.toml
          --locked
          --no-deps
          --format-version 1
          > /dev/null

  desktop-compile:
    name: macOS Tauri desktop compile
    runs-on: macos-latest
    timeout-minutes: 18
    env:
      CARGO_INCREMENTAL: "1"
    steps:
      - name: Checkout shell and Rust core
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/fabushi-tauri/**
            /third_party/mahayana/**

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore macOS Tauri Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: tauri-host-macos-v3
          cache-all-crates: true

      - name: Compile the real desktop shell
        run: >-
          cargo check
          --manifest-path apps/fabushi-tauri/src-tauri/Cargo.toml
          --profile ci
          --locked
          --features desktop
