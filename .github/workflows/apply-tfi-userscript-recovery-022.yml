name: Apply TFI userscript recovery 022

on:
  push:
    branches:
      - codex/tfi-userscript-bound-recovery-20260917

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out parent branch
        uses: actions/checkout@v7
        with:
          ref: codex/tfi-userscript-bound-recovery-20260917
          fetch-depth: 0

      - name: Verify exact source v2.9.36 artifact
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=2fd43b6ba64a58acbc806ad35a4c48b477ac57f0
          SOURCE_SHA256=11784d8eafe788b7d72a99bd191865ba472ccf219561d91302cfadb65a5dae97
          SOURCE_SIZE=237859
          SOURCE_URL="https://raw.githubusercontent.com/bhrumom/fabushi-chatgpt-auto-confirm-userscript/${SOURCE_SHA}/chatgpt-auto-confirm.user.js"
          curl -fsSL "$SOURCE_URL" -o /tmp/chatgpt-auto-confirm.user.js
          test "$(wc -c < /tmp/chatgpt-auto-confirm.user.js)" = "$SOURCE_SIZE"
          test "$(sha256sum /tmp/chatgpt-auto-confirm.user.js | awk '{print $1}')" = "$SOURCE_SHA256"
          grep -Eq '^// @version[[:space:]]+2\.9\.36$' /tmp/chatgpt-auto-confirm.user.js
          grep -Fq "const VERSION = '2.9.36';" /tmp/chatgpt-auto-confirm.user.js

      - name: Add verified GitHub latest-release discovery
        shell: bash
        run: |
          set -euo pipefail
          cat > chatgpt-vps-control/chrome-platform/extension/marketplace-userscript-release.js <<'EOF'
          import {
            compareMarketplaceVersions,
            marketplaceItemId,
            marketplaceItemVersion,
          } from "./marketplace-install.js";

          export const CHATGPT_AUTO_CONFIRM_PLUGIN_ID = "chatgpt-auto-confirm";
          export const CHATGPT_AUTO_CONFIRM_REPOSITORY = "https://github.com/bhrumom/fabushi-chatgpt-auto-confirm-userscript";
          export const CHATGPT_AUTO_CONFIRM_LATEST_RELEASE_API = "https://api.github.com/repos/bhrumom/fabushi-chatgpt-auto-confirm-userscript/releases/latest";
          export const CHATGPT_AUTO_CONFIRM_ASSET_NAME = "chatgpt-auto-confirm.user.js";
          const MAX_USERSCRIPT_BYTES = 2 * 1024 * 1024;
          const REQUEST_TIMEOUT_MS = 8_000;

          function clone(value) {
            return JSON.parse(JSON.stringify(value));
          }

          function artifactUrlFor(sourceRef) {
            return `https://raw.githubusercontent.com/bhrumom/fabushi-chatgpt-auto-confirm-userscript/${sourceRef}/${CHATGPT_AUTO_CONFIRM_ASSET_NAME}`;
          }

          function releaseUrlFor(tag) {
            return `${CHATGPT_AUTO_CONFIRM_REPOSITORY}/releases/tag/${tag}`;
          }

          function assetDownloadUrlFor(tag) {
            return `${CHATGPT_AUTO_CONFIRM_REPOSITORY}/releases/download/${tag}/${CHATGPT_AUTO_CONFIRM_ASSET_NAME}`;
          }

          export function parseGitHubUserscriptRelease(release) {
            if (!release || typeof release !== "object") throw new Error("GitHub latest release 响应无效。");
            if (release.draft || release.prerelease) throw new Error("GitHub latest release 不是正式稳定版。");
            const tag = String(release.tag_name || "").trim();
            const version = tag.match(/^v(\d+\.\d+\.\d+)$/)?.[1] || "";
            if (!version) throw new Error("GitHub latest release tag 不是受支持的语义版本。");
            const sourceRef = String(release.target_commitish || "").trim().toLowerCase();
            if (!/^[a-f0-9]{40}$/.test(sourceRef)) throw new Error("GitHub latest release 没有固定到 exact commit SHA。");
            const asset = (Array.isArray(release.assets) ? release.assets : [])
              .find((candidate) => candidate?.name === CHATGPT_AUTO_CONFIRM_ASSET_NAME);
            if (!asset || asset.state !== "uploaded") throw new Error("GitHub latest release 缺少已上传的 userscript artifact。");
            const digestMatch = String(asset.digest || "").trim().toLowerCase().match(/^sha256:([a-f0-9]{64})$/);
            if (!digestMatch) throw new Error("GitHub latest release artifact 缺少 SHA-256 digest。");
            const size = Number(asset.size);
            if (!Number.isSafeInteger(size) || size <= 0 || size > MAX_USERSCRIPT_BYTES) {
              throw new Error("GitHub latest release artifact size 超出允许范围。");
            }
            const expectedAssetUrl = assetDownloadUrlFor(tag);
            if (String(asset.browser_download_url || "").trim() !== expectedAssetUrl) {
              throw new Error("GitHub latest release artifact URL 与受信仓库不一致。");
            }
            return {
              pluginId: CHATGPT_AUTO_CONFIRM_PLUGIN_ID,
              version,
              tag,
              sourceRef,
              sha256: digestMatch[1],
              size,
              releaseUrl: releaseUrlFor(tag),
              artifactUrl: artifactUrlFor(sourceRef),
              assetUrl: expectedAssetUrl,
              releaseNotes: String(release.body || "").trim().slice(0, 4_000),
            };
          }

          function patchArtifacts(container, metadata) {
            if (!container || !Array.isArray(container.artifacts)) return;
            for (const artifact of container.artifacts) {
              const isUserscript = artifact?.runtime === "userscript"
                || artifact?.format === "user-js"
                || /chatgpt-auto-confirm\.user\.js$/i.test(String(artifact?.entry || artifact?.source?.url || ""));
              if (!isUserscript) continue;
              artifact.source = { ...(artifact.source || {}), type: "https", url: metadata.artifactUrl };
              artifact.sha256 = metadata.sha256;
              artifact.size = metadata.size;
            }
          }

          function patchInstall(install, metadata) {
            if (!install || typeof install !== "object") return;
            install.version = metadata.version;
            install.source = {
              ...(install.source || {}),
              provider: "github",
              repository: CHATGPT_AUTO_CONFIRM_REPOSITORY,
              sourceRef: metadata.sourceRef,
              releaseUrl: metadata.releaseUrl,
              marketplaceHostsPackage: false,
            };
            patchArtifacts(install, metadata);
          }

          export function projectGitHubUserscriptRelease(baseItem, release) {
            if (!baseItem || marketplaceItemId(baseItem) !== CHATGPT_AUTO_CONFIRM_PLUGIN_ID) {
              throw new Error("GitHub userscript release 缺少 ChatGPT 自动确认基准清单。");
            }
            const metadata = parseGitHubUserscriptRelease(release);
            const baseVersion = marketplaceItemVersion(baseItem);
            if (baseVersion && compareMarketplaceVersions(metadata.version, baseVersion) < 0) return clone(baseItem);
            const item = clone(baseItem);
            item.pluginId = CHATGPT_AUTO_CONFIRM_PLUGIN_ID;
            item.latestVersion = metadata.version;
            if (Object.prototype.hasOwnProperty.call(item, "version")) item.version = metadata.version;
            item.source = {
              ...(item.source || {}),
              provider: "github",
              repository: CHATGPT_AUTO_CONFIRM_REPOSITORY,
              sourceRef: metadata.sourceRef,
              releaseUrl: metadata.releaseUrl,
            };
            patchInstall(item.install, metadata);
            if (item.releaseManifest && typeof item.releaseManifest === "object") {
              item.releaseManifest.version = metadata.version;
              if (item.releaseManifest.source && typeof item.releaseManifest.source === "object") {
                item.releaseManifest.source = {
                  ...item.releaseManifest.source,
                  provider: "github",
                  repository: CHATGPT_AUTO_CONFIRM_REPOSITORY,
                  sourceRef: metadata.sourceRef,
                  releaseUrl: metadata.releaseUrl,
                };
              }
              patchArtifacts(item.releaseManifest, metadata);
              patchInstall(item.releaseManifest.install, metadata);
            }
            if (metadata.releaseNotes) item.releaseNotes = metadata.releaseNotes;
            return item;
          }

          async function fetchLatestRelease({ fetchFn = globalThis.fetch, signal } = {}) {
            if (typeof fetchFn !== "function") throw new Error("GitHub release discovery 缺少 fetch 实现。");
            const controller = signal ? null : new AbortController();
            const timer = controller ? setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS) : null;
            try {
              const response = await fetchFn(CHATGPT_AUTO_CONFIRM_LATEST_RELEASE_API, {
                headers: { Accept: "application/vnd.github+json" },
                cache: "no-store",
                redirect: "error",
                signal: signal || controller?.signal,
              });
              if (!response?.ok) throw new Error(`GitHub latest release 请求失败（${response?.status || "network"}）。`);
              return await response.json();
            } finally {
              if (timer) clearTimeout(timer);
            }
          }

          export async function fetchLatestUserscriptMarketplaceItem({ baseItem, fetchFn = globalThis.fetch, signal } = {}) {
            return projectGitHubUserscriptRelease(baseItem, await fetchLatestRelease({ fetchFn, signal }));
          }

          export async function fetchLatestUserscriptUpdateItem({ fetchFn = globalThis.fetch, signal } = {}) {
            const metadata = parseGitHubUserscriptRelease(await fetchLatestRelease({ fetchFn, signal }));
            return {
              pluginId: CHATGPT_AUTO_CONFIRM_PLUGIN_ID,
              displayName: "ChatGPT 自动确认",
              latestVersion: metadata.version,
              source: {
                provider: "github",
                repository: CHATGPT_AUTO_CONFIRM_REPOSITORY,
                sourceRef: metadata.sourceRef,
                releaseUrl: metadata.releaseUrl,
              },
              install: {
                protocol: "fabushi.marketplace.install.v1",
                strategy: "github-immutable",
                pluginId: CHATGPT_AUTO_CONFIRM_PLUGIN_ID,
                version: metadata.version,
                source: {
                  provider: "github",
                  repository: CHATGPT_AUTO_CONFIRM_REPOSITORY,
                  sourceRef: metadata.sourceRef,
                  releaseUrl: metadata.releaseUrl,
                  marketplaceHostsPackage: false,
                },
                artifacts: [{
                  id: "chatgpt-auto-confirm-userscript",
                  runtime: "userscript",
                  platforms: ["chrome-extension"],
                  source: { type: "https", url: metadata.artifactUrl },
                  sha256: metadata.sha256,
                  size: metadata.size,
                  format: "user-js",
                  entry: CHATGPT_AUTO_CONFIRM_ASSET_NAME,
                }],
                update: {
                  check: "github-latest-release",
                  comparison: "version-then-artifact-sha256",
                  allowDowngrade: false,
                  rollback: "previous-active",
                },
              },
            };
          }

          export function mergeLatestUserscriptItem(items, latestItem) {
            const merged = Array.isArray(items) ? [...items] : [];
            if (!latestItem || marketplaceItemId(latestItem) !== CHATGPT_AUTO_CONFIRM_PLUGIN_ID) return merged;
            const index = merged.findIndex((item) => marketplaceItemId(item) === CHATGPT_AUTO_CONFIRM_PLUGIN_ID);
            if (index < 0) {
              merged.unshift(latestItem);
              return merged;
            }
            const currentVersion = marketplaceItemVersion(merged[index]);
            const latestVersion = marketplaceItemVersion(latestItem);
            if (!currentVersion || (latestVersion && compareMarketplaceVersions(latestVersion, currentVersion) >= 0)) {
              merged[index] = latestItem;
            }
            return merged;
          }
          EOF

      - name: Pin v2.9.36, enable live discovery, and advance Chrome 0.6.12
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/chatgpt-auto-confirm.user.js chatgpt-vps-control/chrome-platform/extension/userscript/chatgpt-auto-confirm.user.js
          python - <<'PY'
          from pathlib import Path

          app_path = Path('chatgpt-vps-control/chrome-platform/extension/app.js')
          app = app_path.read_text()
          import_anchor = '} from "./marketplace-install.js";\n'
          release_import = '''import {
            fetchLatestUserscriptMarketplaceItem,
          } from "./marketplace-userscript-release.js";
          '''
          if 'from "./marketplace-userscript-release.js"' not in app:
              if import_anchor not in app:
                  raise SystemExit('app import anchor missing')
              app = app.replace(import_anchor, import_anchor + release_import, 1)
          app = app.replace('42df09a39f4505418f13a4fab578c96ee03b9b37', '2fd43b6ba64a58acbc806ad35a4c48b477ac57f0')
          app = app.replace('4fc88a50a8bb5034d5ec41f262c333d83e83917b1e22f75b26bb04ae10f8602b', '11784d8eafe788b7d72a99bd191865ba472ccf219561d91302cfadb65a5dae97')
          app = app.replace('const MARKETPLACE_USERSCRIPT_SIZE = 235583;', 'const MARKETPLACE_USERSCRIPT_SIZE = 237859;')
          app = app.replace('2.9.35', '2.9.36')

          old_bundled = '''async function bundledMarketplaceItems() {
            const official = await officialMarketplaceItem();
            return [official, ...BUILTIN_MARKETPLACE_ITEMS.slice(1)];
          }
          '''
          new_bundled = '''async function bundledMarketplaceItems() {
            const pinned = await officialMarketplaceItem();
            let official = pinned;
            try {
              official = await fetchLatestUserscriptMarketplaceItem({ baseItem: pinned });
            } catch {
              // GitHub discovery is advisory for availability. The bundled exact
              // pin remains the offline/rollback fallback and is still verified
              // again before installation.
            }
            return [official, ...BUILTIN_MARKETPLACE_ITEMS.slice(1)];
          }
          '''
          if old_bundled not in app:
              raise SystemExit('bundledMarketplaceItems anchor missing')
          app = app.replace(old_bundled, new_bundled, 1)

          start = app.index('async function refreshMarketplace(query = "") {')
          end = app.index('\nasync function refreshInstalled()', start)
          refresh = '''async function refreshMarketplace(query = "") {
            const requestId = ++state.marketplaceRequestId;
            const showBundled = shouldShowBundledFallback(query);
            const builtinsPromise = showBundled ? bundledMarketplaceItems() : Promise.resolve([]);
            const mergeBuiltins = (items, builtins) => {
              const merged = Array.isArray(items) ? [...items] : [];
              for (const builtin of builtins) {
                const index = merged.findIndex((item) => itemPluginId(item) === builtin.pluginId);
                if (index < 0) {
                  merged.unshift(builtin);
                  continue;
                }
                const comparison = compareVersions(itemVersion(builtin), itemVersion(merged[index]));
                if (comparison > 0
                  || (comparison === 0 && builtin.pluginId === BUILTIN_MARKETPLACE_ITEM.pluginId)
                  || !userscriptSurface(merged[index])) merged[index] = builtin;
              }
              return merged;
            };

            // The public Fabushi catalog and the source repository are both
            // discovery inputs. For ChatGPT 自动确认 the verified GitHub latest
            // release outranks a stale same-version catalog entry, while a
            // newer server catalog still wins. Installation remains immutable.
            try {
              const [liveItems, builtins] = await Promise.all([fetchPublicMarketplace(query), builtinsPromise]);
              if (requestId !== state.marketplaceRequestId) return;
              state.marketplace = mergeBuiltins(liveItems, builtins);
              renderCards($("#marketplace-list"), state.marketplace, state.desktopConnected ? "没有找到兼容 Chrome 的项目" : "没有找到可独立安装的 Chrome 项目");
              setMarketplaceUpdateStatus(marketplaceCatalogStatus(query));
              return;
            } catch {
              // Continue with verified GitHub fallback and, if connected, Host.
            }

            const builtins = await builtinsPromise;
            if (requestId !== state.marketplaceRequestId) return;
            if (!state.desktopConnected) {
              state.marketplace = builtins;
              renderCards($("#marketplace-list"), state.marketplace, "没有找到可独立安装的 Chrome 项目");
              setMarketplaceUpdateStatus({
                ...marketplaceCatalogStatus(query),
                checkedAt: Date.now(),
                error: builtins.length ? "" : "线上 Marketplace 暂时不可用。",
                reason: builtins.length ? "github-release-fallback" : "catalog",
              });
              return;
            }
            try {
              let result;
              try {
                result = await desktopRequest("feature.marketplace.browse", { query: query.trim() || undefined, platform: "chrome-extension" });
              } catch {
                result = await desktopRequest("feature.marketplace.browse", { query: query.trim() || undefined, platform: "web" });
              }
              if (requestId !== state.marketplaceRequestId) return;
              state.marketplace = mergeBuiltins(marketplaceItems(result), builtins);
              renderCards($("#marketplace-list"), state.marketplace, "没有找到兼容 Chrome 的项目");
              setMarketplaceUpdateStatus(marketplaceCatalogStatus(query));
            } catch (error) {
              state.marketplace = builtins;
              renderCards($("#marketplace-list"), state.marketplace, "没有找到兼容 Chrome 的项目");
              if (builtins.length) {
                setMarketplaceUpdateStatus(marketplaceCatalogStatus(query));
              } else {
                showBanner(error.message, "error");
                setMarketplaceUpdateStatus({ ...state.marketplaceUpdate, checkedAt: Date.now(), error: error.message, reason: "catalog" });
              }
            }
          }
          '''
          app = app[:start] + refresh + app[end:]
          app_path.write_text(app)

          checker_path = Path('chatgpt-vps-control/chrome-platform/extension/marketplace-update-check.js')
          checker = checker_path.read_text()
          checker_anchor = '} from "./marketplace-install.js";\n'
          checker_import = '''import {
            fetchLatestUserscriptUpdateItem,
            mergeLatestUserscriptItem,
          } from "./marketplace-userscript-release.js";
          '''
          if 'from "./marketplace-userscript-release.js"' not in checker:
              if checker_anchor not in checker:
                  raise SystemExit('checker import anchor missing')
              checker = checker.replace(checker_anchor, checker_anchor + checker_import, 1)
          start = checker.index('async function fetchMarketplaceItems() {')
          end = checker.index('\nasync function sendStatusToOpenViews', start)
          replacement = '''async function fetchMarketplaceCatalogItems() {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
            try {
              const response = await fetch(MARKETPLACE_UPDATE_API_URL, {
                headers: { Accept: "application/json" },
                cache: "no-store",
                redirect: "error",
                signal: controller.signal,
              });
              if (!response.ok) throw new Error(`Marketplace 请求失败（${response.status}）。`);
              return marketplaceItems(await response.json());
            } finally {
              clearTimeout(timer);
            }
          }

          async function fetchMarketplaceItems() {
            const [catalogResult, releaseResult] = await Promise.allSettled([
              fetchMarketplaceCatalogItems(),
              fetchLatestUserscriptUpdateItem(),
            ]);
            let items = catalogResult.status === "fulfilled" ? catalogResult.value : [];
            if (releaseResult.status === "fulfilled") items = mergeLatestUserscriptItem(items, releaseResult.value);
            if (items.length) return items;
            const failure = catalogResult.status === "rejected" ? catalogResult.reason : releaseResult.reason;
            throw failure instanceof Error ? failure : new Error(String(failure || "Marketplace 与 GitHub release 均不可用。"));
          }
          '''
          checker = checker[:start] + replacement + checker[end:]
          checker_path.write_text(checker)

          for path in [
              'chatgpt-vps-control/chrome-platform/extension/manifest.json',
              'chatgpt-vps-control/scripts/package-chrome-extension.mjs',
              'chatgpt-vps-control/scripts/validate-chrome-extension.mjs',
              'chatgpt-vps-control/docs/chrome-web-store/README.md',
              '.github/workflows/chrome-extension-web-store.yml',
              '.github/workflows/chrome-extension-web-store-publish.yml',
          ]:
              p = Path(path)
              text = p.read_text()
              if '0.6.11' not in text:
                  raise SystemExit(f'{path}: expected current Chrome 0.6.11 pin')
              p.write_text(text.replace('0.6.11', '0.6.12'))
          PY

      - name: Add release discovery regression coverage
        shell: bash
        run: |
          set -euo pipefail
          cat > chatgpt-vps-control/tests/marketplace-userscript-release.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import {
            mergeLatestUserscriptItem,
            parseGitHubUserscriptRelease,
            projectGitHubUserscriptRelease,
          } from "../chrome-platform/extension/marketplace-userscript-release.js";
          import { marketplaceUpdateCandidates } from "../chrome-platform/extension/marketplace-update-check.js";

          const sha = "2fd43b6ba64a58acbc806ad35a4c48b477ac57f0";
          const digest = "11784d8eafe788b7d72a99bd191865ba472ccf219561d91302cfadb65a5dae97";
          const release = (overrides = {}) => ({
            tag_name: "v2.9.36",
            target_commitish: sha,
            draft: false,
            prerelease: false,
            body: "bound conversation recovery",
            assets: [{
              name: "chatgpt-auto-confirm.user.js",
              state: "uploaded",
              size: 237859,
              digest: `sha256:${digest}`,
              browser_download_url: "https://github.com/bhrumom/fabushi-chatgpt-auto-confirm-userscript/releases/download/v2.9.36/chatgpt-auto-confirm.user.js",
            }],
            ...overrides,
          });
          const base = (version = "2.9.35") => ({
            pluginId: "chatgpt-auto-confirm",
            displayName: "ChatGPT 自动确认",
            latestVersion: version,
            source: {
              provider: "github",
              repository: "https://github.com/bhrumom/fabushi-chatgpt-auto-confirm-userscript",
              sourceRef: "a".repeat(40),
              releaseUrl: `https://github.com/bhrumom/fabushi-chatgpt-auto-confirm-userscript/releases/tag/v${version}`,
            },
            install: {
              protocol: "fabushi.marketplace.install.v1",
              strategy: "github-immutable",
              pluginId: "chatgpt-auto-confirm",
              version,
              source: {
                provider: "github",
                repository: "https://github.com/bhrumom/fabushi-chatgpt-auto-confirm-userscript",
                sourceRef: "a".repeat(40),
                releaseUrl: `https://github.com/bhrumom/fabushi-chatgpt-auto-confirm-userscript/releases/tag/v${version}`,
                marketplaceHostsPackage: false,
              },
              artifacts: [{ runtime: "userscript", format: "user-js", sha256: "b".repeat(64), size: 10, source: { type: "https", url: "https://raw.githubusercontent.com/old" } }],
              update: { allowDowngrade: false },
            },
            releaseManifest: {
              version,
              artifacts: [{ runtime: "userscript", format: "user-js", sha256: "b".repeat(64), size: 10, source: { type: "https", url: "https://raw.githubusercontent.com/old" } }],
              install: {
                version,
                source: { sourceRef: "a".repeat(40) },
                artifacts: [{ runtime: "userscript", format: "user-js", sha256: "b".repeat(64), size: 10, source: { type: "https", url: "https://raw.githubusercontent.com/old" } }],
              },
            },
          });

          test("GitHub latest release projects an immutable v2.9.36 Marketplace contract", () => {
            const metadata = parseGitHubUserscriptRelease(release());
            assert.equal(metadata.version, "2.9.36");
            assert.equal(metadata.sourceRef, sha);
            assert.equal(metadata.sha256, digest);
            assert.equal(metadata.size, 237859);
            const item = projectGitHubUserscriptRelease(base(), release());
            assert.equal(item.latestVersion, "2.9.36");
            assert.equal(item.install.version, "2.9.36");
            assert.equal(item.install.source.sourceRef, sha);
            assert.equal(item.install.artifacts[0].sha256, digest);
            assert.equal(item.install.artifacts[0].size, 237859);
            assert.equal(item.install.artifacts[0].source.url, `https://raw.githubusercontent.com/bhrumom/fabushi-chatgpt-auto-confirm-userscript/${sha}/chatgpt-auto-confirm.user.js`);
            assert.equal(item.releaseManifest.version, "2.9.36");
            assert.equal(item.releaseManifest.install.version, "2.9.36");
          });

          test("GitHub latest release rejects non-stable or mutable identities", () => {
            assert.throws(() => parseGitHubUserscriptRelease(release({ prerelease: true })), /正式稳定版/);
            assert.throws(() => parseGitHubUserscriptRelease(release({ target_commitish: "main" })), /exact commit/);
            const badDigest = release();
            badDigest.assets = [{ ...badDigest.assets[0], digest: "sha256:nope" }];
            assert.throws(() => parseGitHubUserscriptRelease(badDigest), /SHA-256/);
          });

          test("GitHub discovery never downgrades and outranks a stale equal-or-older catalog", () => {
            const older = release({ tag_name: "v2.9.34", assets: [{ ...release().assets[0], browser_download_url: "https://github.com/bhrumom/fabushi-chatgpt-auto-confirm-userscript/releases/download/v2.9.34/chatgpt-auto-confirm.user.js" }] });
            assert.equal(projectGitHubUserscriptRelease(base(), older).latestVersion, "2.9.35");
            const latest = projectGitHubUserscriptRelease(base(), release());
            assert.equal(mergeLatestUserscriptItem([base("2.9.35")], latest)[0].latestVersion, "2.9.36");
            assert.equal(mergeLatestUserscriptItem([base("2.9.37")], latest)[0].latestVersion, "2.9.37");
            const updates = marketplaceUpdateCandidates([latest], [{
              sourcePluginId: "chatgpt-auto-confirm",
              sourcePluginVersion: "2.9.35",
              sourceArtifactSha256: "b".repeat(64),
            }]);
            assert.equal(updates[0]?.latestVersion, "2.9.36");
            assert.equal(updates[0]?.artifactSha256, digest);
