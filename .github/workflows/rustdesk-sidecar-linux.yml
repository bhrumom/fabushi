name: RustDesk sidecar Linux

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

on:
  pull_request:
    paths:
      - 'integrations/rustdesk-sidecar/**'
      - '.github/workflows/rustdesk-sidecar-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustdesk-sidecar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  source-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Verify license and immutable upstream pin
        run: |
          grep -Fx 'repository=https://github.com/rustdesk/rustdesk.git' integrations/rustdesk-sidecar/UPSTREAM.lock
          grep -Ex 'commit=[0-9a-f]{40}' integrations/rustdesk-sidecar/UPSTREAM.lock
          grep -Fx 'license=AGPL-3.0-only' integrations/rustdesk-sidecar/UPSTREAM.lock
          grep -F 'separately built and distributable AGPL-3.0-only derivative' integrations/rustdesk-sidecar/README.md
          grep -F 'MUST NOT be passed into the RustDesk process' integrations/rustdesk-sidecar/README.md

      - name: Install RustDesk Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc git g++ libasound2-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev \
            libpulse-dev libva-dev libvdpau-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev \
            nasm wget

      - name: Prepare pinned corresponding source
        run: bash integrations/rustdesk-sidecar/prepare-source.sh "$RUNNER_TEMP/rustdesk-sidecar"

      - name: Export Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install RustDesk vcpkg dependencies
        working-directory: ${{ runner.temp }}/rustdesk-sidecar
        run: $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"

      - uses: dtolnay/rust-toolchain@stable

      - name: Check AGPL sidecar overlay
        working-directory: ${{ runner.temp }}/rustdesk-sidecar
        run: cargo check --locked --bin fabushi-sidecar

      - name: Build AGPL sidecar overlay
        working-directory: ${{ runner.temp }}/rustdesk-sidecar
        run: cargo build --locked --release --bin fabushi-sidecar

      - name: Smoke protocol and deny unauthenticated input
        working-directory: ${{ runner.temp }}/rustdesk-sidecar
        run: |
          printf '%s\n%s\n' \
            '{"type":"hello","protocol":"fabushi.rustdesk-sidecar.v1"}' \
            '{"type":"mouse","sessionId":"missing","mask":0,"x":0,"y":0}' \
            | timeout 10s target/release/fabushi-sidecar > "$RUNNER_TEMP/sidecar.out"
          grep -F '"type":"hello"' "$RUNNER_TEMP/sidecar.out"
          grep -F 'unknown-session' "$RUNNER_TEMP/sidecar.out"
          ! grep -E 'cookie|bearer|accountToken|deviceToken' "$RUNNER_TEMP/sidecar.out"

      - name: Upload corresponding-source overlay and binary
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-sidecar-linux-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/rustdesk-sidecar/target/release/fabushi-sidecar
            ${{ runner.temp }}/rustdesk-sidecar/FABUSHI-SIDECAR-SOURCE.txt
            integrations/rustdesk-sidecar/UPSTREAM.lock
            integrations/rustdesk-sidecar/README.md
            integrations/rustdesk-sidecar/prepare-source.sh
            integrations/rustdesk-sidecar/overlay/src/bin/fabushi_sidecar.rs
