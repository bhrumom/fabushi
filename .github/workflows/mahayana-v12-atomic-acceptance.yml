name: Mahayana v12 atomic acceptance

on:
  pull_request:
    paths:
      - 'fabushi/web/src/miniapps/**'
      - 'fabushi/web/tests/miniapp-deployment-identity-*.test.*'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/**'
      - '.github/workflows/mahayana-v12-atomic-acceptance.yml'
  push:
    branches:
      - codex/mahayana-marketplace-cloudflare-v10

permissions:
  contents: read

jobs:
  identity-schema:
    name: v12 / T01.1 identity-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run identity schema contract assertions
        run: node --test fabushi/web/tests/miniapp-deployment-identity-contract.test.js
      - name: Run identity migration round-trip
        run: python3 fabushi/web/tests/miniapp-deployment-identity-migration.test.py
      - name: Write evidence marker
        run: |
          mkdir -p .mahayana/evidence/v12
          python3 - <<'PY2'
          import json, os
          from datetime import datetime, timezone
          evidence = {
              "taskId": "T01.1",
              "checkName": "v12 / T01.1 identity-schema",
              "commit": os.environ["GITHUB_SHA"],
              "runUrl": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "assertions": [
                  "identity contract fixtures",
                  "serialization round-trip",
                  "source-hosting separation",
                  "SQLite migration round-trip",
              ],
              "externalReceipts": [],
              "completedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          with open(".mahayana/evidence/v12/T01.1.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY2
      - name: Upload T01.1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: mahayana-v12-T01.1-evidence
          path: .mahayana/evidence/v12/T01.1.json
          if-no-files-found: error

  local-workspace-offline:
    name: v12 / T02.1 local-workspace-offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run local workspace contract assertions
        run: node --test fabushi/web/tests/miniapp-workspace-offline-contract.test.js
      - name: Write evidence marker
        run: |
          mkdir -p .mahayana/evidence/v12
          python3 - <<'PY2'
          import json, os
          from datetime import datetime, timezone
          with open('.mahayana/evidence/v12/T02.1.json', 'w', encoding='utf-8') as f:
              json.dump({
                'taskId': 'T02.1',
                'checkName': 'v12 / T02.1 local-workspace-offline',
                'commit': os.environ['GITHUB_SHA'],
                'runUrl': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                'assertions': ['deterministic snapshot', 'offline workspace transition'],
                'externalReceipts': [],
                'completedAt': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              }, f, indent=2)
          PY2
      - name: Upload T02.1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: mahayana-v12-T02.1-evidence
          path: .mahayana/evidence/v12/T02.1.json
          if-no-files-found: error


