name: TFI multi-device sync finalizer

on:
  push:
    branches:
      - feat/tfi-multidevice-account-sync
    paths:
      - .github/workflows/tfi-multidevice-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/apply-tfi-multidevice-account-sync.py
            .github/scripts/repair-tfi-multidevice-transform.py
            .github/scripts/apply-tfi-multidevice-renderer.py
            .github/workflows/tfi-multidevice-account-sync.yml
            .github/workflows/tfi-multidevice-account-sync-v2.yml
            .github/workflows/tfi-multidevice-account-sync-v3.yml
            .github/workflows/tfi-multidevice-account-sync-v4.yml
            .github/workflows/tfi-multidevice-account-sync-v5.yml
            .github/workflows/tfi-multidevice-finalize.yml
            ai-backend
            desktop
            frontend/apps/web/src
            frontend/packages/shared/src
            frontend/packages/widgets/src
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply backend and native account synchronization
        run: python3 .github/scripts/repair-tfi-multidevice-transform.py
      - name: Apply desktop account sync coordinator and Mini App CloudStorage bridge
        run: python3 .github/scripts/apply-tfi-multidevice-renderer.py
      - name: Verify generated diff
        run: git diff --check
      - name: Install AI backend dependencies
        working-directory: ai-backend
        run: npm ci
      - name: Verify account sync backend
        working-directory: ai-backend
        run: node --test test/account_sync_store.test.js test/miniapp_marketplace_http.test.js
      - name: Verify native account sync bridge
        run: node --test desktop/electron/native-capability-handlers.test.cjs
      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci
      - name: Verify Electron renderer TypeScript and bundle
        working-directory: desktop
        run: npm run build:renderer
      - name: Commit verified multi-device implementation
        env:
          BRANCH: feat/tfi-multidevice-account-sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/scripts/apply-tfi-multidevice-account-sync.py .github/scripts/repair-tfi-multidevice-transform.py .github/scripts/apply-tfi-multidevice-renderer.py .github/workflows/tfi-multidevice-account-sync.yml .github/workflows/tfi-multidevice-account-sync-v2.yml .github/workflows/tfi-multidevice-account-sync-v3.yml .github/workflows/tfi-multidevice-account-sync-v4.yml .github/workflows/tfi-multidevice-account-sync-v5.yml .github/workflows/tfi-multidevice-finalize.yml
          git add ai-backend/src/account_sync_store.js ai-backend/src/platform_api.js ai-backend/src/miniapp_marketplace_mcp.js desktop/electron/native-capability-handlers.cjs desktop/electron/native-capability-handlers.test.cjs desktop/src/messaging-shell-v2.tsx
          git commit -m "feat(sync): implement Telegram-class multi-device account synchronization"
          git push origin "HEAD:${BRANCH}"
