name: FAB-P0001 M3 self patch

on:
  push:
    branches:
      - fix/fab-p0001-m3-e2e-closure
    paths:
      - .github/workflows/fab-p0001-m3-self-patch.yml
      - scripts/fab-p0001-m3-self-patch.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fab-p0001-m3-self-patch.yml
      - scripts/fab-p0001-m3-self-patch.py

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'bhrumom/fabushi' && (github.event_name == 'push' || github.head_ref == 'fix/fab-p0001-m3-e2e-closure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out M3 closure branch
        uses: actions/checkout@v5
        with:
          ref: fix/fab-p0001-m3-e2e-closure
          fetch-depth: 1

      - name: Fetch canonical driver from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git show origin/main:.github/workflows/fab-p0001-m3-unread-patch-driver.yml > "$RUNNER_TEMP/canonical-driver.yml"

      - name: Apply deterministic M3 product patch
        id: patch
        shell: bash
        env:
          CANONICAL_DRIVER: ${{ runner.temp }}/canonical-driver.yml
        run: |
          set -o pipefail
          python3 scripts/fab-p0001-m3-self-patch.py 2>&1 | tee "$RUNNER_TEMP/m3-patch.log"

      - name: Persist patch diagnostic on failure
        if: failure() && steps.patch.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/m3-patch.log" .github/fab-p0001-m3-self-patch-error.txt
          git config user.name "fabushi-ci"
          git config user.email "fabushi-ci@users.noreply.github.com"
          git add .github/fab-p0001-m3-self-patch-error.txt
          git commit -m "ci(tfi): record M3 self-patch diagnostic" || exit 0
          git push origin HEAD:fix/fab-p0001-m3-e2e-closure

      - name: Validate exact product patch allowlist
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              native/mahayana-messaging/src/engine.rs|native/mahayana-messaging/src/service.rs|native/mahayana-messaging/tests/typing_contract.rs|native/mahayana-messaging/tests/unread_projection_contract.rs|desktop/src/messaging-shell-v2.tsx|desktop/e2e/messenger.spec.ts) ;;
              *) echo "Unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit product patch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fabushi-ci"
          git config user.email "fabushi-ci@users.noreply.github.com"
          git add \
            native/mahayana-messaging/src/engine.rs \
            native/mahayana-messaging/src/service.rs \
            native/mahayana-messaging/tests/typing_contract.rs \
            native/mahayana-messaging/tests/unread_projection_contract.rs \
            desktop/src/messaging-shell-v2.tsx \
            desktop/e2e/messenger.spec.ts
          git commit -m "fix(tfi): close M3 unread typing and reload semantics"
          git push origin HEAD:fix/fab-p0001-m3-e2e-closure
