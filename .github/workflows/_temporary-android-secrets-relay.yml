name: TEMP Android Actions secrets relay
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: android-secrets-relay
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Set Android release signing secrets on target repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TEMP_ANDROID_MIGRATION_TARGET_ACTIONS_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
          FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          names=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            FABUSHI_CI_TEST_USERNAME
            FABUSHI_CI_TEST_PASSWORD
          )
          target_names=(
            ANDROID_RELEASE_KEYSTORE_BASE64
            ANDROID_RELEASE_KEYSTORE_PASSWORD
            ANDROID_RELEASE_KEY_ALIAS
            ANDROID_RELEASE_KEY_PASSWORD
            FABUSHI_CI_TEST_USERNAME
            FABUSHI_CI_TEST_PASSWORD
          )
          for i in "${!names[@]}"; do
            source_name="${names[$i]}"
            target_name="${target_names[$i]}"
            if [[ -z "${!source_name:-}" ]]; then
              echo "::error::Source Actions secret is unavailable: ${source_name}"
              exit 1
            fi
            printf '%s' "${!source_name}" | gh secret set "$target_name" --repo fabu-android/fabushi-android --app actions
            echo "Migrated ${source_name} to ${target_name} by name only."
          done
