name: Host fast E2E

on:
  pull_request:
    paths:
      - frontend/apps/host/**
      - frontend/apps/web/src/app/host/**
      - frontend/apps/web/src/lib/mahayana-host/**
      - frontend/apps/web/tsconfig.host.json
      - frontend/apps/web/package.json
      - frontend/packages/shared/src/mahayana-host-features.ts
      - contracts/automation/cross-platform-journeys.json
      - frontend/packages/shared/src/index.ts
      - frontend/pnpm-lock.yaml
      - frontend/pnpm-workspace.yaml
      - fabushi/web/mahayana-wasm/**
      - fabushi/e2e/package.json
      - fabushi/e2e/package-lock.json
      - fabushi/e2e/playwright.host.config.js
      - fabushi/e2e/tests/host-fast-user-journey.spec.ts
      - .github/workflows/host-fast-e2e.yml
  push:
    branches:
      - main
    paths:
      - frontend/apps/host/**
      - frontend/apps/web/src/app/host/**
      - frontend/apps/web/src/lib/mahayana-host/**
      - frontend/apps/web/tsconfig.host.json
      - frontend/packages/shared/src/mahayana-host-features.ts
      - contracts/automation/cross-platform-journeys.json
      - frontend/pnpm-lock.yaml
      - frontend/pnpm-workspace.yaml
      - fabushi/web/mahayana-wasm/**
      - fabushi/e2e/**
      - .github/workflows/host-fast-e2e.yml
  workflow_dispatch:

concurrency:
  group: host-fast-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-fast-e2e:
    name: React Host complete user journey
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout only Host test inputs
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /frontend/**
            /fabushi/e2e/**
            /fabushi/web/mahayana-wasm/**
            /contracts/automation/cross-platform-journeys.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pinned pnpm through Corepack
        run: corepack enable

      - id: pnpm-store
        name: Restore reusable Host pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/host-pnpm-store
          key: host-pnpm-${{ runner.os }}-v2-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile --prefer-offline --store-dir "$RUNNER_TEMP/host-pnpm-store"

      - name: Save Host pnpm store before typecheck
        if: steps.pnpm-store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/host-pnpm-store
          key: host-pnpm-${{ runner.os }}-v2-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Strictly typecheck the standalone and Web Host boundaries
        working-directory: frontend
        run: |
          pnpm --filter @fabushi/host typecheck
          pnpm --filter @fabushi/web typecheck:host

      - name: Build production Host bundle outside journey budget
        working-directory: frontend
        env:
          NEXT_PUBLIC_MAHAYANA_HOST_MODE: test
        run: pnpm --filter @fabushi/host build

      - name: Install Playwright test package without browser download
        working-directory: fabushi/e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --prefer-offline

      - name: Verify system Chrome is available
        run: google-chrome --version

      - name: Run complete Host user journey under execution budget
        id: journey
        working-directory: fabushi/e2e
        shell: bash
        env:
          FABUSHI_HOST_PREBUILT: "1"
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          npm run test:host-fast
          elapsed="$(( $(date +%s) - started_at ))"
          echo "elapsed_seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "Host user journey elapsed: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt 45 ]; then
            echo "Host fast E2E exceeded the 45-second execution budget." >&2
            exit 1
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: host-fast-e2e-diagnostics
          path: |
            fabushi/e2e/playwright-report/host-fast
            fabushi/e2e/test-results
          if-no-files-found: ignore
