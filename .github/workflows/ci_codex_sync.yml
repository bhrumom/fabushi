name: Mahayana embedded Codex Runtime

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "third_party/mahayana"
      - "third_party/mahayana/**"
      - "fabushi/lib/services/miniapp/mahayana_codex_runtime*.dart"
      - ".github/workflows/ci_codex_sync.yml"
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-mahayana-runtime:
    name: Test embedded Codex Runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Run Cargo fmt check
        run: cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all -- --check

      - name: Run Cargo clippy
        run: >-
          cargo clippy --locked
          --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml
          --package mahayana-agent-codex
          --package mahayana-ffi
          --package mahayana-cli
          --all-targets -- -D warnings

      - name: Run automated unit & integration tests
        if: runner.os == 'Linux'
        run: >-
          cargo test --locked
          --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml
          --package mahayana-agent-codex
          --package mahayana-agent-responses
          --package mahayana-platform-client
          --package mahayana-cli

  test-flutter-codex-binding:
    name: Validate Flutter/Dart Codex Sdk Binding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: fabushi
        run: flutter pub get

      - name: Analyze Dart syntax for the Runtime bridges
        working-directory: fabushi
        run: >-
          dart analyze
          lib/services/miniapp/mahayana_codex_runtime.dart
          lib/services/miniapp/mahayana_codex_runtime_io.dart
          lib/services/miniapp/mahayana_codex_runtime_web.dart
          lib/services/mahayana_sdk.dart
          lib/services/mahayana_command_service.dart
