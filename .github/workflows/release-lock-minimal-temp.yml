name: Release lock minimal temp

on:
  push:
    branches:
      - codex/formal-release-1.2.10

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/formal-release-1.2.10
          fetch-depth: 0
      - name: Restore lockfiles and change only root release identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- desktop/package-lock.json mobile/package-lock.json
          python3 - <<'PY'
          from pathlib import Path
          for name in ('desktop/package-lock.json','mobile/package-lock.json'):
              p=Path(name)
              s=p.read_text()
              old='"version": "1.2.9"'
              if s.count(old) < 2:
                  raise SystemExit(f'{name}: expected at least two 1.2.9 root identities')
              s=s.replace(old,'"version": "1.2.10"',2)
              p.write_text(s)
          PY
          git diff --check
      - name: Commit minimal lockfile diff and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release-lock-minimal-temp.yml
          git add desktop/package-lock.json mobile/package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(release): minimize 1.2.10 lock metadata diff'
          git push origin HEAD:codex/formal-release-1.2.10
