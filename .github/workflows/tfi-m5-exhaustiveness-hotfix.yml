name: TFI M5 exhaustiveness hotfix

on:
  push:
    branches: ["feat/fab-p0001-m5-contacts-groups"]
    paths:
      - ".github/workflows/tfi-m5-exhaustiveness-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fab-p0001-m5-contacts-groups
          fetch-depth: 0
      - name: Apply exact exhaustiveness fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("native/mahayana-messaging/src/service.rs")
          text = path.read_text()
          old_command = "            ClientCommand::StartTyping { .. } | ClientCommand::StopTyping { .. } => Vec::new(),"
          new_command = "            ClientCommand::Search { .. }\n            | ClientCommand::StartTyping { .. }\n            | ClientCommand::StopTyping { .. } => Vec::new(),"
          old_event = "            ServerEvent::SyncBatch { .. }\n            | ServerEvent::FolderChanged { .. }"
          new_event = "            ServerEvent::SyncBatch { .. }\n            | ServerEvent::SearchResults { .. }\n            | ServerEvent::FolderChanged { .. }"
          if text.count(old_command) != 1:
              raise SystemExit("expected exactly one ClientCommand exhaustiveness target")
          if text.count(old_event) != 1:
              raise SystemExit("expected exactly one ServerEvent exhaustiveness target")
          path.write_text(text.replace(old_command, new_command, 1).replace(old_event, new_event, 1))
      - name: Commit exact branch fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add native/mahayana-messaging/src/service.rs
          git commit -m "fix(tfi): make M5 search matches exhaustive"
          git push origin HEAD:feat/fab-p0001-m5-contacts-groups
