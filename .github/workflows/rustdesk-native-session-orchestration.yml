name: RustDesk native session orchestration

on:
  pull_request:
    paths:
      - '.github/scripts/rustdesk-native-session-orchestration.py'
      - '.github/scripts/rustdesk-requested-grants-integration.py'
      - '.github/scripts/rustdesk-migration-v20-registration.py'
      - '.github/workflows/rustdesk-native-session-orchestration.yml'
      - 'frontend/apps/web/src/lib/remote-computer/**'
      - 'frontend/apps/web/src/lib/fabushi-runtime/native-desktop.ts'
      - 'desktop/electron/main.cjs'
      - 'desktop/electron/native-edge.cjs'
      - 'desktop/electron/rustdesk-*.cjs'
      - 'desktop/src/edge/contracts/native-capabilities.ts'
      - 'desktop/src/messaging-shell-v2.tsx'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/remote_computer.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/lib.rs'
      - 'third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0020_remote_computer_requested_grants.sql'
      - 'chatgpt-vps-control/tests/rustdesk-session-permission-enforcement.test.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rustdesk-native-session-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  materialize-and-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/rustdesk-fusion-route-negotiation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Materialize authoritative grants and native RustDesk session orchestration
        run: |
          python .github/scripts/rustdesk-requested-grants-integration.py
          python .github/scripts/rustdesk-migration-v20-registration.py
          python .github/scripts/rustdesk-native-session-orchestration.py
      - name: Verify authoritative cloud grant materialization
        run: |
          grep -q 'RemoteComputerPermissionsRequest' third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/remote_computer.rs
          grep -q 'REMOTE_COMPUTER_REQUESTED_GRANTS_SCHEMA_V20' third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/lib.rs
          grep -q 'JOIN remote_computer_session_grants g' third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/remote_computer.rs
      - name: Verify native credential lifecycle materialization
        run: |
          grep -q 'createRustDeskHostSessionCredential' desktop/electron/main.cjs
          grep -q 'revokeRustDeskHostSessionCredential' desktop/electron/main.cjs
          grep -q 'rotateTemporaryPassword' desktop/electron/main.cjs
      - name: Verify active-session RustDesk orchestration materialization
        run: |
          grep -q 'type: "rustdesk.bootstrap"' frontend/apps/web/src/lib/remote-computer/desktop-peer.ts
          grep -q 'nativeRustDesk.connect' frontend/apps/web/src/lib/remote-computer/mobile-peer.ts
          grep -q "provider: 'rustdesk-sidecar'" desktop/src/messaging-shell-v2.tsx
      - name: Verify temporary credentials never enter cloud persistence
        run: |
          ! grep -Eq 'temporaryPassword|rustdeskPassword|providerPassword' third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/remote_computer.rs
          ! grep -Eqi 'temporary_password|rustdesk_password|provider_password' third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0019_remote_computer_audit_grants.sql
      - name: Verify remote session security contracts
        run: node --test chatgpt-vps-control/tests/rustdesk-session-permission-enforcement.test.js
      - name: Verify isolated Electron RustDesk process contracts
        run: node --test desktop/electron/rustdesk-sidecar-process.test.cjs desktop/electron/rustdesk-host-bootstrap.test.cjs desktop/electron/rustdesk-host-daemon-process.test.cjs
      - name: Typecheck shared web surface
        run: |
          corepack enable
          corepack prepare pnpm@10.9.0 --activate
          pnpm --dir frontend/apps/web install --frozen-lockfile --ignore-scripts
          pnpm --dir frontend/apps/web run typecheck
      - name: Typecheck desktop surface
        run: |
          npm --prefix desktop ci --ignore-scripts
          npm --prefix desktop run typecheck
      - name: Commit verified orchestration to dedicated integration branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            frontend/apps/web/src/lib/remote-computer/native-rustdesk-controller.ts \
            frontend/apps/web/src/lib/remote-computer/desktop-peer.ts \
            frontend/apps/web/src/lib/remote-computer/mobile-peer.ts \
            frontend/apps/web/src/lib/remote-computer/remote-api.ts \
            frontend/apps/web/src/lib/fabushi-runtime/native-desktop.ts \
            desktop/electron/main.cjs \
            desktop/electron/native-edge.cjs \
            desktop/src/edge/contracts/native-capabilities.ts \
            desktop/src/messaging-shell-v2.tsx \
            third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/remote_computer.rs \
            third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/lib.rs \
            third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/0020_remote_computer_requested_grants.sql \
            chatgpt-vps-control/tests/rustdesk-session-permission-enforcement.test.js
          if git diff --cached --quiet; then
            echo 'Native RustDesk orchestration source already materialized.'
            exit 0
          fi
          git commit -m 'feat(remote): connect authorized sessions through native RustDesk'
          git push origin HEAD:codex/rustdesk-fusion-route-negotiation
