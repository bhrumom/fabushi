name: ChatGPT Android Controller

on:
  pull_request:
    paths:
      - '.agents/plugins/plugins/chatgpt-android-controller/**'
      - '.github/workflows/chatgpt-android-controller-test.yml'
      - '.github/workflows/chatgpt-android-apk-runner.yml'
  push:
    branches:
      - main
    paths:
      - '.agents/plugins/plugins/chatgpt-android-controller/**'
      - '.github/workflows/chatgpt-android-controller-test.yml'
      - '.github/workflows/chatgpt-android-apk-runner.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .agents/plugins/plugins/chatgpt-android-controller
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Validate Android controller shell scripts
        run: |
          set -euo pipefail
          bash -n scripts/avd-state.sh
          bash -n scripts/fetch-chatgpt-apkcombo.sh
          bash -n scripts/verify-chatgpt-xapk.sh
          bash -n scripts/check-chatgpt-pairip.sh
          bash -n scripts/install-chatgpt-xapk.sh
      - name: Verify hosted Android emulator runtime
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK root: $sdk_root"
          test -d "$sdk_root"
          sdkmanager_bin=$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -u+x -print \
            | sort -V | tail -n 1)
          echo "sdkmanager: ${sdkmanager_bin:-missing}"
          test -n "$sdkmanager_bin"
          test -x "$sdkmanager_bin"
          tools_bin=$(dirname "$sdkmanager_bin")
          test -x "$tools_bin/avdmanager"
          test -x "$sdk_root/platform-tools/adb"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
          } >> "$GITHUB_ENV"
          {
            echo "$tools_bin"
            echo "$sdk_root/platform-tools"
            echo "$sdk_root/emulator"
          } >> "$GITHUB_PATH"

          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libpulse0
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" emulator 'build-tools;35.0.0'

          emulator_bin="$sdk_root/emulator/emulator"
          test -x "$emulator_bin"
          emulator_version=$("$emulator_bin" -version 2>&1)
          "$sdkmanager_bin" --version
          "$sdk_root/platform-tools/adb" version | head -n 1
          printf '%s\n' "$emulator_version" | head -n 1
