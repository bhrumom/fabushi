name: ChatGPT Android Controller

on:
  pull_request:
    paths:
      - '.agents/plugins/plugins/chatgpt-android-controller/**'
      - '.github/workflows/chatgpt-android-controller-test.yml'
      - '.github/workflows/chatgpt-android-apk-runner.yml'
  push:
    branches:
      - main
    paths:
      - '.agents/plugins/plugins/chatgpt-android-controller/**'
      - '.github/workflows/chatgpt-android-controller-test.yml'
      - '.github/workflows/chatgpt-android-apk-runner.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .agents/plugins/plugins/chatgpt-android-controller
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: bash -n scripts/avd-state.sh
      - run: bash -n scripts/fetch-chatgpt-apkcombo.sh
      - name: Verify hosted Android emulator runtime
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK root: $sdk_root"
          test -d "$sdk_root"
          sdkmanager_bin=$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -u+x -print \
            | sort -V | tail -n 1)
          echo "sdkmanager: ${sdkmanager_bin:-missing}"
          test -n "$sdkmanager_bin"
          test -x "$sdkmanager_bin"
          tools_bin=$(dirname "$sdkmanager_bin")
          test -x "$tools_bin/avdmanager"
          test -x "$sdk_root/platform-tools/adb"

          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libpulse0
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" emulator 'build-tools;35.0.0'

          emulator_bin="$sdk_root/emulator/emulator"
          test -x "$emulator_bin"
          if ! emulator_version=$("$emulator_bin" -version 2>&1); then
            printf '%s\n' "$emulator_version"
            exit 1
          fi

          "$sdkmanager_bin" --version
          "$sdk_root/platform-tools/adb" version | head -n 1
          printf '%s\n' "$emulator_version" | head -n 1
      - name: Verify downloadable ChatGPT XAPK identity
        working-directory: .agents/plugins/plugins/chatgpt-android-controller
        shell: bash
        env:
          CHATGPT_ANDROID_VERSION_NAME: '1.2026.202'
          CHATGPT_ANDROID_VERSION_CODE: '2620225'
          CHATGPT_ANDROID_EXPECTED_CERT_SHA256: 'b24f4bfbb3cf293f938703b9d87027c1102cc36dc4fa206910e08927db40473c'
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/chatgpt.xapk"
          extract="$RUNNER_TEMP/chatgpt-xapk"
          bash scripts/fetch-chatgpt-apkcombo.sh "$bundle"
          mkdir -p "$extract"
          unzip -q "$bundle" -d "$extract"
          mapfile -t apks < <(find "$extract" -type f -name '*.apk' -print | sort)
          if (( ${#apks[@]} == 0 )); then
            echo '::error::Downloaded XAPK has no APK entries.'
            exit 1
          fi
          printf 'XAPK APK entries (%s):\n' "${#apks[@]}"
          printf '%s\n' "${apks[@]##*/}"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x -print | sort -V | tail -n 1)
          aapt=$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x -print | sort -V | tail -n 1)
          test -x "$apksigner"
          test -x "$aapt"

          for apk in "${apks[@]}"; do
            cert=$(
              "$apksigner" verify --print-certs "$apk" 2>/dev/null \
                | awk -F': ' '/certificate SHA-256 digest:/ {print tolower($2); exit}'
            )
            if [[ "$cert" != "$CHATGPT_ANDROID_EXPECTED_CERT_SHA256" ]]; then
              echo "::error::Unexpected signing certificate for $(basename "$apk"): ${cert:-missing}"
              exit 1
            fi
          done

          base=''
          for apk in "${apks[@]}"; do
            if "$aapt" dump badging "$apk" 2>/dev/null | grep -q "package: name='com.openai.chatgpt'"; then
              base="$apk"
              break
            fi
          done
          if [[ -z "$base" ]]; then
            echo '::error::No APK in the archive declares com.openai.chatgpt.'
            exit 1
          fi
          "$aapt" dump badging "$base" | head -n 4
          echo "Verified ChatGPT XAPK base: $(basename "$base")"
