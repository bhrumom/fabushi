name: CD - Worker production deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA to deploy. Leave empty to deploy the selected ref.
        required: false
        type: string

concurrency:
  group: cd-worker-production-main
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  resolve-source:
    name: Resolve Worker source and deployment impact
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      should_deploy: ${{ steps.impact.outputs.should_deploy }}
    steps:
      - name: Resolve source commit
        id: source
        shell: bash
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            source_sha="${{ github.event.workflow_run.head_sha }}"
          elif [ -n "${INPUT_SOURCE_SHA:-}" ]; then
            source_sha="$INPUT_SOURCE_SHA"
          else
            source_sha="${{ github.sha }}"
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved Worker source: $source_sha"
      - name: Check whether Worker deployment inputs changed
        id: impact
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          script: |
            if (process.env.FORCE_DEPLOY === 'true') {
              core.setOutput('should_deploy', 'true');
              core.info('Manual dispatch explicitly requests a Worker deployment.');
              return;
            }

            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.SOURCE_SHA,
              per_page: 100,
            });
            const files = (commit.files || []).map((file) => file.filename);
            const safetyLimitReached = files.length >= 300;
            const relevant = files.some((filename) =>
              filename.startsWith('fabushi/web/') ||
              filename.startsWith('third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/'),
            );
            const shouldDeploy = safetyLimitReached || relevant;
            core.setOutput('should_deploy', shouldDeploy ? 'true' : 'false');
            await core.summary
              .addHeading('Worker deployment impact')
              .addRaw(`source=${process.env.SOURCE_SHA}\n`)
              .addRaw(`changed_files=${files.length}\n`)
              .addRaw(`should_deploy=${shouldDeploy}\n`)
              .addRaw(safetyLimitReached ? 'reason=300-file safety limit reached; fail-safe deploy\n' : '')
              .write();

  deploy-staging:
    name: Deploy staging Worker
    needs: resolve-source
    if: needs.resolve-source.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
      url: https://fabushi-flutter-web-dev.bhrumom.workers.dev
    defaults:
      run:
        working-directory: fabushi/web
    steps:
      - name: Checkout Worker source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fabushi/web/**
            /.github/scripts/**
            /third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/**
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run Worker regression tests
        shell: bash
        run: |
          set -euo pipefail
          printf '{"type":"module"}\n' > package.json
          node tests/profile.test.js
          python3 ../../.github/scripts/prepare-development-wrangler.py --self-test
          bash -n ../../.github/scripts/bootstrap-development-account-d1.sh
      - name: Resolve isolated development D1 bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ../../.github/scripts/prepare-development-wrangler.py \
            wrangler.toml wrangler.development.ci.toml
          ! grep -q 'YOUR_DEV_DATABASE_ID' wrangler.development.ci.toml
          grep -q 'database_name = "search_database_dev"' wrangler.development.ci.toml
          grep -q 'database_name = "mahayana-platform-development"' wrangler.development.ci.toml
      - name: Validate staging Worker configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@latest deploy
          --config wrangler.development.ci.toml
          --env development
          --dry-run
          --outdir /tmp/fabushi-staging-worker
      - name: Verify staging security secrets before remote mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        shell: bash
        run: >-
          bash ../../.github/scripts/assert-worker-security-secrets.sh
          development --config wrangler.development.ci.toml
      - name: Bootstrap development account D1 when empty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: >-
          bash ../../.github/scripts/bootstrap-development-account-d1.sh
          wrangler.development.ci.toml development
      - name: Apply remaining development account D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bash ../../.github/scripts/run-wrangler-d1-migrations.sh
          DB development --config wrangler.development.ci.toml
      - name: Apply development marketplace D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: >-
          bash ../../.github/scripts/run-wrangler-d1-migrations.sh
          PLATFORM_DB development --config wrangler.development.ci.toml
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@latest deploy
          --config wrangler.development.ci.toml
          --env development
      - name: Sync staging self-hosted registration mail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          AUTH_SYSTEM_MAIL_URL: ${{ secrets.AUTH_SYSTEM_MAIL_URL }}
          AUTH_SYSTEM_MAIL_TOKEN: ${{ secrets.AUTH_SYSTEM_MAIL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${AUTH_SYSTEM_MAIL_URL:-}" ]
          [ -n "${AUTH_SYSTEM_MAIL_TOKEN:-}" ]
          printf '%s' "$AUTH_SYSTEM_MAIL_URL" | npx --yes wrangler@latest secret put AUTH_SYSTEM_MAIL_URL --config wrangler.development.ci.toml --env development
          printf '%s' "$AUTH_SYSTEM_MAIL_TOKEN" | npx --yes wrangler@latest secret put AUTH_SYSTEM_MAIL_TOKEN --config wrangler.development.ci.toml --env development
          # URL + token are required immediately above, so keep registration email enabled on every deployment.
          printf '%s' 'true' | npx --yes wrangler@latest secret put AUTH_SYSTEM_MAIL_ENABLED --config wrangler.development.ci.toml --env development

  staging-e2e:
    name: Staging API E2E and smoke gate
    needs:
      - resolve-source
      - deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fabushi/e2e
    env:
      STAGING_API_URL: https://fabushi-flutter-web-dev.bhrumom.workers.dev
      STAGING_APP_URL: ${{ vars.STAGING_APP_URL || 'https://fabushi-flutter-web-dev.bhrumom.workers.dev' }}
      STAGING_TEST_LOGIN: ${{ secrets.STAGING_TEST_LOGIN }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      STAGING_TEST_EMAIL: ${{ vars.STAGING_TEST_EMAIL }}
      STAGING_TEST_PHONE: ${{ vars.STAGING_TEST_PHONE }}
      STAGING_SOCIAL_TARGET_USERNAME: ${{ vars.STAGING_SOCIAL_TARGET_USERNAME }}
    steps:
      - name: Checkout E2E files
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fabushi/e2e/**
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install E2E dependencies
        run: npm ci
      - name: Run staging API E2E
        run: npm test
      - name: Smoke test staging API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$STAGING_API_URL/health" > /tmp/staging-health.json
          test -s /tmp/staging-health.json
          status=$(curl -sS -o /tmp/staging-auth.json -w '%{http_code}' "$STAGING_API_URL/api/auth/user-info")
          test "$status" = "401" -o "$status" = "403"

  deploy-production:
    name: Deploy production Worker
    needs:
      - resolve-source
      - staging-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_API_URL || 'https://api.ombhrum.com' }}
    defaults:
      run:
        working-directory: fabushi/web
    steps:
      - name: Checkout validated Worker source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fabushi/web/**
            /.github/scripts/**
            /third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations/**
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Disable production route mutation in CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('wrangler.toml')
          text = path.read_text()
          pattern = re.compile(r'(?ms)^(\[env\.production\]\nname = "fabushi-flutter-web-prod"\n)(?:routes = \[\n(?:  .*\n)+?\]\n)?(workers_dev = false\n)')
          replacement = '[env.production]\nname = "fabushi-flutter-web-prod"\n# Route is pre-provisioned in Cloudflare.\nworkers_dev = false\n'
          new_text, count = pattern.subn(replacement, text, count=1)
          if count == 0:
              raise SystemExit('Could not locate production Worker block in wrangler.toml')
          path.write_text(new_text)
          PY
      - name: Verify production security secrets before remote mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        shell: bash
        run: bash ../../.github/scripts/assert-worker-security-secrets.sh production
      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: bash ../../.github/scripts/run-wrangler-d1-migrations.sh DB production
      - name: Sync production automation token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          VERSION_POLICY_AUTOMATION_TOKEN: ${{ secrets.VERSION_POLICY_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${VERSION_POLICY_AUTOMATION_TOKEN:-}" ]
          printf '%s' "$VERSION_POLICY_AUTOMATION_TOKEN" | npx --yes wrangler@latest secret put VERSION_POLICY_AUTOMATION_TOKEN --env production
      - name: Sync production self-hosted registration mail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          AUTH_SYSTEM_MAIL_URL: ${{ secrets.AUTH_SYSTEM_MAIL_URL }}
          AUTH_SYSTEM_MAIL_TOKEN: ${{ secrets.AUTH_SYSTEM_MAIL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${AUTH_SYSTEM_MAIL_URL:-}" ]
          [ -n "${AUTH_SYSTEM_MAIL_TOKEN:-}" ]
          printf '%s' "$AUTH_SYSTEM_MAIL_URL" | npx --yes wrangler@latest secret put AUTH_SYSTEM_MAIL_URL --env production
          printf '%s' "$AUTH_SYSTEM_MAIL_TOKEN" | npx --yes wrangler@latest secret put AUTH_SYSTEM_MAIL_TOKEN --env production
          # URL + token are required immediately above, so keep registration email enabled on every deployment.
          printf '%s' 'true' | npx --yes wrangler@latest secret put AUTH_SYSTEM_MAIL_ENABLED --env production
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --env production

  production-smoke:
    name: Production API smoke
    needs:
      - resolve-source
      - deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://api.ombhrum.com' }}
    steps:
      - name: Verify production API health and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$PRODUCTION_API_URL/health" > /tmp/production-health.json
          test -s /tmp/production-health.json
          status=$(curl -sS -o /tmp/production-auth.json -w '%{http_code}' "$PRODUCTION_API_URL/api/auth/user-info")
          test "$status" = "401" -o "$status" = "403"

          browser_start_status=$(curl -sS -o /tmp/production-browser-start.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"platform":"desktop"}' \
            "$PRODUCTION_API_URL/api/auth/browser/start")
          test "$browser_start_status" = "200"
          jq -e '.attemptId and .pollSecret and .loginUrl' /tmp/production-browser-start.json >/dev/null
          ! grep -Fq 'This Cloudflare Worker is an API backend only.' /tmp/production-browser-start.json
          login_url=$(jq -er '.loginUrl' /tmp/production-browser-start.json)
          case "$login_url" in
            "$PRODUCTION_API_URL/api/auth/browser/portal"*) ;;
            *) echo "Production browser login escaped canonical API origin: $login_url" >&2; exit 1 ;;
          esac
