name: Chain macOS test release to interactive App E2E

on:
  workflow_run:
    workflows:
      - Native Electron macOS test release
      - Post-main E2E Release delivery
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main source SHA whose published macOS release should be tested
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: macos-interactive-release-chain-${{ github.event.workflow_run.id || inputs.source_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch-interactive:
    name: Dispatch exact-source FCM external controller
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: release
        name: Resolve exact-source published macOS release tag
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            upstream_id='${{ github.event.workflow_run.id }}'
            upstream_conclusion='${{ github.event.workflow_run.conclusion }}'
            test -n "$upstream_id"
            test "$upstream_conclusion" = success

            upstream="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$upstream_id")"
            upstream_path="$(jq -r '.path // empty' <<<"$upstream")"
            upstream_title="$(jq -r '.display_title // empty' <<<"$upstream")"
            upstream_event="$(jq -r '.event // empty' <<<"$upstream")"
            upstream_head_sha="$(jq -r '.head_sha // empty' <<<"$upstream")"

            case "$upstream_path" in
              .github/workflows/native-electron-release.yml)
                source_sha="$upstream_head_sha"
                ;;
              .github/workflows/post-main-delivery.yml)
                if [ "$upstream_event" != workflow_run ]; then
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  echo "Ignoring non-delivery Post-main contract run $upstream_id ($upstream_event)." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                source_sha="$(sed -nE 's/^Post-main source=([0-9a-f]{40}) upstream=.*/\1/p' <<<"$upstream_title")"
                ;;
              *)
                echo "Unexpected upstream workflow path: $upstream_path" >&2
                exit 1
                ;;
            esac
            upstream_name="$upstream_title"
          else
            source_sha="$DISPATCH_SOURCE_SHA"
            upstream_name='manual exact-source replay'
            upstream_id="$GITHUB_RUN_ID"
          fi
          test -n "$source_sha"
          test "${#source_sha}" = 40
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]')"
          release_tag="$(jq -sr --arg sha "$source_sha" '
            [ .[]
              | select(.draft == false and .immutable == true and .target_commitish == $sha)
              | select(any(.assets[]?; (.name // "") | test("^fabushi-[0-9]+[.][0-9]+[.][0-9]+-macos-arm64[.]zip$")))
            ]
            | sort_by(.published_at // .created_at)
            | last
            | .tag_name // empty
          ' <<<"$releases")"
          if [ -z "$release_tag" ]; then
            echo "No immutable published macOS release with an installable ZIP is bound to exact source $source_sha" >&2
            exit 1
          fi

          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_tag" --jq '.sha')"
          test "$tag_sha" = "$source_sha"
          short_source="${source_sha:0:12}"
          [[ "$release_tag" == desktop-*"-$short_source" ]]

          existing="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fcm-010-13-11-macos-external-controller.yml/runs?head_sha=$source_sha&per_page=100")"
          existing_run="$(jq -r '
            [ .workflow_runs[]
              | select(.event == "workflow_dispatch")
              | select(.head_branch == $tag)
              | select(.status != "completed" or .conclusion == "success")
            ]
            | sort_by(.created_at)
            | last
            | .id // empty
          ' --arg tag "$release_tag" <<<"$existing")"
          skip=false
          if [ -n "$existing_run" ]; then
            skip=true
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          {
            echo '## macOS release -> FCM external controller chain'
            echo
            echo "- Trigger event: $GITHUB_EVENT_NAME"
            echo "- Upstream: $upstream_name / $upstream_id"
            echo "- Exact source SHA: \`$source_sha\`"
            echo "- Exact immutable release tag/ref: \`$release_tag\`"
            if [ "$skip" = true ]; then
              echo "- Existing active/successful exact-source external-controller run: \`$existing_run\`; duplicate dispatch suppressed."
            else
              echo '- No active/successful exact-source external-controller run exists; controller dispatch is required.'
            fi
            echo '- The FCM controller is the only component allowed to create and externally control the fresh target run; this bridge never dispatches the target workflow directly.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch exact-source FCM external controller from immutable release tag
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          gh workflow run fcm-010-13-11-macos-external-controller.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
