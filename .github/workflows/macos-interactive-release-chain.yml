name: macOS interactive release auto-chain (disabled by FCM-023)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact formal candidate SHA; informational only while legacy auto-chain is disabled
        required: true
        type: string

permissions:
  contents: read

jobs:
  disabled:
    name: Release-to-E2E auto-chain disabled
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - shell: bash
        run: |
          echo 'Automatic test-release -> interactive E2E chaining is disabled by FCM-023.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Formal validation must be manually initiated and externally driven through the Fabushi official MCP.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Historical implementation is preserved under .github/workflows-disabled/macos-interactive-release-chain.yml.' >> "$GITHUB_STEP_SUMMARY"