name: MSR Recovery Queue V4

on:
  push:
    branches:
      - feat/msr-sovereign-runtime-final
    paths:
      - .github/workflows/msr-recovery-queue-v4.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/msr-sovereign-runtime-final
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Patch and verify prompt recovery state machine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('third_party/mahayana/mahayana-rs/mahayana-orchestrator/src/lib.rs')
          text = path.read_text()
          if 'pub fn requeue(&mut self, id: &str)' not in text:
              marker = '    pub fn complete(&mut self, id: &str) -> Result<(), OrchestratorError> {\n'
              addition = '''    pub fn requeue(&mut self, id: &str) -> Result<(), OrchestratorError> {
        let entry = self
            .entries
            .iter_mut()
            .find(|entry| entry.id == id)
            .ok_or_else(|| OrchestratorError::PromptNotFound(id.to_string()))?;
        if entry.state != PromptState::Running {
            return Err(OrchestratorError::InvalidInput(format!(
                "prompt {id} cannot be requeued from {:?}",
                entry.state
            )));
        }
        entry.state = PromptState::Pending;
        Ok(())
    }

    pub fn reclaim(&mut self, id: &str) -> Result<PromptEntry, OrchestratorError> {
        let entry = self
            .entries
            .iter_mut()
            .find(|entry| entry.id == id)
            .ok_or_else(|| OrchestratorError::PromptNotFound(id.to_string()))?;
        if entry.state != PromptState::Pending {
            return Err(OrchestratorError::InvalidInput(format!(
                "prompt {id} cannot be reclaimed from {:?}",
                entry.state
            )));
        }
        entry.state = PromptState::Running;
        Ok(entry.clone())
    }

'''
              if marker not in text:
                  raise SystemExit('PromptQueue complete marker missing')
              text = text.replace(marker, addition + marker, 1)

          if 'prompt_queue_requeues_and_reclaims_running_work' not in text:
              marker = '    #[test]\n    fn prompt_queue_dedupes_pending_updates() {\n'
              test = '''    #[test]
    fn prompt_queue_requeues_and_reclaims_running_work() {
        let mut queue = PromptQueue::default();
        let id = queue
            .enqueue("recover me", PromptPriority::UserBlocking, None, Value::Null)
            .expect("enqueue prompt");
        let running = queue.take_next().expect("take prompt");
        assert_eq!(running.id, id);
        assert_eq!(running.state, PromptState::Running);

        queue.requeue(&id).expect("requeue running prompt");
        let pending = queue.pending();
        assert_eq!(pending.len(), 1);
        assert_eq!(pending[0].id, id);
        assert_eq!(pending[0].state, PromptState::Pending);

        let reclaimed = queue.reclaim(&id).expect("reclaim pending prompt");
        assert_eq!(reclaimed.id, id);
        assert_eq!(reclaimed.state, PromptState::Running);
        assert!(queue.pending().is_empty());
        assert!(queue.reclaim(&id).is_err());
    }

'''
              if marker not in text:
                  raise SystemExit('prompt queue test marker missing')
              text = text.replace(marker, test + marker, 1)
          path.write_text(text)
          PY

          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all
          cargo test --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml -p mahayana-orchestrator
          cargo clippy --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml -p mahayana-orchestrator --all-targets -- -D warnings

          rm -f .github/workflows/msr-recovery-queue-v4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add third_party/mahayana/mahayana-rs/mahayana-orchestrator/src/lib.rs .github/workflows/msr-recovery-queue-v4.yml
          git diff --cached --check
          git commit -m 'feat(msr): make suspended prompts reclaimable'
          git push origin HEAD:feat/msr-sovereign-runtime-final
