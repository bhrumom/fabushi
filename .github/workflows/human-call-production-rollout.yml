name: Human call production backend rollout

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact canonical main SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: human-call-production-backend
  cancel-in-progress: false

jobs:
  rollout:
    name: Provision TURN and deploy exact-main Human call backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      TURN_KEY_NAME_PREFIX: fabushi-desktop-production-

    steps:
      - name: Checkout requested exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require canonical main exact-head binding
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          remote_main="$(git ls-remote https://github.com/$GITHUB_REPOSITORY.git refs/heads/main | awk '{print $1}')"
          test -n "$remote_main"
          if [ "$remote_main" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Canonical main drifted: expected $EXPECTED_SOURCE_SHA, current $remote_main"
            exit 1
          fi
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Create a fresh Cloudflare Realtime TURN key
        id: turn
        shell: bash
        run: |
          set -euo pipefail
          short_source="${EXPECTED_SOURCE_SHA:0:12}"
          key_name="${TURN_KEY_NAME_PREFIX}${short_source}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          response="$RUNNER_TEMP/turn-key-create.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}'             --request POST             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/calls/turn_keys"             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             --header 'Content-Type: application/json'             --data "$(jq -cn --arg name "$key_name" '{name:$name}')")"
          test "$status" = "200" || {
            jq '{success,errors,messages}' "$response" >&2 || true
            echo "::error::Cloudflare TURN key creation failed with HTTP $status"
            exit 1
          }
          jq -e '.success == true and (.result.uid|type=="string") and (.result.key|type=="string")' "$response" >/dev/null
          turn_key_id="$(jq -r '.result.uid' "$response")"
          turn_key_token="$(jq -r '.result.key' "$response")"
          test -n "$turn_key_id"
          test -n "$turn_key_token"
          echo "::add-mask::$turn_key_token"
          {
            echo "turn_key_id=$turn_key_id"
            echo "turn_key_name=$key_name"
          } >> "$GITHUB_OUTPUT"
          printf '%s' "$turn_key_token" > "$RUNNER_TEMP/turn-key-token"
          chmod 600 "$RUNNER_TEMP/turn-key-token"
          rm -f "$response"

      - name: Store TURN authority only in production Worker secrets
        working-directory: fabushi/web
        shell: bash
        env:
          TURN_KEY_ID: ${{ steps.turn.outputs.turn_key_id }}
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/turn-key-token")"
          echo "::add-mask::$token"
          printf '%s' "$TURN_KEY_ID" | npx --yes wrangler@latest secret put FABUSHI_TURN_KEY_ID --env production
          printf '%s' "$token" | npx --yes wrangler@latest secret put FABUSHI_TURN_KEY_API_TOKEN --env production
          rm -f "$RUNNER_TEMP/turn-key-token"

      - name: Require all production Worker secrets before mutation
        working-directory: fabushi/web
        shell: bash
        run: |
          set -euo pipefail
          bash ../../.github/scripts/assert-worker-security-secrets.sh production

      - name: Apply canonical production D1 migrations
        working-directory: fabushi/web
        shell: bash
        run: |
          set -euo pipefail
          bash ../../.github/scripts/run-wrangler-d1-migrations.sh DB production

      - name: Deploy exact-main production Worker
        id: deploy
        working-directory: fabushi/web
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/wrangler-deploy.log"
          npx --yes wrangler@latest deploy --env production 2>&1 | tee "$deploy_log"
          grep -F 'api.ombhrum.com' "$deploy_log" >/dev/null
          {
            echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "worker_name=fabushi-flutter-web-prod"
          } >> "$GITHUB_OUTPUT"

      - name: Retire older Fabushi Desktop TURN keys after successful deploy
        shell: bash
        env:
          CURRENT_TURN_KEY_ID: ${{ steps.turn.outputs.turn_key_id }}
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/turn-keys.json"
          curl --fail --silent --show-error             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/calls/turn_keys"             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > "$keys"
          jq -e '.success == true' "$keys" >/dev/null
          jq -r --arg prefix "$TURN_KEY_NAME_PREFIX" --arg current "$CURRENT_TURN_KEY_ID"             '.result[]? | select((.name // "") | startswith($prefix)) | select(.uid != $current) | .uid' "$keys" |
          while IFS= read -r key_id; do
            test -n "$key_id" || continue
            curl --fail --silent --show-error --request DELETE               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/calls/turn_keys/$key_id"               --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null
          done
          rm -f "$keys"

      - name: Record non-sensitive rollout provenance
        if: always()
        shell: bash
        env:
          TURN_KEY_ID: ${{ steps.turn.outputs.turn_key_id }}
          TURN_KEY_NAME: ${{ steps.turn.outputs.turn_key_name }}
          DEPLOYED_AT: ${{ steps.deploy.outputs.deployed_at }}
          WORKER_NAME: ${{ steps.deploy.outputs.worker_name }}
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/turn-key-token" "$RUNNER_TEMP/turn-key-create.json"
          mkdir -p "$RUNNER_TEMP/human-call-rollout-evidence"
          jq -n             --arg schema 'fabushi.human-call-production-rollout.v1'             --arg sourceSha "$EXPECTED_SOURCE_SHA"             --arg runId "$GITHUB_RUN_ID"             --arg runAttempt "$GITHUB_RUN_ATTEMPT"             --arg turnKeyId "${TURN_KEY_ID:-}"             --arg turnKeyName "${TURN_KEY_NAME:-}"             --arg workerName "${WORKER_NAME:-}"             --arg deployedAt "${DEPLOYED_AT:-}"             '{schema:$schema,sourceSha:$sourceSha,runId:$runId,runAttempt:$runAttempt,turnKeyId:$turnKeyId,turnKeyName:$turnKeyName,workerName:$workerName,deployedAt:$deployedAt}'             > "$RUNNER_TEMP/human-call-rollout-evidence/provenance.json"

      - name: Upload non-sensitive rollout provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: human-call-production-rollout-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/human-call-rollout-evidence/
          if-no-files-found: error
          retention-days: 90
