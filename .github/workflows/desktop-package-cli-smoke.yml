name: Desktop package CLI smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag containing desktop packages. Use latest by default.
        required: false
        default: latest
        type: string
  release:
    types:
      - published

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-package-cli-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-cli-smoke:
    name: Smoke installed ${{ matrix.target }} package CLI
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'desktop-')
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            pattern: '*windows-x64.zip'
            cli: global_dharma_sharing_cli.exe
          - target: macos
            os: macos-latest
            pattern: '*macos-*.zip'
            cli: global_dharma_sharing.app/Contents/MacOS/global_dharma_sharing_cli
          - target: linux
            os: ubuntu-latest
            pattern: '*linux-x64.tar.gz'
            cli: global_dharma_sharing_cli
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/assert-openclaw-bundle.sh
            .github/scripts/assert-mahayana-bundle.sh

      - name: Download release package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name || 'latest' }}
          ASSET_PATTERN: ${{ matrix.pattern }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package"
          if [ "$RELEASE_TAG" = "latest" ]; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_PATTERN" --dir "$RUNNER_TEMP/package" --clobber
          else
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_PATTERN" --dir "$RUNNER_TEMP/package" --clobber
          fi
          find "$RUNNER_TEMP/package" -maxdepth 1 -type f -print

      - name: Install Linux package and smoke CLI
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/installed"
          archive="$(find "$RUNNER_TEMP/package" -maxdepth 1 -name '*linux-x64.tar.gz' -print -quit)"
          if [ -z "$archive" ]; then
            echo "No Linux archive downloaded" >&2
            exit 1
          fi
          tar -xzf "$archive" -C "$RUNNER_TEMP/installed"
          cli="$RUNNER_TEMP/installed/${{ matrix.cli }}"
          if [ ! -x "$cli" ]; then
            echo "Installed package CLI not found or not executable: $cli" >&2
            exit 1
          fi
          ./.github/scripts/assert-openclaw-bundle.sh "$RUNNER_TEMP/installed" linux-x64
          ./.github/scripts/assert-mahayana-bundle.sh "$RUNNER_TEMP/installed" linux
          doctor_json="$($cli doctor --json)"
          echo "$doctor_json"
          jq -e '.ok == true' <<<"$doctor_json" >/dev/null
          gateway_json="$($cli gateway-smoke --timeout-seconds 120 --json)"
          echo "$gateway_json"
          jq -e '.ok == true' <<<"$gateway_json" >/dev/null
          miniapp_json="$($cli miniapp-smoke --json)"
          echo "$miniapp_json"
          jq -e '.ok == true' <<<"$miniapp_json" >/dev/null

      - name: Install macOS package and smoke CLI
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/installed"
          case "$(uname -m)" in
            arm64)
              macos_arch="arm64"
              openclaw_platform="macos-arm64"
              ;;
            *)
              macos_arch="x64"
              openclaw_platform="macos-x64"
              ;;
          esac
          zip_path="$(find "$RUNNER_TEMP/package" -maxdepth 1 -name "*macos-$macos_arch.zip" -print -quit)"
          if [ -z "$zip_path" ]; then
            echo "No macOS $macos_arch zip downloaded" >&2
            find "$RUNNER_TEMP/package" -maxdepth 1 -type f -print
            exit 1
          fi
          ditto -x -k "$zip_path" "$RUNNER_TEMP/installed"
          cli="$RUNNER_TEMP/installed/${{ matrix.cli }}"
          if [ ! -x "$cli" ]; then
            echo "Installed package CLI not found or not executable: $cli" >&2
            find "$RUNNER_TEMP/installed" -maxdepth 5 -type f | sort | head -100
            exit 1
          fi
          ./.github/scripts/assert-openclaw-bundle.sh "$RUNNER_TEMP/installed/global_dharma_sharing.app" "$openclaw_platform"
          ./.github/scripts/assert-mahayana-bundle.sh "$RUNNER_TEMP/installed/global_dharma_sharing.app" macos
          doctor_json="$($cli doctor --json)"
          echo "$doctor_json"
          jq -e '.ok == true' <<<"$doctor_json" >/dev/null
          gateway_json="$($cli gateway-smoke --timeout-seconds 120 --json)"
          echo "$gateway_json"
          jq -e '.ok == true' <<<"$gateway_json" >/dev/null
          miniapp_json="$($cli miniapp-smoke --json)"
          echo "$miniapp_json"
          jq -e '.ok == true' <<<"$miniapp_json" >/dev/null

      - name: Install Windows package and smoke CLI
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "$env:RUNNER_TEMP\package" -Filter "*windows-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "No Windows zip downloaded" }
          $installDir = Join-Path $env:RUNNER_TEMP "installed"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $installDir -Force
          $cli = Join-Path $installDir "${{ matrix.cli }}"
          if (-not (Test-Path $cli)) { throw "Installed package CLI not found: $cli" }
          $mahayana = Join-Path $installDir "mahayana.exe"
          $mahayanaRuntime = Join-Path $installDir "mahayana_runtime.dll"
          if (-not (Test-Path $mahayana)) { throw "Bundled Mahayana CLI not found: $mahayana" }
          if (-not (Test-Path $mahayanaRuntime)) { throw "Bundled Mahayana Runtime not found: $mahayanaRuntime" }
          & $mahayana help | Out-Null
          $mahayanaHome = Join-Path $env:RUNNER_TEMP "mahayana-home"
          New-Item -ItemType Directory -Force -Path $mahayanaHome | Out-Null
          $env:MAHAYANA_HOME = $mahayanaHome
          $mahayanaStatus = (& $mahayana status | Out-String) | ConvertFrom-Json
          if ($mahayanaStatus.model -ne "deepseek-chat") { throw "Unexpected Mahayana model" }
          if ($mahayanaStatus.modelProvider -ne "first-party-dacheng") { throw "Unexpected Mahayana provider" }
          if ($mahayanaStatus.remoteAgentEnabled -ne $false) { throw "Remote Mahayana agent must stay disabled" }
          $doctorJson = & $cli doctor --json | Out-String
          Write-Output $doctorJson
          $doctorResult = $doctorJson | ConvertFrom-Json
          if (-not $doctorResult.ok) { throw "doctor returned ok=false" }
          $gatewayJson = & $cli gateway-smoke --timeout-seconds 120 --json | Out-String
          Write-Output $gatewayJson
          $gatewayResult = $gatewayJson | ConvertFrom-Json
          if (-not $gatewayResult.ok) { throw "gateway-smoke returned ok=false" }
          $miniappJson = & $cli miniapp-smoke --json | Out-String
          Write-Output $miniappJson
          $miniappResult = $miniappJson | ConvertFrom-Json
          if (-not $miniappResult.ok) { throw "miniapp-smoke returned ok=false" }
