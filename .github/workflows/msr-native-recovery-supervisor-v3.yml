name: MSR Native Recovery Supervisor V3

on:
  push:
    branches:
      - feat/msr-sovereign-runtime-final
    paths:
      - .github/workflows/msr-native-recovery-supervisor-v3.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout final MSR branch
        uses: actions/checkout@v5
        with:
          ref: feat/msr-sovereign-runtime-final
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Patch provider-neutral recovery and production supervision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          python3 - <<'PY'
          from pathlib import Path

          orchestrator = Path('third_party/mahayana/mahayana-rs/mahayana-orchestrator/src/lib.rs')
          text = orchestrator.read_text()
          if 'pub fn requeue(&mut self, id: &str)' not in text:
              marker = '    pub fn complete(&mut self, id: &str) -> Result<(), OrchestratorError> {\n'
              addition = '''    pub fn requeue(&mut self, id: &str) -> Result<(), OrchestratorError> {
        let entry = self
            .entries
            .iter_mut()
            .find(|entry| entry.id == id)
            .ok_or_else(|| OrchestratorError::PromptNotFound(id.to_string()))?;
        if entry.state != PromptState::Running {
            return Err(OrchestratorError::InvalidInput(format!(
                "prompt {id} cannot be requeued from {:?}",
                entry.state
            )));
        }
        entry.state = PromptState::Pending;
        Ok(())
    }

    pub fn reclaim(&mut self, id: &str) -> Result<PromptEntry, OrchestratorError> {
        let entry = self
            .entries
            .iter_mut()
            .find(|entry| entry.id == id)
            .ok_or_else(|| OrchestratorError::PromptNotFound(id.to_string()))?;
        if entry.state != PromptState::Pending {
            return Err(OrchestratorError::InvalidInput(format!(
                "prompt {id} cannot be reclaimed from {:?}",
                entry.state
            )));
        }
        entry.state = PromptState::Running;
        Ok(entry.clone())
    }

'''
              if marker not in text:
                  raise SystemExit('PromptQueue complete marker not found')
              text = text.replace(marker, addition + marker, 1)
          orchestrator.write_text(text)

          engine = Path('third_party/mahayana/mahayana-rs/mahayana-native-engine/src/lib.rs')
          text = engine.read_text()
          old_import = '''use mahayana_kernel::supervisor::{
    ApprovalLedger, ApprovalOutcome, ApprovalRecord, LoopDisposition, LoopPolicy, LoopState,
    PermissionDecision, PermissionKey, PermissionLedger, PermissionMemory,
};'''
          new_import = '''use mahayana_kernel::supervisor::{
    ApprovalLedger, ApprovalOutcome, ApprovalRecord, LoopDisposition, LoopPolicy, LoopState,
    OracleStatus, PermissionDecision, PermissionKey, PermissionLedger, PermissionMemory,
    TaskRecord, TaskState, TaskSupervisor, VerificationMode, VerificationOracle,
};'''
          if 'TaskSupervisor' not in text:
              if old_import not in text:
                  raise SystemExit('native engine supervisor import marker not found')
              text = text.replace(old_import, new_import, 1)

          if 'supervisor: TaskSupervisor,' not in text:
              marker = '    hooks: HookRegistry,\n}'
              replacement = '    hooks: HookRegistry,\n    #[serde(default)]\n    supervisor: TaskSupervisor,\n}'
              if marker not in text:
                  raise SystemExit('snapshot hooks marker not found')
              text = text.replace(marker, replacement, 1)

          if 'supervisor: Mutex<TaskSupervisor>,' not in text:
              marker = '    hooks: Mutex<HookRegistry>,\n    telemetry: Arc<RuntimeTelemetry>,'
              replacement = '    hooks: Mutex<HookRegistry>,\n    supervisor: Mutex<TaskSupervisor>,\n    telemetry: Arc<RuntimeTelemetry>,'
              if marker not in text:
                  raise SystemExit('engine hooks field marker not found')
              text = text.replace(marker, replacement, 1)

          if 'supervisor: Mutex::new(TaskSupervisor::default()),' not in text:
              marker = '            hooks: Mutex::new(HookRegistry::default()),\n            telemetry: Arc::new(RuntimeTelemetry::default()),'
              replacement = '            hooks: Mutex::new(HookRegistry::default()),\n            supervisor: Mutex::new(TaskSupervisor::default()),\n            telemetry: Arc::new(RuntimeTelemetry::default()),'
              if marker not in text:
                  raise SystemExit('engine init marker not found')
              text = text.replace(marker, replacement, 1)

          if 'fn begin_supervised_attempt(' not in text:
              marker = '    async fn execute_active_prompt(\n'
              addition = '''    fn begin_supervised_attempt(
        &self,
        prompt: &PromptEntry,
        operation_id: &OperationId,
    ) -> Result<String, KernelError> {
        let mut supervisor = self
            .supervisor
            .lock()
            .map_err(|_| KernelError::Backend("task supervisor poisoned".into()))?;
        match supervisor.task(&prompt.id).map(|task| task.state) {
            None => {
                let mut task = TaskRecord::new(
                    prompt.id.clone(),
                    prompt.text.clone(),
                    std::iter::empty::<String>(),
                    VerificationMode::ObjectiveRequired,
                )
                .map_err(|error| KernelError::Backend(error.to_string()))?;
                task.add_oracle(
                    VerificationOracle::required("model_completion")
                        .map_err(|error| KernelError::Backend(error.to_string()))?,
                )
                .map_err(|error| KernelError::Backend(error.to_string()))?;
                supervisor
                    .add_task(task)
                    .map_err(|error| KernelError::Backend(error.to_string()))?;
                supervisor
                    .start_task(&prompt.id)
                    .map_err(|error| KernelError::Backend(error.to_string()))?;
            }
            Some(TaskState::Pending) => supervisor
                .start_task(&prompt.id)
                .map_err(|error| KernelError::Backend(error.to_string()))?,
            Some(TaskState::Paused) => supervisor
                .resume_task(&prompt.id)
                .map_err(|error| KernelError::Backend(error.to_string()))?,
            Some(TaskState::Running) => {}
            Some(state) => {
                return Err(KernelError::Backend(format!(
                    "prompt {} cannot start from supervised state {state:?}",
                    prompt.id
                )));
            }
        }
        let (attempt_id, _) = supervisor
            .begin_attempt(
                &prompt.id,
                format!("prompt:{}:{}", prompt.id, operation_id.as_str()),
                now_ms(),
            )
            .map_err(|error| KernelError::Backend(error.to_string()))?;
        Ok(attempt_id)
    }

    fn pause_supervised_task(
        &self,
        task_id: &str,
        attempt_id: &str,
    ) -> Result<(), KernelError> {
        let mut supervisor = self
            .supervisor
            .lock()
            .map_err(|_| KernelError::Backend("task supervisor poisoned".into()))?;
        supervisor
            .finish_attempt(task_id, attempt_id, now_ms(), false)
            .map_err(|error| KernelError::Backend(error.to_string()))?;
        supervisor
            .pause_task(task_id)
            .map_err(|error| KernelError::Backend(error.to_string()))
    }

    fn complete_supervised_task(
        &self,
        task_id: &str,
        attempt_id: &str,
    ) -> Result<(), KernelError> {
        let mut supervisor = self
            .supervisor
            .lock()
            .map_err(|_| KernelError::Backend("task supervisor poisoned".into()))?;
        supervisor
            .finish_attempt(task_id, attempt_id, now_ms(), true)
            .map_err(|error| KernelError::Backend(error.to_string()))?;
        supervisor
            .begin_verification(task_id)
            .map_err(|error| KernelError::Backend(error.to_string()))?;
        supervisor
            .task_mut(task_id)
            .and_then(|task| {
                task.record_oracle(
                    "model_completion",
                    OracleStatus::Passed,
                    Some("Mahayana native model completed the prompt".into()),
                )
            })
            .map_err(|error| KernelError::Backend(error.to_string()))?;
        supervisor
            .complete_task(task_id)
            .map_err(|error| KernelError::Backend(error.to_string()))
    }

    fn fail_supervised_task(
        &self,
        task_id: &str,
        attempt_id: &str,
        reason: &str,
    ) -> Result<(), KernelError> {
        let mut supervisor = self
            .supervisor
            .lock()
            .map_err(|_| KernelError::Backend("task supervisor poisoned".into()))?;
        supervisor
            .finish_attempt(task_id, attempt_id, now_ms(), false)
            .map_err(|error| KernelError::Backend(error.to_string()))?;
        supervisor
            .task_mut(task_id)
            .and_then(|task| {
                task.record_oracle(
                    "model_completion",
                    OracleStatus::Failed,
                    Some(reason.to_owned()),
                )
            })
            .map_err(|error| KernelError::Backend(error.to_string()))?;
        supervisor
            .fail_task(task_id, reason)
            .map_err(|error| KernelError::Backend(error.to_string()))
    }

'''
              if marker not in text:
                  raise SystemExit('execute_active_prompt marker not found')
              text = text.replace(marker, addition + marker, 1)

          start_marker = '''    ) -> Result<(), KernelError> {
        let attempt_id = Self::start_attempt(session, operation_id, &prompt.id);
        let result = self
            .run_prompt('''
          if 'let supervisor_attempt_id = self.begin_supervised_attempt' not in text:
              replacement = '''    ) -> Result<(), KernelError> {
        let supervisor_attempt_id = self.begin_supervised_attempt(&prompt, operation_id)?;
        let attempt_id = Self::start_attempt(session, operation_id, &prompt.id);
        let result = self
            .run_prompt('''
              if start_marker not in text:
                  raise SystemExit('active prompt start marker not found')
              text = text.replace(start_marker, replacement, 1)

          suspend_marker = '''        if control.suspended.load(Ordering::SeqCst) {
            Self::finish_attempt(session, &attempt_id, OperationAttemptState::Suspended);
            self.telemetry.operation_suspended();'''
          if 'pause_supervised_task(&prompt.id, &supervisor_attempt_id)' not in text:
              replacement = '''        if control.suspended.load(Ordering::SeqCst) {
            session
                .prompt_queue
                .requeue(&prompt.id)
                .map_err(|error| KernelError::Backend(error.to_string()))?;
            Self::finish_attempt(session, &attempt_id, OperationAttemptState::Suspended);
            self.pause_supervised_task(&prompt.id, &supervisor_attempt_id)?;
            self.telemetry.operation_suspended();'''
              if suspend_marker not in text:
                  raise SystemExit('suspend branch marker not found')
              text = text.replace(suspend_marker, replacement, 1)

          success_marker = '''                Self::finish_attempt(session, &attempt_id, OperationAttemptState::Completed);
                self.telemetry.operation_completed();'''
          if 'complete_supervised_task(&prompt.id, &supervisor_attempt_id)' not in text:
              replacement = '''                Self::finish_attempt(session, &attempt_id, OperationAttemptState::Completed);
                self.complete_supervised_task(&prompt.id, &supervisor_attempt_id)?;
                self.telemetry.operation_completed();'''
              if success_marker not in text:
                  raise SystemExit('success branch marker not found')
              text = text.replace(success_marker, replacement, 1)

          failure_marker = '''                self.telemetry.operation_failed();
                events.emit(KernelEvent::OperationFailed {'''
          if 'fail_supervised_task(' not in text[text.find('async fn execute_active_prompt'):text.find('#[async_trait]', text.find('async fn execute_active_prompt'))]:
              replacement = '''                self.fail_supervised_task(
                    &prompt.id,
                    &supervisor_attempt_id,
                    &error.to_string(),
                )?;
                self.telemetry.operation_failed();
                events.emit(KernelEvent::OperationFailed {'''
              if failure_marker not in text:
                  raise SystemExit('failure branch marker not found')
              text = text.replace(failure_marker, replacement, 1)

          snapshot_marker = '''            hooks: self
                .hooks
                .lock()
                .map_err(|_| KernelError::Backend("hook registry poisoned".into()))?
                .clone(),
        };'''
          if 'task supervisor poisoned' in text and 'supervisor: self' not in text[text.find('let state = NativeSnapshotState'):text.find('Ok(KernelSessionSnapshot', text.find('let state = NativeSnapshotState'))]:
              replacement = '''            hooks: self
                .hooks
                .lock()
                .map_err(|_| KernelError::Backend("hook registry poisoned".into()))?
                .clone(),
            supervisor: self
                .supervisor
                .lock()
                .map_err(|_| KernelError::Backend("task supervisor poisoned".into()))?
                .clone(),
        };'''
              if snapshot_marker not in text:
                  raise SystemExit('snapshot hooks marker not found')
              text = text.replace(snapshot_marker, replacement, 1)

          text = text.replace('metadata: json!({"snapshotVersion": 1}),', 'metadata: json!({"snapshotVersion": 2}),', 1)

          restore_marker = '''        *self
            .hooks
            .lock()
            .map_err(|_| KernelError::Backend("hook registry poisoned".into()))? = state.hooks;
        self.sessions'''
          if '= state.supervisor;' not in text:
              replacement = '''        *self
            .hooks
            .lock()
            .map_err(|_| KernelError::Backend("hook registry poisoned".into()))? = state.hooks;
        *self
            .supervisor
            .lock()
            .map_err(|_| KernelError::Backend("task supervisor poisoned".into()))? =
            state.supervisor;
        self.sessions'''
              if restore_marker not in text:
                  raise SystemExit('restore hooks marker not found')
              text = text.replace(restore_marker, replacement, 1)

          resume_marker = '''            let prompt = session.active_prompt.clone().ok_or_else(|| {
                KernelError::OperationNotFound(format!(
                    "{} has no suspended prompt in session {}",
                    request.operation_id.as_str(),
                    request.session_id.as_str()
                ))
            })?;
            events.emit(KernelEvent::Activity {'''
          if '.prompt_queue\n                .reclaim(&active_prompt.id)' not in text:
              replacement = '''            let active_prompt = session.active_prompt.clone().ok_or_else(|| {
                KernelError::OperationNotFound(format!(
                    "{} has no suspended prompt in session {}",
                    request.operation_id.as_str(),
                    request.session_id.as_str()
                ))
            })?;
            let prompt = session
                .prompt_queue
                .reclaim(&active_prompt.id)
                .map_err(|error| KernelError::Backend(error.to_string()))?;
            session.active_prompt = Some(prompt.clone());
            events.emit(KernelEvent::Activity {'''
              if resume_marker not in text:
                  raise SystemExit('resume prompt marker not found')
              text = text.replace(resume_marker, replacement, 1)

          engine.write_text(text)
          PY

          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all
          cargo test --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml \
            -p mahayana-orchestrator \
            -p mahayana-native-engine \
            -p mahayana-kernel \
            -p mahayana-workspace-engine
          cargo clippy --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml \
            -p mahayana-orchestrator \
            -p mahayana-native-engine \
            --all-targets -- -D warnings

          rm -f .github/workflows/msr-final-hardening.yml
          rm -f .github/workflows/msr-final-hardening-v2.yml
          rm -f .github/workflows/msr-native-recovery-supervisor-v3.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat(msr): make recovery reclaimable and supervise native tasks'
          git push origin HEAD:feat/msr-sovereign-runtime-final
