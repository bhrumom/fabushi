name: CD - Flutter Web

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-flutter-web.yml'
      - 'fabushi/analysis_options.yaml'
      - 'fabushi/l10n.yaml'
      - 'fabushi/pubspec.yaml'
      - 'fabushi/pubspec.lock'
      - 'fabushi/lib/**'
      - 'fabushi/web/**'
      - 'fabushi/assets/**'
      - '!fabushi/assets/built_in/**'
      - 'fabushi/fonts/**'
  workflow_dispatch:

concurrency:
  group: flutter-web-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  FLUTTER_VERSION: '3.41.9'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CLOUDFLARE_PAGES_PROJECT: fabushi-web-prod
  EXPECTED_CUSTOM_DOMAIN: flutter.ombhrum.com

jobs:
  deploy-flutter-web:
    name: Build and deploy Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://flutter.ombhrum.com
    defaults:
      run:
        working-directory: fabushi
    steps:
      - name: Checkout Flutter Web source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fabushi/analysis_options.yaml
            /fabushi/l10n.yaml
            /fabushi/pubspec.yaml
            /fabushi/pubspec.lock
            /fabushi/lib/**
            /fabushi/web/**
            !/fabushi/web/assets/built_in/**
            /fabushi/assets/**
            !/fabushi/assets/built_in/**
            /fabushi/fonts/**

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Show build context
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          echo "Cloudflare Pages project: $CLOUDFLARE_PAGES_PROJECT"
          echo "Expected custom domain: $EXPECTED_CUSTOM_DOMAIN"
          echo "Deploy source ref: $GITHUB_REF_NAME"
          echo "Deploy source SHA: $GITHUB_SHA"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter Web entrypoint
        run: flutter analyze lib/main.dart

      - name: Build Flutter Web release
        run: flutter build web --release

      - name: Smoke test built Flutter Web app
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory build/web > /tmp/fabushi-flutter-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /tmp/fabushi-index.html; then
              break
            fi
            sleep 1
          done

          test -s /tmp/fabushi-index.html
          grep -Eq 'flutter|main\.dart\.js|flutter_bootstrap\.js' /tmp/fabushi-index.html

      - name: Upload Flutter Web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: flutter-web-build-${{ github.sha }}
          path: fabushi/build/web
          retention-days: 14
          if-no-files-found: error

      - name: Check Cloudflare credential presence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN || vars.WRANGLER_API_TOKEN || vars.CLOUDFLARE_TOKEN || vars.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CF_ACCOUNT || secrets.CLOUDFLARE_ACCOUNT || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || vars.CF_ACCOUNT || vars.CLOUDFLARE_ACCOUNT }}
        run: |
          set -euo pipefail
          [ "$CLOUDFLARE_PAGES_PROJECT" = "fabushi-web-prod" ] || { echo "Refusing to deploy to unexpected Pages project: $CLOUDFLARE_PAGES_PROJECT"; exit 1; }
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "Cloudflare API token is not configured."; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "Cloudflare account id is not configured."; exit 1; }
          echo "Cloudflare credentials are configured."

      - name: Inspect custom domain before deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN || vars.WRANGLER_API_TOKEN || vars.CLOUDFLARE_TOKEN || vars.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CF_ACCOUNT || secrets.CLOUDFLARE_ACCOUNT || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || vars.CF_ACCOUNT || vars.CLOUDFLARE_ACCOUNT }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status=$(curl -sS -w '%{http_code}' -o "$response_file" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT/domains" || true)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::warning::Could not read Cloudflare Pages custom domains before deploy. HTTP status: $status"
            cat "$response_file"
            exit 0
          fi
          python3 - "$response_file" "$EXPECTED_CUSTOM_DOMAIN" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          expected = sys.argv[2]

          def contains_domain(value):
              if isinstance(value, dict):
                  for key in ("name", "domain", "hostname"):
                      if value.get(key) == expected:
                          return True
                  return any(contains_domain(item) for item in value.values())
              if isinstance(value, list):
                  return any(contains_domain(item) for item in value)
              return value == expected

          if contains_domain(payload):
              print(f"Verified custom domain before deploy: {expected}")
          else:
              print(f"::warning::Expected custom domain {expected} is not bound to this Pages project before deploy.")
          PY

      - name: Deploy Flutter Web to Cloudflare
        id: deploy_flutter_web
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN || vars.WRANGLER_API_TOKEN || vars.CLOUDFLARE_TOKEN || vars.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CF_ACCOUNT || secrets.CLOUDFLARE_ACCOUNT || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || vars.CF_ACCOUNT || vars.CLOUDFLARE_ACCOUNT }}
        run: |
          set -euo pipefail

          set +e
          npx --yes wrangler@latest pages deploy build/web \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA" 2>&1 | tee /tmp/flutter-web-pages-deploy.log
          pages_status="${PIPESTATUS[0]}"
          set -e

          if [ "$pages_status" -eq 0 ]; then
            echo "target=cloudflare-pages" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -Eqi 'Authentication error|permission|not authorized|forbidden|code: 10000' /tmp/flutter-web-pages-deploy.log; then
            exit "$pages_status"
          fi

          echo "::warning::Cloudflare Pages deploy failed because the configured token cannot access Pages. Falling back to a Cloudflare Worker static-assets deploy."

          cat > flutter-web-static-worker.js <<'EOF'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              const pathname = url.pathname;

              let response = await env.ASSETS.fetch(request);
              if (response.status === 404 && !pathname.startsWith('/api/') && !/\.[^/]+$/.test(pathname)) {
                response = await env.ASSETS.fetch(new Request(new URL('/index.html', request.url), request));
              }

              const headers = new Headers(response.headers);
              headers.set('Access-Control-Allow-Origin', '*');
              headers.set('X-App-Version', '${GITHUB_SHA}');

              if (pathname === '/' || pathname === '/index.html' || pathname === '/flutter_service_worker.js' || pathname === '/main.dart.js') {
                headers.set('Cache-Control', 'no-cache, no-store, must-revalidate');
              } else if (/\.(js|css|png|jpg|jpeg|gif|svg|woff2?|json|wasm)$/i.test(pathname) && !headers.has('Cache-Control')) {
                headers.set('Cache-Control', 'public, max-age=31536000, immutable');
              }

              return new Response(request.method === 'HEAD' ? null : response.body, {
                status: response.status,
                statusText: response.statusText,
                headers,
              });
            },
          };
          EOF

          cat > wrangler.flutter-web-static.toml <<'EOF'
          name = "fabushi-flutter-web-static-prod"
          main = "flutter-web-static-worker.js"
          compatibility_date = "2026-06-11"
          workers_dev = false

          [assets]
          directory = "build/web"
          EOF

          npx --yes wrangler@latest deploy \
            --config wrangler.flutter-web-static.toml \
            --domain "$EXPECTED_CUSTOM_DOMAIN"

          echo "target=cloudflare-worker-static-assets" >> "$GITHUB_OUTPUT"

      - name: Inspect custom domain after deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN || vars.WRANGLER_API_TOKEN || vars.CLOUDFLARE_TOKEN || vars.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CF_ACCOUNT || secrets.CF_ACCOUNT || secrets.CLOUDFLARE_ACCOUNT || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || vars.CF_ACCOUNT || vars.CLOUDFLARE_ACCOUNT }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status=$(curl -sS -w '%{http_code}' -o "$response_file" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT/domains" || true)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::warning::Could not read Cloudflare Pages custom domains after deploy. HTTP status: $status"
            cat "$response_file"
            exit 0
          fi
          python3 - "$response_file" "$EXPECTED_CUSTOM_DOMAIN" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          expected = sys.argv[2]

          def contains_domain(value):
              if isinstance(value, dict):
                  for key in ("name", "domain", "hostname"):
                      if value.get(key) == expected:
                          return True
                  return any(contains_domain(item) for item in value.values())
              if isinstance(value, list):
                  return any(contains_domain(item) for item in value)
              return value == expected

          if contains_domain(payload):
              print(f"Verified custom domain after deploy: {expected}")
          else:
              print(f"::warning::Expected custom domain {expected} is not bound to this Pages project after deploy.")
          PY

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## Flutter Web deployment"
            echo ""
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Trigger: $GITHUB_EVENT_NAME"
            echo "- Cloudflare deploy target: ${{ steps.deploy_flutter_web.outputs.target }}"
            echo "- Cloudflare Pages project: $CLOUDFLARE_PAGES_PROJECT"
            echo "- Expected custom domain: $EXPECTED_CUSTOM_DOMAIN"
            echo "- Production URL: https://flutter.ombhrum.com"
          } >> "$GITHUB_STEP_SUMMARY"
