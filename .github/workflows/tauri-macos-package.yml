name: Tauri macOS package and functional tests

on:
  pull_request:
    branches: [main]
    paths:
      - .agents/plugins/**
      - .github/workflows/tauri-macos-package.yml
      - apps/fabushi-tauri/**
      - contracts/automation/cross-platform-journeys.json
      - fabushi/e2e/**
      - frontend/apps/host/**
      - frontend/apps/web/src/app/host/**
      - frontend/apps/web/src/lib/mahayana-host/**
      - frontend/packages/shared/src/mahayana-host-features.ts
      - scripts/check-tauri-production-contract.mjs
      - third_party/mahayana/mahayana-rs/**
  workflow_dispatch:

concurrency:
  group: tauri-macos-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-package:
    name: Build macOS installer package
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Enable pinned pnpm through Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Tauri Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: tauri-macos-package-v1
          cache-all-crates: true

      - name: Build macOS app and DMG
        working-directory: apps/fabushi-tauri
        run: >-
          corepack pnpm dlx @tauri-apps/cli@2.11.3 build
          --features desktop
          --config src-tauri/tauri.package.conf.json

      - name: Verify and stage installer artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="third_party/mahayana/mahayana-rs/target/release/bundle"
          app_path="$(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' -print | sort | head -n 1)"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print | sort | head -n 1)"
          test -n "$app_path"
          test -n "$dmg_path"
          test -f "$app_path/Contents/Resources/fabushi-official/marketplace.json"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          test -x "$app_path/Contents/MacOS/$executable"

          mkdir -p macos-package-artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app_path" macos-package-artifacts/Fabushi.app.zip
          cp "$dmg_path" macos-package-artifacts/
          printf '%s\n' "$GITHUB_SHA" > macos-package-artifacts/source-sha.txt
          (
            cd macos-package-artifacts
            shasum -a 256 Fabushi.app.zip *.dmg > SHA256SUMS.txt
          )

          echo "app_name=$(basename "$app_path")" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "$dmg_path")" >> "$GITHUB_OUTPUT"

      - name: Upload macOS installer package
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-macos-package
          path: macos-package-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Summarize package
        shell: bash
        run: |
          {
            echo "## macOS package"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- App: \`${{ steps.package.outputs.app_name }}\`"
            echo "- DMG: \`${{ steps.package.outputs.dmg_name }}\`"
            echo "- Apple upload: not performed"
          } >> "$GITHUB_STEP_SUMMARY"

  functional-test:
    name: Test packaged Mac app and all Host journeys
    needs: build-package
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download packaged app
        uses: actions/download-artifact@v5
        with:
          name: fabushi-macos-package
          path: macos-package-artifacts

      - name: Enable pinned pnpm through Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Host E2E package
        working-directory: fabushi/e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Verify system Chrome
        run: /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --version

      - name: Run complete Host user journeys
        working-directory: fabushi/e2e
        run: npm run test:host-fast

      - name: Verify Tauri production wiring
        run: node scripts/check-tauri-production-contract.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Tauri Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/mahayana/mahayana-rs -> target
          shared-key: tauri-macos-package-v1
          cache-all-crates: true

      - name: Run Tauri command contract
        run: >-
          cargo test
          --manifest-path apps/fabushi-tauri/src-tauri/Cargo.toml
          --profile ci
          --locked
          --no-default-features
          --features headless

      - name: Verify packaged resources and launch app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p macos-package-smoke
          ditto -x -k macos-package-artifacts/Fabushi.app.zip macos-package-smoke
          app_path="$(find macos-package-smoke -maxdepth 1 -type d -name '*.app' -print | sort | head -n 1)"
          test -n "$app_path"
          test -f "$app_path/Contents/Resources/fabushi-official/marketplace.json"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          executable_path="$app_path/Contents/MacOS/$executable"
          test -x "$executable_path"

          "$executable_path" > "$RUNNER_TEMP/fabushi-packaged-app.log" 2>&1 &
          app_pid=$!
          sleep 8
          if ! kill -0 "$app_pid" 2>/dev/null; then
            echo "Packaged Tauri app exited during startup." >&2
            cat "$RUNNER_TEMP/fabushi-packaged-app.log" >&2 || true
            exit 1
          fi
          kill "$app_pid" || true
          wait "$app_pid" || true

      - name: Upload functional-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-macos-functional-test-diagnostics
          path: |
            fabushi/e2e/playwright-report/host-fast
            fabushi/e2e/test-results
            ${{ runner.temp }}/fabushi-packaged-app.log
          if-no-files-found: ignore
          retention-days: 14
