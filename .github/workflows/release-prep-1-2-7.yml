name: Prepare Fabushi 1.2.7 formal release branch

on:
  push:
    branches:
      - release/1.2.7-formal-store-finalizer

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare canonical 1.2.7 release source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const version = '1.2.7';
          const build = 13;
          const appVersion = JSON.parse(fs.readFileSync('app-version.json', 'utf8'));
          appVersion.version = version;
          appVersion.androidVersionCode = build;
          appVersion.iosBuildNumber = build;
          fs.writeFileSync('app-version.json', JSON.stringify(appVersion, null, 2) + '\n');
          for (const file of ['desktop/package.json', 'desktop/package-lock.json', 'mobile/package.json', 'mobile/package-lock.json']) {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            value.version = version;
            if (value.packages && value.packages['']) value.packages[''].version = version;
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');
          }
          NODE
          sed -i 's/MARKETING_VERSION: 1\.2\.6/MARKETING_VERSION: 1.2.7/' mobile/ios/project.yml
          sed -i 's/CURRENT_PROJECT_VERSION: 12/CURRENT_PROJECT_VERSION: 13/' mobile/ios/project.yml
          sed -i 's/\[full-platform-release-final-20260831\]/[full-platform-release]/g' .github/workflows/native-android-release.yml .github/workflows/apple-store-delivery.yml

          if ! grep -q '^## \[1\.2\.7\]' fabushi/CHANGELOG.md; then
            cat > "$RUNNER_TEMP/changelog-head" <<'EOF'
          # 更新日志

          ## [1.2.7] - 2026-09-02

          ### 正式发布渠道闭环
          - 将桌面、Android、iOS 正式版本统一提升到 `1.2.7`，Android/iOS repository build identity 提升到 `13`，从新的受保护 `main` exact SHA 重新执行全平台正式发布。
          - 将历史一次性移动发布哨兵 `[full-platform-release-final-20260831]` 泛化为 `[full-platform-release]`，使受保护主线上的正式发布提交能够自动进入 Android GitHub Release 与 Apple Store Connect 交付。
          - 新增正式发布 Google Play 编排器：仅在 exact-main Native mobile quality gate 成功且提交带正式发布标记时，使用仓库 `GITHUB_TOKEN` 通过 `workflow_dispatch` 调用现有 Google Play 工作流；Google Play GitHub 证据使用独立 `google-play-v<version>-<SHA>` 标签，避免与独立 Android GitHub Release 的分钟级标签竞态。
          - 保留所有现有 exact-SHA release gate、签名、公证、模拟用户 E2E、不可变 Release 与生产部署要求，不用本地重型构建替代 GitHub Actions。

          ---

          EOF
            tail -n +3 fabushi/CHANGELOG.md >> "$RUNNER_TEMP/changelog-head"
            mv "$RUNNER_TEMP/changelog-head" fabushi/CHANGELOG.md
          fi

          cat > .github/workflows/formal-google-play-orchestrator.yml <<'EOF'
          name: Formal Google Play release orchestrator

          on:
            workflow_run:
              workflows:
                - Native mobile quality gate
              types: [completed]
              branches: [main]

          permissions:
            actions: write
            contents: read

          concurrency:
            group: formal-google-play-release
            cancel-in-progress: false

          jobs:
            dispatch:
              if: >-
                github.event.workflow_run.event == 'push' &&
                github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.head_branch == 'main' &&
                contains(github.event.workflow_run.head_commit.message, '[full-platform-release]')
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - name: Dispatch exact-main Google Play production delivery
                  shell: bash
                  env:
                    GH_TOKEN: ${{ github.token }}
                    SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
                  run: |
                    set -euo pipefail
                    main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
                    if [ "$main_sha" != "$SOURCE_SHA" ]; then
                      echo "Refusing stale formal release: main=$main_sha upstream=$SOURCE_SHA" >&2
                      exit 1
                    fi
                    version="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/app-version.json?ref=$SOURCE_SHA" | jq -r '.version')"
                    test -n "$version" && test "$version" != null
                    short_sha="${SOURCE_SHA:0:12}"
                    release_tag="google-play-v${version}-${short_sha}"
                    gh workflow run google-play-delivery.yml \
                      --repo "$GITHUB_REPOSITORY" \
                      --ref main \
                      -f ref="$SOURCE_SHA" \
                      -f track=production \
                      -f release_status=completed \
                      -f changes_not_sent_for_review=true \
                      -f github_release_tag="$release_tag"
                    echo "Dispatched Google Play production delivery for $SOURCE_SHA as $release_tag" >> "$GITHUB_STEP_SUMMARY"
          EOF

          if ! grep -q 'FCM-016' projects/fabushi-cicd-merge-governance/management/01-WBS原子任务.md; then
            cat >> projects/fabushi-cicd-merge-governance/management/01-WBS原子任务.md <<'EOF'
          | FCM-016 | Release Fabushi 1.2.7 with canonical automatic store delivery | yes | all intake PRs dispositioned; protected merge; exact-main required gates; immutable five-platform Release; Android GitHub + Google Play + Apple Store delivery; production deploy; install/upgrade/runtime verification | in-progress |
          EOF
          fi
          if ! grep -q 'FCM-016 fresh formal release' projects/fabushi-cicd-merge-governance/management/03-验收追踪矩阵.md; then
            cat >> projects/fabushi-cicd-merge-governance/management/03-验收追踪矩阵.md <<'EOF'
          | FCM-016 fresh formal release | generic formal-release channel trigger, Google Play exact-SHA dispatch, 1.2.7 unified version/build 13, protected merge, exact-main release + stores + runtime acceptance | task source `source/2026-09-02-fcm-016-full-platform-release-1.2.7.md`; live evidence appended after acceptance | in-progress |
          EOF
          fi
          if ! grep -q 'FCM-016 Round 1' projects/fabushi-cicd-merge-governance/management/05-状态报告.md; then
            cat >> projects/fabushi-cicd-merge-governance/management/05-状态报告.md <<'EOF'

          ## 2026-09-02 — FCM-016 Round 1 — 1.2.7 canonical store-delivery finalizer

          - Intake recheck found zero open PRs after PR #2285 merged `1.2.6` to canonical main.
          - Exact `1.2.6` main passed CI, Electron desktop, native mobile, security and production deployment gates and published immutable `desktop-1.2.6`, but automatic Android/Apple store paths still depended on the historical `[full-platform-release-final-20260831]` marker and current Google Play remained manual-only.
          - GitHub official Actions documentation confirms repository `GITHUB_TOKEN` may trigger `workflow_dispatch`; the new orchestrator therefore reuses the existing Google Play delivery workflow instead of duplicating signing/build/upload logic or introducing a PAT.
          - Prepared fresh `1.2.7` / native build 13 and generic `[full-platform-release]` release marker. FCM-016 remains in-progress until protected merge, exact-main gates, all supported delivery channels, immutable Release evidence, production runtime, package install and explicit upgrade verification are green.
          EOF
          fi
          if ! grep -q '^## 2026-09-02 — FCM-016' projects/fabushi-cicd-merge-governance/management/07-变更日志.md; then
            cat >> projects/fabushi-cicd-merge-governance/management/07-变更日志.md <<'EOF'

          ## 2026-09-02 — FCM-016

          - Advanced the fresh canonical release train to 1.2.7 / native build 13 after 1.2.6 exposed stale mobile-store trigger wiring.
          - Replaced the dated automatic store marker with generic `[full-platform-release]` and added exact-main Google Play orchestration through the existing delivery workflow using repository-scoped `GITHUB_TOKEN` workflow dispatch.
          - Separated Google Play evidence tags from the independent Android GitHub Release tag namespace to prevent immutable-release races.
          EOF
          fi
          cat > projects/fabushi-cicd-merge-governance/source/2026-09-02-fcm-016-full-platform-release-1.2.7.md <<'EOF'
          # FCM-016 — Fabushi 1.2.7 full-platform formal release

          ## Requirement
          Complete a fresh formal Fabushi release from canonical protected `main`: disposition all open PRs, unify version/changelog, execute existing CI/CD, publish all supported platform/channel outputs, and verify Actions, immutable Release assets, production delivery, install/package journeys, and upgrade behavior.

          ## Live diagnosis
          - Open PR intake before this release repair: `0`.
          - `main@03341e78d2ed2c5daf1b5711429c5ed60816c0e4` published immutable desktop 1.2.6 and passed exact-main desktop/mobile/production gates.
          - Android GitHub and Apple automatic delivery still required a historical date-specific release marker; Google Play was manual-only, so exact-main 1.2.6 did not have complete same-SHA store delivery evidence.
          - Because 1.2.6 is immutable and already published, this closure uses a new monotonically increasing 1.2.7 release rather than mutating old lineage.

          ## Open-source-first evidence
          GitHub Actions official documentation was reviewed before changing orchestration. `workflow_run` is retained for privileged post-gate separation, and GitHub documents `workflow_dispatch` as an allowed `GITHUB_TOKEN` workflow-trigger exception. The implementation reuses the repository's existing signed Google Play workflow rather than cloning its upload logic or adding a long-lived PAT.

          ## Release identity
          - Product version: `1.2.7`
          - Repository Android/iOS build identity: `13`
          - Formal release commit marker: `[full-platform-release]`
          EOF

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-version.json desktop/package.json desktop/package-lock.json mobile/package.json mobile/package-lock.json mobile/ios/project.yml fabushi/CHANGELOG.md .github/workflows/native-android-release.yml .github/workflows/apple-store-delivery.yml .github/workflows/formal-google-play-orchestrator.yml projects/fabushi-cicd-merge-governance
          git commit -m '[full-platform-release] fix(release): prepare Fabushi 1.2.7 canonical channel delivery'
          git push origin HEAD:release/1.2.7-formal-store-finalizer
