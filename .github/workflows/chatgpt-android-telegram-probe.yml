name: ChatGPT Android Telegram Mirror Probe

on:
  pull_request:
    paths:
      - '.github/workflows/chatgpt-android-telegram-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Inspect public Telegram post with ChatGPT 1.0.0016
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/telegram.html"
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 20 --max-time 90 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/139 Safari/537.36' \
            'https://t.me/s/ksc666?before=6706' --output "$page"
          test -s "$page"
          python3 - "$page" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          marker='data-post="ksc666/6704"'
          start=p.find(marker)
          if start < 0:
              raise SystemExit('Telegram post 6704 not found')
          next_post=p.find('data-post="ksc666/6705"', start)
          if next_post < 0:
              next_post=min(len(p), start+20000)
          block=p[start:next_post]
          print('post_block_bytes=', len(block))
          for tag in re.findall(r'<[^>]+>', block, flags=re.S):
              flat=' '.join(tag.split())
              low=flat.lower()
              if any(k in low for k in ('document', 'data-view=', 'download', 'href=', 'data-', 'file')):
                  print('TAG', flat[:4000])
          print('filename_present=', 'ChatGPT_1.0.0016.xapk' in block)
          PY
