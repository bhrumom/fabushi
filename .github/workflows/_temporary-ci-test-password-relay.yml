name: TEMP Fabushi CI test password relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Set Fabushi CI test password on destination Actions secret
        env:
          GH_TOKEN: ${{ secrets.IOS_MIGRATION_TARGET_ACTIONS_TOKEN }}
          FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$FABUSHI_CI_TEST_PASSWORD"
          printf '%s' "$FABUSHI_CI_TEST_PASSWORD" | gh secret set FABUSHI_CI_TEST_PASSWORD --repo fabushi-ios/fabushi-ios --app actions
          echo "Set FABUSHI_CI_TEST_PASSWORD on the target Actions secrets list; value redacted."
