name: Post-main E2E Release delivery (disabled by FCM-023)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA for an explicitly requested legacy/manual investigation
        required: true
        type: string

permissions:
  contents: read

jobs:
  disabled:
    name: Automatic post-main E2E disabled
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain manual-only policy
        shell: bash
        run: |
          {
            echo '## FCM-023'
            echo
            echo 'Automatic post-main E2E and E2E-gated Release publication are disabled.'
            echo 'Test/beta releases must be published without behavioral testing.'
            echo 'For formal validation, manually start the appropriate App-owned Action runner and drive the installed App through the Fabushi official MCP.'
            echo 'The pre-FCM-023 workflow is preserved under .github/workflows-disabled/post-main-delivery.yml for history only.'
          } >> "$GITHUB_STEP_SUMMARY"