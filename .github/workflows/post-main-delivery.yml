name: Release lane policy contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'projects/fabushi-cicd-merge-governance/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Post-main delivery contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Enforce FCM-023 release-lane policy
        shell: bash
        run: |
          set -euo pipefail
          for file in release-macos.yml release-windows.yml release-linux.yml release-ios.yml; do
            test -f ".github/workflows/$file"
            grep -F 'release_kind:' ".github/workflows/$file" >/dev/null
          done
          grep -F 'name: Release Android' .github/workflows/native-android-release.yml >/dev/null
          grep -F 'options: [test, formal]' .github/workflows/native-android-release.yml >/dev/null
          grep -F 'workflow_dispatch:' .github/workflows/gbf-release-candidate.yml >/dev/null
          ! grep -F 'pull_request:' .github/workflows/gbf-release-candidate.yml >/dev/null
          ! grep -F 'push:' .github/workflows/electron-macos-hot-package.yml >/dev/null
          ! grep -F 'push:' .github/workflows/native-mobile.yml >/dev/null
          ! grep -F 'release:' .github/workflows/macos-desktop-e2e.yml >/dev/null
          ! grep -F 'workflow_run:' .github/workflows/formal-store-delivery-orchestrator.yml >/dev/null
          ! grep -F 'test:e2e' .github/workflows/electron-desktop.yml >/dev/null
          grep -F "inputs.release_kind == 'formal'" .github/workflows/release-desktop-platform.yml >/dev/null
          grep -F 'Legacy combined release (disabled)' .github/workflows/native-electron-release.yml >/dev/null
          echo 'FCM-023 fast test / strict formal release policy is enforced.'
