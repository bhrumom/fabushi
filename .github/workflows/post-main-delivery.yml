name: Post-main E2E Release delivery
run-name: Post-main source=${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }} upstream=${{ github.event.workflow_run.id || github.event.pull_request.number || 'contract' }} conclusion=${{ github.event.workflow_run.conclusion || 'contract' }}

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/post-main-delivery.yml'
      - '.github/workflows/electron-desktop.yml'
      - '.github/workflows/native-mobile.yml'
      - '.github/workflows/macos-desktop-e2e.yml'
      - '.github/scripts/verify-release-updater-ui.mjs'
  workflow_run:
    workflows:
      - Electron desktop quality gate
    types:
      - completed

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: post-main-delivery-${{ github.event.workflow_run.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Post-main delivery contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout delivery control plane only
        uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/post-main-delivery.yml
            .github/workflows/electron-desktop.yml
            .github/workflows/native-mobile.yml
            .github/workflows/macos-desktop-e2e.yml
            .github/scripts/verify-release-updater-ui.mjs
      - name: Check updater automation JavaScript syntax
        run: node --check .github/scripts/verify-release-updater-ui.mjs
      - name: Require exact-SHA and tested-artifact invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'github.event.workflow_run.head_sha' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'run-name: Post-main source=' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'actions/runs/$ELECTRON_RUN_ID' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'post-main-source-binding.json' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'Native mobile result' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'Native iOS' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F -- '--paginate --slurp' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'map(.check_runs) | add' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'run-id:' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'needs.gate.outputs.electron_run_id' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'fabushi-delivery-mac.json' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'latest-mac.yml' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'gh release create "$tag" "${assets[@]}"' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'latest_args=(--latest)' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'Checksum manifest must never contain itself.' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'references missing release asset' .github/workflows/post-main-delivery.yml >/dev/null
          grep -F 'desktop-update-cloud' .github/scripts/verify-release-updater-ui.mjs >/dev/null
          grep -F 'github.sha' .github/workflows/electron-desktop.yml >/dev/null
          grep -F 'github.sha' .github/workflows/native-mobile.yml >/dev/null
          echo 'Post-main delivery control-plane invariants are present.'

  gate:
    name: Require exact-main desktop and mobile E2E
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      electron_run_id: ${{ steps.meta.outputs.electron_run_id }}
      electron_conclusion: ${{ steps.meta.outputs.electron_conclusion }}
      native_run_id: ${{ steps.wait-native.outputs.native_run_id }}
    steps:
      - id: meta
        name: Bind delivery to the completed Electron main run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          ELECTRON_RUN_ID: ${{ github.event.workflow_run.id }}
          ELECTRON_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          test -n "$ELECTRON_RUN_ID"
          upstream="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ELECTRON_RUN_ID")"
          api_source_sha="$(jq -r '.head_sha // empty' <<<"$upstream")"
          api_event="$(jq -r '.event // empty' <<<"$upstream")"
          api_branch="$(jq -r '.head_branch // empty' <<<"$upstream")"
          api_conclusion="$(jq -r '.conclusion // empty' <<<"$upstream")"
          mkdir -p evidence/post-main-delivery
          jq -n \
            --arg controllerSha "$GITHUB_SHA" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg electronRunId "$ELECTRON_RUN_ID" \
            --arg event "$api_event" \
            --arg branch "$api_branch" \
            --arg conclusion "$api_conclusion" \
            '{schemaVersion:1,controllerDefaultBranchSha:$controllerSha,sourceSha:$sourceSha,electronRunId:$electronRunId,electronEvent:$event,electronBranch:$branch,electronConclusion:$conclusion}' \
            > evidence/post-main-delivery/post-main-source-binding.json
          {
            echo '## Post-main delivery source binding'
            echo "- Controller/default-branch SHA: \`$GITHUB_SHA\`"
            echo "- Upstream Electron source SHA: \`$SOURCE_SHA\`"
            echo "- Upstream Electron run: \`$ELECTRON_RUN_ID\`"
            echo "- Upstream event/branch: \`$api_event / $api_branch\`"
            echo "- Upstream conclusion: \`$api_conclusion\`"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$api_source_sha" = "$SOURCE_SHA"
          test "$api_event" = push
          test "$api_branch" = main
          test "$api_conclusion" = "$ELECTRON_CONCLUSION"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "electron_run_id=$ELECTRON_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "electron_conclusion=$api_conclusion" >> "$GITHUB_OUTPUT"

      - name: Preserve exact-source workflow_run binding evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-main-source-binding-${{ github.event.workflow_run.id }}
          path: evidence/post-main-delivery/post-main-source-binding.json
          if-no-files-found: warn
          retention-days: 90

      - name: Require successful exact-source Electron result
        shell: bash
        env:
          ELECTRON_CONCLUSION: ${{ steps.meta.outputs.electron_conclusion }}
        run: |
          set -euo pipefail
          test "$ELECTRON_CONCLUSION" = success

      - id: wait-native
        name: Wait for Android and iOS platform checks on the same main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 7200))
          native_run_id=''
          required_checks=('Native mobile result' 'Native iOS')
          while [ "$SECONDS" -lt "$deadline" ]; do
            # A busy main SHA can have more than 100 check-runs. Fetch every page so
            # release gating cannot miss successful native checks outside page one.
            checks="$(gh api --paginate --slurp -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" | jq '{check_runs: (map(.check_runs) | add)}')"
            all_done=true
            for required in "${required_checks[@]}"; do
              status="$(jq -r --arg required "$required" '[.check_runs[] | select(.name == $required)] | sort_by(.started_at) | last | .status // "missing"' <<<"$checks")"
              conclusion="$(jq -r --arg required "$required" '[.check_runs[] | select(.name == $required)] | sort_by(.started_at) | last | .conclusion // ""' <<<"$checks")"
              details_url="$(jq -r --arg required "$required" '[.check_runs[] | select(.name == $required)] | sort_by(.started_at) | last | .details_url // ""' <<<"$checks")"
              if [ "$status" = completed ]; then
                if [ "$conclusion" != success ]; then
                  echo "$required for $SOURCE_SHA concluded $conclusion" >&2
                  exit 1
                fi
                if [ -z "$native_run_id" ] && [ -n "$details_url" ]; then
                  native_run_id="$(sed -nE 's#.*actions/runs/([0-9]+).*#\1#p' <<<"$details_url" | head -1)"
                fi
              else
                all_done=false
              fi
              echo "Native check $required: status=$status conclusion=${conclusion:-pending}"
            done
            if [ "$all_done" = true ]; then
              echo "native_run_id=$native_run_id" >> "$GITHUB_OUTPUT"
              echo "- Native mobile result: success" >> "$GITHUB_STEP_SUMMARY"
              echo "- Native iOS: success" >> "$GITHUB_STEP_SUMMARY"
              echo "- Native workflow run: ${native_run_id:-unknown}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for Android and iOS native checks on $SOURCE_SHA" >&2
          exit 1

  publish:
    name: Publish tested main artifacts to GitHub Release
    needs: gate
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: write
    concurrency:
      group: fabushi-desktop-release-publication
      cancel-in-progress: false
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.collect.outputs.version }}
      source_sha: ${{ needs.gate.outputs.source_sha }}
    steps:
      - name: Checkout version policy sync script
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            app-version.json
            .github/scripts/sync-app-version-policy.mjs
      - name: Download tested macOS package artifacts from exact Electron run
        uses: actions/download-artifact@v8
        with:
          name: fabushi-electron-mac
          path: electron-artifacts/mac
          github-token: ${{ github.token }}
          run-id: ${{ needs.gate.outputs.electron_run_id }}

      - name: Download tested Windows package artifacts from exact Electron run
        uses: actions/download-artifact@v8
        with:
          name: fabushi-electron-win
          path: electron-artifacts/win
          github-token: ${{ github.token }}
          run-id: ${{ needs.gate.outputs.electron_run_id }}

      - name: Download tested Linux package artifacts from exact Electron run
        uses: actions/download-artifact@v8
        with:
          name: fabushi-electron-linux
          path: electron-artifacts/linux
          github-token: ${{ github.token }}
          run-id: ${{ needs.gate.outputs.electron_run_id }}

      - id: collect
        name: Validate exact-SHA manifests and updater assets
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
        run: |
          set -euo pipefail
          mac_manifest="$(find electron-artifacts/mac -type f -name 'fabushi-delivery-mac.json' -print -quit)"
          win_manifest="$(find electron-artifacts/win -type f -name 'fabushi-delivery-win.json' -print -quit)"
          linux_manifest="$(find electron-artifacts/linux -type f -name 'fabushi-delivery-linux.json' -print -quit)"
          test -n "$mac_manifest" && test -n "$win_manifest" && test -n "$linux_manifest"

          version="$(jq -r '.version' "$mac_manifest")"
          test -n "$version" && test "$version" != null
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Desktop delivery version is not monotonic SemVer: $version" >&2
            exit 1
          fi
          for manifest in "$mac_manifest" "$win_manifest" "$linux_manifest"; do
            test "$(jq -r '.version' "$manifest")" = "$version"
            test "$(jq -r '.sha' "$manifest")" = "$SOURCE_SHA"
          done

          mkdir -p release-assets
          while IFS= read -r asset; do cp "$asset" release-assets/; done < <(
            find electron-artifacts -type f \( \
              -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o \
              -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o \
              -name 'latest-mac.yml' -o -name 'latest.yml' -o -name 'latest-linux.yml' -o \
              -name 'fabushi-delivery-*.json' \
            \) -print | sort
          )

          test -n "$(find release-assets -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*macos-*.zip' -print -quit)"
          test -f release-assets/latest-mac.yml
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.zip.blockmap' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)"

          metadata_version="$(awk -F': ' '/^version:/ {gsub(/[[:space:]\r]/, "", $2); print $2; exit}' release-assets/latest-mac.yml)"
          test "$metadata_version" = "$version"

          # electron-updater follows the URLs encoded in these channel files. Refuse to
          # publish if a generated metadata URL does not resolve to an exact asset name.
          for metadata in latest-mac.yml latest.yml latest-linux.yml; do
            test -f "release-assets/$metadata"
            while IFS= read -r referenced; do
              test -n "$referenced"
              if [ ! -f "release-assets/$referenced" ]; then
                echo "$metadata references missing release asset: $referenced" >&2
                exit 1
              fi
            done < <(awk '$1 == "-" && $2 == "url:" { print $3 }' "release-assets/$metadata" | tr -d "\"'")
          done

          # Write outside release-assets first. Creating the destination in-place before
          # `find` can make the checksum file hash itself as an empty file.
          checksum_file="$RUNNER_TEMP/SHA256SUMS.txt"
          (cd release-assets && find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 shasum -a 256 > "$checksum_file")
          mv "$checksum_file" release-assets/SHA256SUMS.txt
          if grep -Fq 'SHA256SUMS.txt' release-assets/SHA256SUMS.txt; then
            echo 'Checksum manifest must never contain itself.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Validated exact-SHA updater assets for version $version / $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort >> "$GITHUB_STEP_SUMMARY"

      - id: release
        name: Create immutable tested Release without allowing out-of-order rollback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
          VERSION: ${{ steps.collect.outputs.version }}
          ELECTRON_RUN_ID: ${{ needs.gate.outputs.electron_run_id }}
          NATIVE_RUN_ID: ${{ needs.gate.outputs.native_run_id }}
        run: |
          set -euo pipefail
          canonical_tag="desktop-$VERSION"
          tag="$canonical_tag"

          # A same-version published Release is immutable. This can happen when a
          # prior exact-SHA desktop delivery completed before a follow-up Android/iOS
          # fix reached the same release train. Keep the old Release untouched and
          # publish a provenance-scoped recovery Release instead of overwriting it.
          canonical_existing="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$canonical_tag\")" 2>/dev/null || true)"
          if [ -n "$canonical_existing" ]; then
            canonical_target="$(jq -r '.target_commitish' <<<"$canonical_existing")"
            canonical_draft="$(jq -r '.draft' <<<"$canonical_existing")"
            if [ "$canonical_draft" != true ] && [ "$canonical_target" != "$SOURCE_SHA" ]; then
              tag="${canonical_tag}-${SOURCE_SHA:0:12}"
              echo "Canonical Release $canonical_tag is immutable at $canonical_target; publishing recovery Release $tag."
            fi
          fi
          # Only canonical desktop-X.Y.Z releases participate in updater ordering.
          # Legacy desktop-v1.0.1-* tags sort after numeric SemVer under sort -V and
          # previously caused every new desktop Release to be published with make_latest=false.
          highest_version="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease --jq '.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | test("^desktop-[0-9]+[.][0-9]+[.][0-9]+$"))) | .tagName' | sed 's/^desktop-//' | sort -V | tail -1)"
          make_latest=true
          if [ -n "$highest_version" ]; then
            newest="$(printf '%s\n%s\n' "$highest_version" "$VERSION" | sort -V | tail -1)"
            if [ "$newest" != "$VERSION" ]; then
              make_latest=false
            fi
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Automated Fabushi desktop delivery from canonical main.

          - Source SHA: \`$SOURCE_SHA\`
          - Release tag: \`$tag\`
          - Canonical desktop tag: \`$canonical_tag\`
          - Electron packaged-user E2E run: \`$ELECTRON_RUN_ID\`
          - Native mobile simulated-user run: \`${NATIVE_RUN_ID:-unknown}\`
          - Desktop version: \`$VERSION\`
          - Publication ordering: make_latest=$make_latest

          The macOS DMG/ZIP/updater metadata and Windows/Linux installers are the same artifacts that passed the Electron packaged-user gate for this source SHA.
          EOF

          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\")" 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            release_id="$(jq -r '.id' <<<"$existing")"
            existing_target="$(jq -r '.target_commitish' <<<"$existing")"
            existing_draft="$(jq -r '.draft' <<<"$existing")"
            test "$existing_target" = "$SOURCE_SHA"
            if [ "$existing_draft" != true ]; then
              echo "Release $tag is already published for $SOURCE_SHA; refusing to mutate published assets."
              if [ "$make_latest" = true ]; then
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f make_latest=true >/dev/null
                latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
                if [ "$latest_tag" != "$tag" ]; then
                  echo "GitHub Latest pointer did not advance to $tag; observed $latest_tag" >&2
                  exit 1
                fi
              fi
              echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Removing stale draft Release $tag before retrying atomic publication."
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          fi

          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -gt 0
          latest_args=(--latest)
          if [ "$make_latest" != true ]; then
            latest_args=(--latest=false)
          fi
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Fabushi Desktop $VERSION" \
            --notes-file "$notes" \
            "${latest_args[@]}"

          published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          test "$(jq -r '.draft' <<<"$published")" = false
          test "$(jq -r '.prerelease' <<<"$published")" = false
          test "$(jq -r '.tag_name' <<<"$published")" = "$tag"
          test "$(jq -r '.target_commitish' <<<"$published")" = "$SOURCE_SHA"
          if [ "$make_latest" = true ]; then
            release_id="$(jq -r '.id' <<<"$published")"
            # GitHub exposes make_latest directly on the Release REST API. Patch and
            # read it back instead of trusting the CLI flag silently. electron-updater
            # follows /releases/latest, so a stale pointer is a delivery failure.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f make_latest=true >/dev/null
            latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
            if [ "$latest_tag" != "$tag" ]; then
              echo "GitHub Latest pointer did not advance to $tag; observed $latest_tag" >&2
              exit 1
            fi
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo '## Published Release'
            echo "- Tag: \`$tag\`"
            echo "- Target: \`$SOURCE_SHA\`"
            echo "- make_latest: \`$make_latest\`"
            echo "- macOS Release E2E will start from the release-published event."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync tested desktop Release into official-site version policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION_POLICY_ENDPOINT: ${{ vars.VERSION_POLICY_ENDPOINT }}
          VERSION_POLICY_AUTOMATION_TOKEN: ${{ secrets.VERSION_POLICY_AUTOMATION_TOKEN }}
          VERSION_POLICY_CHANNELS: stable
          VERSION_POLICY_PLATFORMS: macos,windows,linux
          VERSION_SYNC_SOURCE: github-actions-desktop-release
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          asset_url() {
            local pattern="$1"
            jq -r --arg pattern "$pattern" '.assets[] | select(.name | test($pattern; "i")) | .browser_download_url' <<<"$release_json" | head -1
          }
          export APP_DOWNLOAD_URL_MACOS="$(asset_url '[.]dmg$')"
          export APP_DOWNLOAD_URL_WINDOWS="$(asset_url 'setup[.]exe$')"
          export APP_DOWNLOAD_URL_LINUX="$(asset_url '[.]deb$')"
          test -n "$APP_DOWNLOAD_URL_MACOS"
          test -n "$APP_DOWNLOAD_URL_WINDOWS"
          test -n "$APP_DOWNLOAD_URL_LINUX"
          node .github/scripts/sync-app-version-policy.mjs --releaseTag "$RELEASE_TAG"

      - name: Preserve post-main delivery ledger
        uses: actions/upload-artifact@v7
        with:
          name: post-main-delivery-${{ needs.gate.outputs.source_sha }}
          path: |
            release-assets/**
          if-no-files-found: error
          retention-days: 30
