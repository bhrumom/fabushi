name: ChatGPT Android Account Session Probe

on:
  push:
    branches:
      - fix/chatgpt-android-apkcombo-source
    paths:
      - '.agents/plugins/plugins/chatgpt-android-controller/scripts/seed-chrome-session.mjs'
      - '.agents/plugins/plugins/chatgpt-android-controller/scripts/restore-latest-account-credentials.sh'
      - '.github/workflows/chatgpt-android-account-session-probe.yml'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: chatgpt-auto-confirm-acct_6fe593e530e2
    env:
      CHATGPT_ACCOUNT_ID: acct_6fe593e530e2
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore latest rolling account credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHATGPT_AUTO_CONFIRM_STATE_KEY: ${{ secrets.CHATGPT_AUTO_CONFIRM_STATE_KEY }}
        run: bash .agents/plugins/plugins/chatgpt-android-controller/scripts/restore-latest-account-credentials.sh

      - name: Install Android emulator runtime
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin=$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -u+x -print | sort -V | tail -n 1)
          test -x "$sdkmanager_bin"
          tools_bin=$(dirname "$sdkmanager_bin")
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
          } >> "$GITHUB_ENV"
          {
            echo "$tools_bin"
            echo "$sdk_root/platform-tools"
            echo "$sdk_root/emulator"
          } >> "$GITHUB_PATH"
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libpulse0
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" emulator 'system-images;android-35;google_apis_playstore;x86_64'

      - name: Boot fresh Play Store Android
        id: emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/account-session-probe-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME" "$HOME/.android"
          chmod 700 "$ANDROID_AVD_HOME" "$HOME/.android"
          rm -f "$HOME/.android/adbkey" "$HOME/.android/adbkey.pub"
          adb keygen "$HOME/.android/adbkey" >/dev/null
          chmod 600 "$HOME/.android/adbkey"
          chmod 644 "$HOME/.android/adbkey.pub"
          echo "ADB_VENDOR_KEYS=$HOME/.android" >> "$GITHUB_ENV"
          adb kill-server >/dev/null 2>&1 || true
          ADB_VENDOR_KEYS="$HOME/.android" adb start-server >/dev/null

          printf 'no\n' | avdmanager create avd --force \
            --name account-session-probe \
            --package 'system-images;android-35;google_apis_playstore;x86_64' \
            --device pixel_7
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          log="$RUNNER_TEMP/account-session-probe-emulator.log"
          nohup emulator -avd account-session-probe \
            -no-window -noaudio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 3072 >"$log" 2>&1 &
          pid=$!
          echo "pid=$pid" >> "$GITHUB_OUTPUT"

          attached=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -n 160 "$log" || true
              exit 1
            fi
            if adb devices | awk '$1 ~ /^emulator-/ && $2 == "device" {found=1} END{exit !found}'; then
              attached=true
              break
            fi
            sleep 2
          done
          [[ "$attached" == true ]]

          booted=false
          for attempt in $(seq 1 180); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == '1' ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          [[ "$booted" == true ]]
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell input keyevent 82 || true

      - name: Verify server-side ChatGPT session in Android Chrome
        shell: bash
        working-directory: .agents/plugins/plugins/chatgpt-android-controller
        run: node scripts/seed-chrome-session.mjs

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb emu kill || true
          pid='${{ steps.emulator.outputs.pid }}'
          [[ -z "$pid" ]] || kill "$pid" >/dev/null 2>&1 || true
