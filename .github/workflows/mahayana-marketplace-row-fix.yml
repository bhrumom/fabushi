name: Mahayana Marketplace Row Fix

on:
  push:
    branches:
      - codex/mahayana-marketplace-parallel-20260726-r16
    paths:
      - .github/workflows/mahayana-marketplace-row-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mahayana-marketplace-parallel-20260726-r16
          fetch-depth: 0
      - name: Remove invalid D1 row rename
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api.rs')
          source = path.read_text(encoding='utf-8')
          old = '''#[derive(Debug, Deserialize, Serialize)]
          #[serde(rename_all = "camelCase")]
          struct MarketplacePluginRow {
          '''
          new = '''#[derive(Debug, Deserialize, Serialize)]
          struct MarketplacePluginRow {
          '''
          if source.count(old) != 1:
              raise SystemExit('MarketplacePluginRow block did not match exactly once')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api.rs
      - name: Commit focused fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api.rs
          git commit -m "Fix marketplace browse row decoding"
          git push origin HEAD:codex/mahayana-marketplace-parallel-20260726-r16
