name: TFI re-evaluate release PR 2371

on:
  push:
    branches:
      - ops/tfi-dispatch-electron-gate-2371
    paths:
      - '.github/workflows/tfi-dispatch-electron-gate-2371.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-evaluate exact release PR through existing automerge policy
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/actions/workflows/automerge.yml/dispatches \
            -f ref='main' \
            -f 'inputs[pr_number]=2371'
