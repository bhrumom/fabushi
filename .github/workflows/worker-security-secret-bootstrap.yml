name: Worker security secret bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/worker-security-secret-bootstrap.yml'
      - '.github/security-bootstrap-trigger'

permissions:
  contents: read

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Bootstrap missing internal Worker secrets
        working-directory: fabushi/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          command -v jq >/dev/null
          command -v openssl >/dev/null

          secret_names() {
            local environment="$1"
            npx --yes wrangler@latest secret list --env "$environment" --format json | jq -r '.[].name' | sort -u
          }
          has_name() {
            grep -Fxq "$2" <<<"$1"
          }
          put_secret() {
            local environment="$1" name="$2" value="$3"
            echo "::add-mask::$value"
            printf '%s' "$value" | npx --yes wrangler@latest secret put "$name" --env "$environment" >/dev/null
            printf 'Configured missing %s for %s.\n' "$name" "$environment"
          }
          ensure_random_secret() {
            local environment="$1" names="$2" name="$3"
            if has_name "$names" "$name"; then
              printf '%s already configured for %s.\n' "$name" "$environment"
              return
            fi
            local value
            value="$(openssl rand -base64 48 | tr -d '\n')"
            put_secret "$environment" "$name" "$value"
          }

          git fetch --no-tags origin main:refs/remotes/origin/main
          admin_email="$(python3 - <<'PY'
          import re
          import subprocess
          text = subprocess.check_output(
              ['git', 'show', 'origin/main:fabushi/web/src/config/constants.js'],
              cwd='../..',
              text=True,
          )
          match = re.search(r"export const ADMIN_EMAIL\s*=\s*['\"]([^'\"]+@[^'\"]+)['\"]", text)
          if not match:
              raise SystemExit('Unable to migrate historical administrator allowlist without exposing it.')
          print(match.group(1).strip().lower())
          PY
          )"
          echo "::add-mask::$admin_email"

          firebase_project_id="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('phone-verify.html').read_text(encoding='utf-8')
          match = re.search(r'projectId:\s*["\']([^"\']+)["\']', text)
          if not match:
              raise SystemExit('Unable to resolve Firebase project id from the public client configuration.')
          print(match.group(1))
          PY
          )"
          echo "::add-mask::$firebase_project_id"

          # Use a new secret binding name so old deployments that still carry a
          # plaintext JWT_SECRET var can be migrated without deleting a live
          # binding or creating an authentication outage window.
          for environment in development production; do
            names="$(secret_names "$environment")"
            ensure_random_secret "$environment" "$names" JWT_SIGNING_SECRET
            ensure_random_secret "$environment" "$names" TRANSFER_RECEIPT_SECRET
            if ! has_name "$names" ADMIN_EMAILS; then
              put_secret "$environment" ADMIN_EMAILS "$admin_email"
            fi
            if [ "$environment" = production ] && ! has_name "$names" FIREBASE_PROJECT_ID; then
              put_secret production FIREBASE_PROJECT_ID "$firebase_project_id"
            fi
          done

      - name: Rotate and synchronize the shared auth-provider bridge proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        shell: bash
        run: bash .github/scripts/deploy-auth-provider-bridge.sh

      - name: Verify production and development security preflight
        working-directory: fabushi/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bash ../../.github/scripts/assert-worker-security-secrets.sh development
          bash ../../.github/scripts/assert-worker-security-secrets.sh production
