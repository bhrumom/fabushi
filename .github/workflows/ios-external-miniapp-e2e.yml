name: iOS External MiniApp E2E

on:
  workflow_dispatch:
    inputs:
      marketplace_mode:
        description: Marketplace distribution source for the iOS black-box run
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - live
  workflow_call:
    inputs:
      marketplace_mode:
        description: Marketplace distribution source for the iOS black-box run
        required: false
        default: fixture
        type: string
    secrets:
      TEST_ACCOUNT_TOKEN:
        required: false
      MAHAYANA_TEST_ACCOUNT_TOKEN:
        required: false
  schedule:
    - cron: '17 18 * * *'
  pull_request:
    paths:
      - 'fabushi/lib/**'
      - 'fabushi/pubspec.yaml'
      - 'fabushi/pubspec.lock'
      - 'fabushi/assets/**'
      - 'fabushi/fonts/subset/**'
      - 'fabushi/ios/**'
      - 'fabushi/tool/ios_e2e/**'
      - '.agents/plugins/plugins/global-dharma/**'
      - 'third_party/mahayana/**'
      - 'docs/testing/ios-external-miniapp-e2e.md'
      - '.github/workflows/ios-external-miniapp-e2e.yml'
      - '.github/workflows/ios-e2e-codex-autofix.yml'

permissions:
  contents: read

concurrency:
  group: ios-external-miniapp-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.9
  BUNDLE_ID: com.ombhrum.fabushi
  PLUGIN_QUERY: 全球法布施
  PLUGIN_ID: global-dharma
  APPIUM_VERSION: 3.6.0
  XCUITEST_DRIVER_VERSION: 12.3.1
  COCOAPODS_VERSION: 1.17.0
  MAHAYANA_MANIFEST: third_party/mahayana/mahayana-rs/Cargo.toml
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  LIVE_MARKETPLACE_API_BASE_URL: https://api.ombhrum.com
  MARKETPLACE_MODE: ${{ inputs.marketplace_mode || (github.event_name == 'schedule' && 'live') || 'fixture' }}

jobs:
  architecture-contract:
    name: Production install contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify E2E architecture cannot fake mobile installation
        shell: bash
        run: |
          set -euo pipefail
          python3 fabushi/tool/ios_e2e/verify_architecture.py
          python3 -m py_compile fabushi/tool/ios_e2e/appium_flow.py
          python3 -m py_compile fabushi/tool/ios_e2e/control_client.py
          python3 -m py_compile fabushi/tool/ios_e2e/marketplace_fixture.py
          python3 -m py_compile fabushi/tool/ios_e2e/marketplace_fixture_probe.py
          python3 -m json.tool \
            fabushi/tool/ios_e2e/flows/global_fabushi_search_open.v1.json \
            >/dev/null

      - name: Serve and verify canonical global-dharma Marketplace fixture contract
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/marketplace-fixture-contract"
          mkdir -p "$fixture_dir"
          python3 fabushi/tool/ios_e2e/marketplace_fixture.py \
            --plugin-root .agents/plugins/plugins/global-dharma \
            --package-file "$fixture_dir/global-dharma.tar.gz" \
            --metadata-file "$fixture_dir/metadata.json" \
            --commit-sha "$GITHUB_SHA" \
            --host 127.0.0.1 \
            --port 0 \
            > "$fixture_dir/server.log" 2>&1 &
          fixture_pid=$!
          printf '%s\n' "$fixture_pid" > "$fixture_dir/server.pid"
          cleanup_fixture() {
            kill "$fixture_pid" 2>/dev/null || true
            wait "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup_fixture EXIT
          python3 fabushi/tool/ios_e2e/marketplace_fixture_probe.py \
            --pid-file "$fixture_dir/server.pid" \
            --log-file "$fixture_dir/server.log" \
            --metadata-file "$fixture_dir/metadata.json" \
            --package-file "$fixture_dir/global-dharma.tar.gz" \
            --query "$PLUGIN_QUERY" \
            --full-contract
          python3 - "$fixture_dir" <<'PY'
          import hashlib
          import json
          import sys
          import tarfile
          from pathlib import Path

          root = Path(sys.argv[1])
          package = root / 'global-dharma.tar.gz'
          metadata = json.loads((root / 'metadata.json').read_text(encoding='utf-8'))
          payload = package.read_bytes()
          assert metadata['protocol'] == 'fabushi.marketplace.fixture.v1'
          assert metadata['pluginId'] == 'global-dharma'
          assert isinstance(metadata.get('baseUrl'), str)
          assert metadata['baseUrl'].startswith('http://127.0.0.1:')
          canonical = json.loads(
              Path('.agents/plugins/plugins/global-dharma/.codex-plugin/plugin.json').read_text(encoding='utf-8')
          )
          assert metadata['version'] == canonical['version']
          assert metadata['platforms'] == ['mobile']
          assert metadata['packageSize'] == len(payload)
          assert metadata['packageSha256'] == hashlib.sha256(payload).hexdigest()
          with tarfile.open(package, 'r:gz') as archive:
              names = set(archive.getnames())
          required = {
              '.codex-plugin/plugin.json',
              '.mahayana/plugin.json',
              '.mcp.json',
          }
          assert required <= names, (required - names)
          PY

      - name: Test production marketplace install contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test \
            --locked \
            --manifest-path "$MAHAYANA_MANIFEST" \
            --package mahayana-plugin-host \
            --package mahayana-platform-client


  platform-slim-contract:
    name: Platform slim Flutter contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve platform dependencies
        working-directory: fabushi
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../platform-slim-pub-get.log
          flutter pub deps --style=compact > ../platform-slim-deps.txt

      - name: Analyze platform runtime graph
        working-directory: fabushi
        shell: bash
        timeout-minutes: 8
        run: |
          flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos \
            lib/main.dart \
            lib/bootstrap \
            lib/screens/main_navigation_screen.dart \
            lib/screens/social_feature_chat_screen.dart \
            lib/screens/mini_app_host_screen.dart \
            lib/services/miniapp \
            lib/widgets/app_wrapper.dart \
            lib/widgets/layout/telegram_drawer.dart

      - name: Require committed Pub lock to match resolver
        shell: bash
        run: git diff --exit-code -- fabushi/pubspec.lock

      - name: Upload platform slim resolver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-slim-resolver-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fabushi/pubspec.lock
            platform-slim-pub-get.log
            platform-slim-deps.txt
            fabushi/linux/flutter/generated_plugin_registrant.cc
            fabushi/linux/flutter/generated_plugins.cmake
            fabushi/windows/flutter/generated_plugin_registrant.cc
            fabushi/windows/flutter/generated_plugins.cmake
          if-no-files-found: warn
          retention-days: 14


  ios-dependency-contract:
    name: iOS dependency lock contract
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify pinned Xcode and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR="$DEVELOPER_DIR"
          xcodebuild -version
          test "$(xcodebuild -version | awk '/^Xcode / {print $2}')" = "16.4"
          test "$(pod --version)" = "$COCOAPODS_VERSION"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve Pub and CocoaPods graphs
        shell: bash
        run: |
          set -o pipefail
          (cd fabushi && flutter pub get) 2>&1 | tee ios-dependency-pub-get.log
          (cd fabushi/ios && pod install) 2>&1 | tee ios-dependency-pod-install.log

      - name: Require committed dependency locks
        shell: bash
        run: git diff --exit-code -- fabushi/pubspec.lock fabushi/ios/Podfile.lock

      - name: Upload resolved iOS dependency locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dependency-resolver-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fabushi/pubspec.lock
            fabushi/ios/Podfile.lock
            fabushi/.flutter-plugins-dependencies
            fabushi/macos/Flutter/GeneratedPluginRegistrant.swift
            ios-dependency-pub-get.log
            ios-dependency-pod-install.log
          if-no-files-found: warn
          retention-days: 14


  ios-external-miniapp-e2e:
    name: iOS production-path black-box canary
    needs: [architecture-contract, platform-slim-contract, ios-dependency-contract]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 150
    env:
      TEST_ACCOUNT_TOKEN: ${{ secrets.TEST_ACCOUNT_TOKEN || secrets.MAHAYANA_TEST_ACCOUNT_TOKEN }}
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            artifacts/install \
            artifacts/marketplace \
            artifacts/ios/screenshots \
            artifacts/ios/page-source \
            artifacts/logs

      - name: Require fixed test account credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TEST_ACCOUNT_TOKEN:-}" ]; then
            echo "TEST_ACCOUNT_TOKEN or MAHAYANA_TEST_ACCOUNT_TOKEN is required for the real iOS canary." >&2
            exit 1
          fi

      - name: Verify pinned Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee artifacts/logs/xcode-version.txt
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          printf '%s\n' "$simulator_sdk" | tee artifacts/logs/ios-simulator-sdk-version.txt
          xcode_version="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          [ "$xcode_version" = "16.4" ] || {
            echo "Expected Xcode 16.4, got $xcode_version" >&2
            exit 1
          }

      - name: Select Marketplace distribution mode
        shell: bash
        run: |
          set -euo pipefail
          case "$MARKETPLACE_MODE" in
            fixture)
              printf 'mode=fixture\n' | tee artifacts/marketplace/mode.txt
              ;;
            live)
              printf 'mode=live\napiBaseUrl=%s\n' "$LIVE_MARKETPLACE_API_BASE_URL" \
                | tee artifacts/marketplace/mode.txt
              echo "MARKETPLACE_API_BASE_URL=$LIVE_MARKETPLACE_API_BASE_URL" >> "$GITHUB_ENV"
              ;;
            *) echo "Unsupported MARKETPLACE_MODE=$MARKETPLACE_MODE" >&2; exit 1 ;;
          esac

      - name: Start deterministic Marketplace distribution fixture
        if: env.MARKETPLACE_MODE == 'fixture'
        shell: bash
        run: |
          set -euo pipefail
          python3 fabushi/tool/ios_e2e/marketplace_fixture.py \
            --plugin-root .agents/plugins/plugins/global-dharma \
            --package-file artifacts/marketplace/global-dharma.tar.gz \
            --metadata-file artifacts/marketplace/fixture-metadata.json \
            --commit-sha "$GITHUB_SHA" \
            --host 127.0.0.1 \
            --port 0 \
            > artifacts/logs/marketplace-fixture.log 2>&1 &
          echo $! > "$RUNNER_TEMP/marketplace-fixture.pid"
          python3 fabushi/tool/ios_e2e/marketplace_fixture_probe.py \
            --pid-file "$RUNNER_TEMP/marketplace-fixture.pid" \
            --log-file artifacts/logs/marketplace-fixture.log \
            --metadata-file artifacts/marketplace/fixture-metadata.json \
            --package-file artifacts/marketplace/global-dharma.tar.gz \
            --query "$PLUGIN_QUERY" \
            --full-contract \
            --github-env "$GITHUB_ENV" \
            --mode-file artifacts/marketplace/mode.txt \
            | tee artifacts/marketplace/fixture-probe.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fingerprint Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV | tee artifacts/logs/rustc-version.txt
          fingerprint="$(rustc -vV | shasum -a 256 | awk '{print $1}')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Fingerprint iOS Mahayana runtime inputs
        id: ios-mahayana-runtime
        shell: bash
        env:
          CONFIGURATION: Debug
          PLATFORM_NAME: iphonesimulator
          ARCHS: arm64
        run: |
          set -euo pipefail
          fingerprint="$(./fabushi/ios/build_telegram_runtime.sh --fingerprint)"
          test "${#fingerprint}" -eq 64
          printf '%s\n' "$fingerprint" | tee artifacts/logs/mahayana-ios-runtime-fingerprint.txt
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore cached iOS E2E Runner.app
        id: ios-e2e-app-cache
        uses: actions/cache/restore@v4
        with:
          path: fabushi/build/ios/iphonesimulator/Runner.app
          key: ios-e2e-runner-v1-${{ runner.os }}-${{ runner.arch }}-xcode16.4-flutter3.41.9-${{ steps.ios-mahayana-runtime.outputs.fingerprint }}-${{ hashFiles('fabushi/lib/**', 'fabushi/ios/**', 'fabushi/pubspec.yaml', 'fabushi/pubspec.lock', 'fabushi/assets/**', 'fabushi/fonts/subset/**') }}

      - name: Restore Cargo download cache
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true'
        id: cargo-download-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ios-mahayana-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.fingerprint }}-${{ hashFiles('third_party/mahayana/mahayana-rs/Cargo.lock') }}

      - name: Restore fingerprinted iOS Mahayana runtime
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true'
        id: ios-mahayana-runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            fabushi/ios/Runner/Libs/libmahayana_runtime.a
            fabushi/ios/Runner/Libs/libmahayana_runtime.a.fingerprint
          key: ios-mahayana-runtime-v1-${{ runner.os }}-${{ runner.arch }}-xcode16.4-${{ steps.ios-mahayana-runtime.outputs.fingerprint }}

      - name: Seed iOS Simulator Mahayana runtime
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 35
        env:
          CONFIGURATION: Debug
          PLATFORM_NAME: iphonesimulator
          ARCHS: arm64
        run: |
          set -o pipefail
          ./fabushi/ios/build_telegram_runtime.sh 2>&1 \
            | tee artifacts/logs/mahayana-ios-simulator-runtime.log
          expected="${{ steps.ios-mahayana-runtime.outputs.fingerprint }}"
          actual="$(tr -d '\r\n' < fabushi/ios/Runner/Libs/libmahayana_runtime.a.fingerprint)"
          test "$actual" = "$expected"
          test -s fabushi/ios/Runner/Libs/libmahayana_runtime.a
          shasum -a 256 fabushi/ios/Runner/Libs/libmahayana_runtime.a \
            | tee artifacts/logs/mahayana-ios-runtime-sha256.txt

      - name: Save fingerprinted iOS Mahayana runtime
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true' && steps.ios-mahayana-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            fabushi/ios/Runner/Libs/libmahayana_runtime.a
            fabushi/ios/Runner/Libs/libmahayana_runtime.a.fingerprint
          key: ios-mahayana-runtime-v1-${{ runner.os }}-${{ runner.arch }}-xcode16.4-${{ steps.ios-mahayana-runtime.outputs.fingerprint }}

      - name: Save Cargo download cache
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true' && steps.cargo-download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ios-mahayana-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.fingerprint }}-${{ hashFiles('third_party/mahayana/mahayana-rs/Cargo.lock') }}

      - name: Setup Flutter
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install pinned Appium XCUITest stack
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "appium@3.6.0"
          appium driver install "xcuitest@12.3.1"
          appium --version | tee artifacts/logs/appium-version.txt
          appium driver list --installed | tee artifacts/logs/appium-drivers.txt

      - name: Resolve Flutter dependencies without lock drift
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true'
        working-directory: fabushi
        shell: bash
        timeout-minutes: 10
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../artifacts/logs/flutter-pub-get.log
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- fabushi/pubspec.lock

      - name: Verify pinned CocoaPods toolchain
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(pod --version)"
          printf '%s\n' "$actual" | tee artifacts/logs/cocoapods-version.txt
          [ "$actual" = "$COCOAPODS_VERSION" ] || {
            echo "Expected CocoaPods $COCOAPODS_VERSION, got $actual" >&2
            exit 1
          }

      - name: Restore CocoaPods download cache
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true'
        id: cocoapods-download-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            fabushi/ios/Pods
          key: ios-cocoapods-v2-${{ runner.os }}-${{ runner.arch }}-xcode16.4-cocoapods1.17.0-${{ hashFiles('fabushi/ios/Podfile.lock') }}

      - name: Install pinned CocoaPods graph
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true'
        working-directory: fabushi/ios
        shell: bash
        timeout-minutes: 15
        run: |
          set -o pipefail
          pod install --deployment 2>&1 | tee ../../artifacts/logs/pod-install.log
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- fabushi/ios/Podfile.lock

      - name: Save CocoaPods download cache
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true' && steps.cocoapods-download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            fabushi/ios/Pods
          key: ios-cocoapods-v2-${{ runner.os }}-${{ runner.arch }}-xcode16.4-cocoapods1.17.0-${{ hashFiles('fabushi/ios/Podfile.lock') }}

      - name: Verify Xcode reuses fingerprinted Mahayana runtime
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          CONFIGURATION: Debug
          PLATFORM_NAME: iphonesimulator
          ARCHS: arm64
        run: |
          set -o pipefail
          ./fabushi/ios/build_telegram_runtime.sh 2>&1 \
            | tee artifacts/logs/mahayana-ios-runtime-reuse.log
          grep -Fq 'Reusing fingerprinted Mahayana Rust runtime' \
            artifacts/logs/mahayana-ios-runtime-reuse.log

      - name: Build iOS Simulator app
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true'
        working-directory: fabushi
        shell: bash
        timeout-minutes: 45
        run: |
          set -o pipefail
          flutter build ios --simulator --debug --no-codesign \
            --dart-define=FABUSHI_E2E_CONTROL=true 2>&1 \
            | tee ../artifacts/logs/flutter-ios-build.log
          test -d build/ios/iphonesimulator/Runner.app

      - name: Save cached iOS E2E Runner.app
        if: steps.ios-e2e-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: fabushi/build/ios/iphonesimulator/Runner.app
          key: ios-e2e-runner-v1-${{ runner.os }}-${{ runner.arch }}-xcode16.4-flutter3.41.9-${{ steps.ios-mahayana-runtime.outputs.fingerprint }}-${{ hashFiles('fabushi/lib/**', 'fabushi/ios/**', 'fabushi/pubspec.yaml', 'fabushi/pubspec.lock', 'fabushi/assets/**', 'fabushi/fonts/subset/**') }}

      - name: Create isolated iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes available -j > artifacts/ios/available-runtimes.json
          xcrun simctl list devicetypes -j > artifacts/ios/available-device-types.json
          selection="$(python3 - artifacts/ios/available-runtimes.json artifacts/ios/available-device-types.json <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          runtimes = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8')).get('runtimes', [])
          device_types = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8')).get('devicetypes', [])

          ios = []
          for runtime in runtimes:
              identifier = runtime.get('identifier', '')
              if not runtime.get('isAvailable', True) or '.iOS-' not in identifier:
                  continue
              version = runtime.get('version', '')
              numbers = tuple(int(part) for part in re.findall(r'\d+', version))
              ios.append((numbers, identifier, runtime.get('name', identifier)))
          if not ios:
              raise SystemExit('No available iOS Simulator runtime was found')
          ios.sort(reverse=True)
          _, runtime_id, runtime_name = ios[0]

          preferred = ('iPhone 16 Pro', 'iPhone 16', 'iPhone 15 Pro', 'iPhone 15')
          by_name = {row.get('name'): row.get('identifier') for row in device_types}
          device_name = next((name for name in preferred if by_name.get(name)), None)
          if device_name is None:
              device_name = next(
                  (row.get('name') for row in device_types if str(row.get('name', '')).startswith('iPhone')),
                  None,
              )
          if not device_name or not by_name.get(device_name):
              raise SystemExit('No iPhone Simulator device type was found')
          print(f'{runtime_id}|{by_name[device_name]}|{runtime_name}|{device_name}')
          PY
          )"
          IFS='|' read -r runtime_id device_type runtime_name device_name <<< "$selection"
          simulator_name="Fabushi-E2E-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          udid="$(xcrun simctl create "$simulator_name" "$device_type" "$runtime_id")"
          test -n "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
          printf 'runtime=%s\ndevice=%s\nudid=%s\n' \
            "$runtime_name" "$device_name" "$udid" \
            | tee artifacts/ios/selected-simulator.txt
          xcrun simctl boot "$udid"
          python3 - "$udid" <<'PY'
          import subprocess
          import sys

          udid = sys.argv[1]
          try:
              subprocess.run(
                  ['xcrun', 'simctl', 'bootstatus', udid, '-b'],
                  check=True,
                  timeout=240,
              )
          except subprocess.TimeoutExpired as error:
              raise SystemExit(f'Simulator boot did not complete within 240 seconds: {error}')
          PY
          xcrun simctl io "$udid" screenshot artifacts/ios/screenshots/00-clean-simulator.png

      - name: Snapshot resolved dependency locks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/dependencies
          cp fabushi/pubspec.lock artifacts/dependencies/pubspec.lock.resolved
          if [[ -f fabushi/ios/Podfile.lock ]]; then
            cp fabushi/ios/Podfile.lock artifacts/dependencies/Podfile.lock.resolved
          fi
          git diff -- fabushi/pubspec.lock fabushi/ios/Podfile.lock \
            > artifacts/dependencies/lock-diff.patch || true

      - name: Install Fabushi into Simulator
        id: app
        shell: bash
        env:
          IOS_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/fabushi/build/ios/iphonesimulator/Runner.app"
          xcrun simctl install "$IOS_UDID" "$app"
          app_home="$(xcrun simctl get_app_container "$IOS_UDID" "$BUNDLE_ID" data)"
          test -d "$app_home"
          printf 'app_home=%s\n' "$app_home" >> "$GITHUB_OUTPUT"
          xcrun simctl io "$IOS_UDID" screenshot artifacts/ios/screenshots/01-app-installed.png

      - name: Provision only the fixed test-account session fixture
        shell: bash
        env:
          APP_HOME: ${{ steps.app.outputs.app_home }}
        run: |
          set -euo pipefail
          runtime_root="$APP_HOME/Library/Application Support/mahayana-runtime"
          codex_plugins="$runtime_root/codex/plugins"
          mkdir -p "$APP_HOME/.mahayana" "$codex_plugins"

          printf '%s' "$TEST_ACCOUNT_TOKEN" \
            | shasum -a 256 \
            | awk '{print $1}' \
            > "$APP_HOME/.mahayana/test-account-login.sha256"
          chmod 600 "$APP_HOME/.mahayana/test-account-login.sha256"

          before_count="$(find "$codex_plugins" -type f -path '*/.codex-plugin/plugin.json' | wc -l | tr -d ' ')"
          [ "$before_count" = "0" ] || {
            echo "Clean Simulator unexpectedly contains an installed plugin." >&2
            exit 1
          }
          printf 'No plugins were preinstalled. Installation must happen through the App UI.\n' \
            > artifacts/install/precondition.txt

      - name: Start iOS diagnostics and launch app
        shell: bash
        env:
          IOS_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl spawn "$IOS_UDID" log stream \
            --style json \
            --level debug \
            --predicate 'process == "Runner"' \
            > artifacts/logs/ios-runner-live.jsonl 2>&1 &
          echo $! > "$RUNNER_TEMP/ios-log-stream.pid"

          xcrun simctl io "$IOS_UDID" recordVideo \
            --codec=h264 artifacts/ios/e2e.mp4 \
            > artifacts/logs/simulator-video.log 2>&1 &
          echo $! > "$RUNNER_TEMP/ios-video.pid"

          SIMCTL_CHILD_MAHAYANA_TEST_ACCOUNT_TOKEN="$TEST_ACCOUNT_TOKEN" \
            SIMCTL_CHILD_MAHAYANA_API_BASE_URL="$MARKETPLACE_API_BASE_URL" \
            xcrun simctl launch --terminate-running-process \
              "$IOS_UDID" "$BUNDLE_ID" \
            > artifacts/logs/simctl-launch.txt
          xcrun simctl io "$IOS_UDID" screenshot artifacts/ios/screenshots/02-app-launched.png

      - name: Verify debug E2E control and fixed test-account session
        shell: bash
        env:
          APP_HOME: ${{ steps.app.outputs.app_home }}
        run: |
          set -euo pipefail
          python3 fabushi/tool/ios_e2e/control_client.py \
            --app-home "$APP_HOME" \
            --method ping \
            --output artifacts/install/control-ping.json
          python3 fabushi/tool/ios_e2e/control_client.py \
            --app-home "$APP_HOME" \
            --method auth.status \
            --output artifacts/install/control-auth-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('artifacts/install/control-auth-status.json').read_text())
          assert payload.get('ok') is True
          assert payload.get('result', {}).get('loggedIn') is True
          PY

      - name: Preflight exact Marketplace release through production client
        shell: bash
        env:
          APP_HOME: ${{ steps.app.outputs.app_home }}
        run: |
          set -euo pipefail
          params="$(python3 -c 'import json,os; print(json.dumps({"query": os.environ["PLUGIN_QUERY"]}))')"
          python3 fabushi/tool/ios_e2e/control_client.py \
            --app-home "$APP_HOME" \
            --method marketplace.search \
            --params "$params" \
            --output artifacts/install/control-marketplace-search.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('artifacts/install/control-marketplace-search.json').read_text(encoding='utf-8'))
          mode = os.environ['MARKETPLACE_MODE']
          plugin_id = os.environ['PLUGIN_ID']
          result = payload.get('result', {}) if payload.get('ok') is True else {}
          plugins = result.get('plugins', []) if isinstance(result, dict) else []
          target = next(
              (item for item in plugins if isinstance(item, dict) and item.get('pluginId') == plugin_id),
              None,
          )
          evidence = {
              'mode': mode,
              'pluginId': plugin_id,
              'apiBaseUrl': os.environ['MARKETPLACE_API_BASE_URL'],
              'found': target is not None,
              'release': target,
          }
          Path('artifacts/marketplace/preflight.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          if target is None:
              code = 'LIVE_MARKETPLACE_RELEASE_MISSING' if mode == 'live' else 'FIXTURE_MARKETPLACE_RELEASE_MISSING'
              raise SystemExit(f'{code}: exact {plugin_id} mobile release is unavailable')
          if not target.get('latestVersion'):
              raise SystemExit(f'{mode.upper()}_MARKETPLACE_VERSION_MISSING: release has no latestVersion')
          if mode == 'fixture':
              fixture = json.loads(Path('artifacts/marketplace/fixture-metadata.json').read_text(encoding='utf-8'))
              assert target.get('pluginId') == fixture['pluginId']
              assert target.get('latestVersion') == fixture['version']
              assert target.get('packageSha256') == fixture['packageSha256']
              assert target.get('packageSize') == fixture['packageSize']
          PY

      - name: Start Appium local WebDriver endpoint
        shell: bash
        run: |
          set -euo pipefail
          appium \
            --address 127.0.0.1 \
            --port 4723 \
            --log artifacts/logs/appium.log \
            --log-timestamp \
            > artifacts/logs/appium-console.log 2>&1 &
          echo $! > "$RUNNER_TEMP/appium.pid"
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              try:
                  with opener.open('http://127.0.0.1:4723/status', timeout=3) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  if payload.get('value', {}).get('ready') is not False:
                      raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit('Appium did not become ready within 90 seconds')
          PY

      - name: Install, search, open, and verify 全球法布施 through the App UI
        shell: bash
        env:
          IOS_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          python3 fabushi/tool/ios_e2e/appium_flow.py \
            --udid "$IOS_UDID" \
            --bundle-id "$BUNDLE_ID" \
            --plugin-id "$PLUGIN_ID" \
            --query "$PLUGIN_QUERY" \
            --artifacts artifacts/ios

      - name: Query installed and runtime state through E2E Control v1
        shell: bash
        env:
          APP_HOME: ${{ steps.app.outputs.app_home }}
        run: |
          set -euo pipefail
          params="$(python3 -c 'import json,os; print(json.dumps({"pluginId": os.environ["PLUGIN_ID"]}))')"
          python3 fabushi/tool/ios_e2e/control_client.py \
            --app-home "$APP_HOME" \
            --method marketplace.inspect \
            --params "$params" \
            --output artifacts/install/control-marketplace-inspect.json
          python3 fabushi/tool/ios_e2e/control_client.py \
            --app-home "$APP_HOME" \
            --method runtime.status \
            --output artifacts/install/control-runtime-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('artifacts/install/control-marketplace-inspect.json').read_text())
          result = payload.get('result', {})
          assert payload.get('ok') is True
          assert result.get('installed') is True
          assert result.get('pluginId') == 'global-dharma'
          assert result.get('version')
          assert result.get('packageSha256')
          PY

      - name: Verify production install receipt and package identity
        shell: bash
        env:
          APP_HOME: ${{ steps.app.outputs.app_home }}
        run: |
          set -euo pipefail
          plugin_root="$APP_HOME/Library/Application Support/mahayana-runtime/codex/plugins/$PLUGIN_ID"
          receipt="$plugin_root/.mahayana/marketplace-install.json"
          manifest="$plugin_root/.codex-plugin/plugin.json"
          test -f "$receipt"
          test -f "$manifest"
          cp "$receipt" artifacts/install/marketplace-install-receipt.json
          cp "$manifest" artifacts/install/installed-plugin-manifest.json

          python3 - "$PLUGIN_ID" "$receipt" "$manifest" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          plugin_id, receipt_path, manifest_path = sys.argv[1:]
          receipt = json.loads(Path(receipt_path).read_text(encoding='utf-8'))
          manifest = json.loads(Path(manifest_path).read_text(encoding='utf-8'))

          assert receipt.get('protocol') == 'mahayana.marketplace.install-receipt.v1'
          assert receipt.get('pluginId') == plugin_id
          assert manifest.get('name') == plugin_id
          assert receipt.get('version') == manifest.get('version')
          digest = receipt.get('packageSha256', '')
          assert re.fullmatch(r'[0-9a-fA-F]{64}', digest)
          assert isinstance(receipt.get('packageSize'), int) and receipt['packageSize'] > 0
          source = receipt.get('source')
          assert isinstance(source, dict) and source
          assert isinstance(source.get('provider'), str) and source['provider']
          if source.get('provider') == 'github':
              assert isinstance(source.get('repository'), str) and source['repository']
          mode = __import__('os').environ['MARKETPLACE_MODE']
          if mode == 'fixture':
              fixture = json.loads(Path('artifacts/marketplace/fixture-metadata.json').read_text(encoding='utf-8'))
              assert source.get('provider') == 'repository-fixture'
              assert source.get('repository') == 'bhrumom/fabushi'
              assert source.get('commitSha') == fixture['source']['commitSha']
              assert receipt.get('version') == fixture['version']
              assert digest.lower() == fixture['packageSha256'].lower()
              assert receipt.get('packageSize') == fixture['packageSize']

          evidence = {
              'marketplaceMode': mode,
              'pluginId': plugin_id,
              'version': receipt['version'],
              'packageSha256': digest.lower(),
              'packageSize': receipt['packageSize'],
              'source': source,
              'manifestVersion': manifest['version'],
          }
          Path('artifacts/install/verified-release-identity.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence, ensure_ascii=False))
          PY

      - name: Stop diagnostics and collect final state
        if: always()
        shell: bash
        env:
          IOS_UDID: ${{ steps.simulator.outputs.udid }}
          APP_HOME: ${{ steps.app.outputs.app_home }}
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/ios-video.pid" ]; then
            kill -INT "$(cat "$RUNNER_TEMP/ios-video.pid")" 2>/dev/null
          fi
          if [ -f "$RUNNER_TEMP/ios-log-stream.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ios-log-stream.pid")" 2>/dev/null
          fi
          if [ -f "$RUNNER_TEMP/appium.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/appium.pid")" 2>/dev/null
          fi
          if [ -f "$RUNNER_TEMP/marketplace-fixture.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/marketplace-fixture.pid")" 2>/dev/null
          fi
          sleep 3
          if [ -n "${IOS_UDID:-}" ]; then
            xcrun simctl io "$IOS_UDID" screenshot \
              artifacts/ios/screenshots/99-final.png 2>/dev/null
            xcrun simctl spawn "$IOS_UDID" log show \
              --style json \
              --last 30m \
              --predicate 'process == "Runner"' \
              > artifacts/logs/ios-runner-final.jsonl 2>&1
            xcrun simctl shutdown "$IOS_UDID" 2>/dev/null || true
            xcrun simctl delete "$IOS_UDID" 2>/dev/null || true
          fi
          if [ -n "${APP_HOME:-}" ] && [ -d "$APP_HOME/Library/Application Support/mahayana-runtime" ]; then
            find "$APP_HOME/Library/Application Support/mahayana-runtime" \
              -maxdepth 7 -type f -print | sort \
              > artifacts/install/runtime-files.txt
          fi

      - name: Upload iOS E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-external-miniapp-e2e-${{ env.MARKETPLACE_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
