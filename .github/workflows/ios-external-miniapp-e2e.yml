name: iOS External MiniApp E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'
  pull_request:
    paths:
      - 'fabushi/lib/**'
      - 'fabushi/ios/**'
      - 'fabushi/tool/ios_e2e/**'
      - 'third_party/mahayana/**'
      - 'docs/testing/ios-external-miniapp-e2e.md'
      - '.github/workflows/ios-external-miniapp-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ios-external-miniapp-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.9
  BUNDLE_ID: com.ombhrum.fabushi
  PLUGIN_QUERY: 全球法布施
  PLUGIN_ID: global-dharma
  APPIUM_VERSION: 3.6.0
  XCUITEST_DRIVER_VERSION: 12.3.1
  MAHAYANA_MANIFEST: third_party/mahayana/mahayana-rs/Cargo.toml
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  architecture-contract:
    name: Production install contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify E2E architecture cannot fake mobile installation
        shell: bash
        run: |
          set -euo pipefail
          python3 fabushi/tool/ios_e2e/verify_architecture.py
          python3 -m py_compile fabushi/tool/ios_e2e/appium_flow.py
          python3 -m json.tool \
            fabushi/tool/ios_e2e/flows/global_fabushi_search_open.v1.json \
            >/dev/null

      - name: Test production marketplace install contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test \
            --locked \
            --manifest-path "$MAHAYANA_MANIFEST" \
            --package mahayana-plugin-host \
            --package mahayana-platform-client

  ios-external-miniapp-e2e:
    name: iOS production-path black-box canary
    needs: architecture-contract
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TEST_ACCOUNT_TOKEN: ${{ secrets.TEST_ACCOUNT_TOKEN || secrets.MAHAYANA_TEST_ACCOUNT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            artifacts/install \
            artifacts/ios/screenshots \
            artifacts/ios/page-source \
            artifacts/logs

      - name: Require fixed test account credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TEST_ACCOUNT_TOKEN:-}" ]; then
            echo "TEST_ACCOUNT_TOKEN or MAHAYANA_TEST_ACCOUNT_TOKEN is required for the real iOS canary." >&2
            exit 1
          fi

      - name: Verify pinned Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee artifacts/logs/xcode-version.txt
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          printf '%s\n' "$simulator_sdk" | tee artifacts/logs/ios-simulator-sdk-version.txt
          xcode_version="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          [ "$xcode_version" = "16.4" ] || {
            echo "Expected Xcode 16.4, got $xcode_version" >&2
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install pinned Appium XCUITest stack
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "appium@3.6.0"
          appium driver install "xcuitest@12.3.1"
          appium --version | tee artifacts/logs/appium-version.txt
          appium driver list --installed | tee artifacts/logs/appium-drivers.txt

      - name: Resolve clean iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > artifacts/ios/available-devices.json
          udid="$(python3 - artifacts/ios/available-devices.json <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          devices = []
          for runtime, rows in data.get('devices', {}).items():
              for row in rows:
                  if row.get('isAvailable') and 'iPhone' in row.get('name', ''):
                      name = row.get('name', '')
                      rank = next(
                          (100 - index for index, preferred in enumerate(
                              ('iPhone 16', 'iPhone 15', 'iPhone 14')
                          ) if preferred in name),
                          0,
                      )
                      devices.append((rank, runtime, name, row['udid']))
          if not devices:
              raise SystemExit('No available iPhone Simulator was found')
          devices.sort(reverse=True)
          print(devices[0][3])
          PY
          )"
          xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
          xcrun simctl erase "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl io "$udid" screenshot artifacts/ios/screenshots/00-clean-simulator.png

      - name: Build iOS Simulator app
        working-directory: fabushi
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../artifacts/logs/flutter-pub-get.log
          flutter build ios --simulator --debug --no-codesign \
            --dart-define=FABUSHI_E2E_CONTROL=true 2>&1 \
            | tee ../artifacts/logs/flutter-ios-build.log
          test -d build/ios/iphonesimulator/Runner.app

      - name: Install Fabushi into Simulator
        id: app
        shell: bash
        env:
          IOS_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/fabushi/build/ios/iphonesimulator/Runner.app"
          xcrun simctl install "$IOS_UDID" "$app"
          app_home="$(xcrun simctl get_app_container "$IOS_UDID" "$BUNDLE_ID" data)"
          test -d "$app_home"
          printf 'app_home=%s\n' "$app_home" >> "$GITHUB_OUTPUT"
          xcrun simctl io "$IOS_UDID" screenshot artifacts/ios/screenshots/01-app-installed.png

      - name: Provision only the fixed test-account session fixture
        shell: bash
        env:
          APP_HOME: ${{ steps.app.outputs.app_home }}
        run: |
          set -euo pipefail
          runtime_root="$APP_HOME/Library/Application Support/mahayana-runtime"
          codex_plugins="$runtime_root/codex/plugins"
          mkdir -p "$APP_HOME/.mahayana" "$codex_plugins"

          printf '%s' "$TEST_ACCOUNT_TOKEN" \
            | shasum -a 256 \
            | awk '{print $1}' \
            > "$APP_HOME/.mahayana/test-account-login.sha256"
          chmod 600 "$APP_HOME/.mahayana/test-account-login.sha256"

          before_count="$(find "$codex_plugins" -type f -path '*/.codex-plugin/plugin.json' | wc -l | tr -d ' ')"
          [ "$before_count" = "0" ] || {
            echo "Clean Simulator unexpectedly contains an installed plugin." >&2
            exit 1
          }
          printf 'No plugins were preinstalled. Installation must happen through the App UI.\n' \
            > artifacts/install/precondition.txt

      - name: Start iOS diagnostics and launch app
        shell: bash
        env:
          IOS_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl spawn "$IOS_UDID" log stream \
            --style json \
            --level debug \
            --predicate 'process == "Runner"' \
            > artifacts/logs/ios-runner-live.jsonl 2>&1 &
          echo $! > "$RUNNER_TEMP/ios-log-stream.pid"

          xcrun simctl io "$IOS_UDID" recordVideo \
            --codec=h264 artifacts/ios/e2e.mp4 \
            > artifacts/logs/simulator-video.log 2>&1 &
          echo $! > "$RUNNER_TEMP/ios-video.pid"

          SIMCTL_CHILD_MAHAYANA_TEST_ACCOUNT_TOKEN="$TEST_ACCOUNT_TOKEN" \
            xcrun simctl launch --terminate-running-process \
              "$IOS_UDID" "$BUNDLE_ID" \
            > artifacts/logs/simctl-launch.txt
          xcrun simctl io "$IOS_UDID" screenshot artifacts/ios/screenshots/02-app-launched.png

      - name: Verify debug E2E control and fixed test-account session
        shell: bash
        env:
          APP_HOME: ${{ steps.app.outputs.app_home }}
        run: |
          set -euo pipefail
          python3 fabushi/tool/ios_e2e/control_client.py \
            --app-home "$APP_HOME" \
            --method ping \
            --output artifacts/install/control-ping.json
          python3 fabushi/tool/ios_e2e/control_client.py \
            --app-home "$APP_HOME" \
            --method auth.status \
            --output artifacts/install/control-auth-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('artifacts/install/control-auth-status.json').read_text())
          assert payload.get('ok') is True
          assert payload.get('result', {}).get('loggedIn') is True
          PY

      - name: Start Appium local WebDriver endpoint
        shell: bash
        run: |
          set -euo pipefail
          appium \
            --address 127.0.0.1 \
            --port 4723 \
            --log artifacts/logs/appium.log \
            --log-timestamp \
            > artifacts/logs/appium-console.log 2>&1 &
          echo $! > "$RUNNER_TEMP/appium.pid"
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4723/status', timeout=3) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  if payload.get('value', {}).get('ready') is not False:
                      raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit('Appium did not become ready within 90 seconds')
          PY

      - name: Install, search, open, and verify 全球法布施 through the App UI
        shell: bash
        env:
          IOS_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          python3 fabushi/tool/ios_e2e/appium_flow.py \
            --udid "$IOS_UDID" \
            --bundle-id "$BUNDLE_ID" \
            --plugin-id "$PLUGIN_ID" \
            --query "$PLUGIN_QUERY" \
            --artifacts artifacts/ios

      - name: Query installed and runtime state through E2E Control v1
        shell: bash
        env:
          APP_HOME: ${{ steps.app.outputs.app_home }}
        run: |
          set -euo pipefail
          params="$(python3 -c 'import json,os; print(json.dumps({"pluginId": os.environ["PLUGIN_ID"]}))')"
          python3 fabushi/tool/ios_e2e/control_client.py \
            --app-home "$APP_HOME" \
            --method marketplace.inspect \
            --params "$params" \
            --output artifacts/install/control-marketplace-inspect.json
          python3 fabushi/tool/ios_e2e/control_client.py \
            --app-home "$APP_HOME" \
            --method runtime.status \
            --output artifacts/install/control-runtime-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('artifacts/install/control-marketplace-inspect.json').read_text())
          result = payload.get('result', {})
          assert payload.get('ok') is True
          assert result.get('installed') is True
          assert result.get('pluginId') == 'global-dharma'
          assert result.get('version')
          assert result.get('packageSha256')
          PY

      - name: Verify production install receipt and package identity
        shell: bash
        env:
          APP_HOME: ${{ steps.app.outputs.app_home }}
        run: |
          set -euo pipefail
          plugin_root="$APP_HOME/Library/Application Support/mahayana-runtime/codex/plugins/$PLUGIN_ID"
          receipt="$plugin_root/.mahayana/marketplace-install.json"
          manifest="$plugin_root/.codex-plugin/plugin.json"
          test -f "$receipt"
          test -f "$manifest"
          cp "$receipt" artifacts/install/marketplace-install-receipt.json
          cp "$manifest" artifacts/install/installed-plugin-manifest.json

          python3 - "$PLUGIN_ID" "$receipt" "$manifest" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          plugin_id, receipt_path, manifest_path = sys.argv[1:]
          receipt = json.loads(Path(receipt_path).read_text(encoding='utf-8'))
          manifest = json.loads(Path(manifest_path).read_text(encoding='utf-8'))

          assert receipt.get('protocol') == 'mahayana.marketplace.install-receipt.v1'
          assert receipt.get('pluginId') == plugin_id
          assert manifest.get('name') == plugin_id
          assert receipt.get('version') == manifest.get('version')
          digest = receipt.get('packageSha256', '')
          assert re.fullmatch(r'[0-9a-fA-F]{64}', digest)
          assert isinstance(receipt.get('packageSize'), int) and receipt['packageSize'] > 0
          source = receipt.get('source')
          assert isinstance(source, dict) and source
          assert isinstance(source.get('provider'), str) and source['provider']
          if source.get('provider') == 'github':
              assert isinstance(source.get('repository'), str) and source['repository']

          evidence = {
              'pluginId': plugin_id,
              'version': receipt['version'],
              'packageSha256': digest.lower(),
              'packageSize': receipt['packageSize'],
              'source': source,
              'manifestVersion': manifest['version'],
          }
          Path('artifacts/install/verified-release-identity.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence, ensure_ascii=False))
          PY

      - name: Stop diagnostics and collect final state
        if: always()
        shell: bash
        env:
          IOS_UDID: ${{ steps.simulator.outputs.udid }}
          APP_HOME: ${{ steps.app.outputs.app_home }}
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/ios-video.pid" ]; then
            kill -INT "$(cat "$RUNNER_TEMP/ios-video.pid")" 2>/dev/null
          fi
          if [ -f "$RUNNER_TEMP/ios-log-stream.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ios-log-stream.pid")" 2>/dev/null
          fi
          if [ -f "$RUNNER_TEMP/appium.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/appium.pid")" 2>/dev/null
          fi
          sleep 3
          if [ -n "${IOS_UDID:-}" ]; then
            xcrun simctl io "$IOS_UDID" screenshot \
              artifacts/ios/screenshots/99-final.png 2>/dev/null
            xcrun simctl spawn "$IOS_UDID" log show \
              --style json \
              --last 30m \
              --predicate 'process == "Runner"' \
              > artifacts/logs/ios-runner-final.jsonl 2>&1
          fi
          if [ -n "${APP_HOME:-}" ] && [ -d "$APP_HOME/Library/Application Support/mahayana-runtime" ]; then
            find "$APP_HOME/Library/Application Support/mahayana-runtime" \
              -maxdepth 7 -type f -print | sort \
              > artifacts/install/runtime-files.txt
          fi

      - name: Upload iOS E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-external-miniapp-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
