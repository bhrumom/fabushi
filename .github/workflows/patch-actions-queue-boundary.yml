name: Patch Actions queue boundary

on:
  push:
    branches:
      - codex/fix-actions-queue-boundary

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/fix-actions-queue-boundary
          fetch-depth: 0
      - name: Patch dynamic controller
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('.agents/plugins/plugins/chatgpt-auto-confirm/scripts/run-dynamic-actions-controller.mjs')
          source = path.read_text()

          source, count = re.subn(
              r"const boundaryRetrySeconds = Math\.max\(2, Number\(\n"
              r"  process\.env\.CHATGPT_AUTO_CONFIRM_TASK_BOUNDARY_RETRY_SECONDS \|\| 5,\n"
              r"\)\);\n",
              "const boundaryRetrySeconds = Math.max(2, Number(\n"
              "  process.env.CHATGPT_AUTO_CONFIRM_TASK_BOUNDARY_RETRY_SECONDS || 5,\n"
              "));\n"
              "const taskClaimSeconds = Math.min(180, Math.max(5, Number(\n"
              "  process.env.CHATGPT_AUTO_CONFIRM_TASK_CLAIM_SECONDS || 60,\n"
              ")));\n",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('claim timeout insertion point not found')

          pattern = re.compile(
              r"    if \(queued\.length > 0 && runningCount < maxConcurrent\) \{\n"
              r".*?"
              r"      native\('queue_pause'\);\n"
              r"    \}\n",
              re.S,
          )
          replacement = """    if (queued.length > 0 && runningCount < maxConcurrent) {
              if (!child || child.exitCode !== null) {
                process.stdout.write(`TASK_CHAT_BOUNDARY_DEFERRED ${JSON.stringify({
                  reason,
                  revision: sync.revision,
                  queuedIds: queued.map(task => task.id),
                  action: 'wait_for_child_controller',
                })}\\n`);
                return sync;
              }
              process.stdout.write(`TASK_CHAT_BOUNDARY ${JSON.stringify({
                reason,
                revision: sync.revision,
                queuedIds: queued.map(task => task.id),
                runningCount,
                maxConcurrent,
                action: 'resume_until_task_claimed',
                claimTimeoutSeconds: taskClaimSeconds,
              })}\\n`);
              native('queue_resume', {
                maxConcurrent,
                reviewGate: control.reviewGate ?? false,
              });
              const queuedIds = new Set(queued.map(task => task.id));
              const claimDeadline = Date.now() + taskClaimSeconds * 1_000;
              let claimedIds = [];
              while (Date.now() < claimDeadline && child?.exitCode === null) {
                await sleep(1_000);
                const current = native('queue_status');
                const currentTasks = Array.isArray(current.tasks) ? current.tasks : [];
                claimedIds = currentTasks
                  .filter(task => queuedIds.has(task.id) && task.status !== 'queued')
                  .map(task => task.id);
                if (claimedIds.length > 0) break;
              }
              native('queue_pause');
              process.stdout.write(`TASK_CHAT_CLAIM ${JSON.stringify({
                reason,
                queuedIds: [...queuedIds],
                claimedIds,
                claimed: claimedIds.length > 0,
                childExitCode: child?.exitCode ?? null,
              })}\\n`);
            }
          """
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit('dispatch boundary block not found')
          path.write_text(source)
      - name: Validate patch
        run: |
          node --check .agents/plugins/plugins/chatgpt-auto-confirm/scripts/run-dynamic-actions-controller.mjs
          grep -q "resume_until_task_claimed" .agents/plugins/plugins/chatgpt-auto-confirm/scripts/run-dynamic-actions-controller.mjs
          grep -q "wait_for_child_controller" .agents/plugins/plugins/chatgpt-auto-confirm/scripts/run-dynamic-actions-controller.mjs
          git diff --check
      - name: Commit repair
        run: |
          rm -f .github/workflows/patch-actions-queue-boundary.yml .github/queue-boundary-patch-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(actions): wait for queued Chat task claims"
          git push origin HEAD:codex/fix-actions-queue-boundary
