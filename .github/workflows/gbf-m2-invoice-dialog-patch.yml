name: GBF M2 one-shot invoice dialog patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gbf-m2-invoice-dialog-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'gbf/m2-e2e-closure-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Replace unsupported invoice prompts with product dialog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('desktop/src/messaging-shell-v2.tsx')
          text = path.read_text(encoding='utf-8')

          def insert_after_once(source, marker, addition, label):
              if addition.strip() in source:
                  return source
              if source.count(marker) != 1:
                  raise SystemExit(f'{label}: expected one marker, found {source.count(marker)}')
              return source.replace(marker, marker + addition, 1)

          text = insert_after_once(
              text,
              "type EditDialogState = { conversationId: string; messageId: string; originalText: string; text: string } | null;\n",
              "type InvoiceDialogState = { conversationId: string; title: string; amount: string } | null;\n",
              'invoice dialog type',
          )
          text = insert_after_once(
              text,
              "  const [editDialog, setEditDialog] = useState<EditDialogState>(null);\n",
              "  const [invoiceDialog, setInvoiceDialog] = useState<InvoiceDialogState>(null);\n",
              'invoice dialog state',
          )

          if "window.prompt('账单名称'" in text:
              start_marker = "  async function createInvoiceForActivePeer() {\n"
              end_marker = "\n  async function handleMessageAction("
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              replacement = """  function createInvoiceForActivePeer() {
            if (!activePeer?.conversationId || activePeer.source !== 'selfhosted') {
              setError('账单需要发送到 Fabushi 自建会话。');
              return;
            }
            setInvoiceDialog({ conversationId: activePeer.conversationId, title: '订单', amount: '9.99' });
          }

          async function saveInvoiceDialog() {
            if (!invoiceDialog) return;
            const title = invoiceDialog.title.trim();
            const amount = Number(invoiceDialog.amount);
            if (!title) {
              setError('账单名称不能为空。');
              return;
            }
            if (!Number.isFinite(amount) || amount <= 0) {
              setError('金额必须大于 0。');
              return;
            }
            try {
              await selfHosted.createInvoice({
                conversationId: invoiceDialog.conversationId,
                title,
                currency: 'USD',
                amountMinor: Math.round(amount * 100),
                providerId: 'fabushi-pay',
              });
              setInvoiceDialog(null);
            } catch (cause) {
              setError(cause instanceof Error ? cause.message : String(cause));
            }
          }
          """
              text = text[:start] + replacement + text[end:]

          render = "      {invoiceDialog ? <InvoiceDialog dialog={invoiceDialog} onChange={setInvoiceDialog} onClose={() => setInvoiceDialog(null)} onSave={() => void saveInvoiceDialog()} /> : null}\n"
          if render.strip() not in text:
              marker = "      {newDialog ? <NewConversationDialog"
              index = text.index(marker)
              text = text[:index] + render + text[index:]

          component_marker = "function NewConversationDialog("
          if "function InvoiceDialog({ dialog, onChange, onClose, onSave }" not in text:
              index = text.index(component_marker)
              component = """function InvoiceDialog({ dialog, onChange, onClose, onSave }: { dialog: Exclude<InvoiceDialogState, null>; onChange: React.Dispatch<React.SetStateAction<InvoiceDialogState>>; onClose: () => void; onSave: () => void }) {
            const amount = Number(dialog.amount);
            const validAmount = Number.isFinite(amount) && amount > 0;
            return <div className={styles.backdrop} onMouseDown={onClose}><section className={styles.dialog} onMouseDown={(event) => event.stopPropagation()}>
              <header><div><strong>发送账单</strong><small>Fabushi Pay · USD</small></div><button type="button" onClick={onClose}><X size={17} /></button></header>
              <label><span>账单名称</span><input autoFocus data-testid="invoice-title-input" value={dialog.title} onChange={(event) => onChange((current) => current ? { ...current, title: event.target.value } : current)} placeholder="订单" /></label>
              <label><span>金额（USD）</span><input data-testid="invoice-amount-input" inputMode="decimal" value={dialog.amount} onChange={(event) => onChange((current) => current ? { ...current, amount: event.target.value } : current)} placeholder="9.99" /></label>
              <footer><button type="button" onClick={onClose}>取消</button><button type="button" className={styles.primaryButton} disabled={!dialog.title.trim() || !validAmount} onClick={onSave}>创建账单</button></footer>
            </section></div>;
          }

          """
              text = text[:index] + component + text[index:]

          path.write_text(text, encoding='utf-8')

          spec = Path('desktop/e2e/messenger.spec.ts')
          tests = spec.read_text(encoding='utf-8')
          if "const answers = ['E2E 账单', '1.99'];" in tests:
              start = tests.index("    const answers = ['E2E 账单', '1.99'];")
              end_marker = "    await expect(page.getByText('🧾 账单')).toBeVisible();\n"
              end = tests.index(end_marker, start) + len(end_marker)
              replacement = """    await page.getByTitle('发送账单').click();
              await page.getByTestId('invoice-title-input').fill('E2E 账单');
              await page.getByTestId('invoice-amount-input').fill('1.99');
              await page.getByRole('button', { name: '创建账单' }).click();
              await expect(page.getByText('🧾 账单')).toBeVisible();
          """
              tests = tests[:start] + replacement + tests[end:]
          spec.write_text(tests, encoding='utf-8')
          PY
      - name: Verify patch shape
        shell: bash
        run: |
          grep -q 'data-testid="invoice-title-input"' desktop/src/messaging-shell-v2.tsx
          grep -q 'data-testid="invoice-amount-input"' desktop/src/messaging-shell-v2.tsx
          grep -q "name: '创建账单'" desktop/e2e/messenger.spec.ts
          ! grep -q "window.prompt('账单名称'" desktop/src/messaging-shell-v2.tsx
          git diff --check
      - name: Commit product fix and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/gbf-m2-invoice-dialog-patch.yml
          git config user.name 'fabushi-ci'
          git config user.email 'fabushi-ci@users.noreply.github.com'
          git add desktop/src/messaging-shell-v2.tsx desktop/e2e/messenger.spec.ts
          git commit -m 'fix(gbf): replace Electron invoice prompts with dialog'
          git push origin HEAD:gbf/m2-e2e-closure-20260822
