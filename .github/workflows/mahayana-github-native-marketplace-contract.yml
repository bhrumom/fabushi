name: Mahayana GitHub Native Marketplace Contract

on:
  pull_request:
    paths:
      - 'fabushi/web/src/marketplace/github-native-contract.js'
      - 'fabushi/web/tests/github-native-marketplace-contract.test.js'
      - '.github/workflows/mahayana-github-native-marketplace-contract.yml'
      - '.github/scripts/bootstrap-mahayana-github-native-live-e2e.mjs'
      - 'templates/mahayana-mcp-app-github-native/**'
      - 'ai-backend/package.json'
      - 'ai-backend/package-lock.json'
      - 'ai-backend/src/official_mcp_apps.js'
      - 'ai-backend/src/server.js'
      - 'ai-backend/test/official_mcp_apps.test.js'
      - 'fabushi/lib/services/mini_app_registry_service.dart'
      - 'fabushi/web/src/config/constants.js'
      - 'fabushi/web/tests/dacheng-ai-handler.test.js'
      - 'fabushi/web/tests/mcp-apps-only-source-contract.test.js'
      - 'frontend/apps/web/src/app/miniapps/[id]/McpPluginApp.tsx'
      - 'frontend/packages/mcp-app-sdk/**'
      - 'native/global-dharma/crates/global-dharma-mcp/**'
  push:
    branches:
      - codex/mahayana-marketplace-cloudflare-v10
    paths:
      - 'fabushi/web/src/marketplace/github-native-contract.js'
      - 'fabushi/web/tests/github-native-marketplace-contract.test.js'
      - '.github/workflows/mahayana-github-native-marketplace-contract.yml'
      - '.github/scripts/bootstrap-mahayana-github-native-live-e2e.mjs'
      - 'templates/mahayana-mcp-app-github-native/**'
      - 'ai-backend/package.json'
      - 'ai-backend/package-lock.json'
      - 'ai-backend/src/official_mcp_apps.js'
      - 'ai-backend/src/server.js'
      - 'ai-backend/test/official_mcp_apps.test.js'
      - 'fabushi/lib/services/mini_app_registry_service.dart'
      - 'fabushi/web/src/config/constants.js'
      - 'fabushi/web/tests/dacheng-ai-handler.test.js'
      - 'fabushi/web/tests/mcp-apps-only-source-contract.test.js'
      - 'frontend/apps/web/src/app/miniapps/[id]/McpPluginApp.tsx'
      - 'frontend/packages/mcp-app-sdk/**'
      - 'native/global-dharma/crates/global-dharma-mcp/**'

permissions:
  contents: read

jobs:
  refresh-ai-backend-lock:
    name: Refresh AI backend lockfile in trusted branch
    if: github.event_name == 'push' && github.repository == 'bhrumom/fabushi' && github.ref == 'refs/heads/codex/mahayana-marketplace-cloudflare-v10'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@v4
        with:
          ref: codex/mahayana-marketplace-cloudflare-v10
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate lockfile without running dependency scripts
        run: npm install --prefix ai-backend --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit only the generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ai-backend/package-lock.json; then
            echo 'Lockfile is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-backend/package-lock.json
          git commit -m 'chore: refresh AI backend lockfile'
          git push origin HEAD:codex/mahayana-marketplace-cloudflare-v10


  bootstrap-live-collaboration:
    name: Bootstrap public upstream, fork, rulesets, and trusted boundaries
    if: github.event_name == 'push' && github.repository == 'bhrumom/fabushi' && github.ref == 'refs/heads/codex/mahayana-marketplace-cloudflare-v10'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_ADMIN_TOKEN: ${{ secrets.OFFICIAL_SITE_RELEASE_PAT }}
      UPSTREAM_OWNER: bhrumom
      FORK_OWNER: bhrum
      TEST_REPOSITORY: mahayana-mcp-app-collaboration-v10
      TEMPLATE_ROOT: templates/mahayana-mcp-app-github-native
      EVIDENCE_PATH: live-e2e-bootstrap-evidence.json
    steps:
      - name: Checkout exact trusted source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: false

      - name: Require the protected GitHub administration token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_ADMIN_TOKEN" || {
            echo 'OFFICIAL_SITE_RELEASE_PAT is required to create the public acceptance repository, fork, and rulesets.' >&2
            exit 1
          }

      - name: Bootstrap real public GitHub collaboration topology
        run: node .github/scripts/bootstrap-mahayana-github-native-live-e2e.mjs

      - name: Upload immutable bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: mahayana-github-native-live-e2e-bootstrap-${{ github.sha }}
          path: live-e2e-bootstrap-evidence.json
          if-no-files-found: error
          retention-days: 30

  contract:
    name: GitHub-native MCP App contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run contract tests
        run: node --test fabushi/web/tests/github-native-marketplace-contract.test.js

  mcp-apps-only:
    name: Stateless MCP Apps host and runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-backend/package-lock.json

      - name: Install AI backend dependencies from lockfile
        run: npm ci --prefix ai-backend

      - name: Verify MCP Apps-only source contract
        run: node --test fabushi/web/tests/mcp-apps-only-source-contract.test.js fabushi/web/tests/dacheng-ai-handler.test.js

      - name: Verify stateless official MCP Apps server
        run: npm test --prefix ai-backend
