name: Apply Fabushi MCP account auth patch

on:
  push:
    branches:
      - feat/fabushi-mcp-account-oauth
    paths:
      - .github/scripts/apply-fabushi-mcp-account-auth-patch.py
      - .github/workflows/fabushi-mcp-account-auth-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/fabushi-mcp-account-oauth
          fetch-depth: 1
      - name: Apply exact source patches
        run: python3 .github/scripts/apply-fabushi-mcp-account-auth-patch.py
      - name: Commit source patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chatgpt-vps-control/lib/fabushi-remote-mcp-server.js chatgpt-vps-control/tests/fabushi-remote-mcp-server.test.js third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/account.rs
          git diff --cached --check
          git commit -m 'feat(mcp): use direct Fabushi account login flow'
          git push origin HEAD:feat/fabushi-mcp-account-oauth
