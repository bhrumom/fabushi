name: Grok Cargo lock branch bootstrap

on:
  push:
    branches:
      - fix/grok-native-electron-ci-20260815

permissions:
  contents: write

jobs:
  resolve-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve the complete workspace dependency graph
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo metadata --format-version 1 >/dev/null

      - name: Prove the resolved lock is self-consistent
        working-directory: third_party/mahayana/mahayana-rs
        run: cargo metadata --locked --format-version 1 >/dev/null

      - name: Commit Cargo-owned lock update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- third_party/mahayana/mahayana-rs/Cargo.lock; then
            echo 'Cargo.lock is already resolved.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add third_party/mahayana/mahayana-rs/Cargo.lock
          git commit -m 'fix(cargo): resolve migrated workspace lockfile'
          git push origin HEAD:${{ github.ref_name }}
