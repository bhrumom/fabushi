name: Mahayana Rust autoformat

on:
  pull_request:
    paths:
      - third_party/mahayana/mahayana-rs/**
      - .github/workflows/mahayana-autoformat.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mahayana-autoformat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: third_party/mahayana/mahayana-rs
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /third_party/mahayana/**
            /.github/workflows/mahayana-autoformat.yml

      - name: Set up Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Mahayana Rust workspace
        run: cargo fmt --all

      - name: Commit formatting if needed
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- third_party/mahayana/mahayana-rs; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/mahayana/mahayana-rs
          git commit -m "style(mahayana): apply rustfmt"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
