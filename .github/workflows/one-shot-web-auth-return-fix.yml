name: One-shot Web auth return fix

on:
  push:
    branches:
      - fix/web-auth-official-site-20260916
    paths:
      - .github/workflows/one-shot-web-auth-return-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/web-auth-official-site-20260916
          fetch-depth: 0

      - name: Patch Web browser auth completion semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          account_path = Path('third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/account.rs')
          source = account_path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'fn browser_result_page_for_device\(.*?\n\}\n\nfn browser_result_page\(',
              re.S,
          )
          replacement = r'''fn browser_result_page_for_device(
              success: bool,
              message: &str,
              attempt_id: Option<&str>,
              device_id: &str,
          ) -> Result<Response> {
              if device_id == "fabushi-web-wasm" || device_id.starts_with("fabushi-web-") {
                  return browser_web_result_page(success, message, attempt_id);
              }
              if success {
                  if let Some(request_id) = device_id.strip_prefix("mcp-oauth-") {
                      let valid = (32..=128).contains(&request_id.len())
                          && request_id
                              .bytes()
                              .all(|byte| byte.is_ascii_alphanumeric() || matches!(byte, b'_' | b'-'));
                      if valid {
                          let return_url = format!(
                              "https://fabushi-mcp.ombhrum.com/oauth/fabushi/complete?request_id={request_id}"
                          );
                          let literal = serde_json::to_string(&return_url).unwrap_or_else(|_| "null".into());
                          return browser_html_response(format!(
                              r#"<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fabushi 登录</title></head><body><main>登录成功，正在返回 AI 客户端…</main><script>location.replace({literal});</script></body></html>"#
                          ));
                      }
                  }
              }
              browser_result_page(success, message, attempt_id)
          }

          fn browser_web_result_page(
              success: bool,
              message: &str,
              attempt_id: Option<&str>,
          ) -> Result<Response> {
              let status = if success { "completed" } else { "failed" };
              let attempt_literal = serde_json::to_string(attempt_id.unwrap_or_default())
                  .unwrap_or_else(|_| "\"\"".into());
              let close_script = if success {
                  format!(
                      "try{{window.opener?.postMessage({{type:'fabushi.auth.complete',status:'{status}',attemptId:{attempt_literal}}},'https://web.ombhrum.com')}}catch{{}}setTimeout(()=>{{try{{window.close()}}catch{{}}}},220);"
                  )
              } else {
                  String::new()
              };
              let tone = if success { "ok" } else { "warn" };
              let eyebrow = if success { "AUTHENTICATED" } else { "LOGIN INTERRUPTED" };
              browser_html_response(format!(
                  r#"<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fabushi Web 登录</title><style>*{{box-sizing:border-box}}html,body{{margin:0;min-height:100%;background:#080808;color:#f6f6f2;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}}body{{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 35%,rgba(121,98,255,.12),transparent 29%),#080808}}main{{width:min(440px,100%);padding:42px;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:rgba(18,18,18,.94);box-shadow:0 40px 100px rgba(0,0,0,.55);text-align:center}}.state{{width:9px;height:9px;display:inline-block;margin-right:7px;border-radius:50%;background:#72d8ad;box-shadow:0 0 0 6px rgba(114,216,173,.08)}}main[data-tone="warn"] .state{{background:#ff9b7f;box-shadow:0 0 0 6px rgba(255,155,127,.08)}}.eyebrow{{margin:0 0 10px;color:#8d7ee8;font-size:10px;font-weight:850;letter-spacing:.17em}}h1{{margin:0;font-size:26px;font-weight:580;letter-spacing:-.035em}}p{{margin:14px auto 0;color:#8f8f8f;font-size:13px;line-height:1.65}}.return{{height:46px;margin-top:26px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:#f0f0ec;color:#101010;text-decoration:none;font-size:13px;font-weight:780}}small{{display:block;margin-top:18px;color:#5f5f5f;font-size:10px;line-height:1.6}}</style></head><body><main data-tone="{tone}"><p class="eyebrow"><span class="state"></span>{eyebrow}</p><h1>{title}</h1><p>{message}</p><a class="return" href="https://web.ombhrum.com/">返回 Fabushi Web</a><small>{hint}</small></main><script>{close_script}</script></body></html>"#,
                  tone = tone,
                  eyebrow = eyebrow,
                  title = if success { "登录成功" } else { "登录未完成" },
                  message = html_escape(message),
                  hint = if success {
                      "正在关闭登录窗口；Fabushi Web 会通过一次性会话领取登录结果。"
                  } else {
                      "请返回 Fabushi Web 后重新发起登录。"
                  },
                  close_script = close_script,
              ))
          }

          fn browser_result_page('''
          source, replacements = pattern.subn(replacement, source, count=1)
          if replacements != 1:
              raise SystemExit(f'expected one browser_result_page_for_device block, replaced {replacements}')

          wake_pattern = re.compile(
              r'    let wake_script = deep_link\n.*?        \.unwrap_or_default\(\);',
              re.S,
          )
          source, replacements = wake_pattern.subn('    let wake_script = "";', source, count=1)
          if replacements != 1:
              raise SystemExit(f'expected one automatic deep-link wake block, replaced {replacements}')

          source = source.replace(
              '如果 Fabushi 没有自动返回，请点击上方按钮；登录结果仍会通过一次性会话安全领取。',
              '返回按钮仅用于唤醒已安装的 Fabushi 客户端；登录结果仍会通过一次性会话安全领取。',
          )
          account_path.write_text(source, encoding='utf-8')

          gate_path = Path('.github/scripts/assert-auth-entry-flow.py')
          gate = gate_path.read_text(encoding='utf-8')
          marker = "    'worker safe return scheme': (worker, 'fabushi://auth/complete?attemptId='),\n"
          additions = marker + (
              "    'worker web auth target': (worker, 'fabushi-web-wasm'),\n"
              "    'worker web auth closes popup': (worker, 'window.close()'),\n"
              "    'worker custom scheme is manual fallback': (worker, 'let wake_script = \\\"\\\";'),\n"
          )
          if "'worker web auth target'" not in gate:
              if marker not in gate:
                  raise SystemExit('auth gate marker not found')
              gate = gate.replace(marker, additions, 1)
          gate_path.write_text(gate, encoding='utf-8')
          PY

          cargo fmt --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml --all
          python3 .github/scripts/assert-auth-entry-flow.py
          git diff --check

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-web-auth-return-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/mahayana/mahayana-rs/mahayana-platform-worker/src/worker_api/account.rs .github/scripts/assert-auth-entry-flow.py .github/workflows/one-shot-web-auth-return-fix.yml
          git commit -m "fix(auth): keep Web login in the browser"
          git push origin HEAD:fix/web-auth-official-site-20260916
