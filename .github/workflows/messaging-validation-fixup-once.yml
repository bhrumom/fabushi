name: Messaging validation fixup one-shot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/messaging-validation-fixup-once.yml'
      - 'native/mahayana-messaging/**'
      - 'third_party/mahayana/mahayana-rs/**'
  push:
    branches:
      - feat/fabushi-messaging-rust-selfhosted
    paths:
      - '.github/workflows/messaging-validation-fixup-once.yml'
      - 'native/mahayana-messaging/**'
      - 'third_party/mahayana/mahayana-rs/**'

permissions:
  contents: write

concurrency:
  group: messaging-validation-fixup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-format:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/mahayana-messaging -> target
            third_party/mahayana/mahayana-rs -> target
          shared-key: messaging-final-validation-v2

      - name: Format only messaging Rust sources
        run: cargo fmt --manifest-path native/mahayana-messaging/Cargo.toml

      - name: Test self-hosted messaging core and server
        run: cargo test --manifest-path native/mahayana-messaging/Cargo.toml --all-targets

      - name: Clippy self-hosted messaging core and server
        run: cargo clippy --manifest-path native/mahayana-messaging/Cargo.toml --all-targets -- -D warnings

      - name: Test production Host bridge and contact projection
        run: >-
          cargo test
          --manifest-path third_party/mahayana/mahayana-rs/Cargo.toml
          -p mahayana-host-protocol
          -p mahayana-feature-host
          -p mahayana-social

      - name: Reject build artifacts from the commit set
        shell: bash
        run: |
          set -euo pipefail
          git add native/mahayana-messaging/src native/mahayana-messaging/tests
          if git diff --cached --name-only | grep -E '(^|/)target/'; then
            echo 'Refusing to commit Cargo build artifacts.' >&2
            exit 1
          fi

      - name: Commit rustfmt-only source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'Rust sources already match rustfmt.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(messaging): apply final rustfmt'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
