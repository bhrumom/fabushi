name: global_dharma_sharing
description: 大乘平台 - MiniApp 与智能代理宿主
publish_to: 'none'
version: 1.0.1+407

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Platform core
  provider: ^6.0.5
  get_it: ^8.0.3
  equatable: ^2.0.7
  fpdart: ^1.1.0
  ffi: ^2.1.2

  # Network and persistence
  http: ^1.2.0
  dio: ^5.4.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.3.1
  path_provider: ^2.0.15
  package_info_plus: ^8.3.1

  # MiniApp / Marketplace runtime
  file_picker: ^10.3.3
  path: ^1.8.3
  archive: ^4.0.7
  convert: ^3.1.2
  crypto: ^3.0.3
  uuid: ^4.5.1
  flutter_inappwebview: ^6.0.0
  webview_flutter: ^4.4.2
  url_launcher: ^6.1.11

  # Platform integration
  permission_handler: ^12.0.1
  device_info_plus: ^11.1.0
  app_links: ^6.3.3
  sign_in_with_apple: ^7.0.1
  tobias: ^5.3.0
  universal_html: ^2.2.4
  window_manager: ^0.5.1

# Tobias 配置
tobias:
  url_scheme: fabushi

patrol:
  app_name: global_dharma_sharing
  android:
    package_name: com.ombhrum.fabushi
  ios:
    bundle_id: com.ombhrum.fabushi
  macos:
    bundle_id: com.ombhrum.fabushi

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3
  patrol: ^4.6.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/data/
    # assets/built_in/ 已移除 - 素材通过 CDN 下载，不打包进 APK/IPA
    # Web 端素材在 web/assets/built_in/，独立提供服务
    - assets/ip_data/
    # OpenClaw manifest is always available; large desktop runtimes are
    # injected by release/test scripts or supplied via DACHENG_OPENCLAW_RUNTIME_DIR.
    - assets/openclaw/bundle_manifest.json
    - assets/desktop_control/chrome_extension/
  
  fonts:
    # 使用子集化后的字体（从80MB压缩至~4.5MB）
    # 原始字体保留在 fonts/ 目录以备后用
    - family: NotoSansSC
      fonts:
        - asset: fonts/subset/NotoSansSC-Regular-subset.woff2
        - asset: fonts/subset/NotoSansSC-Bold-subset.woff2
          weight: 700
    - family: NotoSerifSC
      fonts:
        - asset: fonts/subset/NotoSerifSC-Regular-subset.woff2
        - asset: fonts/subset/NotoSerifSC-Bold-subset.woff2
          weight: 700
