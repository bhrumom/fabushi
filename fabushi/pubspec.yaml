name: global_dharma_sharing
description: 全球法布施 - 佛教经文全球传播应用
publish_to: 'none'
version: 1.0.1+407

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 核心依赖
  cupertino_icons: ^1.0.6
  intl: any

  # 状态管理
  provider: ^6.0.5
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3

  # 网络请求
  http: ^1.2.0
  dio: ^5.4.1
  connectivity_plus: ^7.0.0

  # 本地存储
  shared_preferences: ^2.2.2
  path_provider: ^2.0.15
  package_info_plus: ^8.3.1
  sqflite: ^2.4.2

  # 文件处理
  file_picker: ^10.3.3
  path: ^1.8.3
  archive: ^4.0.7
  csv: ^6.0.0
  image: ^4.5.4

  # UI组件
  flex_color_scheme: ^8.0.2
  lucide_icons_flutter: ^3.1.5
  searchfield: ^1.3.5

  # 地图和地理位置
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  vector_math: ^2.1.4

  # 3D渲染
  flutter_earth_globe:
    path: lib/packages/flutter_earth_globe
  flutter_gl:
    path: lib/packages/flutter_gl
  three_dart: ^0.0.16
  three_dart_jsm: ^0.0.10

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  google_sign_in: ^7.2.0

  # 支付
  tobias: ^5.3.0  # 支付宝
  in_app_purchase: ^3.2.0  # Apple IAP（iOS端会员充值）

  # WebView
  webview_flutter: ^4.4.2
  webview_flutter_android: ^4.10.13
  flutter_inappwebview: ^6.0.0
  url_launcher: ^6.1.11

  # 视频播放
  video_player: ^2.9.5
  flutter_cache_manager: ^3.4.1
