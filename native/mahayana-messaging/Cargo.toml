[package]
name = "fabushi-messaging-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Self-hosted, platform-neutral Rust messaging domain for Fabushi humans, AI agents, bots, payments, and Mini Apps."
publish = false

[lib]
name = "fabushi_messaging_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
serde_json = "1"
