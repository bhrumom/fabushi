[package]
name = "codex-wrapper"
version = "0.1.0"
edition = "2021"
description = "Universal Codex Rust SDK bridge supporting multi-model switching, platform transport adaptation, and virtual sandbox."
publish = false

[lib]
name = "codex_wrapper"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["transport-subprocess"]
transport-subprocess = ["dep:tokio"]
transport-embedded = ["dep:tokio"]
transport-wasm = []

[dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
once_cell = "1"
log = "0.4"
cfg-if = "1"
tokio = { version = "1", features = ["full", "process", "io-util"], optional = true }
async-stream = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
