[package]
name = "mahayana-wrapper"
version = "0.1.0"
edition = "2021"
description = "Compatibility boundary between Fabushi and the Mahayana CLI fork."
publish = false

[lib]
name = "mahayana_wrapper"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
codex-sdk = { package = "codex-client-sdk", version = "=0.107.0" }
codex-wrapper = { path = "../codex-wrapper" }
fabushi-miniapp-core = { path = "../miniapp-core" }
fabushi-miniapp-runtime = { path = "../fabushi-miniapp-runtime" }
fabushi-telegram-runtime = { path = "../telegram-runtime" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
ureq = { version = "2.12", features = ["json"] }
url = "2"
