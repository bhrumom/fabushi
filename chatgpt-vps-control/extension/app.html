<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fabushi</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-width: 720px;
        min-height: 520px;
        background: Canvas;
        color: CanvasText;
      }
      .shell {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: 100vh;
      }
      aside {
        padding: 24px 18px;
        border-right: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
      }
      .brand {
        margin: 0 0 24px;
        font-size: 24px;
      }
      nav {
        display: grid;
        gap: 8px;
      }
      nav button {
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: inherit;
        text-align: left;
        font: inherit;
        cursor: pointer;
      }
      nav button[aria-current="page"] {
        background: color-mix(in srgb, CanvasText 10%, transparent);
        font-weight: 600;
      }
      main {
        padding: 28px 32px;
      }
      .search {
        width: min(680px, 100%);
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid color-mix(in srgb, CanvasText 24%, transparent);
        border-radius: 12px;
        background: Canvas;
        color: CanvasText;
        font: inherit;
      }
      .panel {
        margin-top: 24px;
        max-width: 760px;
      }
      .panel h2 {
        margin-bottom: 8px;
      }
      .panel p {
        margin-top: 0;
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <h1 class="brand">Fabushi</h1>
        <nav aria-label="Fabushi">
          <button type="button" data-section="Chats" aria-current="page">Chats</button>
          <button type="button" data-section="Mini Apps">Mini Apps</button>
          <button type="button" data-section="Marketplace">Marketplace</button>
        </nav>
      </aside>
      <main>
        <input id="marketplace-search" class="search" type="search" placeholder="Search Marketplace" aria-label="Search Marketplace" />
        <section class="panel" aria-live="polite">
          <h2 id="section-title">Chats</h2>
          <p id="section-description">Open conversations and continue your Fabushi work.</p>
        </section>
      </main>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
