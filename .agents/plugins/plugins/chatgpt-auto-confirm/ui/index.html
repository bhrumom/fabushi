<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><title>ChatGPT 自动确认</title><style>body{font:16px system-ui;margin:0;padding:2rem;max-width:48rem}article{padding:1.25rem;border:1px solid #ddd;border-radius:1rem}</style></head><body><article><h1>ChatGPT 自动确认</h1><p>使用 dispatch-goal 只提交一条完整总目标；ChatGPT 自行拆解并一次性持续完成全部工作。插件通过已授权的当前内置 Browser Chat 页面每轮新建 Chat，固定选择 GPT-5.6 Sol 与 Extra High，后台检测并自动批准授权卡：优先选择“允许本次会话”，没有该选项时直接点击“允许”。回复结束后由插件根据自然语言完成与验证信号决定是否停止；未完成时自动重新附着标签页，执行租约结束时由长期宿主泵恢复同一任务并继续新 Chat 续作；不会切换到 Work/worker、Devspace 或通用 CDP。</p></article></body></html>
